<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RAG Architect Lab — AY</title>
<style>
:root{
  --navy:#0a0f1e;--navy2:#111827;--navy3:#1a2236;--navy4:#243050;--navy5:#2d3a56;
  --teal:#00d4c8;--teal2:#00a89e;--tealb:rgba(0,212,200,.08);
  --amber:#f59e0b;--amber2:#b45309;--amberb:rgba(245,158,11,.08);
  --purple:#a78bfa;--purpleb:rgba(167,139,250,.08);
  --green:#34d399;--greenb:rgba(52,211,153,.08);
  --coral:#f87171;--coralb:rgba(248,113,113,.08);
  --blue:#60a5fa;--blueb:rgba(96,165,250,.08);
  --t1:#e8eaf0;--t2:#8b94ab;--t3:#4a5568;
  --bd:#1e2d45;--bd2:#2d4060;
  --mono:'Courier New',Courier,monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--navy);color:var(--t1);font-family:var(--sans);font-size:13px;}
::-webkit-scrollbar{width:5px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--navy5);border-radius:3px;}

/* HEADER */
.hdr{height:52px;background:var(--navy2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:200;}
.logo{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--navy);flex-shrink:0;}
.hdr-info{flex:1;}
.hdr-title{font-size:13px;font-weight:700;}
.hdr-sub{font-size:10px;color:var(--t3);margin-top:1px;}
.hdr-pills{display:flex;gap:4px;margin-left:auto;}
.hpill{padding:3px 9px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--navy3);color:var(--t3);transition:all .15s;letter-spacing:.2px;}
.hpill:hover{border-color:var(--bd2);color:var(--t2);}
.hpill.on{background:var(--tealb);border-color:var(--teal);color:var(--teal);}

/* STEP INDICATOR BAR */
.stepbar{height:36px;background:var(--navy3);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 18px;gap:6px;position:fixed;top:52px;left:0;right:0;z-index:190;overflow-x:auto;}
.stepbar::-webkit-scrollbar{height:0;}
.step-node{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--navy4);font-size:10px;font-weight:700;color:var(--t3);white-space:nowrap;transition:all .2s;}
.step-node.s1{border-color:rgba(0,212,200,.3);color:var(--teal);background:var(--tealb);}
.step-node.s2{border-color:rgba(245,158,11,.3);color:var(--amber);background:var(--amberb);}
.step-node.s3{border-color:rgba(167,139,250,.3);color:var(--purple);background:var(--purpleb);}
.step-node.s4{border-color:rgba(52,211,153,.3);color:var(--green);background:var(--greenb);}
.step-arrow{color:var(--bd2);font-size:11px;flex-shrink:0;}

/* LAYOUT */
.body{position:fixed;top:88px;left:0;right:0;bottom:0;display:flex;overflow:hidden;}

/* RAIL */
.rail{width:248px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 8px;}
.rail-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);padding:4px 8px 6px;}
.si{padding:10px 11px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all .15s;}
.si:hover{background:var(--navy3);border-color:var(--bd);}
.si.on{background:var(--tealb);border-color:var(--teal);}
.si-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.si-title{font-size:12px;font-weight:700;color:var(--t1);margin:2px 0;}
.si.on .si-num{color:var(--teal);}
.si.on .si-title{color:var(--teal);}
.si-steps{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;}
.d1{background:var(--teal);opacity:.7;}
.d2{background:var(--amber);opacity:.7;}
.d3{background:var(--purple);opacity:.7;}
.d4{background:var(--green);opacity:.7;}
.si-why{font-size:10px;color:var(--t3);margin-top:4px;line-height:1.4;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.stage-hdr{padding:12px 18px 10px;background:var(--navy2);border-bottom:1px solid var(--bd);flex-shrink:0;}
.sh-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
.sh-num{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.2);padding:2px 7px;border-radius:4px;}
.sh-title{font-size:14px;font-weight:700;color:var(--t1);}
.sh-desc{font-size:11px;color:var(--t2);line-height:1.55;max-width:700px;}
.sh-meta{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;}
.sh-meta span{font-size:10px;color:var(--t3);}
.sh-meta strong{font-family:var(--mono);color:var(--t2);}
.tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;letter-spacing:.2px;}
.tc{background:var(--tealb);color:var(--teal);}
.ta{background:var(--amberb);color:var(--amber);}
.tp{background:var(--purpleb);color:var(--purple);}
.tg{background:var(--greenb);color:var(--green);}
.tr{background:var(--coralb);color:var(--coral);}
.tb{background:var(--blueb);color:var(--blue);}

.code-area{flex:1;overflow-y:auto;padding:14px 18px 20px;}

/* CODE BLOCK */
.cb{background:var(--navy);border:1px solid var(--bd);border-radius:8px;overflow:hidden;position:relative;margin-bottom:14px;}
.cb-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 13px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.cb-left{display:flex;align-items:center;gap:10px;}
.cb-lang{font-size:10px;color:var(--t3);font-family:var(--mono);}
.cb-file{font-size:10px;color:var(--t2);font-family:var(--mono);}
.cb-copy{font-size:9px;font-weight:700;padding:2px 9px;border-radius:4px;background:var(--navy4);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;font-family:var(--sans);transition:all .15s;}
.cb-copy:hover{color:var(--t1);border-color:var(--teal);}
pre{padding:16px;font-family:var(--mono);font-size:11.5px;line-height:1.8;overflow-x:auto;white-space:pre;}

/* syntax */
.kw{color:#c792ea;}.fn{color:#82aaff;}.cls{color:#ffcb6b;}
.st{color:#c3e88d;}.cm{color:#546e7a;font-style:italic;}
.nm{color:#f78c6c;}.dc{color:#89ddff;}.im{color:#c792ea;}
.bi{color:#f78c6c;}
/* step section dividers inside code */
.s1l{color:var(--teal);font-weight:700;}
.s2l{color:var(--amber);font-weight:700;}
.s3l{color:var(--purple);font-weight:700;}
.s4l{color:var(--green);font-weight:700;}
/* diff */
.da{background:rgba(52,211,153,.06);color:var(--green);}

/* WHAT'S NEW */
.wn{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:8px;padding:13px 15px;}
.wn-title{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;}
.wn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.wn-step{background:var(--navy3);border-radius:6px;padding:10px 12px;}
.wn-step-label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;}
.wn-step ul{padding-left:13px;font-size:11px;color:var(--t2);line-height:1.65;}
.wn-step li{margin-bottom:2px;}
.wn-step code{font-family:var(--mono);font-size:10px;background:var(--navy4);padding:1px 4px;border-radius:3px;}
.inst{margin-top:10px;background:var(--navy);border:1px solid var(--bd);border-radius:5px;padding:8px 12px;font-family:var(--mono);font-size:11px;color:var(--green);}
.inst-lbl{font-size:9px;color:var(--t3);font-family:var(--sans);margin-bottom:3px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}

/* ASK PANEL */
.ask{width:284px;flex-shrink:0;background:var(--navy2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.ask-hdr{padding:11px 13px;border-bottom:1px solid var(--bd);}
.ask-hdr-t{font-size:12px;font-weight:700;color:var(--purple);}
.ask-hdr-s{font-size:10px;color:var(--t3);margin-top:1px;}
.ask-body{flex:1;overflow-y:auto;padding:10px 11px 4px;}
.sugs{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.sug{background:var(--navy3);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;font-size:10px;color:var(--t2);cursor:pointer;text-align:left;font-family:var(--sans);transition:all .15s;line-height:1.4;}
.sug:hover{border-color:var(--bd2);color:var(--t1);}
.msg{margin-bottom:8px;}
.who{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--t3);text-transform:uppercase;margin-bottom:2px;}
.bbl{padding:7px 9px;border-radius:6px;font-size:11px;line-height:1.6;}
.bbl-u{background:var(--navy4);color:var(--t1);border-radius:6px 6px 2px 6px;}
.bbl-a{background:var(--purpleb);border:1px solid rgba(167,139,250,.12);color:var(--t1);border-radius:6px 6px 6px 2px;}
.ask-ft{padding:7px 9px;border-top:1px solid var(--bd);}
.ask-row{display:flex;gap:5px;align-items:flex-end;}
.ask-inp{flex:1;background:var(--navy3);border:1px solid var(--bd);border-radius:5px;color:var(--t1);font-family:var(--sans);font-size:11px;padding:6px 8px;resize:none;outline:none;height:38px;transition:border-color .15s;}
.ask-inp:focus{border-color:var(--teal2);}
.ask-btn{flex-shrink:0;padding:6px 10px;background:var(--teal);color:var(--navy);border:none;border-radius:5px;font-weight:700;font-size:12px;cursor:pointer;}
.ask-btn:hover{background:var(--teal2);}
.sp{display:inline-block;width:10px;height:10px;border:2px solid var(--bd2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:3px;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ── ARCHITECT SECTIONS ── */
.arch-area{flex:1;overflow-y:auto;padding:14px 18px 20px;}
.rail-divider{height:1px;background:var(--bd);margin:10px 4px;position:relative;}
.rail-divider span{position:absolute;top:-7px;left:8px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);background:var(--navy2);padding:0 5px;}
.ai{padding:10px 11px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all .15s;}
.ai:hover{background:var(--navy3);border-color:var(--bd);}
.ai.on{background:var(--purpleb);border-color:var(--purple);}
.ai-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.ai-title{font-size:12px;font-weight:700;color:var(--t1);margin:2px 0;}
.ai.on .ai-num{color:var(--purple);}
.ai.on .ai-title{color:var(--purple);}
.ai-why{font-size:10px;color:var(--t3);line-height:1.4;}
/* arch header */
.ah-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
.ah-num{font-size:10px;font-family:var(--mono);color:var(--purple);background:var(--purpleb);border:1px solid rgba(167,139,250,.2);padding:2px 7px;border-radius:4px;}
.ah-title{font-size:14px;font-weight:700;color:var(--t1);}
.ah-desc{font-size:11px;color:var(--t2);line-height:1.55;max-width:700px;}
/* decision card */
.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.dc{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;padding:14px;}
.dc-scenario{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.dc-choice{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:5px;}
.dc-why{font-size:11px;color:var(--t2);line-height:1.6;margin-bottom:6px;}
.dc-not{font-size:10px;color:var(--coral);line-height:1.5;}
.dc-not strong{font-weight:700;}
/* tradeoff table */
.tt{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px;}
.tt th{background:var(--navy3);color:var(--t3);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 11px;text-align:left;border-bottom:1px solid var(--bd);}
.tt td{padding:8px 11px;border-bottom:1px solid var(--bd);color:var(--t2);vertical-align:top;line-height:1.5;}
.tt tr:last-child td{border-bottom:none;}
.tt td:first-child{color:var(--t1);font-weight:600;font-size:12px;}
.tt tr:hover td{background:var(--navy3);}
.good{color:var(--green);}.ok{color:var(--amber);}.bad{color:var(--coral);}
.tt-title{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:6px;margin-top:14px;}
/* failure card */
.fc{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--coral);border-radius:8px;padding:13px 15px;margin-bottom:10px;}
.fc-name{font-size:13px;font-weight:700;color:var(--coral);margin-bottom:4px;}
.fc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px;}
.fc-block{font-size:11px;line-height:1.6;}
.fc-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:3px;}
/* metric card */
.mc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.mc{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;padding:14px;}
.mc-name{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:4px;}
.mc-formula{font-family:var(--mono);font-size:10px;color:var(--amber);background:var(--navy3);padding:4px 8px;border-radius:4px;margin-bottom:6px;}
.mc-desc{font-size:11px;color:var(--t2);line-height:1.6;}
.mc-good{font-size:10px;color:var(--green);margin-top:5px;}
/* checklist */
.cl-section{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;}
.cl-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:8px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:11px;color:var(--t2);line-height:1.5;}
.cl-item:last-child{border-bottom:none;}
.cl-check{width:14px;height:14px;border-radius:3px;background:var(--greenb);border:1px solid rgba(52,211,153,.3);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--green);}
.cl-req{font-size:9px;font-weight:700;letter-spacing:.3px;padding:1px 5px;border-radius:3px;margin-left:auto;flex-shrink:0;}
.req-p0{background:var(--coralb);color:var(--coral);}
.req-p1{background:var(--amberb);color:var(--amber);}
.req-p2{background:var(--greenb);color:var(--green);}
/* Q&A */
.qa-item{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;overflow:hidden;}
.qa-q{padding:12px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:background .15s;}
.qa-q:hover{background:var(--navy3);}
.qa-q.open{background:var(--navy3);border-bottom:1px solid var(--bd);}
.qa-qnum{font-size:10px;font-family:var(--mono);color:var(--amber);flex-shrink:0;margin-top:1px;}
.qa-qtext{font-size:12px;font-weight:600;color:var(--t1);flex:1;line-height:1.5;}
.qa-arrow{color:var(--t3);font-size:12px;flex-shrink:0;transition:transform .2s;}
.qa-q.open .qa-arrow{transform:rotate(90deg);}
.qa-a{padding:14px;display:none;font-size:11px;color:var(--t2);line-height:1.7;}
.qa-a.open{display:block;}
.qa-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-bottom:8px;display:inline-block;}
.qa-wf{background:var(--tealb);color:var(--teal);}
.qa-arch{background:var(--amberb);color:var(--amber);}
.qa-prod{background:var(--purpleb);color:var(--purple);}

/* INLINE Q&A PANEL (ask sidebar) */
.sugs-qa .qa-item{margin-bottom:6px;border-radius:6px;}
.sugs-qa .qa-q{padding:8px 9px;gap:6px;}
.sugs-qa .qa-qnum{font-size:9px;}
.sugs-qa .qa-qtext{font-size:11px;line-height:1.4;}
.sugs-qa .qa-a{padding:10px;}
.qa-diagram{background:var(--navy);border:1px solid var(--bd);border-radius:6px;padding:6px 4px;margin-bottom:8px;}
.qa-mnemonic{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.18);border-radius:5px;padding:6px 9px;margin-bottom:8px;line-height:1.4;}
.qa-answer-text{font-size:11px;color:var(--t2);line-height:1.65;}

/* INFRA MATURITY STAGES (A5) */
.infra-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.infra-pill{padding:6px 13px;border-radius:18px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--navy3);color:var(--t3);transition:all .15s;}
.infra-pill:hover{border-color:var(--bd2);color:var(--t2);}
.infra-pill.on{background:var(--tealb);border-color:var(--teal);color:var(--teal);}
.infra-stage-hdr{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap;}
.infra-stage-title{font-size:13px;font-weight:700;color:var(--t1);}
.infra-stage-desc{font-size:11.5px;color:var(--t2);line-height:1.55;margin-bottom:12px;}
.infra-whatchanged{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:8px;padding:11px 14px;margin-top:12px;}
.infra-whatchanged-title{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
.infra-whatchanged-body{font-size:11.5px;color:var(--t2);line-height:1.65;}
.infra-whatchanged-body code{font-family:var(--mono);font-size:10.5px;background:var(--navy3);padding:1px 5px;border-radius:3px;color:var(--teal);}
/* SVG diagram box */
.diag-box{background:var(--navy);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.diag-title{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);padding:8px 14px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.diag-box svg{display:block;}
/* arch info box */
.info-box{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:8px;padding:13px 15px;margin-bottom:12px;}
.info-title{font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px;}
.info-body{font-size:11px;color:var(--t2);line-height:1.7;}
.info-body li{margin-bottom:3px;padding-left:2px;}
.section-h{font-size:11px;font-weight:700;color:var(--t2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">AY</div>
  <div class="hdr-info">
    <div class="hdr-title">RAG Pipeline Lab</div>
    <div class="hdr-sub">Chunk → Search → Assemble → Generate &nbsp;·&nbsp; Code Stages + Architect Prep</div>
  </div>
  <div class="hdr-pills" id="hdrPills"></div>
</div>

<div class="stepbar" id="stepbar">
  <div class="step-node s1">① CHUNK</div>
  <div class="step-arrow">→</div>
  <div class="step-node s2">② SEARCH</div>
  <div class="step-arrow">→</div>
  <div class="step-node s3">③ ASSEMBLE</div>
  <div class="step-arrow">→</div>
  <div class="step-node s4">④ GENERATE</div>
</div>

<div class="body">
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="stage-hdr" id="stageHdr"></div>
    <div class="code-area" id="codeArea"></div>
  </div>
  <div class="ask">
    <div class="ask-hdr">
      <div class="ask-hdr-t">Ask Claude</div>

code:`<span class="im">import</span> re, hashlib, anthropic
<span class="im">from</span> dataclasses <span class="im">import</span> dataclass, field
<span class="im">from</span> sklearn.feature_extraction.text <span class="im">import</span> TfidfVectorizer
<span class="im">from</span> sklearn.metrics.pairwise <span class="im">import</span> cosine_similarity


<span class="s1l"># ════════════════════════════════════════
# STEP 1 — CHUNK
# ════════════════════════════════════════</span>
<span class="da">@dataclass
<span class="kw">class</span> Chunk:
    text:     <span class="cls">str</span>
    chunk_id: <span class="cls">str</span>    <span class="cm"># SHA-256[:16] of content</span>
    doc_id:   <span class="cls">str</span>
    page:     <span class="cls">int</span>
    tokens:   <span class="cls">int</span>
    index:    <span class="cls">int</span>

<span class="kw">def</span> <span class="fn">count_tokens</span>(t: <span class="cls">str</span>) -> <span class="cls">int</span>:
    <span class="kw">return</span> max(<span class="nm">1</span>, <span class="bi">len</span>(t) // <span class="nm">4</span>)  <span class="cm"># swap for tiktoken in prod</span>

<span class="kw">def</span> <span class="fn">chunk</span>(text: <span class="cls">str</span>, doc_id: <span class="cls">str</span>, max_tok=<span class="nm">256</span>, overlap=<span class="nm">2</span>) -> <span class="cls">list</span>[Chunk]:
    sents = re.split(<span class="st">r'(?&lt;=[.!?])\s+'</span>, text.strip())
    sents = [s.strip() <span class="kw">for</span> s <span class="kw">in</span> sents <span class="kw">if</span> s.strip()]
    chunks, buf, idx = [], [], <span class="nm">0</span>
    <span class="kw">for</span> s <span class="kw">in</span> sents:
        buf.append(s)
        <span class="kw">if</span> count_tokens(<span class="st">" "</span>.join(buf)) >= max_tok:
            raw = <span class="st">" "</span>.join(buf)
            chunks.append(Chunk(raw, hashlib.sha256(raw.encode()).hexdigest()[:<span class="nm">16</span>],
                                doc_id, idx // <span class="nm">3</span> + <span class="nm">1</span>, count_tokens(raw), idx))
            idx  += <span class="nm">1</span>
            buf   = buf[-overlap:]   <span class="cm"># sliding overlap</span>
    <span class="kw">if</span> buf:
        raw = <span class="st">" "</span>.join(buf)
        chunks.append(Chunk(raw, hashlib.sha256(raw.encode()).hexdigest()[:<span class="nm">16</span>],
                            doc_id, idx // <span class="nm">3</span> + <span class="nm">1</span>, count_tokens(raw), idx))
    <span class="kw">return</span> chunks</span>


<span class="s2l"># ════════════════════════════════════════
# STEP 2 — SEARCH
# ════════════════════════════════════════</span>
<span class="kw">def</span> <span class="fn">search</span>(query: <span class="cls">str</span>, chunks: <span class="cls">list</span>[Chunk], k=<span class="nm">10</span>) -> <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]]:
    texts      = [c.text <span class="kw">for</span> c <span class="kw">in</span> chunks]
    vectorizer = TfidfVectorizer(stop_words=<span class="st">"english"</span>)
    matrix     = vectorizer.fit_transform(texts)
    q_vec      = vectorizer.transform([query])
    scores     = cosine_similarity(q_vec, matrix)[<span class="nm">0</span>]
    top_k      = scores.argsort()[-k:][::-<span class="nm">1</span>]
    <span class="cm"># Return (chunk, score) tuples so assembly can use scores</span>
    <span class="kw">return</span> [(chunks[i], <span class="cls">float</span>(scores[i])) <span class="kw">for</span> i <span class="kw">in</span> top_k]


<span class="s3l"># ════════════════════════════════════════
# STEP 3 — ASSEMBLE PAYLOAD
# ════════════════════════════════════════</span>
<span class="da">@dataclass
<span class="kw">class</span> Payload:
    system:        <span class="cls">str</span>
    user:          <span class="cls">str</span>
    chunk_ids:     <span class="cls">list</span>[<span class="cls">str</span>]   <span class="cm"># for citation verification</span>
    total_tokens:  <span class="cls">int</span>

SYSTEM_TMPL = <span class="st">"""You are a Claims AI assistant at Wells Fargo.
Answer using ONLY the numbered context blocks below.
Cite sources using [chunk_id] notation after each claim.
If the context does not contain the answer, say exactly:
\"The provided context does not contain enough information.\""""</span>

<span class="kw">def</span> <span class="fn">assemble</span>(
    query:     <span class="cls">str</span>,
    results:   <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]],
    max_ctx_tokens: <span class="cls">int</span> = <span class="nm">3000</span>,
) -> Payload:
    <span class="cm"># Sort by score descending, then enforce token budget</span>
    results.sort(key=<span class="kw">lambda</span> x: x[<span class="nm">1</span>], reverse=<span class="kw">True</span>)
    used, selected = <span class="nm">0</span>, []
    <span class="kw">for</span> chunk, score <span class="kw">in</span> results:
        <span class="kw">if</span> used + chunk.tokens > max_ctx_tokens:
            <span class="kw">break</span>           <span class="cm"># budget exhausted — drop remaining</span>
        selected.append((chunk, score))
        used += chunk.tokens

    <span class="cm"># Build numbered context blocks with metadata</span>
    blocks = []
    <span class="kw">for</span> i, (c, score) <span class="kw">in</span> <span class="bi">enumerate</span>(selected, <span class="nm">1</span>):
        blocks.append(
            <span class="st">f"[{i}] chunk_id:{c.chunk_id} doc:{c.doc_id} "</span>
            <span class="st">f"page:{c.page} score:{score:.3f}\n{c.text}"</span>

    user_msg = <span class="st">f"Context:\n\n"</span> + <span class="st">"\n\n---\n\n"</span>.join(blocks) + <span class="st">f"\n\nQuestion: {query}"</span>
    <span class="kw">return</span> Payload(
        system       = SYSTEM_TMPL,
        user         = user_msg,
        chunk_ids    = [c.chunk_id <span class="kw">for</span> c, _ <span class="kw">in</span> selected],
        total_tokens = used,
    )</span>


<span class="s4l"># ════════════════════════════════════════
# STEP 4 — GENERATE
# ════════════════════════════════════════</span>
<span class="da">@dataclass
<span class="kw">class</span> Answer:
    text:          <span class="cls">str</span>
    cited_ids:     <span class="cls">list</span>[<span class="cls">str</span>]  <span class="cm"># chunk IDs found in response</span>
    grounded:      <span class="cls">bool</span>       <span class="cm"># False if model said "don't know"</span>

    output_tokens: <span class="cls">int</span>

<span class="kw">def</span> <span class="fn">generate</span>(payload: Payload) -> Answer:

    <span class="cm"># Grounding check: model admitted it doesn't know</span>
    grounded = <span class="st">"does not contain"</span> <span class="kw">not in</span> text.lower()
    <span class="bi">print</span>(<span class="st">f"tokens — in:{resp.usage.input_tokens} out:{resp.usage.output_tokens}"</span>)
    <span class="kw">return</span> Answer(text, cited, grounded, resp.usage.input_tokens, resp.usage.output_tokens)</span>


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    text    = <span class="bi">open</span>(<span class="st">"policy.txt"</span>).read()
    chunks  = chunk(text, doc_id=<span class="st">"claims_policy_v2"</span>)
    query   = <span class="st">"What is the recovery rate for auto claims?"</span>
    results = search(query, chunks)
    payload = assemble(query, results)

    <span class="bi">print</span>(answer.text)
    <span class="bi">print</span>(<span class="st">f"Cited: {answer.cited_ids} | Grounded: {answer.grounded}"</span>)`
},

{

code:`<span class="im">import</span> re, hashlib, anthropic, numpy <span class="kw">as</span> np
<span class="im">from</span> dataclasses <span class="im">import</span> dataclass
<span class="im">from</span> rank_bm25 <span class="im">import</span> BM25Okapi
<span class="im">from</span> sentence_transformers <span class="im">import</span> SentenceTransformer, CrossEncoder
<span class="im">from</span> sklearn.metrics.pairwise <span class="im">import</span> cosine_similarity

<span class="s1l"># ════════════════════════════════════════

# ════════════════════════════════════════</span>
<span class="cm"># from stage2_chunking_assembly import chunk</span>


<span class="s2l"># ════════════════════════════════════════
# STEP 2 — SEARCH  (BM25 + Dense + RRF + Reranker)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">def</span> <span class="fn">reciprocal_rank_fusion</span>(*lists, k=<span class="nm">60</span>) -> <span class="cls">dict</span>[<span class="cls">int</span>, <span class="cls">float</span>]:
    scores = {}
    <span class="kw">for</span> ranked <span class="kw">in</span> lists:
        <span class="kw">for</span> rank, doc_id <span class="kw">in</span> <span class="bi">enumerate</span>(ranked):
            scores[doc_id] = scores.get(doc_id, <span class="nm">0.0</span>) + <span class="nm">1.0</span> / (k + rank + <span class="nm">1</span>)
    <span class="kw">return</span> scores

<span class="kw">class</span> HybridSearcher:
    <span class="kw">def</span> <span class="fn">__init__</span>(self, chunks: <span class="cls">list</span>[Chunk]):
        self.chunks   = chunks

        self.bm25     = BM25Okapi(tokenised)
        self.encoder  = SentenceTransformer(<span class="st">"BAAI/bge-large-en-v1.5"</span>)
        self.vecs     = self.encoder.encode(
            [c.text <span class="kw">for</span> c <span class="kw">in</span> chunks], normalize_embeddings=<span class="kw">True</span>)

    <span class="kw">def</span> <span class="fn">search</span>(self, query: <span class="cls">str</span>, cand_k=<span class="nm">20</span>, final_k=<span class="nm">8</span>) -> <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]]:

        q_vec   = self.encoder.encode([query], normalize_embeddings=<span class="kw">True</span>)

        rrf     = reciprocal_rank_fusion(bm25_r[:cand_k], dense_r[:cand_k])
        cands   = sorted(rrf, key=rrf.get, reverse=<span class="kw">True</span>)[:cand_k]
        pairs   = [(query, self.chunks[i].text) <span class="kw">for</span> i <span class="kw">in</span> cands]
        ce_sc   = self.reranker.predict(pairs)
        ranked  = sorted(<span class="bi">zip</span>(cands, ce_sc), key=<span class="kw">lambda</span> x: x[<span class="nm">1</span>], reverse=<span class="kw">True</span>)

<span class="s3l"># ════════════════════════════════════════
# STEP 3 — ASSEMBLE  (dedup + stitch + budget)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">def</span> <span class="fn">near_dedup</span>(results: <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]], threshold=<span class="nm">0.92</span>) -> <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]]:
    <span class="st">"""Drop chunks whose text is >92% similar to an already-selected chunk."""</span>
    enc      = SentenceTransformer(<span class="st">"BAAI/bge-large-en-v1.5"</span>)
    kept, kept_vecs = [], []
    <span class="kw">for</span> chunk, score <span class="kw">in</span> results:
        v = enc.encode([chunk.text], normalize_embeddings=<span class="kw">True</span>)[<span class="nm">0</span>]

            <span class="kw">if</span> sims.max() > threshold:

        kept.append((chunk, score))
        kept_vecs.append(v)
    <span class="kw">return</span> kept

<span class="kw">def</span> <span class="fn">stitch_adjacent</span>(results: <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]]) -> <span class="cls">list</span>[<span class="cls">tuple</span>[Chunk, <span class="cls">float</span>]]:

    merged, i   = [], <span class="nm">0</span>

            doc_ordered[i+<span class="nm">1</span>][<span class="nm">0</span>].doc_id == c.doc_id <span class="kw">and</span>
            doc_ordered[i+<span class="nm">1</span>][<span class="nm">0</span>].index  == c.index + <span class="nm">1</span>):

            combined_text = c.text + <span class="st">" "</span> + nxt.text
            stitched = Chunk(combined_text, c.chunk_id + <span class="st">"+"</span> + nxt.chunk_id,
                             c.doc_id, c.page, count_tokens(combined_text), c.index)
            merged.append((stitched, max(s, ns)))
            i += <span class="nm">2</span>
        <span class="kw">else</span>:
            merged.append((c, s))
            i += <span class="nm">1</span>
    <span class="kw">return</span> merged

<span class="kw">def</span> <span class="fn">assemble</span>(query, results, max_ctx_tokens=<span class="nm">3000</span>, doc_order=<span class="kw">True</span>) -> Payload:
    results  = near_dedup(results)        <span class="cm"># 1. remove near-duplicates</span>
    results  = stitch_adjacent(results)   <span class="cm"># 2. merge adjacent same-doc chunks</span>
    results.sort(key=<span class="kw">lambda</span> x: x[<span class="nm">1</span>], reverse=<span class="kw">True</span>)  <span class="cm"># 3. score order for budget</span>
    used, selected = <span class="nm">0</span>, []
    <span class="kw">for</span> c, s <span class="kw">in</span> results:
        <span class="kw">if</span> used + c.tokens > max_ctx_tokens: <span class="kw">break</span>
        selected.append((c, s)); used += c.tokens
    <span class="kw">if</span> doc_order:                         <span class="cm"># 4. re-sort by doc position for LLM</span>
        selected.sort(key=<span class="kw">lambda</span> x: (x[<span class="nm">0</span>].doc_id, x[<span class="nm">0</span>].index))
    blocks = [<span class="st">f"[{i+<span class="nm">1</span>}] chunk:{c.chunk_id} score:{s:.3f}\n{c.text}"</span>
              <span class="kw">for</span> i, (c, s) <span class="kw">in</span> <span class="bi">enumerate</span>(selected)]
    user   = <span class="st">"Context:\n\n"</span> + <span class="st">"\n\n---\n\n"</span>.join(blocks) + <span class="st">f"\n\nQuestion: {query}"</span>
    <span class="kw">return</span> Payload(SYSTEM_TMPL, user, [c.chunk_id <span class="kw">for</span> c, _ <span class="kw">in</span> selected], used)</span>


<span class="s4l"># ════════════════════════════════════════
# STEP 4 — GENERATE  (streaming + grounding score)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">def</span> <span class="fn">grounding_score</span>(answer_text: <span class="cls">str</span>, chunk_ids: <span class="cls">list</span>[<span class="cls">str</span>]) -> <span class="cls">float</span>:
    <span class="st">"""% of sentences that cite at least one retrieved chunk."""</span>
    sents     = [s.strip() <span class="kw">for</span> s <span class="kw">in</span> re.split(<span class="st">r'(?&lt;=[.!?])\s+'</span>, answer_text) <span class="kw">if</span> s.strip()]
    cited_set = <span class="bi">set</span>(chunk_ids)
    cited_ok  = <span class="bi">sum</span>(<span class="nm">1</span> <span class="kw">for</span> s <span class="kw">in</span> sents <span class="kw">if</span> any(cid <span class="kw">in</span> s <span class="kw">for</span> cid <span class="kw">in</span> cited_set))
    <span class="kw">return</span> cited_ok / max(<span class="nm">1</span>, <span class="bi">len</span>(sents))

<span class="kw">def</span> <span class="fn">generate</span>(payload: Payload) -> <span class="cls">dict</span>:
    client = anthropic.Anthropic()
    full_text, in_tok, out_tok = <span class="st">""</span>, <span class="nm">0</span>, <span class="nm">0</span>
    <span class="cm"># stream=True — yields text deltas for UI rendering</span>
    <span class="kw">with</span> client.messages.stream(
        model=<span class="st">"claude-sonnet-4-6"</span>, max_tokens=<span class="nm">768</span>,
        system=payload.system,
        messages=[{<span class="st">"role"</span>:<span class="st">"user"</span>,<span class="st">"content"</span>:payload.user}],
    ) <span class="kw">as</span> stream:
        <span class="kw">for</span> text_delta <span class="kw">in</span> stream.text_stream:
            <span class="bi">print</span>(text_delta, end=<span class="st">""</span>, flush=<span class="kw">True</span>)  <span class="cm"># stream to stdout</span>
            full_text += text_delta
        final = stream.get_final_message()
        in_tok, out_tok = final.usage.input_tokens, final.usage.output_tokens
    <span class="bi">print</span>()  <span class="cm"># newline after stream</span>
    g_score = grounding_score(full_text, payload.chunk_ids)
    log = {<span class="st">"input_tokens"</span>: in_tok, <span class="st">"output_tokens"</span>: out_tok,
           <span class="st">"grounding_score"</span>: g_score, <span class="st">"cited_ids"</span>: re.findall(<span class="st">r'\[([a-f0-9+]{16,})\]'</span>, full_text)}
    <span class="bi">print</span>(<span class="st">f"\\n[log] {log}"</span>)
    <span class="kw">return</span> log</span>


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    text    = <span class="bi">open</span>(<span class="st">"policy.txt"</span>).read()
    chunks  = chunk(text, doc_id=<span class="st">"claims_policy_v2"</span>)
    searcher = HybridSearcher(chunks)
    query   = <span class="st">"recovery rate for water damage claims"</span>
    results = searcher.search(query)
    payload = assemble(query, results)
    log     = generate(payload)`
},

{
num:'Stage 4', title:'LangChain + ContextAssembler class',
desc:'Wraps retrieval in LangChain with HyDE query rewriting. Introduces a dedicated ContextAssembler class that handles dedup, budget, metadata injection, and prompt construction as a unit. Adds fallback requery when the model returns an "insufficient context" response.',

install:'pip install anthropic langchain langchain-anthropic faiss-cpu sentence-transformers rank-bm25',
wn:{

code:`<span class="im">import</span> re, anthropic
<span class="im">from</span> dataclasses <span class="im">import</span> dataclass
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> langchain_community.vectorstores <span class="im">import</span> FAISS
<span class="im">from</span> langchain_community.embeddings <span class="im">import</span> HuggingFaceEmbeddings
<span class="im">from</span> langchain.memory <span class="im">import</span> ConversationBufferWindowMemory
<span class="im">from</span> langchain.docstore.document <span class="im">import</span> Document
<span class="im">from</span> stage2_chunking_assembly <span class="im">import</span> Chunk, chunk, count_tokens


<span class="s1l"># ════════════════════════════════════════
# STEP 1 — CHUNK  (wrap in LangChain Document)
# ════════════════════════════════════════</span>
<span class="kw">def</span> <span class="fn">chunk_to_lc_doc</span>(c: Chunk) -> Document:
    <span class="kw">return</span> Document(
        page_content = c.text,
        metadata     = {<span class="st">"chunk_id"</span>: c.chunk_id, <span class="st">"doc_id"</span>: c.doc_id,
                        <span class="st">"page"</span>: c.page, <span class="st">"tokens"</span>: c.tokens},
    )


<span class="s2l"># ════════════════════════════════════════
# STEP 2 — SEARCH  (HyDE + FAISS MMR)
# ════════════════════════════════════════</span>
<span class="da">HYDE_PROMPT = <span class="st">"""Write a paragraph that directly answers this question as if
from a Wells Fargo claims policy document. Do not explain — just answer.
Question: {question}
Hypothetical answer:"""</span>

<span class="kw">def</span> <span class="fn">hyde_rewrite</span>(query: <span class="cls">str</span>, llm: ChatAnthropic) -> <span class="cls">str</span>:
    <span class="st">"""Embed the hypothetical answer — closer to real answer chunks."""</span>
    <span class="kw">return</span> llm.invoke(HYDE_PROMPT.format(question=query)).content

<span class="kw">def</span> <span class="fn">build_retriever</span>(chunks: <span class="cls">list</span>[Chunk]):
    embedder   = HuggingFaceEmbeddings(
        model_name=<span class="st">"BAAI/bge-large-en-v1.5"</span>,
        encode_kwargs={<span class="st">"normalize_embeddings"</span>: <span class="kw">True</span>})
    docs       = [chunk_to_lc_doc(c) <span class="kw">for</span> c <span class="kw">in</span> chunks]
    vectorstore = FAISS.from_documents(docs, embedder)
    <span class="kw">return</span> vectorstore.as_retriever(
        search_type   = <span class="st">"mmr"</span>,
        search_kwargs = {<span class="st">"k"</span>: <span class="nm">8</span>, <span class="st">"fetch_k"</span>: <span class="nm">30</span>},  <span class="cm"># MMR for diversity</span>
    )

<span class="kw">def</span> <span class="fn">search</span>(query: <span class="cls">str</span>, retriever, llm) -> <span class="cls">list</span>[Document]:
    rewritten = hyde_rewrite(query, llm)   <span class="cm"># HyDE rewrite first</span>
    <span class="kw">return</span> retriever.invoke(rewritten)</span>


<span class="s3l"># ════════════════════════════════════════
# STEP 3 — ASSEMBLE  (ContextAssembler class)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">class</span> ContextAssembler:
    <span class="st">"""Single-responsibility class for payload construction."""</span>

    SYSTEM = <span class="st">"""You are a Claims AI assistant at Wells Fargo.
Answer using ONLY the numbered context blocks below.
Cite sources using [chunk_id] notation.
If context is insufficient, respond: "INSUFFICIENT_CONTEXT"."""</span>

    <span class="kw">def</span> <span class="fn">__init__</span>(self, max_ctx_tokens=<span class="nm">3500</span>, dedup_threshold=<span class="nm">0.92</span>):
        self.max_ctx_tokens  = max_ctx_tokens
        self.dedup_threshold = dedup_threshold

    <span class="kw">def</span> <span class="fn">deduplicate</span>(self, docs: <span class="cls">list</span>[Document]) -> <span class="cls">list</span>[Document]:
        seen_ids, result = <span class="bi">set</span>(), []
        <span class="kw">for</span> d <span class="kw">in</span> docs:
            cid = d.metadata.get(<span class="st">"chunk_id"</span>, <span class="st">""</span>)
            <span class="kw">if</span> cid <span class="kw">not in</span> seen_ids:
                seen_ids.add(cid); result.append(d)
        <span class="kw">return</span> result

    <span class="kw">def</span> <span class="fn">budget_trim</span>(self, docs: <span class="cls">list</span>[Document]) -> <span class="cls">list</span>[Document]:
        used, kept = <span class="nm">0</span>, []
        <span class="kw">for</span> d <span class="kw">in</span> docs:
            tok = d.metadata.get(<span class="st">"tokens"</span>) <span class="kw">or</span> count_tokens(d.page_content)
            <span class="kw">if</span> used + tok > self.max_ctx_tokens: <span class="kw">break</span>
            kept.append(d); used += tok
        <span class="kw">return</span> kept

    <span class="kw">def</span> <span class="fn">build_prompt</span>(self, query: <span class="cls">str</span>, docs: <span class="cls">list</span>[Document], memory_str=<span class="st">""</span>) -> <span class="cls">str</span>:
        blocks = []
        <span class="kw">for</span> i, d <span class="kw">in</span> <span class="bi">enumerate</span>(docs, <span class="nm">1</span>):
            m = d.metadata
            blocks.append(
                <span class="st">f"[{i}] chunk:{m.get('chunk_id','?')} doc:{m.get('doc_id','?')} page:{m.get('page','?')}\n"</span>
                + d.page_content
            )
        ctx_str  = <span class="st">"\n\n---\n\n"</span>.join(blocks)
        hist_str = <span class="st">f"\nConversation history:\n{memory_str}\n"</span> <span class="kw">if</span> memory_str <span class="kw">else</span> <span class="st">""</span>
        <span class="kw">return</span> <span class="st">f"Context:\n\n{ctx_str}{hist_str}\n\nQuestion: {query}"</span>

    <span class="kw">def</span> <span class="fn">assemble</span>(self, query, docs, memory_str=<span class="st">""</span>):
        docs = self.deduplicate(docs)
        docs = self.budget_trim(docs)
        user = self.build_prompt(query, docs, memory_str)
        ids  = [d.metadata.get(<span class="st">"chunk_id"</span>, <span class="st">""</span>) <span class="kw">for</span> d <span class="kw">in</span> docs]
        <span class="kw">return</span> {<span class="st">"system"</span>: self.SYSTEM, <span class="st">"user"</span>: user, <span class="st">"chunk_ids"</span>: ids}</span>


<span class="s4l"># ════════════════════════════════════════
# STEP 4 — GENERATE  (fallback requery)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">def</span> <span class="fn">generate</span>(payload: <span class="cls">dict</span>, query: <span class="cls">str</span>, retriever, assembler, llm,
             memory: ConversationBufferWindowMemory) -> <span class="cls">str</span>:
    client = anthropic.Anthropic()

    <span class="kw">def</span> <span class="fn">_call</span>(p):
        resp = client.messages.create(
            model=<span class="st">"claude-sonnet-4-6"</span>, max_tokens=<span class="nm">768</span>,
            system=p[<span class="st">"system"</span>],
            messages=[{<span class="st">"role"</span>:<span class="st">"user"</span>,<span class="st">"content"</span>:p[<span class="st">"user"</span>]}])
        <span class="kw">return</span> resp.content[<span class="nm">0</span>].text, resp.usage

    text, usage = _call(payload)

    <span class="cm"># Fallback: if model flagged insufficient context, rewrite and retry once</span>
    <span class="kw">if</span> <span class="st">"INSUFFICIENT_CONTEXT"</span> <span class="kw">in</span> text:
        rewritten  = llm.invoke(<span class="st">f"Rephrase this question for better document retrieval: {query}"</span>).content
        new_docs   = retriever.invoke(rewritten)
        new_payload = assembler.assemble(rewritten, new_docs)
        text, usage = _call(new_payload)

    <span class="cm"># Save turn to memory for next query</span>
    memory.save_context({<span class="st">"input"</span>: query}, {<span class="st">"output"</span>: text})
    <span class="bi">print</span>(<span class="st">f"[tokens] in:{usage.input_tokens} out:{usage.output_tokens}"</span>)
    <span class="kw">return</span> text</span>


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    text      = <span class="bi">open</span>(<span class="st">"policy.txt"</span>).read()
    chunks    = chunk(text, doc_id=<span class="st">"claims_policy_v2"</span>)
    llm       = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)
    retriever = build_retriever(chunks)
    assembler = ContextAssembler()
    memory    = ConversationBufferWindowMemory(k=<span class="nm">5</span>)
    query     = <span class="st">"What is the recovery rate for water damage claims?"</span>
    docs      = search(query, retriever, llm)
    payload   = assembler.assemble(query, docs, memory.load_memory_variables({}))
    answer    = generate(payload, query, retriever, assembler, llm, memory)
    <span class="bi">print</span>(answer)`
},

{
num:'Stage 5', title:'Production — async, pgvector, SR 11-7',
desc:'Full async pipeline. pgvector stores chunks with tenant isolation. PayloadBuilder handles dedup, stitching, budget, and system prompt construction. AsyncAnthropic streams the response. Every step writes a structured audit event — SR 11-7 compliant end-to-end.',
tags:[{l:'asyncio',c:'tc'},{l:'pgvector',c:'ta'},{l:'Multi-tenant',c:'tp'},{l:'PayloadBuilder',c:'tg'},{l:'SR 11-7 audit',c:'tr'},{l:'Streaming',c:'tb'}],
filename:'stage5_production.py',
install:'pip install anthropic asyncpg pgvector pydantic structlog tenacity sentence-transformers',
wn:{
  chunk:['<code>ProductionChunk(BaseModel)</code> — Pydantic-validated at ingest','<code>embedding_model</code> field tracks which model version produced the vector — SR 11-7 requirement','Async ingestion: <code>await ingest_chunk(conn, chunk, embedding)</code>'],
  search:['<code>pgvector</code>: <code>embedding &lt;=&gt; $1::vector</code> cosine operator in SQL','<code>WHERE tenant_id = $2</code> — single line prevents cross-tenant leakage','<code>@retry(stop_after_attempt(3))</code> on DB calls'],

  generate:['<code>AsyncAnthropic().messages.stream()</code> — async streaming','Token meter accumulates <code>input_tokens</code> + <code>output_tokens</code>','<code>RetrievalAuditEvent</code> Pydantic model written to structlog as JSON','Grounding score computed and included in audit event'],
},
code:`<span class="im">import</span> asyncio, hashlib, re, os, time
<span class="im">import</span> structlog
<span class="im">from</span> pydantic <span class="im">import</span> BaseModel, Field
<span class="im">from</span> dataclasses <span class="im">import</span> dataclass
<span class="im">from</span> datetime <span class="im">import</span> datetime, timezone
<span class="im">from</span> tenacity <span class="im">import</span> retry, stop_after_attempt, wait_exponential
<span class="im">from</span> anthropic <span class="im">import</span> AsyncAnthropic
<span class="im">import</span> asyncpg
<span class="im">from</span> pgvector.asyncpg <span class="im">import</span> register_vector
<span class="im">from</span> sentence_transformers <span class="im">import</span> SentenceTransformer
<span class="im">from</span> stage2_chunking_assembly <span class="im">import</span> chunk, count_tokens

log = structlog.get_logger()   <span class="cm"># structured JSON to stdout</span>


<span class="s1l"># ════════════════════════════════════════
# STEP 1 — CHUNK  (Pydantic-typed, async ingest)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">class</span> ProductionChunk(BaseModel):
    chunk_id:        <span class="cls">str</span>
    tenant_id:       <span class="cls">str</span>
    doc_id:          <span class="cls">str</span>
    text:            <span class="cls">str</span>
    tokens:          <span class="cls">int</span>
    page:            <span class="cls">int</span>
    index:           <span class="cls">int</span>
    embedding_model: <span class="cls">str</span>      <span class="cm"># SR 11-7: track model version</span>
    ingested_at:     <span class="cls">str</span> = Field(default_factory=<span class="kw">lambda</span>: datetime.now(timezone.utc).isoformat())

<span class="kw">async def</span> <span class="fn">ingest_chunk</span>(conn, pc: ProductionChunk, embedding: <span class="cls">list</span>[<span class="cls">float</span>]):
    <span class="kw">await</span> conn.execute(<span class="st">"""
        INSERT INTO chunks (chunk_id,tenant_id,doc_id,text,tokens,page,
                            "index",embedding,embedding_model,ingested_at)
        VALUES ($1,$2,$3,$4,$5,$6,$7,$8::vector,$9,$10)
        ON CONFLICT (chunk_id) DO NOTHING
    """</span>, pc.chunk_id, pc.tenant_id, pc.doc_id, pc.text, pc.tokens,
       pc.page, pc.index, embedding, pc.embedding_model, pc.ingested_at)</span>


<span class="s2l"># ════════════════════════════════════════
# STEP 2 — SEARCH  (pgvector, tenant-isolated)
# ════════════════════════════════════════</span>
<span class="da">EMBED_MODEL = <span class="st">"BAAI/bge-large-en-v1.5"</span>
_encoder    = SentenceTransformer(EMBED_MODEL)

@retry(stop=stop_after_attempt(<span class="nm">3</span>), wait=wait_exponential(min=<span class="nm">1</span>, max=<span class="nm">8</span>))
<span class="kw">async def</span> <span class="fn">search</span>(conn, query: <span class="cls">str</span>, tenant_id: <span class="cls">str</span>, k=<span class="nm">10</span>) -> <span class="cls">list</span>[<span class="cls">dict</span>]:
    emb = _encoder.encode([query], normalize_embeddings=<span class="kw">True</span>)[<span class="nm">0</span>].tolist()
    rows = <span class="kw">await</span> conn.fetch(<span class="st">"""
        SELECT chunk_id, doc_id, text, tokens, page, "index",
               1 - (embedding &lt;=&gt; $1::vector) AS score
        FROM   chunks
        WHERE  tenant_id = $2          -- tenant isolation
        ORDER  BY embedding &lt;=&gt; $1::vector
        LIMIT  $3
    """</span>, emb, tenant_id, k)
    <span class="kw">return</span> [<span class="bi">dict</span>(r) <span class="kw">for</span> r <span class="kw">in</span> rows]</span>


<span class="s3l"># ════════════════════════════════════════
# STEP 3 — ASSEMBLE  (PayloadBuilder)
# ════════════════════════════════════════</span>
<span class="da">@dataclass
<span class="kw">class</span> Payload:
    system:       <span class="cls">str</span>
    user:         <span class="cls">str</span>
    chunk_ids:    <span class="cls">list</span>[<span class="cls">str</span>]
    total_tokens: <span class="cls">int</span>
    build_ms:     <span class="cls">float</span>

<span class="kw">class</span> PayloadBuilder:
    COMPLIANCE_HEADER = <span class="st">"""You are a regulated AI assistant (Wells Fargo Claims).
Answer ONLY from the context. Cite [chunk_id]. If insufficient: say INSUFFICIENT_CONTEXT.
This interaction is logged for SR 11-7 model risk compliance."""</span>

    <span class="kw">def</span> <span class="fn">__init__</span>(self, max_ctx_tokens=<span class="nm">3500</span>):
        self.max_ctx_tokens = max_ctx_tokens

    <span class="kw">def</span> <span class="fn">build</span>(self, query: <span class="cls">str</span>, rows: <span class="cls">list</span>[<span class="cls">dict</span>],
               query_hash: <span class="cls">str</span>, tenant_id: <span class="cls">str</span>) -> Payload:
        t0 = time.monotonic()
        <span class="cm"># 1. Dedup by chunk_id</span>
        seen, deduped = <span class="bi">set</span>(), []
        <span class="kw">for</span> r <span class="kw">in</span> rows:
            <span class="kw">if</span> r[<span class="st">"chunk_id"</span>] <span class="kw">not in</span> seen:
                seen.add(r[<span class="st">"chunk_id"</span>]); deduped.append(r)
        <span class="cm"># 2. Adjacent stitch (same doc, consecutive index)</span>
        deduped.sort(key=<span class="kw">lambda</span> x: (x[<span class="st">"doc_id"</span>], x[<span class="st">"index"</span>]))
        stitched, i = [], <span class="nm">0</span>
        <span class="kw">while</span> i < <span class="bi">len</span>(deduped):
            r = deduped[i]
            <span class="kw">if</span> (i + <span class="nm">1</span> < <span class="bi">len</span>(deduped) <span class="kw">and</span>
                deduped[i+<span class="nm">1</span>][<span class="st">"doc_id"</span>] == r[<span class="st">"doc_id"</span>] <span class="kw">and</span>
                deduped[i+<span class="nm">1</span>][<span class="st">"index"</span>]  == r[<span class="st">"index"</span>] + <span class="nm">1</span>):
                merged = <span class="bi">dict</span>(r)
                merged[<span class="st">"text"</span>]     = r[<span class="st">"text"</span>] + <span class="st">" "</span> + deduped[i+<span class="nm">1</span>][<span class="st">"text"</span>]
                merged[<span class="st">"tokens"</span>]   = r[<span class="st">"tokens"</span>] + deduped[i+<span class="nm">1</span>][<span class="st">"tokens"</span>]
                merged[<span class="st">"chunk_id"</span>] = r[<span class="st">"chunk_id"</span>] + <span class="st">"+"</span> + deduped[i+<span class="nm">1</span>][<span class="st">"chunk_id"</span>]
                stitched.append(merged); i += <span class="nm">2</span>
            <span class="kw">else</span>:

        <span class="cm"># 3. Score-order budget trim</span>
        stitched.sort(key=<span class="kw">lambda</span> x: x[<span class="st">"score"</span>], reverse=<span class="kw">True</span>)
        used, selected = <span class="nm">0</span>, []
        <span class="kw">for</span> r <span class="kw">in</span> stitched:
            <span class="kw">if</span> used + r[<span class="st">"tokens"</span>] > self.max_ctx_tokens: <span class="kw">break</span>
            selected.append(r); used += r[<span class="st">"tokens"</span>]
        <span class="cm"># 4. Doc-order sort for LLM comprehension</span>
        selected.sort(key=<span class="kw">lambda</span> x: (x[<span class="st">"doc_id"</span>], x[<span class="st">"index"</span>]))
        <span class="cm"># 5. Build numbered blocks with metadata</span>
        blocks = [
            <span class="st">f"[{i+<span class="nm">1</span>}] chunk:{r['chunk_id']} doc:{r['doc_id']} "</span>
            <span class="st">f"page:{r['page']} score:{r['score']:.3f}\n{r['text']}"</span>
            <span class="kw">for</span> i, r <span class="kw">in</span> <span class="bi">enumerate</span>(selected)
        ]
        sys_prompt = (self.COMPLIANCE_HEADER +
                      <span class="st">f"\ntenant:{tenant_id} query_hash:{query_hash}"</span>)
        user_msg   = <span class="st">"Context:\n\n"</span> + <span class="st">"\n\n---\n\n"</span>.join(blocks) + <span class="st">f"\n\nQuestion: {query}"</span>
        <span class="kw">return</span> Payload(sys_prompt, user_msg,
                       [r[<span class="st">"chunk_id"</span>] <span class="kw">for</span> r <span class="kw">in</span> selected], used,
                       (time.monotonic() - t0) * <span class="nm">1000</span>)</span>


<span class="s4l"># ════════════════════════════════════════
# STEP 4 — GENERATE  (async stream + audit)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">class</span> AuditEvent(BaseModel):
    query_hash:      <span class="cls">str</span>
    tenant_id:       <span class="cls">str</span>
    chunk_ids:       <span class="cls">list</span>[<span class="cls">str</span>]
    total_ctx_tokens: <span class="cls">int</span>
    input_tokens:    <span class="cls">int</span>
    output_tokens:   <span class="cls">int</span>
    grounding_score: <span class="cls">float</span>
    build_ms:        <span class="cls">float</span>
    total_ms:        <span class="cls">float</span>
    timestamp:       <span class="cls">str</span> = Field(default_factory=<span class="kw">lambda</span>: datetime.now(timezone.utc).isoformat())

<span class="kw">async def</span> <span class="fn">generate</span>(payload: Payload, query_hash: <span class="cls">str</span>, tenant_id: <span class="cls">str</span>) -> <span class="cls">str</span>:
    t0, full_text = time.monotonic(), <span class="st">""</span>
    client = AsyncAnthropic()

        model=<span class="st">"claude-sonnet-4-6"</span>, max_tokens=<span class="nm">768</span>,
        system=payload.system,
        messages=[{<span class="st">"role"</span>:<span class="st">"user"</span>,<span class="st">"content"</span>:payload.user}],
    ) <span class="kw">as</span> stream:
        <span class="kw">async for</span> delta <span class="kw">in</span> stream.text_stream:
            <span class="bi">print</span>(delta, end=<span class="st">""</span>, flush=<span class="kw">True</span>)
            full_text += delta
        final = <span class="kw">await</span> stream.get_final_message()
    <span class="bi">print</span>()
    sents     = re.split(<span class="st">r'(?&lt;=[.!?])\s+'</span>, full_text)
    cited_set = <span class="bi">set</span>(payload.chunk_ids)
    g_score   = <span class="bi">sum</span>(<span class="nm">1</span> <span class="kw">for</span> s <span class="kw">in</span> sents <span class="kw">if</span> any(c <span class="kw">in</span> s <span class="kw">for</span> c <span class="kw">in</span> cited_set)) / max(<span class="nm">1</span>, <span class="bi">len</span>(sents))
    event     = AuditEvent(
        query_hash=query_hash, tenant_id=tenant_id,
        chunk_ids=payload.chunk_ids,
        total_ctx_tokens=payload.total_tokens,
        input_tokens=final.usage.input_tokens,
        output_tokens=final.usage.output_tokens,
        grounding_score=round(g_score, <span class="nm">3</span>),

<span class="kw">async def</span> <span class="fn">main</span>():
    db   = <span class="kw">await</span> asyncpg.create_pool(os.environ[<span class="st">"DATABASE_URL"</span>])

{

code:`<span class="im">import</span> asyncio, hashlib, os, re
<span class="im">from</span> typing <span class="im">import</span> TypedDict
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END
<span class="im">from</span> langgraph.checkpoint.memory <span class="im">import</span> MemorySaver
<span class="im">from</span> anthropic <span class="im">import</span> AsyncAnthropic
<span class="im">import</span> asyncpg
<span class="im">from</span> pgvector.asyncpg <span class="im">import</span> register_vector
<span class="im">from</span> stage5_production <span class="im">import</span> search, PayloadBuilder, generate, AuditEvent
<span class="im">import</span> structlog

log = structlog.get_logger()


<span class="s1l"># ════════════════════════════════════════
# STEP 1 — CHUNK  (pre-step, not in graph)
# ════════════════════════════════════════</span>
<span class="cm"># Chunks are already ingested to pgvector (Stage 5).
# The graph starts from retrieval — chunking is an offline pipeline.</span>


<span class="s2l"># ════════════════════════════════════════
# STEP 2 — SEARCH  (retrieve + grade + rewrite nodes)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">class</span> RAGState(TypedDict):
    query:            <span class="cls">str</span>
    tenant_id:        <span class="cls">str</span>
    rewritten_query:  <span class="cls">str</span> | <span class="kw">None</span>
    rows:             <span class="cls">list</span>[<span class="cls">dict</span>]     <span class="cm"># raw DB rows</span>
    doc_grade:        <span class="cls">float</span>           <span class="cm"># 0–1 relevance of retrieved docs</span>
    payload:          <span class="cls">dict</span> | <span class="kw">None</span>     <span class="cm"># assembled payload</span>
    answer:           <span class="cls">str</span> | <span class="kw">None</span>
    answer_grade:     <span class="cls">float</span>           <span class="cm"># 0–1 grounding score</span>
    needs_human:      <span class="cls">bool</span>
    iterations:       <span class="cls">int</span>
    audit_trail:      <span class="cls">list</span>[<span class="cls">dict</span>]     <span class="cm"># SR 11-7</span>

<span class="kw">async def</span> <span class="fn">retrieve_node</span>(state: RAGState, conn) -> RAGState:
    q    = state[<span class="st">"rewritten_query"</span>] <span class="kw">or</span> state[<span class="st">"query"</span>]
    rows = <span class="kw">await</span> search(conn, q, state[<span class="st">"tenant_id"</span>], k=<span class="nm">12</span>)
    state[<span class="st">"rows"</span>] = rows
    state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"retrieve"</span>,<span class="st">"query"</span>:q,<span class="st">"n_rows"</span>:<span class="bi">len</span>(rows)})
    <span class="kw">return</span> state

<span class="kw">async def</span> <span class="fn">grade_node</span>(state: RAGState) -> RAGState:
    client  = AsyncAnthropic()
    ctx     = <span class="st">"\n\n"</span>.join(r[<span class="st">"text"</span>][:<span class="nm">300</span>] <span class="kw">for</span> r <span class="kw">in</span> state[<span class="st">"rows"</span>][:<span class="nm">3</span>])
    resp    = <span class="kw">await</span> client.messages.create(
        model=<span class="st">"claude-sonnet-4-6"</span>, max_tokens=<span class="nm">5</span>,
        messages=[{<span class="st">"role"</span>:<span class="st">"user"</span>,<span class="st">"content"</span>:
            <span class="st">f"Query: {state['query']}\n\nDocs:\n{ctx}\n\nRate relevance 0.0-1.0. Reply number only."</span>}])
    <span class="kw">try</span>: grade = <span class="cls">float</span>(resp.content[<span class="nm">0</span>].text.strip())
    <span class="kw">except</span>: grade = <span class="nm">0.5</span>
    state[<span class="st">"doc_grade"</span>]   = grade
    state[<span class="st">"needs_human"</span>]  = <span class="nm">0.4</span> &lt;= grade &lt; <span class="nm">0.7</span>
    state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"grade"</span>,<span class="st">"doc_grade"</span>:grade})
    <span class="kw">return</span> state

<span class="kw">def</span> <span class="fn">route_after_grade</span>(state: RAGState) -> <span class="cls">str</span>:
    <span class="kw">if</span> state[<span class="st">"doc_grade"</span>] &lt; <span class="nm">0.4</span>:  <span class="kw">return</span> <span class="st">"rewrite"</span>
    <span class="kw">if</span> state[<span class="st">"needs_human"</span>]:       <span class="kw">return</span> <span class="st">"human_review"</span>
    <span class="kw">return</span> <span class="st">"assemble"</span>

<span class="kw">async def</span> <span class="fn">rewrite_node</span>(state: RAGState) -> RAGState:
    <span class="kw">if</span> state[<span class="st">"iterations"</span>] >= <span class="nm">3</span>:   <span class="cm"># hard stop — prevent infinite loop</span>
        state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"rewrite"</span>,<span class="st">"action"</span>:<span class="st">"max_iterations_hit"</span>})
        <span class="kw">return</span> state
    client   = AsyncAnthropic()
    resp     = <span class="kw">await</span> client.messages.create(
        model=<span class="st">"claude-sonnet-4-6"</span>, max_tokens=<span class="nm">80</span>,
        messages=[{<span class="st">"role"</span>:<span class="st">"user"</span>,<span class="st">"content"</span>:
            <span class="st">f"The query '{state['query']}' returned poor docs (grade={state['doc_grade']:.2f}).\n"</span>
            <span class="st">f"Rewrite it for better retrieval. Reply with the new query only."</span>}])
    rw = resp.content[<span class="nm">0</span>].text.strip()
    state[<span class="st">"rewritten_query"</span>] = rw
    state[<span class="st">"iterations"</span>]      += <span class="nm">1</span>
    state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"rewrite"</span>,<span class="st">"rewritten"</span>:rw,<span class="st">"iter"</span>:state[<span class="st">"iterations"</span>]})
    <span class="kw">return</span> state</span>


<span class="s3l"># ════════════════════════════════════════
# STEP 3 — ASSEMBLE  (assemble_node)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">async def</span> <span class="fn">assemble_node</span>(state: RAGState) -> RAGState:
    q_hash  = hashlib.sha256(state[<span class="st">"query"</span>].encode()).hexdigest()[:<span class="nm">16</span>]
    builder = PayloadBuilder(max_ctx_tokens=<span class="nm">3500</span>)
    pl      = builder.build(
        query      = state[<span class="st">"rewritten_query"</span>] <span class="kw">or</span> state[<span class="st">"query"</span>],
        rows       = state[<span class="st">"rows"</span>],
        query_hash = q_hash,
        tenant_id  = state[<span class="st">"tenant_id"</span>],
    )
    state[<span class="st">"payload"</span>] = {
        <span class="st">"system"</span>:       pl.system,
        <span class="st">"user"</span>:         pl.user,
        <span class="st">"chunk_ids"</span>:    pl.chunk_ids,
        <span class="st">"total_tokens"</span>: pl.total_tokens,
    }
    state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"assemble"</span>,
        <span class="st">"n_chunks"</span>:<span class="bi">len</span>(pl.chunk_ids),<span class="st">"ctx_tokens"</span>:pl.total_tokens})
    <span class="kw">return</span> state</span>


<span class="s4l"># ════════════════════════════════════════
# STEP 4 — GENERATE  (stream + answer grader + check node)
# ════════════════════════════════════════</span>
<span class="da"><span class="kw">async def</span> <span class="fn">generate_node</span>(state: RAGState) -> RAGState:
    pl     = state[<span class="st">"payload"</span>]
    client = AsyncAnthropic()
    full   = <span class="st">""</span>
    <span class="kw">async with</span> client.messages.stream(
        model=<span class="st">"claude-sonnet-4-6"</span>, max_tokens=<span class="nm">768</span>,
        system=pl[<span class="st">"system"</span>],
        messages=[{<span class="st">"role"</span>:<span class="st">"user"</span>,<span class="st">"content"</span>:pl[<span class="st">"user"</span>]}],
    ) <span class="kw">as</span> stream:
        <span class="kw">async for</span> d <span class="kw">in</span> stream.text_stream:
            <span class="bi">print</span>(d, end=<span class="st">""</span>, flush=<span class="kw">True</span>); full += d
        final = <span class="kw">await</span> stream.get_final_message()
    <span class="bi">print</span>()
    state[<span class="st">"answer"</span>] = full
    state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"generate"</span>,
        <span class="st">"in_tok"</span>:final.usage.input_tokens,<span class="st">"out_tok"</span>:final.usage.output_tokens})
    <span class="kw">return</span> state

<span class="kw">async def</span> <span class="fn">check_node</span>(state: RAGState) -> RAGState:
    <span class="st">"""Grade the answer itself — re-enter loop if grounding too low."""</span>
    ans   = state[<span class="st">"answer"</span>] <span class="kw">or</span> <span class="st">""</span>
    cids  = <span class="bi">set</span>(state[<span class="st">"payload"</span>][<span class="st">"chunk_ids"</span>])
    sents = re.split(<span class="st">r'(?&lt;=[.!?])\s+'</span>, ans)
    g     = <span class="bi">sum</span>(<span class="nm">1</span> <span class="kw">for</span> s <span class="kw">in</span> sents <span class="kw">if</span> any(c <span class="kw">in</span> s <span class="kw">for</span> c <span class="kw">in</span> cids)) / max(<span class="nm">1</span>,<span class="bi">len</span>(sents))
    state[<span class="st">"answer_grade"</span>] = g
    state[<span class="st">"audit_trail"</span>].append({<span class="st">"node"</span>:<span class="st">"check"</span>,<span class="st">"answer_grade"</span>:round(g,<span class="nm">3</span>)})
    <span class="kw">await</span> log.ainfo(<span class="st">"rag_complete"</span>, audit=state[<span class="st">"audit_trail"</span>])
    <span class="kw">return</span> state

<span class="kw">def</span> <span class="fn">route_after_check</span>(state: RAGState) -> <span class="cls">str</span>:
    <span class="cm"># If answer is poorly grounded and we have retries left, rewrite</span>
    <span class="kw">if</span> state[<span class="st">"answer_grade"</span>] &lt; <span class="nm">0.4</span> <span class="kw">and</span> state[<span class="st">"iterations"</span>] &lt; <span class="nm">3</span>:
        <span class="kw">return</span> <span class="st">"rewrite"</span>
    <span class="kw">return</span> END


<span class="cm"># ── Build and compile the graph ──────────────────────────</span>
<span class="da"><span class="kw">def</span> <span class="fn">build_graph</span>(conn) -> StateGraph:
    <span class="im">from</span> functools <span class="im">import</span> partial
    wf = StateGraph(RAGState)
    wf.add_node(<span class="st">"retrieve"</span>,    partial(retrieve_node, conn=conn))
    wf.add_node(<span class="st">"grade"</span>,       grade_node)
    wf.add_node(<span class="st">"rewrite"</span>,     rewrite_node)
    wf.add_node(<span class="st">"assemble"</span>,    assemble_node)
    wf.add_node(<span class="st">"human_review"</span>,<span class="kw">lambda</span> s: s)   <span class="cm"># pause point</span>
    wf.add_node(<span class="st">"generate"</span>,    generate_node)
    wf.add_node(<span class="st">"check"</span>,       check_node)
    wf.set_entry_point(<span class="st">"retrieve"</span>)
    wf.add_edge(<span class="st">"retrieve"</span>,    <span class="st">"grade"</span>)
    wf.add_conditional_edges(<span class="st">"grade"</span>, route_after_grade,
        {<span class="st">"rewrite"</span>:<span class="st">"rewrite"</span>,<span class="st">"human_review"</span>:<span class="st">"human_review"</span>,<span class="st">"assemble"</span>:<span class="st">"assemble"</span>})
    wf.add_edge(<span class="st">"rewrite"</span>,     <span class="st">"retrieve"</span>)   <span class="cm"># CRAG loop</span>
    wf.add_edge(<span class="st">"human_review"</span>,<span class="st">"assemble"</span>)   <span class="cm"># human approves → continue</span>
    wf.add_edge(<span class="st">"assemble"</span>,    <span class="st">"generate"</span>)
    wf.add_edge(<span class="st">"generate"</span>,    <span class="st">"check"</span>)
    wf.add_conditional_edges(<span class="st">"check"</span>, route_after_check,
        {<span class="st">"rewrite"</span>:<span class="st">"rewrite"</span>, END:END})
    <span class="kw">return</span> wf.compile(
        checkpointer=MemorySaver(),
        interrupt_before=[<span class="st">"generate"</span>],  <span class="cm"># pause when needs_human=True</span>
    )</span>

<span class="kw">async def</span> <span class="fn">main</span>():
    db   = <span class="kw">await</span> asyncpg.create_pool(os.environ[<span class="st">"DATABASE_URL"</span>])
    <span class="kw">async with</span> db.acquire() <span class="kw">as</span> conn:
        <span class="kw">await</span> register_vector(conn)
        app   = build_graph(conn)
        state = RAGState(
            query=<span class="st">"recovery rate for water damage claims"</span>,
            tenant_id=<span class="st">"wellsfargo_claims"</span>, rewritten_query=<span class="kw">None</span>,
            rows=[], doc_grade=<span class="nm">0.0</span>, payload=<span class="kw">None</span>,
            answer=<span class="kw">None</span>, answer_grade=<span class="nm">0.0</span>, needs_human=<span class="kw">False</span>,
            iterations=<span class="nm">0</span>, audit_trail=[],

const QUESTIONS = [
  // Stage 1 — Naive RAG
  [
    {q:"Why does paragraph split break retrieval quality?", a:"split(\"\\n\\n\") has no awareness of sentence or semantic boundaries — it cuts wherever a blank line happens to fall, which can sever a sentence mid-thought or split a single idea across two chunks. Neither chunk alone then carries enough context for retrieval to match it correctly, and even if retrieved, the LLM gets a fragment instead of a complete thought.", mnemonic:"Blank lines aren't semantic boundaries", steps:["Doc text","Split on \\n\\n","Mid-sentence cut","Fragment retrieved"]},
    {q:"What's wrong with a 3-line f-string payload?", a:"It has no dedup, no token budget, and no ordering logic — chunks go in exactly as retrieved, score order, with no check for near-duplicate content or whether the total exceeds what the model should reasonably process. In production this wastes context window on redundant text and can silently exceed cost/latency expectations.", mnemonic:"No budget, no dedup, no order = no control", steps:["Retrieved chunks","Raw join()","No checks","Sent as-is"]},
    {q:"When is naive RAG actually good enough?", a:"For prototypes, internal tools with low stakes, or corpora small and uniform enough that TF-IDF cosine similarity reliably finds the right chunk. If the document set is under a few hundred chunks and queries are keyword-heavy, the simplicity is a feature, not a liability — added complexity only pays off once you hit its failure modes.", mnemonic:"Small + uniform + low-stakes = naive is fine", steps:["Small corpus","Keyword queries","Low stakes","Naive RAG suffices"]},
  ],
  // Stage 2 — Proper Chunking + Basic Assembly
  [
    {q:"Why SHA-256 and not UUID for chunk IDs?", a:"SHA-256 is content-addressed — the ID is deterministically derived from the chunk's text, so re-ingesting the same document produces the same chunk_id and you get free deduplication. A UUID is random and would produce a new ID every time you re-chunk the same content, making it impossible to tell if a chunk is actually new or just re-processed.", mnemonic:"Content hash = same text, same ID, free dedup", steps:["Chunk text","SHA-256 hash","Same text again","Same ID → dedup"]},
    {q:"How does token budget affect answer quality?", a:"Without a budget, low-relevance chunks can crowd out high-relevance ones simply because they were retrieved alongside them, or the total context can exceed what the model attends to well. Enforcing a budget — and dropping the lowest-scored chunks first — keeps the LLM focused on the most relevant material rather than diluting attention across marginal content.", mnemonic:"Budget keeps signal dense, drops the noise first", steps:["All retrieved","Sort by score","Trim to budget","Dense, relevant context"]},
    {q:"What should the system prompt say for Claims AI?", a:"It needs three things: an explicit instruction to answer only from the provided context (not parametric memory), a required citation format like [chunk_id] so every claim is traceable, and an explicit fallback phrase for insufficient context — something like \"The provided context does not contain enough information\" — so the model has a clean way to say it doesn't know rather than guessing.", mnemonic:"Context-only + cite + explicit fallback phrase", steps:["System prompt","Context-only rule","Citation format","Fallback phrase"]},
  ],

  [
    {q:"Why use RRF instead of normalising scores?", a:"BM25 scores and dense cosine scores live in completely different numerical ranges and distributions — normalising them to combine fairly is fragile and needs per-dataset tuning. RRF sidesteps this by operating purely on rank position (1/(k+rank)), so it never needs to know or care what scale either retriever's scores are on.", mnemonic:"Ranks don't need calibration; scores do", steps:["BM25 scores","Different scale","Dense scores","RRF: ranks only"]},
    {q:"When does near-dedup hurt retrieval?", a:"If the similarity threshold is set too aggressively (e.g. 0.80 instead of 0.92), it can discard chunks that are topically related but meaningfully distinct — like two different sections both discussing 'coverage limits' but for different policy types. Too loose a threshold misses true duplicates from overlapping chunk windows; too tight a threshold throws away genuinely useful diversity.", mnemonic:"Too tight a threshold = false positives on dedup", steps:["Set threshold","Too low (0.80)","Distinct chunks merged","Lost real diversity"]},
    {q:"What doc-order vs score-order does to LLM attention?", a:"Score order presents chunks in relevance rank, which can jump between unrelated documents and confuse the model's sense of narrative flow. Doc-order re-sorts the final selected chunks by their original position in the source document, so the model reads a coherent passage in the order the author intended — closer to how it was trained to read text.", mnemonic:"Doc-order reads like the author wrote it", steps:["Score order","Jumps documents","Doc-order","Reads coherently"]},
