    {q:"What does HyDE actually do to the embedding space?", a:"A short query like 'recovery rate for water damage' embeds as a sparse, low-information vector — far in embedding space from a dense, information-rich answer paragraph, even if that paragraph directly answers the query. HyDE has the LLM write a hypothetical answer first, then embeds that instead — the hypothetical answer's embedding sits much closer to real answer chunks than the bare query's embedding would.", mnemonic:"Embed the hypothetical answer, not the bare question", steps:["Short query","Sparse vector","LLM writes hypo answer","Dense vector, closer match"]},
    {q:"When should ContextAssembler be a class vs functions?", a:"A class makes sense once assembly has multiple stateful configuration parameters (max_ctx_tokens, dedup_threshold) that every method needs access to, and when you want a single object you can unit test and swap implementations of (e.g. a StrictAssembler vs a PermissiveAssembler). If assembly is just 1-2 pure functions with no shared config, plain functions are simpler and avoid unnecessary OOP overhead.", mnemonic:"Shared config across methods → class. Otherwise, functions.", steps:["Multiple methods","Share config?","Yes → class","No → plain functions"]},
    {q:"How does fallback requery differ from CRAG rewrite?", a:"Fallback requery (Stage 4) is reactive and happens after generation — the model says INSUFFICIENT_CONTEXT, and only then do you rewrite the query and retry once. CRAG rewrite (Stage 6) is proactive and happens before generation — a grading step scores retrieved docs, and if the grade is poor, it rewrites and re-retrieves before the LLM ever sees the bad context, potentially looping multiple times.", mnemonic:"Fallback reacts after generation; CRAG prevents before it", steps:["Fallback: generate first","Bad answer","CRAG: grade first","Reject before generating"]},

    {q:"How does adjacent stitching improve answer coherence?", a:"When two retrieved chunks turn out to be sequential in the source document (same doc_id, consecutive index), stitching merges them into one combined block before sending to the LLM — rather than presenting them as two separate, oddly-truncated fragments. This preserves the natural flow of an explanation that happened to span a chunk boundary.", mnemonic:"Adjacent chunks merge back into one continuous thought", steps:["Chunk N","Chunk N+1 (same doc)","Detected adjacent","Merged into one block"]},

    {q:"How does check_node differ from grade_node?", a:"grade_node scores the retrieved DOCUMENTS before generation — is the context good enough to answer from. check_node scores the generated ANSWER after generation — did the model's response actually ground itself in the cited chunks. They catch different failure points: grade_node catches bad retrieval, check_node catches good retrieval but bad generation (e.g. hallucination despite having the right context).", mnemonic:"Grade checks the input; check checks the output", steps:["grade_node","Scores documents","check_node","Scores the answer"]},
    {q:"When does interrupt_before make sense for Claims AI?", a:"Specifically before the generate node when needs_human=True — meaning the document grade fell in the uncertain 0.4-0.7 range, confident enough to attempt an answer but not confident enough to fully automate. This is the right point to pause because the human reviewer sees the retrieved context (not yet a generated answer) and can correct course before the LLM commits to a response built on shaky retrieval.", mnemonic:"Pause before generating, not after — let humans see raw context", steps:["Grade: 0.4-0.7","Uncertain zone","interrupt_before generate","Human reviews context first"]},

//  MINI DIAGRAM + EXPANDABLE Q&A CARDS (shared renderer)
// ═══════════════════════════════════════════════════════
function miniDiagramSVG(steps) {
  const n = steps.length;
  const w = 248, h = 54, boxW = 96, gap = 10;
  const totalW = n * boxW + (n - 1) * gap;
  const startX = Math.max(4, (w - totalW) / 2);
  let svg = `<svg width="100%" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs><marker id="arrowhead-shared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2d4060" stroke-width="1.5"/></marker></defs>`;
  steps.forEach((label, i) => {
    const x = startX + i * (boxW + gap);
    const isLast = i === n - 1;
    const isLoop = label.startsWith('↻');
    const color = isLoop ? 'var(--coral)' : (i === 0 ? 'var(--teal)' : i === n-1 ? 'var(--green)' : 'var(--amber)');
    const bg = isLoop ? 'rgba(248,113,113,.08)' : (i === 0 ? 'rgba(0,212,200,.08)' : i === n-1 ? 'rgba(52,211,153,.08)' : 'rgba(245,158,11,.08)');
    svg += `<rect x="${x}" y="14" width="${boxW}" height="26" rx="5" fill="${bg}" stroke="${color}" stroke-width="1"/>`;
    svg += `<text x="${x+boxW/2}" y="30" text-anchor="middle" fill="${color}" font-size="9" font-weight="700" font-family="sans-serif">${label.replace('↻ ','↻')}</text>`;
    if (!isLast) {
      svg += `<line x1="${x+boxW+1}" y1="27" x2="${x+boxW+gap-1}" y2="27" stroke="#2d4060" stroke-width="1.3" marker-end="url(#arrowhead-shared)"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function renderQACard(qa, idx, prefix) {
  return `
  <div class="qa-item">
    <div class="qa-q" onclick="toggleQACard('${prefix}-${idx}')">
      <span class="qa-qnum">Q${idx+1}</span>
      <span class="qa-qtext">${qa.q}</span>
      <span class="qa-arrow">›</span>
    </div>
    <div class="qa-a" id="qac-${prefix}-${idx}">
      <div class="qa-diagram">${miniDiagramSVG(qa.steps)}</div>
      <div class="qa-mnemonic">💡 ${qa.mnemonic}</div>
      <div class="qa-answer-text">${qa.a}</div>
    </div>
  </div>`;
}

function toggleQACard(id) {
  const aItem = document.getElementById('qac-' + id);
  const qItem = aItem.previousElementSibling;
  const open = qItem.classList.contains('open');
  qItem.classList.toggle('open', !open);
  aItem.classList.toggle('open', !open);
}

function renderQuestionsPanel(questions, prefix) {
  return `<div class="sugs-qa">` + questions.map((qa, i) => renderQACard(qa, i, prefix)).join('') + `</div>`;
}

// ═══════════════════════════════════════════════════════
//  A5 — INFRASTRUCTURE MATURITY STAGES (simple → production)
// ═══════════════════════════════════════════════════════
function infraBox(n) {
  const cx = n.x + n.w/2, cy = n.y + n.h/2;
  const ls = n.label.split('\n');
  const longest = Math.max(...ls.map(l=>l.length));
  // Auto-fit: estimate available px per char, cap font-size so longest line fits inside box width with padding
  const padding = 10;
  const availW = n.w - padding;
  const fitSize = Math.floor(availW / (longest * 0.62));
  const fontSize = Math.max(7, Math.min(9.5, fitSize));
  const rect = `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" fill="${n.bg}" stroke="${n.bc}" stroke-width="1" stroke-dasharray="${n.dashed?'4 3':''}"/>`;
  const lineH = fontSize + 3;
  const txt = ls.map((l,li)=>`<text x="${cx}" y="${cy+(li-ls.length/2+0.6)*lineH}" text-anchor="middle" fill="${n.bc}" font-size="${fontSize}" font-weight="700" font-family="sans-serif">${l}</text>`).join('');
  const sub = n.sub ? `<text x="${cx}" y="${n.y+n.h+12}" text-anchor="middle" fill="#4a5568" font-size="8.5" font-family="sans-serif">${n.sub}</text>` : '';
  return rect + txt + sub;
}
function infraArrow(x1,y1,x2,y2,dashed) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2d4060" stroke-width="1.3" ${dashed?'stroke-dasharray="3 2"':''} marker-end="url(#infra-arrow)"/>`;
}

let history = [], currentStage = 0;

function sendAsk() {
  const inp = document.getElementById('askInp');
  const q = inp.value.trim(); if (!q) return;
  inp.value = '';
  addMsg('user', q);
  const thinking = addMsg('ai', '<span class="sp"></span>Thinking…');
  history.push({ role: 'user', content: q });
  const s = STAGES[currentStage];
  const sys = `You are a senior RAG/ML engineer. The user is studying ${s.num}: "${s.title}". They lead Claims and Recovery AI at Wells Fargo (SR 11-7, 18-person team). This stage covers: CHUNK (${Object.values(s.wn)[0][0]}), SEARCH, ASSEMBLE, GENERATE. Be precise and production-focused. 3-5 sentences max.`;
  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:500, system:sys, messages:history })
  }).then(r=>r.json()).then(d=>{
    const ans = d.content?.map(b=>b.text||'').join('')||'Error.';
    history.push({ role:'assistant', content:ans });
    thinking.querySelector('.bbl').innerHTML = ans.replace(/\n/g,'<br>');
    document.getElementById('askBody').scrollTop = 9999;
  }).catch(e=>{ thinking.querySelector('.bbl').textContent='Error: '+e.message; });
}

function addMsg(role, html) {
  const body = document.getElementById('askBody');
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<div class="who">${role==='user'?'You':'Claude'}</div><div class="bbl ${role==='user'?'bbl-u':'bbl-a'}">${html}</div>`;
  body.appendChild(div);
  body.scrollTop = 9999;
  return div;
}

2. At query time, check that query embedding model = stored embedding model<br>
3. If mismatch: re-embed all chunks with new model before deploying (offline batch job)<br>
4. Use Welch's t-test on cosine score distributions to detect drift without ground truth labels<br>
5. SR 11-7: document model version changes in model inventory with before/after RAGAS scores</div></div>`

{q:'How do you prevent retrieval hallucination?', a:'Layer four defenses: an explicit system prompt instruction to answer only from context with a defined fallback phrase, citation enforcement so claims must reference a chunk_id, a post-generation grounding check that scores what fraction of answer sentences actually cite a retrieved chunk, and tight context assembly (reranked, deduplicated) so there\'s less irrelevant material for the model to drift into using.', mnemonic:'Prompt rule + citations + grounding score + tight context', steps:['Context-only prompt','Require citations','Grounding score check','Tight, reranked context']},
{q:'What causes the semantic gap problem?', a:'Query and document use different vocabulary for the same concept — a claimant might say "write-off" while the policy document says "charge-off." Dense embeddings can miss this if the terms aren\'t close in embedding space, and BM25 misses it because the exact term differs. HyDE query rewriting and domain-specific embedding fine-tuning are the two main fixes.', mnemonic:'Different words, same meaning — gap that retrieval misses', steps:['Query term A','Doc uses term B','Same meaning','Retrieval misses match']},
{q:'How do you handle stale indexes in production?', a:'Content-addressed chunking (SHA-256 IDs) means re-ingesting a changed document only re-embeds chunks whose content actually changed — unchanged chunks keep their existing ID and embedding. Trigger re-ingestion via a Kafka event when the source document changes, and track ingested_at timestamps to monitor for documents that haven\'t been refreshed in an unexpectedly long time.', mnemonic:'Content hash means only changed chunks get re-embedded', steps:['Doc updated','Re-chunk it','Compare SHA-256 IDs','Only changed chunks re-embed']},
],
render:()=>`
<div class="ah-top"><span class="ah-num">A4</span><span class="ah-title">Failure Modes</span></div>
<div class="ah-desc">Every production RAG system hits these. Know the cause, the symptom, and the fix before the interview asks.</div>
${[
{name:'Retrieval Hallucination',cause:'Model answers from parametric memory, ignoring retrieved context',symptom:'Answer is confident and plausible but cites no chunks. Grounding score = 0.',fix:'System prompt: "Answer ONLY from context. If insufficient, say INSUFFICIENT_CONTEXT." Add grounding score check in generation node. Re-retrieve if score < 0.5.'},
{name:'Semantic Gap',cause:'Query and document use different vocabulary for the same concept (e.g. "write-off" vs "charge-off")',symptom:'Dense retrieval misses obviously relevant docs. BM25 also misses because exact term differs.',fix:'HyDE query rewriting. Domain-specific fine-tuned embeddings. Synonym expansion in query preprocessing. Hybrid retrieval — BM25 catches one term, dense catches the other.'},
{name:'Chunk Boundary Split',cause:'The answer spans two adjacent chunks — neither contains enough information alone',symptom:'Low faithfulness on questions whose answer is a multi-paragraph explanation.',fix:'Sliding window overlap (last 2 sentences carried forward). Parent-child chunking: retrieve small child, return large parent. Adjacent chunk stitching in assembly.'},
{name:'Embedding Model Mismatch',cause:'Query encoder and document encoder are different models (or same model but different versions)',symptom:'Cosine scores are uniformly low (~0.1) even for obviously relevant queries.',fix:'Always encode queries and documents with the same model. Store embedding_model version per chunk. Alert on version mismatch before serving.'},
{name:'Stale Index',cause:'Source documents updated but vectors not re-indexed',symptom:'RAG answers old policy versions. Faithfulness is high but answers are factually wrong vs current policy.',fix:'Trigger re-ingest on document change events (Kafka/webhook). Store ingested_at timestamp per chunk. Monitor doc version vs chunk version. SHA-256 chunk ID detects content changes without re-reading all docs.'},
{name:'Context Stuffing',cause:'Too many chunks sent to LLM — exceeds attention capacity or buries the relevant chunk',symptom:'Answer quality degrades as top-K increases beyond 5–7 chunks.',fix:'Token budget enforcement. Cross-encoder reranking reduces to true top-3. Contextual compression extracts only the relevant sentence from each chunk. Doc-order sort improves attention.'},
{name:'Multi-tenant Data Leakage',cause:'Missing or incorrect tenant_id filter — one tenant retrieves another tenant\'s chunks',symptom:'Audit log shows chunk_ids from wrong tenant in retrieval results. Usually caught in pen testing.',fix:'Always include WHERE tenant_id = $param in every pgvector query. Integration test: assert that tenant A never retrieves tenant B chunks. Separate schemas per tenant for highest isolation.'},
{name:'Latency Budget Overrun',cause:'Each pipeline step adds latency — embedding (50ms) + pgvector (80ms) + reranker (200ms) + LLM (600ms) = 930ms',symptom:'p95 latency &gt; 1s. Users perceive the assistant as slow.',fix:'Async parallel BM25 + dense retrieval. Skip cross-encoder for low-stakes queries (use confidence threshold). Cache frequent query embeddings (Redis, 1hr TTL). Stream LLM response to UI. Pre-warm connection pool.'},
].map(f=>`<div class="fc"><div class="fc-name">${f.name}</div><div class="fc-grid"><div class="fc-block"><div class="fc-lbl">Cause</div>${f.cause}</div><div class="fc-block"><div class="fc-lbl">Symptom</div>${f.symptom}</div><div class="fc-block"><div class="fc-lbl">Fix</div>${f.fix}</div></div></div>`).join('')}`

{q:'What is model validation independence in the context of RAG?', a:'The team that validates retrieval quality — running RAGAS evals, adversarial tests, PII leakage checks — must be organizationally separate from the team that built the RAG pipeline. This isn\'t a formality; it exists specifically to catch the blind spots a development team has toward its own system\'s weaknesses.', mnemonic:'Builders test the pieces; a separate team tests the whole', steps:['Dev team builds','Dev team tests','Blind spots remain','Independent team validates']},

{q:'What should I say about chunking strategy selection?', a:'Lead with the tradeoff, not just a recommendation: fixed-size is fast but cuts mid-sentence, sentence-boundary preserves meaning at moderate cost, semantic and propositional chunking cost more compute but maximize precision for high-value knowledge bases. Then state what you\'d choose for the specific scenario asked and why — generic "it depends" answers read as evasive; a stated choice with reasoning reads as judgment.', mnemonic:'State the tradeoff, then commit to a specific choice', steps:['List tradeoffs','Fixed vs sentence vs semantic','State your choice','Justify for this scenario']},

<div class="ah-top"><span class="ah-num">A7</span><span class="ah-title">Interview Q&A — 20 Questions</span></div>
<div class="ah-desc">Click any question to expand the model answer. Every answer is framed for a senior AI Architect / Director-level role at a regulated financial institution.</div>
<div style="margin-top:14px;" id="qaList">
${[
{q:'Walk me through how you would design a RAG system for a claims knowledge base.',tag:'qa-arch',a:`Start with the data layer: ingest claims policy PDFs, DOCX, and DB exports through a parser-cleaner pipeline. Chunk using sentence-boundary splitting with SHA-256 content IDs and sliding overlap — this gives you dedup on re-ingest and no mid-sentence cuts. Embed with BGE-large-en-v1.5 running on-prem (data residency requirement at Wells Fargo) and store in pgvector with a tenant_id column for multi-client isolation. On the serving path, run BM25 and dense retrieval in parallel, fuse with RRF, and cross-encoder rerank the top-20 candidates to get final top-5. The PayloadBuilder deduplicates, stitches adjacent chunks, enforces a 3,500-token budget, and injects a compliance header before the LLM call. Every retrieval event is logged with query_hash, chunk_ids, model versions, and scores for SR 11-7 audit.`},
{q:'Why did you choose pgvector over Pinecone?',tag:'qa-wf',a:`Three reasons for a regulated institution. First, data residency — policy documents cannot leave the Wells Fargo network perimeter, so a SaaS vector store is a non-starter without significant legal review. Second, governance — pgvector lives in the same Postgres instance as our application data, which means multi-tenant isolation is a single WHERE tenant_id clause, schema-level access controls, and audit logs co-located with the vectors. Third, SR 11-7 — the model risk team can inspect the full retrieval system without external vendor access. The tradeoff is scale ceiling (~50M vectors before sharding) and manual hybrid search implementation, both acceptable for our Claims KB size.`},
{q:'How do you evaluate whether your RAG system is actually working?',tag:'qa-arch',a:`I separate retrieval quality from answer quality. For retrieval, I measure context precision (what fraction of top-K chunks were actually useful) and context recall (did we retrieve all chunks needed to answer). For answers, I measure faithfulness (are all claims supported by the context) and answer relevancy (does the answer address the question). I build a golden dataset of 100-200 (question, ground truth answer, source doc) triples from domain experts, run RAGAS weekly, and block deployment on faithfulness regression > 2%. In production, I monitor grounding score per answer in real-time and alert on retrieval miss rate > 5%.`},
{q:'What is the biggest mistake teams make with RAG?',tag:'qa-arch',a:`Skipping the assembly step. Most demos do retrieve-then-dump — take the top-K chunks, join with newlines, send to LLM. In production this fails because overlapping chunks from parent-child indexing send duplicate content, the token budget is ignored causing cost runaway, and the chunks arrive in score order rather than document order — which degrades LLM comprehension of narrative documents. A proper assembly step deduplicates near-identical chunks, stitches adjacent chunks from the same document, trims to a token budget, re-sorts by document position, and injects structured metadata so the LLM can cite sources accurately.`},
{q:'How do you handle the case where no retrieved chunks are relevant?',tag:'qa-prod',a:`The system prompt instructs the model to respond with a specific token — I use INSUFFICIENT_CONTEXT — rather than making up an answer. The generation node detects this token and triggers a fallback path: rewrite the query using a reformulation LLM call, retrieve again, and if still insufficient, escalate to a human or a different knowledge base. In a LangGraph implementation this is a conditional edge from the generate node back to rewrite. I also track the INSUFFICIENT_CONTEXT rate in production — if it exceeds 10%, it signals a KB coverage gap and triggers a document ingestion sprint.`},
{q:'Explain the difference between Naive, Advanced, and Agentic RAG.',tag:'qa-arch',a:`Naive RAG is a single-shot pipeline: embed query, retrieve top-K by cosine, concat context, call LLM. It breaks on paraphrased queries (semantic gap), boundary splits, and context bloat. Advanced RAG adds query preprocessing (HyDE rewrites the query as a hypothetical answer before embedding — 15-30% recall improvement), hybrid retrieval (BM25 + dense + RRF), cross-encoder reranking, and contextual compression (extract only the relevant sentence from each chunk). Agentic RAG models the process as a state machine — it grades retrieved docs, routes to a rewrite loop if quality is low (CRAG), injects human review when confidence is uncertain, and grades the answer itself after generation. Use Naive for prototypes, Advanced for production, Agentic for high-stakes or multi-step queries where the retrieval path is not known upfront.`},
{q:'How do you prevent hallucination in RAG?',tag:'qa-prod',a:`Four layers. First, the system prompt: explicit instruction to answer only from the provided context with a specific fallback phrase if context is insufficient. Second, citation enforcement: instruct the model to cite [chunk_id] after every claim — this surfaces when it's answering from parametric memory rather than context. Third, post-generation grounding check: compute the fraction of answer sentences that reference a cited chunk — if below 0.5, flag the answer and optionally re-retrieve. Fourth, context assembly discipline: send only highly relevant chunks (cross-encoder reranked), not a broad top-20 — a smaller, higher-precision context reduces the surface area for hallucination.`},
{q:'What is SR 11-7 and how does it apply to a RAG system?',tag:'qa-wf',a:`SR 11-7 is the Federal Reserve and OCC's model risk management guidance. It requires regulated institutions to: register models in a model inventory with purpose, owner, version, and validation date; validate models independently (the validation team cannot be the development team); monitor model performance in production with defined metrics and thresholds; and document model limitations, assumptions, and changes. For a RAG system, this means every component is a model — the embedding model, the LLM, and the retrieval pipeline itself. Practically: log query_hash + chunk_ids + model_version on every retrieval, store embedding_model version per chunk row, run weekly RAGAS evals against a golden dataset, require independent validation before deployment, and document the chunking strategy and its limitations.`},
{q:'How do you handle multi-tenant data isolation in RAG?',tag:'qa-wf',a:`The primary mechanism is a tenant_id column on every chunk row in pgvector, with every retrieval query including WHERE tenant_id = $param. This is simple, fast (indexed), and auditable. For higher isolation requirements, separate schemas per tenant prevent any possibility of query logic bugs leaking data. The ingestion pipeline sets tenant_id at ingest time and it never changes. Integration tests assert that tenant A queries never return tenant B chunk_ids — this runs in CI on every deployment. For the LLM payload, the system prompt includes the tenant_id so the model is aware of its operational context.`},
{q:'How would you cut retrieval latency from 800ms to under 300ms?',tag:'qa-prod',a:`Profile first — latency typically breaks down as: embedding ~40ms, BM25 ~10ms, pgvector ANN ~80ms, cross-encoder reranker ~200ms, LLM first token ~500ms. The biggest wins: run BM25 and dense retrieval in parallel with asyncio (saves ~80ms), cache frequent query embeddings in Redis with 1hr TTL (saves ~40ms on repeated queries), make cross-encoder reranking conditional — skip it for queries whose top-1 score is already above 0.9 (saves ~200ms on easy queries), and stream the LLM response to the UI so the user sees the first token at ~100ms even if generation takes 600ms total.`},
{q:'When should you NOT use RAG?',tag:'qa-arch',a:`Three cases. First, when the answer requires reasoning across the entire document, not a specific passage — RAG retrieves fragments, not full document understanding. Second, when the latency budget is under 100ms — retrieval adds irreducible latency. Third, when the domain vocabulary is so specialized that generic embedding models have a large semantic gap and fine-tuning the LLM on the domain is more practical than domain-adapted retrieval. Also: if the knowledge base is small enough to fit in a long-context window entirely, a single LLM call with the full document is simpler and more accurate than retrieval.`},
{q:'What chunking strategy would you use for financial regulatory documents?',tag:'qa-wf',a:`Sentence-boundary chunking with 256-token windows and 2-sentence overlap for the base strategy. Financial regulatory docs have dense, precise language where every sentence matters — fixed-size chunking cuts mid-clause and loses meaning. For tables (fee schedules, rate tables), extract as structured markdown blocks rather than flattening to prose. For cross-references ("see Section 4.2"), flag these chunks with a cross_ref metadata field and retrieve the referenced section alongside. SHA-256 content IDs enable idempotent re-ingest when the document is updated — only changed sections get re-embedded.`},
{q:'How do you choose the right value for K in top-K retrieval?',tag:'qa-arch',a:`K has two values in a production system: candidate_k (how many to retrieve before reranking, typically 20) and final_k (how many to send to the LLM, typically 3-5). Candidate_k should be large enough that the cross-encoder can find the true relevant chunks — I use 20 as a default. Final_k is constrained by the token budget and the LLM's effective attention span. More than 5-7 chunks degrades answer quality because the model distributes attention across more text. I tune final_k empirically against the RAGAS golden dataset — the K that maximises faithfulness × answer relevancy is the right one.`},
{q:'What is HyDE and why does it work?',tag:'qa-arch',a:`HyDE — Hypothetical Document Embedding — addresses the asymmetry between query embeddings and document embeddings. A query like "recovery rate for water damage" embeds as a short, information-sparse vector. A relevant policy paragraph embeds as a dense, information-rich vector. The cosine distance between them is large even if semantically the query is answered by the paragraph. HyDE solves this by asking the LLM to write a hypothetical answer to the query first, then embedding that hypothetical answer. The hypothetical answer embedding is much closer in the embedding space to the real answer chunks. Empirically this improves recall by 15-30% on domain-specific corpora where there's vocabulary mismatch between user queries and document language.`},
{q:'How do you handle document updates in a production RAG system?',tag:'qa-prod',a:`Content-addressed ingestion: every chunk has a SHA-256 ID derived from its text content. When a document is updated, the ingestion pipeline re-chunks the document and computes new SHA-256 IDs. Only chunks whose ID has changed get re-embedded and re-inserted. Chunks that haven't changed are untouched. The pipeline uses ON CONFLICT DO NOTHING in pgvector for idempotent inserts. Deleted sections are tracked by comparing the set of chunk_ids produced from the current document version against those stored — orphaned chunk_ids are soft-deleted with a deleted_at timestamp. A Kafka topic publishes document change events to trigger the ingestion worker.`},
{q:'What is Reciprocal Rank Fusion and why use it over weighted score averaging?',tag:'qa-arch',a:`RRF combines multiple ranked lists using the formula 1/(k + rank) where k=60 is a constant. The key insight is that it operates on ranks, not scores. BM25 scores and dense cosine scores live in completely different numerical ranges and distributions — normalising them to combine them is fragile and requires tuning per dataset. RRF sidesteps this entirely: it only cares about the relative ordering from each retriever, not the absolute score. A chunk that appears in position 3 in BM25 and position 2 in dense retrieval gets a higher RRF score than one that appears in position 1 in only one of them. This makes RRF robust across different retriever types without any calibration.`},
{q:'How do you implement human-in-loop in an agentic RAG system?',tag:'qa-prod',a:`In a LangGraph StateGraph, I add a human_review node and use interrupt_before to pause graph execution before the generate node when needs_human=True. The grade_node sets needs_human=True when the document relevance score falls in the uncertain range (0.4–0.7) — high enough to attempt generation but low enough to warrant review. The graph pauses, writes the current state to MemorySaver, and surfaces the retrieved chunks to a human reviewer interface. The human approves, modifies, or rejects the context before the graph resumes at the generate node. The human decision (approved/modified/rejected) and the reviewer_id are appended to the audit_trail for SR 11-7 compliance.`},
{q:'What is the difference between context precision and context recall?',tag:'qa-arch',a:`Context precision asks: of the chunks I retrieved, how many were actually useful? It measures retrieval quality — are you retrieving noise alongside signal. Context recall asks: did I retrieve all the chunks needed to answer the question correctly? It measures coverage — did I miss anything important. A system with high precision but low recall retrieves few but highly relevant chunks — the answer might be partially correct but miss important details. High recall but low precision retrieves all relevant chunks plus a lot of noise — the LLM has to filter signal from noise. For Claims AI, I target precision > 0.80 (I can't afford to waste context window on noise) and recall > 0.85 (I can't afford to miss policy clauses).`},
{q:'How does embedding model fine-tuning improve RAG?',tag:'qa-arch',a:`Generic embedding models are trained on general web text. Financial/claims documents use domain-specific vocabulary (subrogation, indemnification, pro-rata, charge-off) that may not be well-represented in the training data, causing a semantic gap. Fine-tuning the bi-encoder on (query, relevant_document) pairs from your domain teaches it that "write-off" and "charge-off" are semantically close in your context. You can generate training pairs from your golden eval dataset or by using an LLM to generate synthetic queries for each chunk. Fine-tuning a BGE model with Sentence Transformers takes 2-4 hours on one GPU. Typical improvement: 5-15% on domain-specific RAGAS metrics. Important: re-embed all stored chunks with the fine-tuned model before deploying.`},
{q:'If you had to explain your RAG architecture to a non-technical executive, what would you say?',tag:'qa-wf',a:`Our Claims AI works like a very precise research assistant. When a claims officer asks a question, the system searches through thousands of policy documents in under a second to find the three most relevant paragraphs. It then hands those paragraphs to an AI that reads only those paragraphs to formulate an answer — the AI cannot answer from general knowledge, only from what we retrieved. Every answer cites exactly which document and page it came from, so the claims officer can verify it. The system logs every question asked, every document retrieved, and every answer given — which satisfies our model risk compliance requirements. If the system isn't confident enough, it escalates to a human reviewer before the answer is delivered.`},
].map((qa,i)=>`
<div class="qa-item">
  <div class="qa-q" onclick="toggleQA(${i})">
    <span class="qa-qnum">Q${String(i+1).padStart(2,'0')}</span>
    <span class="qa-qtext">${qa.q}</span>
    <span class="qa-arrow">›</span>
  </div>
  <div class="qa-a" id="qa-${i}">
    <span class="qa-tag ${qa.tag}">${qa.tag==='qa-wf'?'WF / Regulated':qa.tag==='qa-arch'?'Architecture':'Production'}</span>
    <div>${qa.a}</div>
  </div>
</div>`).join('')}
</div>`
}
];

function toggleQA(i) {
  const q = document.querySelectorAll('.qa-q')[i];
  const a = document.getElementById('qa-'+i);
  const open = q.classList.contains('open');
  q.classList.toggle('open', !open);
  a.classList.toggle('open', !open);
}

// ═══════════════════════════════════════════════════════
//  UPDATED RENDER
// ═══════════════════════════════════════════════════════
function selectStage(i) {
  currentStage = i; history = [];
  const s = STAGES[i];
  document.querySelectorAll('.hpill').forEach((p,pi)=>p.classList.toggle('on',pi===i));
  document.querySelectorAll('.si,.ai').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.si')[i]?.classList.add('on');
  document.getElementById('stepbar').style.display = 'flex';
  document.getElementById('codeArea').style.display = 'block';
  const archArea = document.getElementById('archArea');
  if(archArea) archArea.style.display = 'none';

  document.getElementById('stageHdr').innerHTML = `
    <div class="sh-top">
      <span class="sh-num">${s.num}</span>
      <span class="sh-title">${s.title}</span>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;">${s.tags.map(t=>`<span class="tag ${t.c}">${t.l}</span>`).join('')}</div>
    </div>
    <div class="sh-desc">${s.desc}</div>
    <div class="sh-meta"><span>file: <strong>${s.filename}</strong></span><span>steps: <strong>① CHUNK &nbsp;② SEARCH &nbsp;③ ASSEMBLE &nbsp;④ GENERATE</strong></span></div>`;

  const wnHtml = `<div class="wn"><div class="wn-title">What this stage adds</div><div class="wn-grid">
    <div class="wn-step"><div class="wn-step-label" style="color:var(--teal);">① Chunk</div><ul>${s.wn.chunk.map(w=>`<li>${w}</li>`).join('')}</ul></div>
    <div class="wn-step"><div class="wn-step-label" style="color:var(--amber);">② Search</div><ul>${s.wn.search.map(w=>`<li>${w}</li>`).join('')}</ul></div>
    <div class="wn-step"><div class="wn-step-label" style="color:var(--purple);">③ Assemble</div><ul>${s.wn.assemble.map(w=>`<li>${w}</li>`).join('')}</ul></div>
    <div class="wn-step"><div class="wn-step-label" style="color:var(--green);">④ Generate</div><ul>${s.wn.generate.map(w=>`<li>${w}</li>`).join('')}</ul></div>
  </div><div class="inst"><div class="inst-lbl">Install</div>${s.install}</div></div>`;

  document.getElementById('codeArea').innerHTML = `<div class="cb"><div class="cb-bar"><div class="cb-left"><span class="cb-lang">python</span><span class="cb-file">${s.filename}</span></div><button class="cb-copy" onclick="copyCode()">Copy</button></div><pre id="codePre">${s.code}</pre></div>${wnHtml}`;

  const body = document.getElementById('askBody');
  body.innerHTML = renderQuestionsPanel(QUESTIONS[i], 'stage'+i);
  document.getElementById('askSub').textContent = `${s.num} · Claims AI · all 4 steps`;
}

function selectArch(i) {
  currentStage = 100 + i; history = [];
  const a = ARCH[i];
  document.querySelectorAll('.hpill').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.si,.ai').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.ai')[i]?.classList.add('on');
  document.getElementById('stepbar').style.display = 'none';
  document.getElementById('codeArea').style.display = 'none';
  let archArea = document.getElementById('archArea');
  if(!archArea){
    archArea = document.createElement('div');
    archArea.id = 'archArea'; archArea.className = 'arch-area';
    document.querySelector('.main').appendChild(archArea);
  }
  archArea.style.display = 'block';
  archArea.innerHTML = a.render();
  if (a.id === 'sysdesign') initRagInfraStages();

  document.getElementById('stageHdr').innerHTML = `
    <div class="ah-top"><span class="ah-num">${a.num}</span><span class="ah-title">${a.title}</span></div>
    <div class="ah-desc">${a.desc}</div>`;

  const body = document.getElementById('askBody');
  body.innerHTML = renderQuestionsPanel(a.qs, a.id);
  document.getElementById('askSub').textContent = `${a.num} · ${a.title} · Claims AI`;
}

function sendAsk() {
  const inp = document.getElementById('askInp');
  const q = inp.value.trim(); if (!q) return;
  inp.value = '';
  addMsg('user', q);
  const thinking = addMsg('ai', '<span class="sp"></span>Thinking…');
  history.push({ role: 'user', content: q });
  const isArch = currentStage >= 100;
  const contextLabel = isArch ? ARCH[currentStage-100].title : STAGES[currentStage].title;
  const sys = `You are a senior RAG architect and interviewer coach. The user is studying: "${contextLabel}". They are an Executive Director at Wells Fargo leading Claims and Recovery AI (18-person team, SR 11-7 regulated, LangGraph, pgvector, BGE embeddings). Answer in 3-6 sentences. Be precise, production-focused, and tie to Wells Fargo Claims AI context where relevant.`;
  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:600, system:sys, messages:history })
  }).then(r=>r.json()).then(d=>{
    const ans = d.content?.map(b=>b.text||'').join('')||'Error.';
    history.push({ role:'assistant', content:ans });
    thinking.querySelector('.bbl').innerHTML = ans.replace(/\n/g,'<br>');
    document.getElementById('askBody').scrollTop = 9999;
  }).catch(e=>{ thinking.querySelector('.bbl').textContent='Error: '+e.message; });
}

function boot() {
  const pills = document.getElementById('hdrPills');
  pills.innerHTML = STAGES.map((s,i)=>`<button class="hpill${i===0?' on':''}" onclick="selectStage(${i})">${s.num}</button>`).join('');
  const rail = document.getElementById('rail');
  rail.innerHTML =
    `<div class="rail-lbl">Code Stages</div>` +
    STAGES.map((s,i)=>`<div class="si${i===0?' on':''}" onclick="selectStage(${i})">
      <div class="si-num">${s.num}</div><div class="si-title">${s.title}</div>
      <div class="si-steps"><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div></div>
      <div class="si-why">${s.desc.substring(0,60)}…</div></div>`).join('') +
    `<div class="rail-divider"><span>Architect Prep</span></div>` +
    ARCH.map((a,i)=>`<div class="ai" onclick="selectArch(${i})">
      <div class="ai-num">${a.num}</div><div class="ai-title">${a.title}</div>
      <div class="ai-why">${a.desc.substring(0,60)}…</div></div>`).join('');
  selectStage(0);
  document.getElementById('askInp').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAsk();}
  });
}
document.addEventListener('DOMContentLoaded', boot);
</script>
