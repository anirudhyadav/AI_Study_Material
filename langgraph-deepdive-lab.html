<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LangGraph Deep-Dive Lab</title>
<style>
:root{
  --navy:#0a0f1e;--navy2:#111827;--navy3:#1a2236;--navy4:#243050;--navy5:#2d3a56;
  --teal:#00d4c8;--tealb:rgba(0,212,200,.1);
  --amber:#f59e0b;--amberb:rgba(245,158,11,.1);
  --purple:#a78bfa;--purpleb:rgba(167,139,250,.1);
  --green:#34d399;--greenb:rgba(52,211,153,.1);
  --coral:#f87171;--coralb:rgba(248,113,113,.1);
  --blue:#60a5fa;--blueb:rgba(96,165,250,.1);
  --t1:#e8eaf0;--t2:#8b94ab;--t3:#4a5568;
  --bd:#1e2d45;--bd2:#2d4060;
  --mono:'Courier New',Courier,monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--navy);color:var(--t1);font-family:var(--sans);font-size:13px;}
::-webkit-scrollbar{width:5px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--navy5);border-radius:3px;}
.hdr{height:48px;background:var(--navy2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--navy);flex-shrink:0;}
.hdr-title{font-size:13px;font-weight:700;}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--purpleb);border:1px solid rgba(167,139,250,.25);color:var(--purple);margin-left:6px;}
.hdr-sub{font-size:10px;color:var(--t3);margin-left:6px;}
.wrap{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;overflow:hidden;}
.rail{width:228px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--bd);overflow-y:auto;padding:6px 5px 16px;}
.rg{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);padding:10px 8px 4px;border-top:1px solid var(--bd);margin-top:4px;}
.rg:first-child{border-top:none;margin-top:0;}
.si{padding:7px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all .15s;}
.si:hover{background:var(--navy3);}
.si.on{background:var(--tealb);border-color:rgba(0,212,200,.4);}
.si-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.si-title{font-size:11px;font-weight:700;color:var(--t1);margin-top:2px;}
.si.on .si-num{color:var(--teal);}
.si.on .si-title{color:var(--teal);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.shdr{padding:10px 16px 8px;background:var(--navy2);border-bottom:1px solid var(--bd);flex-shrink:0;}
.shdr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.shdr-num{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.25);padding:2px 7px;border-radius:4px;}
.shdr-title{font-size:14px;font-weight:700;}
.shdr-desc{font-size:11px;color:var(--t2);line-height:1.55;max-width:700px;}
.tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;}
.tc{background:var(--tealb);color:var(--teal);}
.ta{background:var(--amberb);color:var(--amber);}
.tp{background:var(--purpleb);color:var(--purple);}
.tg{background:var(--greenb);color:var(--green);}
.tr{background:var(--coralb);color:var(--coral);}
.tb{background:var(--blueb);color:var(--blue);}
.carea{flex:1;overflow-y:auto;padding:12px 16px 20px;}
.uc{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:7px;padding:9px 12px;margin-bottom:10px;}
.uc-lbl{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--amber);margin-bottom:3px;}
.uc-text{font-size:11px;color:var(--t2);line-height:1.55;}
.wn{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:7px;padding:10px 12px;margin-bottom:10px;}
.wn-title{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
.wn-list{font-size:11px;color:var(--t2);line-height:1.7;padding-left:14px;}
.wn-list li{margin-bottom:2px;}
.wn-ilbl{font-size:9px;color:var(--t3);font-family:var(--sans);margin-top:7px;margin-bottom:2px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.wn-install{background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--green);}
.cb{background:var(--navy);border:1px solid var(--bd);border-radius:7px;overflow:hidden;margin-bottom:12px;}
.cb-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.cb-lang{font-size:10px;color:var(--t3);font-family:var(--mono);}
.cb-file{font-size:10px;color:var(--t2);font-family:var(--mono);margin-left:8px;}
.cb-copy{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--navy4);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;font-family:var(--sans);}
.cb-copy:hover{color:var(--teal);border-color:var(--teal);}
.cb pre{padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.8;overflow-x:auto;white-space:pre;color:var(--t1);margin:0;background:var(--navy);}
.kw{color:#c792ea;}.fn{color:#82aaff;}.cls{color:#ffcb6b;}.st{color:#c3e88d;}.cm{color:#546e7a;font-style:italic;}.nm{color:#f78c6c;}.dc{color:#89ddff;}.im{color:#c792ea;}.bi{color:#f78c6c;}
.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.dc-card{background:var(--navy2);border:1px solid var(--bd);border-radius:7px;padding:12px;}
.dc-scenario{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:4px;}
.dc-choice{font-size:12px;font-weight:700;color:var(--teal);margin-bottom:3px;}
.dc-why{font-size:10.5px;color:var(--t2);line-height:1.55;margin-bottom:4px;}
.dc-not{font-size:10px;color:var(--coral);}
.tt{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px;}
.tt th{background:var(--navy3);color:var(--t3);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;text-align:left;border-bottom:1px solid var(--bd);}
.tt td{padding:7px 10px;border-bottom:1px solid var(--bd);color:var(--t2);vertical-align:top;line-height:1.5;}
.tt tr:last-child td{border-bottom:none;}
.tt td:first-child{color:var(--t1);font-weight:600;font-family:var(--mono);font-size:10px;}
.tt tr:hover td{background:var(--navy3);}
.good{color:var(--green);}.ok{color:var(--amber);}.bad{color:var(--coral);}
.sec-h{font-size:9px;font-weight:700;color:var(--t2);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.6px;}
.fc-card{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--coral);border-radius:7px;padding:11px;margin-bottom:8px;}
.fc-name{font-size:12px;font-weight:700;color:var(--coral);margin-bottom:6px;}
.fc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.fc-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:3px;}
.fc-body{font-size:10.5px;color:var(--t2);line-height:1.55;}
.infra-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.ip{padding:4px 11px;border-radius:14px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--navy3);color:var(--t3);transition:all .15s;}
.ip:hover{color:var(--t2);}
.ip.on{background:var(--tealb);border-color:var(--teal);color:var(--teal);}
.infra-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.infra-desc{font-size:11px;color:var(--t2);line-height:1.55;margin-bottom:10px;}
.infra-diag{background:var(--navy);border:1px solid var(--bd);border-radius:7px;overflow:hidden;margin-bottom:10px;}
.infra-dlbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);padding:6px 12px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.infra-chg{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:7px;padding:9px 12px;}
.infra-chg-lbl{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--amber);margin-bottom:4px;}
.infra-chg-body{font-size:11px;color:var(--t2);line-height:1.6;}
.rp{width:262px;flex-shrink:0;background:var(--navy2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.rp-hdr{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.rp-title{font-size:11px;font-weight:700;color:var(--purple);}
.rp-sub{font-size:9px;color:var(--t3);margin-top:1px;}
.rp-body{flex:1;overflow-y:auto;padding:8px 9px 12px;}
.qa-item{background:var(--navy3);border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;overflow:hidden;}
.qa-q{padding:8px 10px;cursor:pointer;display:flex;align-items:flex-start;gap:7px;}
.qa-q:hover{background:var(--navy4);}
.qa-qn{font-size:9px;font-family:var(--mono);color:var(--amber);flex-shrink:0;margin-top:1px;}
.qa-qt{font-size:10.5px;font-weight:600;color:var(--t1);flex:1;line-height:1.35;}
.qa-ar{color:var(--t3);font-size:11px;flex-shrink:0;transition:transform .18s;}
.qa-ar.open{transform:rotate(90deg);}
.qa-body{display:none;padding:9px 10px;border-top:1px solid var(--bd);}
.qa-body.open{display:block;}
.qa-diag{background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:4px 2px;margin-bottom:6px;}
.qa-mem{font-size:9.5px;font-weight:600;color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.18);border-radius:4px;padding:4px 7px;margin-bottom:6px;line-height:1.4;}
.qa-ans{font-size:10.5px;color:var(--t2);line-height:1.6;}
</style>

by gather_node (or initial state)\n    mock_results = [\n        {\"name\": \"Park Hyatt Tokyo\",     \"price\": 350, \"stars\": 5},\n        {\"name\": \"APA Hotel Shinjuku\",    \"price\": 95,  \"stars\": 3},\n        {\"name\": \"Shibuya Excel Hotel\",   \"price\": 165, \"stars\": 4},\n    ]\n    # Filter to budget\n    filtered = [h for h in mock_results if h[\"price\"] <= state[\"budget\"]]\n    return {\"hotel_results\": filtered}\n\n\n# \u2500\u2500 Node 3: format final message \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef format_node(state: TravelState) -> dict:\n    hotels = state[\"hotel_results\"]\n    if not hotels:\n        msg = f\"No hotels found in {state['destination']} under ${state['budget']}/night.\"\n    else:\n        lines = [f\"Found {len(hotels)} hotel(s) in {state['destination']}:\"]\n        lines += [f\"  {'\u2b50'*h['stars']} {h['name']} \u2014 ${h['price']}/night\" for h in hotels]\n        msg = \"\n\".join(lines)\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\n# \u2500\u2500 Wire nodes in order \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"gather\", gather_node)\nworkflow.add_node(\"search\", search_node)\nworkflow.add_node(\"format\", format_node)\nworkflow.set_entry_point(\"gather\")\nworkflow.add_edge(\"gather\", \"search\")   # gather \u2192 search (always)\nworkflow.add_edge(\"search\", \"format\")   # search \u2192 format (always)\nworkflow.add_edge(\"format\", END)\n\napp = workflow.compile()\n\n\nif __name__ == \"__main__\":\n    result = app.invoke({\n        \"destination\": \"Tokyo\", \"check_in\": \"2025-03-10\",\n        \"check_out\": \"2025-03-15\", \"budget\": 200.0, \"messages\": [], \"hotel_results\": [],\n    })\n    print(result[\"messages\"][-1])"}, {"group": "Core Concepts", "num": "C3", "title": "Conditional Edges & Routing", "filename": "c3_conditional.py", "tags": [{"l": "Branching", "c": "tc"}, {"l": "Router fn", "c": "ta"}, {"l": "~60 lines", "c": "tg"}], "desc": "Fixed edges make every request take the same path. Conditional edges let a routing function inspect state and decide which node to go to next \u2014 the foundation of all agentic decision-making. Building on C2 \u2014 same pipeline, now with a budget-check branch.", "usecase": "If the user's budget is under $100, route to a \"budget alert\" node before searching. Otherwise, search directly. The routing decision is a pure function \u2014 inspect state, return a string key.", "wn": ["New: add_conditional_edges calls a routing function instead of hardwiring a destination", "The routing function receives state, returns a string key \u2014 that key maps to a node name", "The third argument to add_conditional_edges is a dict mapping return values \u2192 node names", "The routing function must be deterministic for the same state \u2014 treat it as a pure function", "END can be a value in the routing dict \u2014 a conditional edge can terminate the graph early"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "Can a routing function return more than two options?", "a": "Yes \u2014 the routing dict can have as many keys as needed. The function just returns a string, and LangGraph looks up which node that maps to. There's no limit. Common patterns: 3-way split (low/medium/high confidence), N-way routing in a supervisor, or even a routing function that builds the key dynamically from state content.", "mnemonic": "Return any string, map it to any node \u2014 no limit", "steps": ["State inspected", "Route fn returns key", "Dict lookup", "Any node reached"]}, {"q": "What happens if the routing function returns a key not in the map?", "a": "LangGraph raises a KeyError at runtime \u2014 there's no silent fallback. This is intentional: an unmapped routing key usually indicates a bug in the routing logic. Always include a default fallback key in the routing dict (often mapped to END or an error node) to handle unexpected cases gracefully.", "mnemonic": "Unmapped key = KeyError \u2014 always include a fallback", "steps": ["Route fn returns X", "X not in map", "KeyError raised", "Add fallback key"]}, {"q": "Should routing logic live in the routing function or in the node itself?", "a": "The routing function should be a pure, cheap predicate \u2014 inspect state, return a string. Heavy logic (LLM calls, tool calls) belongs in a dedicated node that runs first, writes a decision field to state, and then a trivially simple routing function reads that field. This keeps routing functions fast, testable, and deterministic.", "mnemonic": "Route fn reads state; nodes make decisions", "steps": ["Node runs", "Writes decision to state", "Route fn reads field", "Returns key trivially"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\n\n\nclass TravelState(TypedDict):\n    destination:  str | None\n    check_in:     str | None\n    check_out:    str | None\n    budget:       float | None\n    messages:     list[str]\n    hotel_results:list[dict]\n\n\ndef gather_node(state: TravelState) -> dict:\n    msg = f\"Searching {state['destination']} \u00b7 ${state['budget']}/night\"\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\n# \u2500\u2500 NEW: routing function \u2014 pure, deterministic \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef route_by_budget(state: TravelState) -> str:\n    \"\"\"Return a string key that maps to the next node.\"\"\"\n    if state[\"budget\"] is None:\n        return \"missing_budget\"\n    if state[\"budget\"] < 80:\n        return \"budget_alert\"\n    return \"search\"\n\n\n# \u2500\u2500 NEW: budget alert path \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef budget_alert_node(state: TravelState) -> dict:\n    msg = f\"\u26a0\ufe0f Budget under $80/night \u2014 options in {state['destination']} will be very limited.\"\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\ndef missing_budget_node(state: TravelState) -> dict:\n    return {\"messages\": state[\"messages\"] + [\"Please provide a nightly budget to continue.\"]}\n\n\ndef search_node(state: TravelState) -> dict:\n    mock = [{\"name\":\"Shibuya Excel\",\"price\":165},{\"name\":\"APA Hotel\",\"price\":95}]\n    return {\"hotel_results\": [h for h in mock if h[\"price\"] <= state[\"budget\"]]}\n\n\ndef format_node(state: TravelState) -> dict:\n    msg = f\"Found: {[h['name'] for h in state['hotel_results']]}\"\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\n# \u2500\u2500 Wire with conditional edge \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"gather\",         gather_node)\nworkflow.add_node(\"budget_alert\",   budget_alert_node)\nworkflow.add_node(\"missing_budget\", missing_budget_node)\nworkflow.add_node(\"search\",         search_node)\nworkflow.add_node(\"format\",         format_node)\n\nworkflow.set_entry_point(\"gather\")\n\n# Conditional: after gather, call route_by_budget \u2192 map key \u2192 node\nworkflow.add_conditional_edges(\"gather\", route_by_budget, {\n    \"budget_alert\":   \"budget_alert\",\n    \"missing_budget\": \"missing_budget\",\n    \"search\":         \"search\",\n})\nworkflow.add_edge(\"budget_alert\",   \"search\")    # warn then still search\nworkflow.add_edge(\"missing_budget\", END)          # stop \u2014 need input\nworkflow.add_edge(\"search\",         \"format\")\nworkflow.add_edge(\"format\",         END)\n\napp = workflow.compile()"}, {"group": "Core Concepts", "num": "C4", "title": "Checkpointing & Memory", "filename": "c4_checkpoint.py", "tags": [{"l": "Persistence", "c": "tc"}, {"l": "thread_id", "c": "ta"}, {"l": "~70 lines", "c": "tg"}], "desc": "By default, every graph.invoke() starts fresh \u2014 state is lost the moment the call returns. Checkpointing saves state after every node, keyed by thread_id, so conversations can resume exactly where they left off across separate invocations.", "usecase": "A user starts planning a Tokyo trip, closes the app, and returns later. With a checkpointer, the second session picks up exactly where the first ended \u2014 destination, dates, budget, and prior messages all restored.", "wn": ["New: MemorySaver (dev) or PostgresSaver (prod) passed to compile(checkpointer=...)", "Every node execution saves a checkpoint keyed by (thread_id, checkpoint_id)", "config={\"configurable\": {\"thread_id\": \"...\"}} routes this invocation to the right conversation", "Second invoke with the same thread_id resumes from the last checkpoint", "app.get_state(config) retrieves the current state without running the graph"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "What is the difference between MemorySaver and PostgresSaver?", "a": "MemorySaver stores checkpoints in-process, in a plain Python dict \u2014 it's lost the moment the process restarts. PostgresSaver writes to a real Postgres table, survives restarts, deploys, and crashes, and supports multiple concurrent processes reading the same thread. MemorySaver for development; PostgresSaver for anything that needs to survive a restart.", "mnemonic": "MemorySaver dies with the process; Postgres survives it", "steps": ["Process restarts", "MemorySaver: gone", "PostgresSaver: intact", "Conversation resumes"]}, {"q": "Can two invocations with the same thread_id run simultaneously?", "a": "Not safely with MemorySaver \u2014 it's not thread-safe for concurrent writes to the same thread. PostgresSaver uses row-level locking, so concurrent invocations with the same thread_id will queue behind each other, preventing checkpoint corruption. For high-concurrency scenarios, each user session should have a unique thread_id.", "mnemonic": "Same thread_id + concurrent writes = race condition with MemorySaver", "steps": ["2 invocations", "Same thread_id", "MemorySaver: race", "PostgresSaver: locks, queues"]}, {"q": "How do you pass new input to an existing thread without overwriting prior state?", "a": "Only pass the fields that are actually new in the second invoke call \u2014 LangGraph merges the new input over the existing checkpoint. Fields you don't pass keep their checkpointed values. If you pass a field you want to reset, just include it with the new value. The checkpoint is the \"base\" and your invoke input is a partial update on top of it.", "mnemonic": "New invoke = partial update on top of checkpoint", "steps": ["Checkpoint exists", "New invoke call", "Only pass new fields", "Merged with checkpoint"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.checkpoint.memory import MemorySaver   # swap \u2192 PostgresSaver for prod\n\n\nclass TravelState(TypedDict):\n    destination:  str | None\n    check_in:     str | None\n    check_out:    str | None\n    budget:       float | None\n    messages:     list[str]\n    hotel_results:list[dict]\n    session_count: int            # NEW: increments every session to show persistence\n\n\ndef greet_node(state: TravelState) -> dict:\n    count = state.get(\"session_count\", 0) + 1\n    msg = (f\"Welcome back! Session #{count}.\" if count > 1\n           else f\"Welcome! Let's plan your trip to {state['destination']}.\")\n    return {\"messages\": state[\"messages\"] + [msg], \"session_count\": count}\n\n\ndef search_node(state: TravelState) -> dict:\n    results = [{\"name\":\"Park Hyatt\",\"price\":350},{\"name\":\"APA Hotel\",\"price\":95}]\n    return {\"hotel_results\": [h for h in results if h[\"price\"] <= (state[\"budget\"] or 999)]}\n\n\ndef format_node(state: TravelState) -> dict:\n    names = [h[\"name\"] for h in state[\"hotel_results\"]]\n    return {\"messages\": state[\"messages\"] + [f\"Results: {names}\"]}\n\n\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"greet\",  greet_node)\nworkflow.add_node(\"search\", search_node)\nworkflow.add_node(\"format\", format_node)\nworkflow.set_entry_point(\"greet\")\nworkflow.add_edge(\"greet\",  \"search\")\nworkflow.add_edge(\"search\", \"format\")\nworkflow.add_edge(\"format\", END)\n\n# \u2500\u2500 Pass the checkpointer at compile time \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ncheckpointer = MemorySaver()\napp = workflow.compile(checkpointer=checkpointer)\n\n# \u2500\u2500 thread_id identifies the conversation \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ncfg = {\"configurable\": {\"thread_id\": \"user-42-tokyo-trip\"}}\n\n\nif __name__ == \"__main__\":\n    # Session 1 \u2014 first time\n    r1 = app.invoke({\n        \"destination\":\"Tokyo\", \"check_in\":\"2025-03-10\", \"check_out\":\"2025-03-15\",\n        \"budget\":200.0, \"messages\":[], \"hotel_results\":[], \"session_count\":0,\n    }, config=cfg)\n    print(\"Session 1:\", r1[\"messages\"][0])   # \"Welcome! Let's plan...\"\n\n    # Session 2 \u2014 same thread_id, state restored from checkpoint\n    r2 = app.invoke({\"messages\": []}, config=cfg)   # only pass new input\n    print(\"Session 2:\", r2[\"messages\"][0])   # \"Welcome back! Session #2.\"\n\n    # Inspect state without running\n    snapshot = app.get_state(cfg)\n    print(\"Stored destination:\", snapshot.values[\"destination\"])"}, {"group": "Core Concepts", "num": "C5", "title": "Store API \u2014 Long-term Memory", "filename": "c5_store.py", "tags": [{"l": "Store API", "c": "tc"}, {"l": "Cross-thread", "c": "ta"}, {"l": "~80 lines", "c": "tg"}], "desc": "The checkpointer handles per-conversation working memory. The Store API handles long-term memory that persists across conversations \u2014 user preferences, travel history, saved itineraries. Namespace-scoped key-value pairs, optionally searchable by embedding similarity.", "usecase": "A returning user's preferred airlines, past destinations, and loyalty program numbers should be remembered across every booking session \u2014 not just within one conversation thread. That's the Store.", "wn": ["New: InMemoryStore (dev) or PostgresStore (prod) passed to compile(store=...)", "Nodes that need the store declare it as a dependency: def node(state, *, store: BaseStore)", "store.put(namespace, key, value) writes a record \u2014 namespace is a tuple like (\"user_prefs\", user_id)", "store.get(namespace, key) retrieves a specific record", "store.search(namespace, query=...) does embedding similarity search across records"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "What is the difference between the checkpointer and the Store?", "a": "The checkpointer saves the complete graph state after every node, scoped to one thread_id \u2014 it's per-conversation working memory. The Store is a separate persistent key-value system, namespace-scoped, that survives across thread boundaries \u2014 it's long-term memory about a user or entity that you explicitly write to and read from.", "mnemonic": "Checkpointer = per-conversation. Store = across all conversations.", "steps": ["Checkpointer", "Per thread_id", "Store", "Across all threads"]}, {"q": "Why use a namespace tuple like (\"user_prefs\", user_id)?", "a": "Namespaces scope access so a store.get for user A can never accidentally retrieve user B's data. The tuple structure also makes it easy to search within a sub-namespace \u2014 you can call store.search((\"user_prefs\", user_id)) to find all preferences for one user without scanning unrelated namespaces.", "mnemonic": "Namespace = natural isolation boundary per entity", "steps": ["(\"user_prefs\",\"user-42\")", "(\"user_prefs\",\"user-43\")", "Separate namespaces", "No cross-read possible"]}, {"q": "When should you use store.search() vs store.get()?", "a": "store.get() for exact key lookups \u2014 you know precisely what you want (\"preferences\" for this user). store.search() for similarity-based retrieval \u2014 \"find the 3 past trips most similar to this destination query.\" search() requires an embedding index configured on the store; get() is always a direct key lookup with no embedding involved.", "mnemonic": "get = exact key. search = similarity over namespace.", "steps": ["Know exact key?", "store.get()", "Need similarity?", "store.search()"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.checkpoint.memory import MemorySaver\nfrom langgraph.store.memory import InMemoryStore   # swap \u2192 PostgresStore for prod\nfrom langgraph.store.base import BaseStore\n\n\nclass TravelState(TypedDict):\n    user_id:      str\n    destination:  str | None\n    budget:       float | None\n    messages:     list[str]\n    hotel_results:list[dict]\n    user_prefs:   dict            # NEW: populated from store, not from invoke input\n\n\n# \u2500\u2500 Node that reads long-term user preferences from Store \u2500\ndef load_prefs_node(state: TravelState, *, store: BaseStore) -> dict:\n    \"\"\"Reads cross-conversation user prefs \u2014 survives thread boundaries.\"\"\"\n    namespace = (\"user_prefs\", state[\"user_id\"])\n    item = store.get(namespace, \"preferences\")\n    prefs = item.value if item else {\"preferred_stars\": 3, \"airlines\": [], \"loyalty_ids\": {}}\n    return {\"user_prefs\": prefs}\n\n\ndef search_node(state: TravelState) -> dict:\n    min_stars = state[\"user_prefs\"].get(\"preferred_stars\", 3)\n    mock = [\n        {\"name\":\"Park Hyatt\",    \"price\":350,\"stars\":5},\n        {\"name\":\"Shibuya Excel\",  \"price\":165,\"stars\":4},\n        {\"name\":\"APA Hotel\",      \"price\": 95,\"stars\":3},\n    ]\n    filtered = [h for h in mock\n                if h[\"price\"] <= (state[\"budget\"] or 999)\n                and h[\"stars\"] >= min_stars]\n    return {\"hotel_results\": filtered}\n\n\n# \u2500\u2500 Node that writes back to Store after a booking \u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef save_trip_node(state: TravelState, *, store: BaseStore) -> dict:\n    \"\"\"Persist this trip to the user's travel history across all future sessions.\"\"\"\n    namespace = (\"travel_history\", state[\"user_id\"])\n    store.put(namespace, state[\"destination\"], {\n        \"destination\": state[\"destination\"],\n        \"budget\":      state[\"budget\"],\n        \"hotels_seen\": [h[\"name\"] for h in state[\"hotel_results\"]],\n    })\n    msg = f\"Trip to {state['destination']} saved to your travel history.\"\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\n# \u2500\u2500 Build graph with both checkpointer + store \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"load_prefs\", load_prefs_node)\nworkflow.add_node(\"search\",     search_node)\nworkflow.add_node(\"save_trip\",  save_trip_node)\nworkflow.set_entry_point(\"load_prefs\")\nworkflow.add_edge(\"load_prefs\", \"search\")\nworkflow.add_edge(\"search\",     \"save_trip\")\nworkflow.add_edge(\"save_trip\",  END)\n\nstore = InMemoryStore()\napp   = workflow.compile(checkpointer=MemorySaver(), store=store)\n\nif __name__ == \"__main__\":\n    # Seed user preferences (normally written after first booking)\n    store.put((\"user_prefs\", \"user-42\"), \"preferences\",\n              {\"preferred_stars\": 4, \"airlines\": [\"ANA\"], \"loyalty_ids\": {\"Hyatt\": \"HW-99821\"}})\n\n    result = app.invoke({\n        \"user_id\":\"user-42\", \"destination\":\"Tokyo\", \"budget\":200.0,\n        \"messages\":[], \"hotel_results\":[], \"user_prefs\":{},\n    }, config={\"configurable\":{\"thread_id\":\"user-42-session-3\"}})\n\n    print(\"Hotels (\u22654\u2605):\", [h[\"name\"] for h in result[\"hotel_results\"]])\n    print(result[\"messages\"][-1])"}, {"group": "Patterns", "num": "P1", "title": "Tool-Calling Agent (ReAct)", "filename": "p1_react_agent.py", "tags": [{"l": "ReAct loop", "c": "tc"}, {"l": "ToolNode", "c": "ta"}, {"l": "~85 lines", "c": "tg"}], "desc": "The ReAct pattern interleaves reasoning and tool calls: the LLM thinks, calls a tool if needed, observes the result, thinks again. Building on C4 \u2014 now with a real LLM and real tools replacing the mock search.", "usecase": "The travel assistant can now call real tools: search_hotels, get_flight_prices, check_availability. The LLM decides which to call and in what order based on what the user asked.", "wn": ["New: LLM bound with .bind_tools(tools) \u2014 LLM can now request tool calls", "ToolNode executes the requested tools and appends results as observations", "should_continue routing function checks if the last message has tool calls \u2014 if yes, loop", "MessagesState is a built-in state type with a messages field using add_messages reducer", "The loop continues until the LLM responds without tool calls \u2014 that's the final answer"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "Why does the tool observation feed back to the agent node?", "a": "Because the LLM needs to see the tool result to decide whether it has enough information to answer \u2014 or whether it needs to call another tool. Without the loop-back, the tool result would be a dead end. The loop is exactly what \"observe\" means in Thought\u2192Action\u2192Observe.", "mnemonic": "Observe \u2192 back to Think \u2192 decide next action", "steps": ["Tool runs", "Result appended", "Loop back to agent", "LLM sees result"]}, {"q": "What does MessagesState give you that a plain TypedDict doesn't?", "a": "MessagesState includes a pre-configured messages field with an add_messages reducer \u2014 it correctly handles appending new messages, updating existing ones by ID, and merging tool call results with their originating calls. A plain list field in your own TypedDict would need you to manually manage those merge semantics, which is error-prone.", "mnemonic": "MessagesState = messages field with merge logic built in", "steps": ["Plain list", "Manual merge", "MessagesState", "add_messages handles it"]}, {"q": "What sets the hard cap on loop iterations?", "a": "The recursion_limit in the config dict \u2014 it's a LangGraph-level safeguard that raises a GraphRecursionError if the graph visits more than that many nodes in one invoke call. The default is 25. Set it explicitly to a value that matches your task's expected depth \u2014 too low and legitimate multi-step tasks fail, too high and a confused agent runs up cost.", "mnemonic": "recursion_limit = hard ceiling, not a suggestion", "steps": ["Loop runs", "Node count++", "Hits recursion_limit", "GraphRecursionError raised"]}], "isArch": false, "code_plain": "from langgraph.graph import StateGraph, END, MessagesState\nfrom langgraph.prebuilt import ToolNode\nfrom langchain_anthropic import ChatAnthropic\nfrom langchain_core.tools import tool\n\n\n# \u2500\u2500 Tools the LLM can call \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n@tool\ndef search_hotels(destination: str, max_price: float) -> list:\n    \"\"\"Search available hotels by destination and max nightly price.\"\"\"\n    mock = {\n        \"Tokyo\":  [{\"name\":\"Park Hyatt\",\"price\":350},{\"name\":\"APA Hotel\",\"price\":95}],\n        \"Paris\":  [{\"name\":\"Le Bristol\",\"price\":900},{\"name\":\"Ibis Gare du Nord\",\"price\":120}],\n    }\n    hotels = mock.get(destination, [])\n    return [h for h in hotels if h[\"price\"] <= max_price]\n\n@tool\ndef get_flight_prices(origin: str, destination: str, date: str) -> dict:\n    \"\"\"Get cheapest available flight price for a route and date.\"\"\"\n    return {\"route\": f\"{origin}\u2192{destination}\", \"date\": date, \"cheapest_usd\": 680}\n\n@tool\ndef check_availability(hotel_name: str, check_in: str, check_out: str) -> dict:\n    \"\"\"Check if a specific hotel has availability for given dates.\"\"\"\n    return {\"hotel\": hotel_name, \"available\": True, \"rooms_left\": 3}\n\ntools = [search_hotels, get_flight_prices, check_availability]\n\n\n# \u2500\u2500 LLM bound with tool access \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nllm  = ChatAnthropic(model=\"claude-sonnet-4-6\").bind_tools(tools)\n\n\n# \u2500\u2500 Agent node: THINK step \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef agent_node(state: MessagesState) -> MessagesState:\n    response = llm.invoke(state[\"messages\"])\n    return {\"messages\": [response]}\n\n# \u2500\u2500 ToolNode: ACT + OBSERVE step (prebuilt) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ntool_node = ToolNode(tools)\n\n\n# \u2500\u2500 Routing: does the LLM want to call a tool? \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef should_continue(state: MessagesState) -> str:\n    last = state[\"messages\"][-1]\n    return \"tools\" if getattr(last, \"tool_calls\", None) else END\n\n\n# \u2500\u2500 Build the ReAct loop \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nworkflow = StateGraph(MessagesState)\nworkflow.add_node(\"agent\", agent_node)\nworkflow.add_node(\"tools\", tool_node)\nworkflow.set_entry_point(\"agent\")\nworkflow.add_conditional_edges(\"agent\", should_continue, {\"tools\": \"tools\", END: END})\nworkflow.add_edge(\"tools\", \"agent\")   # observation feeds back to THINK\n\napp = workflow.compile()\n\nif __name__ == \"__main__\":\n    result = app.invoke(\n        {\"messages\": [(\"user\", \"Find me hotels in Tokyo under $200/night and check if the cheapest one is available March 10-15.\")]},\n        config={\"recursion_limit\": 10},\n    )\n    print(result[\"messages\"][-1].content)"}, {"group": "Patterns", "num": "P2", "title": "Plan-and-Execute", "filename": "p2_plan_execute.py", "tags": [{"l": "Upfront plan", "c": "tc"}, {"l": "Structured output", "c": "ta"}, {"l": "~95 lines", "c": "tg"}], "desc": "Instead of reacting one step at a time, the planner LLM decomposes the task into discrete steps upfront. An executor then runs each step sequentially, and a replan node checks if the plan needs updating. Better than ReAct for long-horizon tasks where seeing the full plan before starting is valuable.", "usecase": "Planning a 5-day Tokyo itinerary involves many independent steps: find hotels, find flights, suggest activities for each day, check restaurant availability. Plan-and-Execute produces a visible step list before any execution starts.", "wn": ["New: PlanState carries a plan: list[str] \u2014 the full task decomposition", "with_structured_output(Plan) forces the LLM to produce a typed Pydantic plan", "executor_node pops one step at a time and appends the result to past_steps", "replan_node decides: continue, replan, or synthesise final response", "The plan is visible in state before any execution \u2014 auditable and resumable"], "install": "pip install langgraph langchain-anthropic pydantic", "qs": [{"q": "When does Plan-and-Execute beat ReAct?", "a": "When the task benefits from visible upfront structure \u2014 long-horizon planning where seeing all steps before any execution starts helps, auditable workflows where you want to log the plan before actions are taken, or tasks where the executor for each step is completely different (e.g. different tool sets per step). ReAct wins for short reactive tasks where the next action genuinely depends on observing the previous one.", "mnemonic": "Plan when structure first matters; React when each step depends on the last", "steps": ["Long-horizon task", "Structure helps", "Plan-Execute wins", "Short reactive \u2192 ReAct"]}, {"q": "What does Annotated[list, operator.add] do for past_steps?", "a": "It tells LangGraph to merge past_steps across nodes using operator.add \u2014 so each node that returns {\"past_steps\": [(step, result)]} appends to the accumulating list rather than overwriting it. Without the Annotated reducer, the second executor call would replace the first call's past_steps entirely.", "mnemonic": "Annotated reducer = accumulate, not overwrite", "steps": ["Node 1 returns list", "Node 2 returns list", "operator.add merges", "Both preserved in state"]}, {"q": "How do you handle a step that fails mid-plan?", "a": "Add error handling inside executor_node \u2014 wrap the execution in a try/except, return a partial result with an error marker (e.g. (step, \"ERROR: ...\")) and let replan_node inspect past_steps for errors. If errors are found, the replan node can revise the remaining plan before continuing. Without this, a single failed step silently produces bad context for all subsequent steps.", "mnemonic": "Catch errors per step, let replan decide what to do", "steps": ["Step fails", "try/except catches it", "Return (step, ERROR)", "replan_node revises"]}], "isArch": false, "code_plain": "from typing import TypedDict, Annotated\nimport operator\nfrom langgraph.graph import StateGraph, END\nfrom langchain_anthropic import ChatAnthropic\nfrom pydantic import BaseModel, Field\n\n\nclass Plan(BaseModel):\n    steps: list[str] = Field(description=\"Ordered steps to plan the trip\")\n\nclass PlanState(TypedDict):\n    task:       str\n    plan:       list[str]\n    past_steps: Annotated[list[tuple], operator.add]   # accumulates across nodes\n    response:   str | None\n\nllm        = ChatAnthropic(model=\"claude-sonnet-4-6\")\nplanner    = llm.with_structured_output(Plan)\n\n\n# \u2500\u2500 Step 1: produce the full plan upfront \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef planner_node(state: PlanState) -> dict:\n    plan = planner.invoke(f\"Create a step-by-step plan to: {state['task']}\")\n    return {\"plan\": plan.steps}\n\n\n# \u2500\u2500 Step 2: execute one step at a time \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef executor_node(state: PlanState) -> dict:\n    step = state[\"plan\"][0]\n    context = \"\n\".join(f\"- {s}: {r}\" for s, r in state[\"past_steps\"])\n    result = llm.invoke(\n        f\"Execute this travel planning step: {step}\n\"\n        f\"Context from prior steps:\n{context or 'None yet'}\"\n    )\n    remaining = state[\"plan\"][1:]\n    return {\"plan\": remaining, \"past_steps\": [(step, result.content)]}\n\n\n# \u2500\u2500 Step 3: decide if we're done or need to replan \u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef replan_node(state: PlanState) -> dict:\n    if not state[\"plan\"]:   # all steps consumed \u2014 synthesise answer\n        summary = llm.invoke(\n            f\"Task: {state['task']}\n\"\n            f\"Completed steps:\n\" + \"\n\".join(f\"- {s}: {r}\" for s,r in state[\"past_steps\"])\n        )\n        return {\"response\": summary.content}\n    return {}   # steps remain \u2014 executor will run next\n\n\ndef should_end(state: PlanState) -> str:\n    return END if state.get(\"response\") else \"executor\"\n\n\nworkflow = StateGraph(PlanState)\nworkflow.add_node(\"planner\",  planner_node)\nworkflow.add_node(\"executor\", executor_node)\nworkflow.add_node(\"replan\",   replan_node)\nworkflow.set_entry_point(\"planner\")\nworkflow.add_edge(\"planner\",  \"executor\")\nworkflow.add_edge(\"executor\", \"replan\")\nworkflow.add_conditional_edges(\"replan\", should_end, {\"executor\": \"executor\", END: END})\n\napp = workflow.compile()\n\nif __name__ == \"__main__\":\n    result = app.invoke({\n        \"task\": \"Plan a 5-day Tokyo trip for 2 people, budget $3000 total, flying from London\",\n        \"plan\": [], \"past_steps\": [], \"response\": None,\n    }, config={\"recursion_limit\": 30})\n    print(result[\"response\"])"}, {"group": "Patterns", "num": "P3", "title": "Parallel Fan-out with Send", "filename": "p3_parallel_send.py", "tags": [{"l": "Send API", "c": "tc"}, {"l": "Fan-out/in", "c": "ta"}, {"l": "~90 lines", "c": "tg"}], "desc": "For tasks with N independent sub-tasks, the Send API dispatches N parallel branches dynamically at runtime \u2014 not a fixed graph shape. Total latency becomes max(branches) not sum(branches). Building on P2 \u2014 same travel domain, now fetching hotel+flight+weather in parallel.", "usecase": "Searching for hotels, checking flight prices, and fetching weather forecasts for Tokyo are three completely independent lookups. Running them in parallel cuts total latency from ~3s to ~1s.", "wn": ["New: Send dispatches parallel branches \u2014 the count is not known at graph-compile time", "The dispatch function returns a list[Send] \u2014 each Send names a node and its private input", "Each branch runs its own isolated state dict (not the main graph state)", "The Annotated[list, operator.add] reducer on results collects all branch outputs", "Fan-in node runs only after ALL parallel branches complete"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "Why does Send use its own dict instead of the main state?", "a": "Each parallel branch needs isolated, independent input \u2014 branch A's \"hotels\" context shouldn't bleed into branch B's \"flights\" context. The private dict is the branch's local working state, not shared with siblings. Only when branches write back through the Annotated reducer does their output merge into the main graph state.", "mnemonic": "Branch input is isolated; output merges through reducer", "steps": ["Send creates branch", "Private dict only", "Branch writes results", "operator.add merges all"]}, {"q": "When does parallel fan-out add latency instead of saving it?", "a": "When there are only 1-2 sub-tasks \u2014 the overhead of setting up N branches exceeds what you save. Also when sub-tasks aren't actually independent and depend on each other's outputs. Fan-out wins when you have 3+ genuinely independent lookups each with non-trivial latency. For a single hotel search, the sequential approach in C2 is simpler and faster.", "mnemonic": "Fan-out wins at 3+ independent tasks \u2014 not for 1-2", "steps": ["1-2 tasks", "Overhead > savings", "3+ tasks", "Max(latency) wins"]}, {"q": "How does fan_in know all branches have finished?", "a": "LangGraph's execution engine tracks the outstanding edges from each Send. The fan_in node is only scheduled after every branch's run_lookup node has returned \u2014 it's a structural guarantee from the graph engine, not something you implement. This is why the order of items in the results list is not guaranteed \u2014 branches complete in whatever order the runtime finishes them.", "mnemonic": "Fan-in is a structural barrier \u2014 engine guarantees all done", "steps": ["N branches dispatched", "Each runs independently", "All return", "fan_in scheduled once"]}], "isArch": false, "code_plain": "from typing import TypedDict, Annotated\nimport operator\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.types import Send\n\n\nclass TravelState(TypedDict):\n    destination: str\n    check_in:    str\n    check_out:   str\n    budget:      float\n    lookups:     list[str]                              # which lookups to run\n    results:     Annotated[list[dict], operator.add]    # merged from parallel branches\n    summary:     str | None\n\n\n# \u2500\u2500 Dispatch node: decide what to look up in parallel \u2500\u2500\u2500\u2500\ndef plan_lookups(state: TravelState) -> dict:\n    return {\"lookups\": [\"hotels\", \"flights\", \"weather\"]}\n\n\n# \u2500\u2500 Fan-out: each lookup becomes an independent parallel branch \u2500\ndef dispatch_lookups(state: TravelState) -> list[Send]:\n    return [\n        Send(\"run_lookup\", {\"lookup\": t, \"destination\": state[\"destination\"],\n                          \"budget\": state[\"budget\"], \"check_in\": state[\"check_in\"]})\n        for t in state[\"lookups\"]\n    ]\n\n\n# \u2500\u2500 Each branch runs THIS node independently & concurrently \u2500\ndef run_lookup(branch: dict) -> TravelState:\n    lookup = branch[\"lookup\"]\n    dest   = branch[\"destination\"]\n    if lookup == \"hotels\":\n        data = {\"type\":\"hotels\", \"found\":[\"APA Hotel ($95)\", \"Shibuya Excel ($165)\"]}\n    elif lookup == \"flights\":\n        data = {\"type\":\"flights\", \"cheapest\":f\"LHR\u2192TYO on {branch['check_in']}: $680\"}\n    else:\n        data = {\"type\":\"weather\", \"forecast\":f\"{dest} in March: 12\u00b0C, mostly clear\"}\n    return {\"results\": [data]}   # operator.add merges each branch's output\n\n\n# \u2500\u2500 Fan-in: runs after ALL branches complete \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef fan_in(state: TravelState) -> dict:\n    parts = \"\n\".join(f\"[{r['type']}] {r}\" for r in state[\"results\"])\n    summary = f\"Travel brief for {state['destination']}:\n{parts}\"\n    return {\"summary\": summary}\n\n\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"plan\",       plan_lookups)\nworkflow.add_node(\"run_lookup\", run_lookup)\nworkflow.add_node(\"fan_in\",     fan_in)\nworkflow.set_entry_point(\"plan\")\nworkflow.add_conditional_edges(\"plan\", dispatch_lookups, [\"run_lookup\"])\nworkflow.add_edge(\"run_lookup\", \"fan_in\")\nworkflow.add_edge(\"fan_in\", END)\n\napp = workflow.compile()"}, {"group": "Patterns", "num": "P4", "title": "Subgraphs & Nesting", "filename": "p4_subgraphs.py", "tags": [{"l": "Nested graphs", "c": "tc"}, {"l": "Compiled node", "c": "ta"}, {"l": "~95 lines", "c": "tg"}], "desc": "A compiled LangGraph graph can be added as a node inside another graph \u2014 subgraphs. This lets you build independently testable units that compose into a larger system. Each subgraph has its own state schema and internal logic; the parent just treats it as a black box.", "usecase": "The hotel search pipeline and the flight search pipeline are each complex enough to be their own subgraph. A top-level travel planner graph calls them as nodes, composing their results without knowing their internals.", "wn": ["New: hotel_search_app = hotel_workflow.compile() \u2014 compiled subgraph is a reusable unit", "Add a compiled subgraph as a node: parent.add_node(\"hotel_search\", hotel_search_app)", "State schema between parent and subgraph must share compatible field names for automatic passing", "The parent graph passes its state to the subgraph node; the subgraph's output is merged back", "Subgraphs can have their own checkpointers, stores, and tools \u2014 fully self-contained"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "How does state pass from parent graph to subgraph?", "a": "LangGraph automatically extracts the fields from the parent state that match the subgraph's TypedDict schema, passes them as the subgraph's input, and merges the subgraph's output fields back into the parent state. Fields in the parent that don't exist in the subgraph schema are simply not passed. Fields the subgraph writes that exist in the parent schema are written back.", "mnemonic": "Matching field names = automatic pass-through. Extras are ignored.", "steps": ["Parent has N fields", "Subgraph needs M fields", "M \u2286 N: auto-passed", "Output merged back"]}, {"q": "Can a subgraph have its own checkpointer?", "a": "Yes \u2014 each subgraph can be compiled with its own independent checkpointer. This gives you per-subgraph resumability, which is useful when subgraphs are long-running and might need to recover independently from a crash. It also means each subgraph can use a different persistence backend \u2014 one in memory for fast ephemeral work, one in Postgres for durable long-running steps.", "mnemonic": "Each subgraph compiles independently \u2014 can have its own checkpointer", "steps": ["Subgraph 1", "MemorySaver", "Subgraph 2", "PostgresSaver"]}, {"q": "When are subgraphs better than just more nodes in the parent graph?", "a": "When the subgraph has its own distinct state schema with fields not needed in the parent, when it's complex enough to test independently, or when separate teams own it. A subgraph is a deployable, testable, versionable unit. If all nodes share the same state and the same team owns them, adding more nodes to the parent is simpler.", "mnemonic": "Subgraph when: distinct schema, independent test, separate owner", "steps": ["Shared state + same team", "More nodes in parent", "Distinct schema + team", "Subgraph wins"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# SUBGRAPH 1 \u2014 Hotel search pipeline\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nclass HotelState(TypedDict):\n    destination:   str\n    budget:        float\n    hotel_results: list[dict]\n\ndef hotel_search(state: HotelState) -> dict:\n    mock = [\"Park Hyatt ($350)\", \"APA Hotel ($95)\", \"Shibuya Excel ($165)\"]\n    return {\"hotel_results\": [{\"name\":h} for h in mock]}\n\ndef hotel_rank(state: HotelState) -> dict:\n    # Sort by price ascending (extracted from name string for demo)\n    ranked = sorted(state[\"hotel_results\"], key=lambda h: h[\"name\"])\n    return {\"hotel_results\": ranked}\n\nhotel_workflow = StateGraph(HotelState)\nhotel_workflow.add_node(\"search\", hotel_search)\nhotel_workflow.add_node(\"rank\",   hotel_rank)\nhotel_workflow.set_entry_point(\"search\")\nhotel_workflow.add_edge(\"search\", \"rank\")\nhotel_workflow.add_edge(\"rank\",   END)\nhotel_app = hotel_workflow.compile()   # compiled = black box to the parent\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# SUBGRAPH 2 \u2014 Flight search pipeline\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nclass FlightState(TypedDict):\n    destination:    str\n    check_in:       str\n    flight_results: list[dict]\n\ndef flight_search(state: FlightState) -> dict:\n    return {\"flight_results\": [{\"route\":f\"LHR\u2192{state['destination']}\",\"price\":680}]}\n\nflight_workflow = StateGraph(FlightState)\nflight_workflow.add_node(\"search\", flight_search)\nflight_workflow.set_entry_point(\"search\")\nflight_workflow.add_edge(\"search\", END)\nflight_app = flight_workflow.compile()\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# PARENT GRAPH \u2014 calls both subgraphs as nodes\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nclass TravelState(TypedDict):\n    destination:    str\n    check_in:       str\n    budget:         float\n    hotel_results:  list[dict]\n    flight_results: list[dict]\n    summary:        str | None\n\ndef summarise(state: TravelState) -> dict:\n    h = len(state[\"hotel_results\"])\n    f = len(state[\"flight_results\"])\n    return {\"summary\": f\"Found {h} hotels and {f} flights for {state['destination']}.\"}\n\nparent = StateGraph(TravelState)\nparent.add_node(\"hotels\",   hotel_app)      # compiled subgraph IS a node\nparent.add_node(\"flights\",  flight_app)\nparent.add_node(\"summarise\", summarise)\nparent.set_entry_point(\"hotels\")\nparent.add_edge(\"hotels\",   \"flights\")\nparent.add_edge(\"flights\",  \"summarise\")\nparent.add_edge(\"summarise\", END)\n\napp = parent.compile()"}, {"group": "Patterns", "num": "P5", "title": "Command & Direct Handoffs", "filename": "p5_command.py", "tags": [{"l": "Command", "c": "tc"}, {"l": "Lateral transfer", "c": "ta"}, {"l": "~85 lines", "c": "tg"}], "desc": "When a node needs to both update state AND specify the next node to go to (bypassing the router), Command is the tool. This enables lateral handoffs \u2014 a hotel agent realising mid-task that the user actually wants flight help, transferring directly without routing back through a supervisor.", "usecase": "The hotel search agent discovers the dates are unavailable and hands off directly to the alternatives agent with a structured context payload, without going back through a top-level router.", "wn": ["New: Command(goto=\"node_name\", update={...}) is returned from a node instead of a plain dict", "goto overrides whatever edge was wired \u2014 the node picks its own successor", "update is the state update, same as a normal node return dict", "Useful for lateral transfers where the routing decision is domain logic the current node possesses", "Every Command-based handoff must be explicitly logged \u2014 no central router logs it automatically"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "How does Command differ from a conditional edge?", "a": "A conditional edge is declared at graph-build time \u2014 you list all possible next nodes and the routing function picks one. Command is returned at runtime from inside a node \u2014 the node itself decides where to go next based on what it discovers during execution. Use conditional edges when routing logic is known upfront; use Command when the routing decision requires information only available after the node runs.", "mnemonic": "Edges are declared at build time; Command decides at run time", "steps": ["Build time", "Edges declared", "Run time", "Command returns destination"]}, {"q": "What goes in the handoff_context field?", "a": "A compressed, structured summary of why the handoff happened and what the receiving node needs to know to pick up the conversation without asking redundant questions. It should be deliberate and concise \u2014 not a raw dump of the full message history. The receiving node uses it to understand its starting context without having to re-derive it from scratch.", "mnemonic": "Context summary = why + what the receiver needs, compressed", "steps": ["Handoff triggered", "Write the reason", "Write receiver context", "Receiver reads it fresh"]}, {"q": "Can Command route to a node that's not wired with an edge from the current node?", "a": "Yes \u2014 and that's exactly the point. Command bypasses the graph's declared edge structure for this one transition. The destination node just needs to exist in the graph; it doesn't need a wired edge from the current node. This is more powerful than conditional edges but requires you to take full responsibility for logging the transition, since there's no central routing point that captures it.", "mnemonic": "Command can go anywhere in the graph \u2014 edges optional", "steps": ["Node A runs", "No edge to Node C", "Command(goto=\"C\")", "Graph routes to C anyway"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.types import Command\nimport logging\n\nlog = logging.getLogger(__name__)\n\n\nclass TravelState(TypedDict):\n    destination:      str\n    check_in:         str\n    check_out:        str\n    budget:           float\n    messages:         list[str]\n    handoff_reason:   str | None   # filled when Command transfers control\n    handoff_context:  str | None   # summary passed to receiving node\n\n\n# \u2500\u2500 Hotel search node \u2014 may hand off to alternatives \u2500\u2500\u2500\u2500\u2500\ndef hotel_node(state: TravelState) -> Command | dict:\n    # Simulate: hotel not available on requested dates\n    available = False\n\n    if not available:\n        reason  = f\"No hotels available in {state['destination']} for {state['check_in']}\u2013{state['check_out']}\"\n        context = f\"User wants {state['destination']}, budget ${state['budget']}/night, dates unavailable\"\n        log.info(\"handoff\", extra={\"from\":\"hotel_node\",\"to\":\"alternatives_node\",\"reason\":reason})\n\n        return Command(\n            goto=\"alternatives\",     # bypass whatever edge was wired\n            update={\n                \"messages\":        state[\"messages\"] + [f\"\u26a0\ufe0f {reason}\"],\n                \"handoff_reason\":  reason,\n                \"handoff_context\": context,\n            }\n        )\n    # Normal case: hotel found\n    return {\"messages\": state[\"messages\"] + [f\"Found hotels in {state['destination']}.\"]}\n\n\n# \u2500\u2500 Alternatives node \u2014 receives context from handoff \u2500\u2500\u2500\u2500\ndef alternatives_node(state: TravelState) -> dict:\n    ctx = state.get(\"handoff_context\", \"\")\n    msg = (\n        f\"Looking for alternatives. Context: {ctx}\n\"\n        f\"Suggestions: try \u00b13 days on dates, or nearby city Osaka.\"\n    )\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\n# \u2500\u2500 Format node \u2014 runs after either path \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef format_node(state: TravelState) -> dict:\n    return {\"messages\": state[\"messages\"] + [\"Trip planning complete.\"]}\n\n\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"hotels\",       hotel_node)\nworkflow.add_node(\"alternatives\", alternatives_node)\nworkflow.add_node(\"format\",       format_node)\nworkflow.set_entry_point(\"hotels\")\nworkflow.add_edge(\"hotels\",       \"format\")        # normal path\nworkflow.add_edge(\"alternatives\", \"format\")        # handoff path converges here\nworkflow.add_edge(\"format\",       END)\n\napp = workflow.compile()"}, {"group": "Patterns", "num": "P6", "title": "Human-in-the-Loop", "filename": "p6_human_loop.py", "tags": [{"l": "interrupt_before", "c": "tc"}, {"l": "Pause & resume", "c": "ta"}, {"l": "~85 lines", "c": "tg"}], "desc": "interrupt_before tells LangGraph to pause execution before a specified node, save the full state to the checkpointer, and wait for an external signal to resume. The graph doesn't run the paused node \u2014 a human can inspect state, modify it, and then resume.", "usecase": "Before confirming a hotel booking (a real-money, irreversible action), the system pauses for the user to review the selection. If they approve, execution resumes from the booking node; if they modify the selection, state is updated before resuming.", "wn": ["New: compile(interrupt_before=[\"book_hotel\"]) \u2014 pause before this node every time", "app.invoke() returns when it hits the interrupt, with current state", "app.get_state(config) retrieves the paused state for the human to inspect", "app.update_state(config, update) lets the human modify state before resuming", "app.invoke(None, config) \u2014 pass None to resume from the checkpoint"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "What does invoke(None, config) mean?", "a": "Passing None as the input tells LangGraph to not update the state at all \u2014 just resume the graph from its last saved checkpoint. The graph picks up exactly where it paused: it re-reads the current state from the checkpointer and runs the node that was interrupted. If you pass a dict instead of None, that dict is merged into the state before resuming.", "mnemonic": "invoke(None) = resume from checkpoint, no state change", "steps": ["Graph paused", "Human approves", "invoke(None, config)", "Resumes from checkpoint"]}, {"q": "Can you interrupt_after instead of interrupt_before?", "a": "Yes \u2014 interrupt_after pauses after a node runs, giving you the node's output for review before the next node starts. Use interrupt_before when you want to confirm or modify state before a node runs (e.g. before a booking). Use interrupt_after when you want to review what a node produced (e.g. after an LLM draft, before sending it to the user).", "mnemonic": "Before = confirm before action. After = review output before next step.", "steps": ["interrupt_before", "Confirm before action", "interrupt_after", "Review output first"]}, {"q": "What happens to the interrupt if the checkpointer is MemorySaver and the process restarts?", "a": "The state is lost entirely \u2014 MemorySaver only lives for the process lifetime. If you restart the process, the paused thread is gone and the user would have to restart their booking. This is why production human-in-loop workflows require PostgresSaver \u2014 the interrupt state persists across process restarts and can be resumed hours or days later.", "mnemonic": "MemorySaver + restart = lost interrupt. Prod needs PostgresSaver.", "steps": ["Graph paused", "Process restarts", "MemorySaver: state gone", "PostgresSaver: resumes fine"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.checkpoint.memory import MemorySaver\n\n\nclass BookingState(TypedDict):\n    destination:    str\n    hotel:          str | None\n    check_in:       str\n    check_out:      str\n    total_price:    float | None\n    booking_ref:    str | None\n    messages:       list[str]\n    approved:       bool\n\n\ndef search_node(state: BookingState) -> dict:\n    # Find the best hotel within budget\n    hotel = \"Shibuya Excel Hotel\"\n    price = 165.0 * 5   # 5 nights\n    msg = f\"Best match: {hotel} \u2014 ${price} total (5 nights)\"\n    return {\"hotel\": hotel, \"total_price\": price,\n            \"messages\": state[\"messages\"] + [msg]}\n\n\ndef book_hotel_node(state: BookingState) -> dict:\n    \"\"\"This node runs AFTER human approval \u2014 confirmed booking.\"\"\"\n    if not state.get(\"approved\", False):\n        return {\"messages\": state[\"messages\"] + [\"Booking cancelled by user.\"]}\n    ref = f\"BK-{state['destination'][:3].upper()}-88210\"\n    msg = f\"\u2705 Booked {state['hotel']} \u00b7 Ref: {ref} \u00b7 ${state['total_price']}\"\n    return {\"booking_ref\": ref, \"messages\": state[\"messages\"] + [msg]}\n\n\nworkflow = StateGraph(BookingState)\nworkflow.add_node(\"search\",     search_node)\nworkflow.add_node(\"book_hotel\", book_hotel_node)\nworkflow.set_entry_point(\"search\")\nworkflow.add_edge(\"search\",     \"book_hotel\")\nworkflow.add_edge(\"book_hotel\", END)\n\n# \u2500\u2500 interrupt_before=\"book_hotel\" \u2014 pause before booking \u2500\napp = workflow.compile(\n    checkpointer=MemorySaver(),\n    interrupt_before=[\"book_hotel\"],   # the graph pauses here every time\n)\n\ncfg = {\"configurable\": {\"thread_id\": \"booking-session-1\"}}\n\nif __name__ == \"__main__\":\n    # Phase 1: run until interrupted\n    r1 = app.invoke({\n        \"destination\":\"Tokyo\", \"hotel\":None, \"check_in\":\"2025-03-10\",\n        \"check_out\":\"2025-03-15\", \"total_price\":None, \"booking_ref\":None,\n        \"messages\":[], \"approved\":False,\n    }, config=cfg)\n    print(\"[PAUSED]\", r1[\"messages\"][-1])   # search result shown, waiting for approval\n\n    # Human reviews and approves \u2014 update state before resuming\n    app.update_state(cfg, {\"approved\": True})\n\n    # Phase 2: resume \u2014 book_hotel node now runs with approved=True\n    r2 = app.invoke(None, config=cfg)\n    print(\"[DONE]\", r2[\"messages\"][-1])"}, {"group": "Patterns", "num": "P7", "title": "Streaming", "filename": "p7_streaming.py", "tags": [{"l": "stream()", "c": "tc"}, {"l": "Token streaming", "c": "ta"}, {"l": "~75 lines", "c": "tg"}], "desc": "Instead of waiting for the full graph to finish, stream() yields incremental updates as they happen \u2014 node outputs, individual LLM tokens, state changes. Critical for user-facing applications where perceived latency matters more than actual latency.", "usecase": "The user sees the hotel search results appear as they're found, then the LLM's summary appearing token by token \u2014 rather than waiting 3 seconds for the whole response. Same graph, different invocation method.", "wn": ["New: app.stream(input, config, stream_mode=...) returns an async/sync iterator", "stream_mode=\"values\" \u2014 emits the full state after each node", "stream_mode=\"updates\" \u2014 emits only the delta (what changed) after each node", "stream_mode=\"messages\" \u2014 emits individual LLM tokens as they arrive", "Multiple modes can be combined: stream_mode=[\"updates\",\"messages\"]"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "What is the difference between stream_mode values, updates, and messages?", "a": "\"values\" emits the full state snapshot after each node \u2014 useful when you want to track the complete picture. \"updates\" emits only the delta (what the node returned) \u2014 more efficient, better for monitoring what changed. \"messages\" emits individual LLM tokens as they stream from the model \u2014 the only mode that lets you show partial responses to users in real time.", "mnemonic": "values=full state, updates=delta only, messages=token by token", "steps": ["values", "Full state each node", "updates", "Delta only", "messages", "Token stream"]}, {"q": "Can you stream and still use a checkpointer?", "a": "Yes \u2014 streaming and checkpointing are independent. The graph writes checkpoints after each node as normal, and stream() yields events as it goes. In fact, streaming with a checkpointer is the recommended production pattern: you get real-time user feedback AND durable state persistence.", "mnemonic": "Streaming and checkpointing are independent \u2014 use both", "steps": ["stream() runs", "Yields events", "After each node", "Checkpoint also written"]}, {"q": "How do you stream to a web client (SSE or WebSocket)?", "a": "Iterate over app.stream() inside your API handler, formatting each chunk as a Server-Sent Event (data: {chunk}\\n\\n) for SSE, or call ws.send() for WebSocket. For FastAPI, use StreamingResponse with an async generator that wraps app.astream(). The key is using astream() (the async version) to avoid blocking the event loop during LLM token generation.", "mnemonic": "astream() for async \u2192 AsyncGenerator \u2192 StreamingResponse", "steps": ["Client connects", "FastAPI async handler", "app.astream()", "SSE/WebSocket chunks"]}], "isArch": false, "code_plain": "from langgraph.graph import StateGraph, END, MessagesState\nfrom langgraph.prebuilt import ToolNode\nfrom langchain_anthropic import ChatAnthropic\nfrom langchain_core.tools import tool\n\n\n@tool\ndef search_hotels(destination: str, max_price: float) -> list:\n    \"\"\"Search available hotels.\"\"\"\n    return [{\"name\":\"APA Hotel\",\"price\":95},{\"name\":\"Shibuya Excel\",\"price\":165}]\n\ntools    = [search_hotels]\nllm      = ChatAnthropic(model=\"claude-sonnet-4-6\").bind_tools(tools)\ntool_node = ToolNode(tools)\n\ndef agent(state: MessagesState):\n    return {\"messages\": [llm.invoke(state[\"messages\"])]}\n\ndef should_continue(state):\n    return \"tools\" if getattr(state[\"messages\"][-1],\"tool_calls\",None) else END\n\nworkflow = StateGraph(MessagesState)\nworkflow.add_node(\"agent\", agent)\nworkflow.add_node(\"tools\", tool_node)\nworkflow.set_entry_point(\"agent\")\nworkflow.add_conditional_edges(\"agent\", should_continue, {\"tools\":\"tools\", END:END})\nworkflow.add_edge(\"tools\", \"agent\")\napp = workflow.compile()\n\ninput_msg = {\"messages\": [(\"user\", \"Find hotels in Tokyo under $200 and recommend the best one.\")]}\n\nif __name__ == \"__main__\":\n    print(\"\u2500\u2500 stream_mode='updates' (node deltas) \u2500\u2500\")\n    for chunk in app.stream(input_msg, stream_mode=\"updates\"):\n        node_name = list(chunk.keys())[0]\n        print(f\"[{node_name}] updated\")\n\n    print(\"\n\u2500\u2500 stream_mode='messages' (tokens) \u2500\u2500\")\n    for msg, metadata in app.stream(input_msg, stream_mode=\"messages\"):\n        if hasattr(msg, \"content\") and msg.content:\n            print(msg.content, end=\"\", flush=True)\n\n    print(\"\n\n\u2500\u2500 combined modes \u2500\u2500\")\n    for event_type, data in app.stream(input_msg, stream_mode=[\"updates\",\"messages\"]):\n        if event_type == \"updates\":\n            print(f\"\n[node update: {list(data.keys())[0]}]\")\n        elif event_type == \"messages\":\n            msg, _ = data\n            if hasattr(msg, \"content\") and msg.content:\n                print(msg.content, end=\"\", flush=True)"}, {"group": "Multi-Agent", "num": "M1", "title": "Supervisor Pattern", "filename": "m1_supervisor.py", "tags": [{"l": "Supervisor LLM", "c": "tc"}, {"l": "Specialist workers", "c": "ta"}, {"l": "~100 lines", "c": "tg"}], "desc": "A supervisor LLM receives the task and routes to specialist worker agents. Workers always return to the supervisor, which decides the next step or declares the task finished. Building on P1 \u2014 now coordinating multiple specialists rather than one general agent.", "usecase": "A Travel Coordinator supervisor routes between three specialists: Hotel Agent (search and book accommodation), Flight Agent (find and compare flights), Itinerary Agent (suggest activities and day plans) \u2014 each with its own tool set.", "wn": ["New: supervisor_node uses structured output to pick the next worker or FINISH", "Each worker is a create_react_agent compiled graph with its own tools", "Workers always return to supervisor \u2014 centralised, auditable routing", "SupervisorState extends MessagesState with a next field for routing", "recursion_limit caps the total supervisor\u2192worker\u2192supervisor loop count"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "Why must workers always return to the supervisor instead of each other?", "a": "Centralising all routing through the supervisor means every transition is a logged supervisor decision \u2014 you have one place to audit the full conversation flow. If workers called each other directly, routing logic would be scattered across every worker, making it much harder to understand why the system did what it did, especially in a compliance context.", "mnemonic": "One router = one audit point. Workers to each other = scattered routing.", "steps": ["Worker done", "Returns to supervisor", "Supervisor logs decision", "Routes to next worker"]}, {"q": "What does create_react_agent give you compared to building one manually?", "a": "create_react_agent builds the full Thought\u2192Action\u2192Observe loop for you \u2014 it wires the agent node, the ToolNode, the should_continue routing function, and the MessagesState into a compiled graph. Manual construction (as in P1) gives you more control over customising each step. Use create_react_agent for standard workers in a multi-agent system; use manual construction when the agent's loop needs custom logic.", "mnemonic": "create_react_agent = prebuilt loop. Manual = custom control.", "steps": ["create_react_agent", "Full loop prebuilt", "Manual build", "Each step customisable"]}, {"q": "How does routing consistency degrade as you add more workers?", "a": "The supervisor LLM has to discriminate between an increasing number of options in one call. More options generally means lower routing consistency \u2014 the model might oscillate between similar-sounding workers or fail to use a specialist when it should. Past ~10-15 workers, split into a hierarchical structure (M2) so no single routing call has to discriminate across all of them at once.", "mnemonic": ">10 workers = routing degrades. Split into hierarchy.", "steps": ["5 workers", "Routing fine", "15+ workers", "Accuracy degrades \u2192 M2"]}], "isArch": false, "code_plain": "from typing import Literal\nfrom langgraph.graph import StateGraph, END, MessagesState\nfrom langgraph.prebuilt import create_react_agent\nfrom langchain_anthropic import ChatAnthropic\nfrom langchain_core.tools import tool\nfrom pydantic import BaseModel\n\nllm = ChatAnthropic(model=\"claude-sonnet-4-6\")\n\n\n# \u2500\u2500 Worker tools (each agent has its own narrowly-scoped set) \u2500\n@tool\ndef search_hotels(destination: str, max_price: float) -> list:\n    \"\"\"Search hotels.\"\"\"\n    return [{\"name\":\"APA Hotel\",\"price\":95},{\"name\":\"Shibuya Excel\",\"price\":165}]\n\n@tool\ndef search_flights(origin: str, destination: str, date: str) -> dict:\n    \"\"\"Search flights.\"\"\"\n    return {\"cheapest\": f\"LHR\u2192{destination}\", \"price\": 680, \"date\": date}\n\n@tool\ndef get_activities(destination: str, days: int) -> list:\n    \"\"\"Get recommended activities.\"\"\"\n    return [\"Shibuya crossing\",\"Senso-ji temple\",\"Akihabara\",\"teamLab Planets\"][:days]\n\n\n# \u2500\u2500 Three specialist agents \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nhotel_agent     = create_react_agent(llm, tools=[search_hotels])\nflight_agent    = create_react_agent(llm, tools=[search_flights])\nitinerary_agent = create_react_agent(llm, tools=[get_activities])\n\n\n# \u2500\u2500 Supervisor: structured routing decision \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nclass RouteDecision(BaseModel):\n    next: Literal[\"hotel_agent\", \"flight_agent\", \"itinerary_agent\", \"FINISH\"]\n\nsupervisor_llm = llm.with_structured_output(RouteDecision)\n\nSYSTEM = \"\"\"You are a travel coordinator. Route requests to the right specialist:\n- hotel_agent: accommodation search and booking\n- flight_agent: flight search and pricing\n- itinerary_agent: activity suggestions and day plans\n- FINISH: when the user's request is fully addressed\"\"\"\n\nclass SupervisorState(MessagesState):\n    next: str\n\ndef supervisor_node(state: SupervisorState) -> dict:\n    decision = supervisor_llm.invoke([{\"role\":\"system\",\"content\":SYSTEM}] + state[\"messages\"])\n    return {\"next\": decision.next}\n\ndef make_worker(agent):\n    def _node(state: SupervisorState) -> dict:\n        result = agent.invoke({\"messages\": state[\"messages\"]})\n        return {\"messages\": result[\"messages\"]}\n    return _node\n\nworkflow = StateGraph(SupervisorState)\nworkflow.add_node(\"supervisor\",      supervisor_node)\nworkflow.add_node(\"hotel_agent\",     make_worker(hotel_agent))\nworkflow.add_node(\"flight_agent\",    make_worker(flight_agent))\nworkflow.add_node(\"itinerary_agent\", make_worker(itinerary_agent))\nworkflow.set_entry_point(\"supervisor\")\nworkflow.add_conditional_edges(\"supervisor\", lambda s: s[\"next\"],\n    {\"hotel_agent\":\"hotel_agent\", \"flight_agent\":\"flight_agent\",\n     \"itinerary_agent\":\"itinerary_agent\", \"FINISH\":END})\nfor worker in [\"hotel_agent\",\"flight_agent\",\"itinerary_agent\"]:\n    workflow.add_edge(worker, \"supervisor\")   # always back to supervisor\n\napp = workflow.compile()"}, {"group": "Multi-Agent", "num": "M2", "title": "Hierarchical Graphs", "filename": "m2_hierarchical.py", "tags": [{"l": "Nested managers", "c": "tc"}, {"l": "Domain isolation", "c": "ta"}, {"l": "~110 lines", "c": "tg"}], "desc": "When the system scales beyond what one supervisor can route cleanly, add a layer: a top-level coordinator routes to domain managers (Accommodation, Transport), each of which is itself a supervisor over its own specialist workers. Building directly on M1.", "usecase": "Accommodation Manager oversees Hotel Agent and Hostel Agent. Transport Manager oversees Flight Agent and Train Agent. A top-level Travel Coordinator routes between these two domains \u2014 no single routing call has to discriminate across all four specialists.", "wn": ["New: each domain manager is a compiled StateGraph added as a node in the parent", "Parent treats compiled subgraph as a black box \u2014 same pattern as P4 but with supervisors inside", "State schemas must share compatible field names for automatic pass-through", "Failure isolation: a bug inside Accommodation Manager can't corrupt Transport Manager state", "Mirrors team ownership \u2014 each domain manager subgraph is owned and deployed by a separate s
