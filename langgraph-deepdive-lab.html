ub-team"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "What is the structural advantage of hierarchy vs flat routing?", "a": "In a flat supervisor, a single routing call discriminates across all workers \u2014 accuracy degrades as N grows. In hierarchy, each routing call only discriminates across a small number of domains or workers at that level. The top coordinator picks between 2 domains. Each domain manager picks between 2-3 workers. Neither routing call is overloaded. Total accuracy improves because each individual decision is easier.", "mnemonic": "Hierarchy = each routing decision is simpler. Flat = one decision gets harder.", "steps": ["Flat: 1 router, N workers", "Routing degrades", "Hierarchy: N small decisions", "Each one easier"]}, {"q": "How do you test a domain subgraph independently?", "a": "Compile and invoke it in isolation with just the messages field \u2014 it's a complete, self-contained graph. Write unit tests for each domain subgraph before testing the full hierarchical graph. This is the main testability advantage of the hierarchical pattern: you can verify the Accommodation Domain behaves correctly without setting up the Transport Domain or the top-level coordinator.", "mnemonic": "Compile alone, test alone \u2014 that's the point of the subgraph boundary", "steps": ["accom_domain.compile()", "Test in isolation", "All accommodation tests pass", "Then test full hierarchy"]}, {"q": "Can the same worker agent appear in multiple domain subgraphs?", "a": "Yes \u2014 a compiled create_react_agent is just a callable that can be added as a node to any StateGraph. If a search_hotels agent is needed in both the Accommodation Domain and a separate Premium Travel Domain, you can add the same compiled agent instance to both. Just be aware that shared state (like memory) between instances would need to be managed carefully.", "mnemonic": "Compiled agents are reusable \u2014 add to any graph that needs them", "steps": ["create_react_agent", "Compiled once", "Add to domain A", "Also add to domain B"]}], "isArch": false, "code_plain": "from typing import Literal\nfrom langgraph.graph import StateGraph, END, MessagesState\nfrom langgraph.prebuilt import create_react_agent\nfrom langchain_anthropic import ChatAnthropic\nfrom langchain_core.tools import tool\nfrom pydantic import BaseModel\n\nllm = ChatAnthropic(model=\"claude-sonnet-4-6\")\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# LAYER 2 \u2014 Accommodation Domain\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n@tool\ndef search_hotels(destination: str) -> list: return [\"Park Hyatt\",\"APA Hotel\"]\n@tool\ndef search_hostels(destination: str) -> list: return [\"Tokyo Backpackers\",\"Khaosan Tokyo\"]\n\nhotel_agent   = create_react_agent(llm, tools=[search_hotels])\nhostel_agent  = create_react_agent(llm, tools=[search_hostels])\n\nclass AccomRoute(BaseModel):\n    next: Literal[\"hotel_agent\",\"hostel_agent\",\"FINISH\"]\n\nclass AccomState(MessagesState):\n    next: str\n\ndef accom_manager(state: AccomState) -> dict:\n    d = llm.with_structured_output(AccomRoute).invoke(\n        \"Route to hotel_agent (4\u2605+), hostel_agent (budget), or FINISH: \" + str(state[\"messages\"]))\n    return {\"next\": d.next}\n\naccom_workflow = StateGraph(AccomState)\naccom_workflow.add_node(\"manager\",      accom_manager)\naccom_workflow.add_node(\"hotel_agent\",  lambda s: hotel_agent.invoke(s))\naccom_workflow.add_node(\"hostel_agent\", lambda s: hostel_agent.invoke(s))\naccom_workflow.set_entry_point(\"manager\")\naccom_workflow.add_conditional_edges(\"manager\", lambda s: s[\"next\"],\n    {\"hotel_agent\":\"hotel_agent\",\"hostel_agent\":\"hostel_agent\",\"FINISH\":END})\naccom_workflow.add_edge(\"hotel_agent\",  \"manager\")\naccom_workflow.add_edge(\"hostel_agent\", \"manager\")\naccom_domain = accom_workflow.compile()   # compiled = black box\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# LAYER 2 \u2014 Transport Domain\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n@tool\ndef search_flights(origin: str, dest: str) -> dict: return {\"price\":680}\n@tool\ndef search_trains(origin: str, dest: str) -> dict:  return {\"price\":85}\n\nflight_agent = create_react_agent(llm, tools=[search_flights])\ntrain_agent  = create_react_agent(llm, tools=[search_trains])\n\nclass TransportRoute(BaseModel):\n    next: Literal[\"flight_agent\",\"train_agent\",\"FINISH\"]\n\nclass TransportState(AccomState): pass   # same shape\n\ndef transport_manager(state: TransportState) -> dict:\n    d = llm.with_structured_output(TransportRoute).invoke(\n        \"Route to flight_agent (international/long) or train_agent (domestic/short): \" + str(state[\"messages\"]))\n    return {\"next\": d.next}\n\ntransport_workflow = StateGraph(TransportState)\ntransport_workflow.add_node(\"manager\",      transport_manager)\ntransport_workflow.add_node(\"flight_agent\", lambda s: flight_agent.invoke(s))\ntransport_workflow.add_node(\"train_agent\",  lambda s: train_agent.invoke(s))\ntransport_workflow.set_entry_point(\"manager\")\ntransport_workflow.add_conditional_edges(\"manager\", lambda s: s[\"next\"],\n    {\"flight_agent\":\"flight_agent\",\"train_agent\":\"train_agent\",\"FINISH\":END})\ntransport_workflow.add_edge(\"flight_agent\",  \"manager\")\ntransport_workflow.add_edge(\"train_agent\",   \"manager\")\ntransport_domain = transport_workflow.compile()\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# LAYER 1 \u2014 Top-level Travel Coordinator\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nclass TopRoute(BaseModel):\n    next: Literal[\"accommodation\",\"transport\",\"FINISH\"]\n\nclass TopState(MessagesState):\n    next: str\n\ndef coordinator(state: TopState) -> dict:\n    d = llm.with_structured_output(TopRoute).invoke(\n        \"Route to accommodation (hotels/hostels) or transport (flights/trains): \" + str(state[\"messages\"]))\n    return {\"next\": d.next}\n\ntop = StateGraph(TopState)\ntop.add_node(\"coordinator\",  coordinator)\ntop.add_node(\"accommodation\", accom_domain)       # compiled subgraph as node\ntop.add_node(\"transport\",     transport_domain)\ntop.set_entry_point(\"coordinator\")\ntop.add_conditional_edges(\"coordinator\", lambda s: s[\"next\"],\n    {\"accommodation\":\"accommodation\",\"transport\":\"transport\",\"FINISH\":END})\ntop.add_edge(\"accommodation\", \"coordinator\")\ntop.add_edge(\"transport\",     \"coordinator\")\n\napp = top.compile()"}, {"group": "Multi-Agent", "num": "M3", "title": "Agent Handoffs (Swarm)", "filename": "m3_handoffs.py", "tags": [{"l": "Direct transfer", "c": "tc"}, {"l": "No supervisor", "c": "ta"}, {"l": "~95 lines", "c": "tg"}], "desc": "In the Swarm pattern (as popularised by OpenAI), agents hand off directly to each other using Command \u2014 no central supervisor needed. Each agent decides for itself whether to hand off and to whom. Looser coupling than M1, but requires discipline on logging.", "usecase": "The Hotel Agent, mid-search, realises the user is actually asking about visa requirements. Instead of routing back through a coordinator, it hands off directly to the Visa Agent with structured context, then the Visa Agent can hand back.", "wn": ["New: hand-off tools are tool-shaped functions that return Command instead of data", "The LLM calls the handoff tool when it decides to transfer \u2014 same mechanism as calling a regular tool", "Command(goto=target, update={...}) transfers control and updates state simultaneously", "No supervisor \u2014 agents route laterally through their own domain judgement", "Requires explicit audit logging at every handoff since there's no central point capturing transitions"], "install": "pip install langgraph langchain-anthropic", "qs": [{"q": "What is the key difference between Swarm and Supervisor?", "a": "In Supervisor (M1), routing is centralised \u2014 every transition goes through one coordinator that decides next steps. In Swarm (M3), routing is decentralised \u2014 each agent decides for itself whether to hand off and to whom, using domain expertise. Supervisor gives better auditability; Swarm gives lower latency (no supervisor hop) and better use of each agent's domain knowledge for routing decisions.", "mnemonic": "Supervisor: one router knows all. Swarm: each agent routes from domain knowledge.", "steps": ["Supervisor", "All routes via coordinator", "Swarm", "Agent routes itself"]}, {"q": "Why does the handoff tool need InjectedState and InjectedToolCallId?", "a": "InjectedState gives the handoff tool access to the full current state without having to pass it as a user-visible argument \u2014 the LLM doesn't see it as a parameter to fill in. InjectedToolCallId is needed to create a properly-formed tool result message that pairs with the tool call that triggered it \u2014 LangGraph uses these IDs to maintain the message chain correctly.", "mnemonic": "Injected = hidden from LLM, needed by the runtime", "steps": ["LLM calls handoff tool", "Doesn't pass state/id", "Runtime injects both", "Message chain stays valid"]}, {"q": "How do you prevent an infinite handoff loop between agents?", "a": "Set a recursion_limit on the invoke call \u2014 each agent-to-agent hop counts as a graph node visit. Also design handoff logic carefully: an agent should only hand off when it genuinely can't handle something, not speculatively. In production, track handoff_count in state and add a guard that escalates to a human or returns a \"unable to resolve\" response if the count exceeds a threshold.", "mnemonic": "recursion_limit + handoff_count guard = no infinite loops", "steps": ["Agent hands off", "Count tracked in state", "Too many hops", "Escalate or stop"]}], "isArch": false, "code_plain": "from typing import Annotated, TypedDict\nfrom langgraph.graph import StateGraph, END, MessagesState\nfrom langgraph.types import Command\nfrom langgraph.prebuilt import InjectedState\nfrom langchain_anthropic import ChatAnthropic\nfrom langchain_core.tools import tool, InjectedToolCallId\nimport logging\n\nlog = logging.getLogger(__name__)\nllm = ChatAnthropic(model=\"claude-sonnet-4-6\")\n\n\n# \u2500\u2500 Factory: creates a tool that performs a lateral handoff \u2500\ndef make_handoff_tool(*, target: str):\n    @tool(f\"transfer_to_{target}\",\n          description=f\"Transfer to {target} when their expertise is needed.\")\n    def _handoff(\n        reason:  str,\n        context: str,\n        state:   Annotated[dict, InjectedState],\n        call_id: Annotated[str, InjectedToolCallId],\n    ) -> Command:\n        log.info(\"handoff\", extra={\"to\":target,\"reason\":reason})   # audit log\n        tool_msg = {\"role\":\"tool\", \"content\":f\"Transferring to {target}: {reason}\",\n                    \"tool_call_id\": call_id}\n        return Command(\n            goto=target,\n            update={\"messages\": state[\"messages\"] + [tool_msg],\n                    \"handoff_context\": context},\n        )\n    return _handoff\n\n\n# \u2500\u2500 Hotel agent \u2014 can hand off to visa or itinerary agent \u2500\ntransfer_to_visa      = make_handoff_tool(target=\"visa_agent\")\ntransfer_to_itinerary = make_handoff_tool(target=\"itinerary_agent\")\n\n@tool\ndef search_hotels(destination: str) -> list:\n    \"\"\"Search hotels in destination.\"\"\"\n    return [\"APA Hotel ($95)\", \"Shibuya Excel ($165)\"]\n\nhotel_llm = llm.bind_tools([search_hotels, transfer_to_visa, transfer_to_itinerary])\n\ndef hotel_agent_node(state: MessagesState) -> Command | dict:\n    response = hotel_llm.invoke(\n        [{\"role\":\"system\",\"content\":\n          \"You search hotels. If asked about visas, transfer to visa_agent. \"\n          \"If asked to plan days, transfer to itinerary_agent.\"}]\n        + state[\"messages\"]\n    )\n    return {\"messages\": [response]}\n\n\n# \u2500\u2500 Visa agent \u2014 only answers visa questions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ntransfer_to_hotel = make_handoff_tool(target=\"hotel_agent\")\n\n@tool\ndef check_visa_requirements(nationality: str, destination: str) -> dict:\n    \"\"\"Check visa requirements.\"\"\"\n    return {\"visa_required\": False, \"stay_limit_days\": 90}\n\nvisa_llm = llm.bind_tools([check_visa_requirements, transfer_to_hotel])\n\ndef visa_agent_node(state: MessagesState) -> Command | dict:\n    ctx = state.get(\"handoff_context\",\"\")\n    response = visa_llm.invoke(\n        [{\"role\":\"system\",\"content\":\n          f\"You handle visa queries. Prior context: {ctx}\"}]\n        + state[\"messages\"]\n    )\n    return {\"messages\": [response]}\n\n\n# \u2500\u2500 Itinerary agent \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n@tool\ndef plan_itinerary(destination: str, days: int) -> list:\n    \"\"\"Generate a day-by-day itinerary.\"\"\"\n    return [f\"Day {i+1}: explore {destination}\" for i in range(days)]\n\nitinerary_llm = llm.bind_tools([plan_itinerary, transfer_to_hotel])\n\ndef itinerary_agent_node(state: MessagesState) -> Command | dict:\n    response = itinerary_llm.invoke(state[\"messages\"])\n    return {\"messages\": [response]}\n\n\nclass SwarmState(MessagesState):\n    handoff_context: str\n\nworkflow = StateGraph(SwarmState)\nworkflow.add_node(\"hotel_agent\",     hotel_agent_node)\nworkflow.add_node(\"visa_agent\",      visa_agent_node)\nworkflow.add_node(\"itinerary_agent\", itinerary_agent_node)\nworkflow.set_entry_point(\"hotel_agent\")\nworkflow.add_edge(\"hotel_agent\",     END)\nworkflow.add_edge(\"visa_agent\",      END)\nworkflow.add_edge(\"itinerary_agent\", END)\n\napp = workflow.compile()"}, {"group": "Production", "num": "Pr1", "title": "Error Handling & Retries", "filename": "pr1_errors.py", "tags": [{"l": "Retry logic", "c": "tc"}, {"l": "Fallback paths", "c": "ta"}, {"l": "~90 lines", "c": "tg"}], "desc": "Production graphs need to handle tool failures, LLM API errors, and unexpected state without crashing the whole invocation. Wrap critical nodes with retry logic, add explicit error paths in the graph, and ensure every failure has a graceful degradation response.", "usecase": "The hotel search API occasionally times out. The flight search might return an error. The booking API has rate limits. Each needs retry logic and a fallback message rather than propagating an exception to the user.", "wn": ["New: @retry decorator (tenacity) wraps tool calls with configurable retry/backoff", "Error state fields (search_error) capture failures without crashing the graph", "A routing function checks for errors and routes to a dedicated handle_error node", "handle_error writes a graceful degradation message to state and terminates cleanly", "Logging at each retry and failure creates the audit trail needed for production debugging"], "install": "pip install langgraph langchain-anthropic tenacity", "qs": [{"q": "Why write errors to state instead of raising an exception?", "a": "Raising an exception inside a node propagates up through the graph executor and crashes the entire invoke() call \u2014 the caller gets an unhandled exception with no graceful response. Writing to an error state field lets the graph route to a dedicated handler that produces a user-friendly message and terminates cleanly. The difference is between \"the assistant crashes\" and \"the assistant says it can't help right now.\"", "mnemonic": "Raise = crash the graph. State error = route to graceful handler.", "steps": ["API fails", "raise Exception", "Graph crashes", "vs state error \u2192 handler"]}, {"q": "What does reraise=True do in the tenacity retry decorator?", "a": "After all retry attempts are exhausted, reraise=True tells tenacity to re-raise the original exception rather than raising a tenacity.RetryError. This means the calling code (your node) sees a ConnectionError, not a tenacity-specific exception \u2014 it's easier to catch the original exception type explicitly in your try/except block.", "mnemonic": "reraise=True = original exception, not a tenacity wrapper", "steps": ["3 retries exhausted", "reraise=True", "Original ConnectionError", "Your except block catches it"]}, {"q": "Should retries happen inside the node or at the graph level?", "a": "Inside the node for transient external failures (API timeouts, rate limits) \u2014 the node is the natural scope for \"retry this specific operation.\" At the graph level (re-invoking the whole graph) for semantic failures \u2014 where the LLM produced a bad decision that needs a full retry from the start. Don't use graph-level retries for network failures; they're too expensive.", "mnemonic": "External failure: retry in node. Semantic failure: retry the graph.", "steps": ["Network timeout", "Retry in node", "Bad LLM decision", "Retry the graph"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\nfrom langchain_core.tools import tool\nfrom tenacity import retry, stop_after_attempt, wait_exponential\nimport logging, random\n\nlog = logging.getLogger(__name__)\n\n\nclass TravelState(TypedDict):\n    destination:  str\n    budget:       float\n    hotel_results:list[dict]\n    search_error: str | None   # error state \u2014 explicit, not an exception\n    messages:     list[str]\n    retry_count:  int\n\n\n# \u2500\u2500 External tool call with automatic retry + backoff \u2500\u2500\u2500\u2500\n@retry(\n    stop=stop_after_attempt(3),\n    wait=wait_exponential(multiplier=1, min=1, max=10),\n    reraise=True,\n)\ndef _call_hotel_api(destination: str, budget: float) -> list:\n    \"\"\"Simulates a flaky external API.\"\"\"\n    if random.random() < 0.3:   # 30% chance of transient failure\n        raise ConnectionError(\"Hotel API timeout\")\n    return [{\"name\":\"APA Hotel\",\"price\":95},{\"name\":\"Shibuya Excel\",\"price\":165}]\n\n\n# \u2500\u2500 Search node: catches errors, writes to state \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef search_node(state: TravelState) -> dict:\n    try:\n        results = _call_hotel_api(state[\"destination\"], state[\"budget\"])\n        log.info(\"search_success\", extra={\"count\":len(results)})\n        return {\"hotel_results\": results, \"search_error\": None}\n    except ConnectionError as e:\n        log.error(\"search_failed\", extra={\"error\":str(e)})\n        # Return error to state \u2014 do NOT raise (would crash the graph)\n        return {\"hotel_results\": [], \"search_error\": str(e)}\n\n\n# \u2500\u2500 Route: did the search succeed? \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef route_after_search(state: TravelState) -> str:\n    if state[\"search_error\"]:\n        return \"handle_error\"\n    if not state[\"hotel_results\"]:\n        return \"no_results\"\n    return \"format\"\n\n\n# \u2500\u2500 Graceful degradation paths \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndef handle_error_node(state: TravelState) -> dict:\n    msg = (f\"We couldn't reach our hotel provider right now ({state['search_error']}). \"\n           f\"Please try again in a few minutes.\")\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\ndef no_results_node(state: TravelState) -> dict:\n    msg = f\"No hotels found in {state['destination']} under ${state['budget']}/night.\"\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\ndef format_node(state: TravelState) -> dict:\n    msg = f\"Found {len(state['hotel_results'])} hotels in {state['destination']}.\"\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\nworkflow = StateGraph(TravelState)\nworkflow.add_node(\"search\",       search_node)\nworkflow.add_node(\"handle_error\", handle_error_node)\nworkflow.add_node(\"no_results\",   no_results_node)\nworkflow.add_node(\"format\",       format_node)\nworkflow.set_entry_point(\"search\")\nworkflow.add_conditional_edges(\"search\", route_after_search,\n    {\"handle_error\": \"handle_error\", \"no_results\": \"no_results\", \"format\": \"format\"})\nworkflow.add_edge(\"handle_error\", END)\nworkflow.add_edge(\"no_results\",   END)\nworkflow.add_edge(\"format\",       END)\n\napp = workflow.compile()"}, {"group": "Production", "num": "Pr2", "title": "Persistence & Resume", "filename": "pr2_persistence.py", "tags": [{"l": "PostgresSaver", "c": "tc"}, {"l": "Resume across deploys", "c": "ta"}, {"l": "~80 lines", "c": "tg"}], "desc": "Production persistence means conversations survive deploys, crashes, and horizontal scaling. PostgresSaver gives you this. Building on C4 \u2014 swapping MemorySaver for the production checkpointer, adding get_state/update_state patterns, and handling the full resume lifecycle.", "usecase": "A user starts booking a 10-day Japan rail pass, gets interrupted mid-flow, and resumes 48 hours later on a different device. The entire booking state \u2014 routes selected, preferences set, approval pending \u2014 is restored exactly.", "wn": ["New: PostgresSaver.from_conn_string() replaces MemorySaver()", "app.get_state(config) retrieves current state \u2014 use before resuming to verify context", "app.update_state(config, patch) lets external systems update state mid-flight", "app.get_state_history(config) returns all checkpoints \u2014 useful for replay and audit", "Connection pooling with psycopg is recommended for production load"], "install": "pip install langgraph langgraph-checkpoint-postgres psycopg psycopg-pool", "qs": [{"q": "What does checkpointer.setup() do?", "a": "It creates the checkpoint tables in the database if they don't already exist \u2014 typically langgraph_checkpoints and langgraph_blobs tables. It's idempotent so safe to call on every startup. In production, you'd typically run this as part of the service startup sequence or as a database migration step, not inline in the main application path.", "mnemonic": "setup() = create tables if not exists, safe to run every time", "steps": ["App starts", "checkpointer.setup()", "Tables exist? Skip", "Missing? Create them"]}, {"q": "How do you use get_state_history for an audit log?", "a": "app.get_state_history(config) returns a list of StateSnapshot objects in reverse chronological order \u2014 most recent first. Each snapshot has the full state values, the checkpoint_id, the parent_id, and the timestamp. For audit purposes, iterate this list to reconstruct the complete timeline of what state looked like after each node ran \u2014 effectively a replay log of every decision the graph made.", "mnemonic": "get_state_history = full timeline of every state change", "steps": ["Graph ran 5 nodes", "5 checkpoints written", "get_state_history()", "Full timeline returned"]}, {"q": "How does PostgresSaver handle concurrent invocations with the same thread_id?", "a": "PostgresSaver uses Postgres row-level locking on the checkpoint row \u2014 if two invocations attempt to write a checkpoint for the same thread_id simultaneously, the second one queues behind the first. This prevents checkpoint corruption at the cost of serialising concurrent writes to the same thread. Design your system so each user session has its own thread_id to avoid unintended serialisation.", "mnemonic": "Same thread_id \u2192 serialised writes via row locking. Use unique IDs.", "steps": ["2 invocations", "Same thread_id", "Row-level lock", "Second waits, then writes"]}], "isArch": false, "code_plain": "from typing import TypedDict\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.checkpoint.postgres import PostgresSaver\nfrom psycopg_pool import ConnectionPool\n\n\nclass BookingState(TypedDict):\n    user_id:      str\n    rail_pass:    str | None\n    routes:       list[str]\n    total_price:  float | None\n    booking_ref:  str | None\n    messages:     list[str]\n    step:         str   # tracks progress for resume awareness\n\n\ndef select_pass_node(state: BookingState) -> dict:\n    return {\"rail_pass\": \"JR Pass 14-day\", \"step\": \"pass_selected\",\n            \"messages\": state[\"messages\"] + [\"Selected: JR Pass 14-day \u2014 \u00a550,000\"]}\n\n\ndef select_routes_node(state: BookingState) -> dict:\n    routes = [\"Tokyo\u2192Kyoto\", \"Kyoto\u2192Osaka\", \"Osaka\u2192Hiroshima\", \"Hiroshima\u2192Tokyo\"]\n    price  = 50000   # JPY\n    return {\"routes\": routes, \"total_price\": price, \"step\": \"routes_selected\",\n            \"messages\": state[\"messages\"] + [f\"Routes planned: {routes}\"]}\n\n\ndef confirm_booking_node(state: BookingState) -> dict:\n    ref = f\"JR-{state['user_id'][:6].upper()}-14D\"\n    return {\"booking_ref\": ref, \"step\": \"confirmed\",\n            \"messages\": state[\"messages\"] + [f\"\u2705 Booked {ref} \u2014 \u00a5{state['total_price']:,}\"]}\n\n\nworkflow = StateGraph(BookingState)\nworkflow.add_node(\"select_pass\",   select_pass_node)\nworkflow.add_node(\"select_routes\", select_routes_node)\nworkflow.add_node(\"confirm\",       confirm_booking_node)\nworkflow.set_entry_point(\"select_pass\")\nworkflow.add_edge(\"select_pass\",   \"select_routes\")\nworkflow.add_edge(\"select_routes\", \"confirm\")\nworkflow.add_edge(\"confirm\",       END)\n\n# \u2500\u2500 Production: connection pool + PostgresSaver \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nDB_URL = \"postgresql://user:pass@localhost:5432/travel_db\"\n\nwith ConnectionPool(conninfo=DB_URL) as pool:\n    checkpointer = PostgresSaver(pool)\n    checkpointer.setup()   # creates checkpoint tables if not exists\n\n    app = workflow.compile(\n        checkpointer=checkpointer,\n        interrupt_before=[\"confirm\"],   # pause for approval before booking\n    )\n\n    cfg = {\"configurable\": {\"thread_id\": \"user-42-rail-booking\"}}\n\n    # Phase 1: plan the trip (user leaves after this)\n    r1 = app.invoke({\n        \"user_id\":\"user-42\", \"rail_pass\":None, \"routes\":[],\n        \"total_price\":None, \"booking_ref\":None, \"messages\":[], \"step\":\"start\",\n    }, config=cfg)\n    print(\"Paused at step:\", r1[\"step\"])   # routes_selected \u2014 awaiting confirm\n\n    # 48 hours later, on a different server / process...\n    snapshot = app.get_state(cfg)\n    print(\"Resumed state:\", snapshot.values[\"step\"])   # routes_selected\n\n    # Get the full checkpoint history for audit\n    history = list(app.get_state_history(cfg))\n    print(f\"{len(history)} checkpoints recorded\")\n\n    # User confirms \u2192 resume\n    r2 = app.invoke(None, config=cfg)\n    print(\"Booking ref:\", r2[\"booking_ref\"])"}, {"group": "Production", "num": "Pr3", "title": "Testing Strategies", "filename": "pr3_testing.py", "tags": [{"l": "Unit tests", "c": "tc"}, {"l": "Graph tests", "c": "ta"}, {"l": "~85 lines", "c": "tg"}], "desc": "LangGraph graphs have three testable layers: individual nodes (pure functions \u2014 trivial to unit test), the compiled graph (integration test with mock tools), and end-to-end behaviour (with a real LLM or a seeded mock). Each layer needs a different testing approach.", "usecase": "Testing the travel booking graph: unit test each node in isolation, integration test the full flow with mocked hotel APIs, and trace-based validation for the LLM decision paths.", "wn": ["New: nodes are pure functions \u2014 test them directly without a graph runner", "Use MemorySaver with a fixed thread_id for deterministic graph integration tests", "Mock tools with unittest.mock.patch to control API responses in tests", "app.get_state(config) lets you assert on intermediate state, not just final output", "For LLM nodes, use with_structured_output and seed the model with deterministic examples"], "install": "pip install langgraph langchain-anthropic pytest", "qs": [{"q": "Why are nodes easier to test than monolithic agent code?", "a": "Because nodes are pure functions: TypedDict in, dict out, no hidden state, no side effects (except for tool calls which you mock). You can call a node directly in a test with a dict as input and assert on the returned dict \u2014 no graph runner, no event loop, no LLM API call needed. This is the primary reason to keep nodes small and single-purpose.", "mnemonic": "Node = pure function = trivially unit testable", "steps": ["Node: TypedDict in", "Dict out", "No hidden state", "Call directly in test"]}, {"q": "How do you test a graph with a human-in-loop interrupt?", "a": "Invoke the graph to the interrupt point, assert on the paused state, call app.update_state() to simulate the human action, then invoke(None, config) to resume and assert on the final state. Use a fixed thread_id in MemorySaver for determinism across test runs. This approach tests both the pause-and-resume mechanism and the state the human would see during review.", "mnemonic": "Invoke to pause \u2192 assert paused state \u2192 update \u2192 resume \u2192 assert final", "steps": ["invoke() pauses", "Assert paused state", "update_state() simulates human", "invoke(None) resumes"]}, {"q": "What should you NOT use MemorySaver for in tests?", "a": "Don't share a MemorySaver instance across multiple test cases \u2014 each test should create its own MemorySaver() to avoid state leakage between tests. Also don't use MemorySaver to test the persistence behaviour itself (e.g. survival across restarts) \u2014 you need a real PostgresSaver with a test database for that. MemorySaver is strictly for in-process, single-test-session isolation.", "mnemonic": "New MemorySaver per test. Test persistence with real Postgres.", "steps": ["Test 1", "New MemorySaver()", "Test 2", "New MemorySaver()"]}], "isArch": false, "code_plain": "# pr3_testing.py \u2014 three testing layers for a LangGraph pipeline\nimport pytest\nfrom typing import TypedDict\nfrom unittest.mock import patch\nfrom langgraph.graph import StateGraph, END\nfrom langgraph.checkpoint.memory import MemorySaver\n\n\nclass TravelState(TypedDict):\n    destination:  str\n    budget:       float\n    hotel_results:list[dict]\n    messages:     list[str]\n\n\ndef search_node(state: TravelState) -> dict:\n    from hotel_api import search   # external dependency\n    results = search(state[\"destination\"], state[\"budget\"])\n    return {\"hotel_results\": results}\n\n\ndef format_node(state: TravelState) -> dict:\n    count = len(state[\"hotel_results\"])\n    msg = (f\"Found {count} hotels in {state['destination']}.\"\n           if count else f\"No hotels found under ${state['budget']}/night.\")\n    return {\"messages\": state[\"messages\"] + [msg]}\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# LAYER 1: Unit tests \u2014 test nodes as pure functions\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\ndef test_format_node_with_results():\n    state = {\"destination\":\"Tokyo\", \"budget\":200.0,\n             \"hotel_results\":[{\"name\":\"APA\"}], \"messages\":[]}\n    result = format_node(state)\n    assert \"Found 1 hotels\" in result[\"messages\"][0]\n\ndef test_format_node_empty_results():\n    state = {\"destination\":\"Tokyo\", \"budget\":50.0,\n             \"hotel_results\":[], \"messages\":[]}\n    result = format_node(state)\n    assert \"No hotels found\" in result[\"messages\"][0]\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# LAYER 2: Graph integration tests \u2014 with mocked tools\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\ndef build_app():\n    wf = StateGraph(TravelState)\n    wf.add_node(\"search\", search_node)\n    wf.add_node(\"format\", format_node)\n    wf.set_entry_point(\"search\")\n    wf.add_edge(\"search\", \"format\")\n    wf.add_edge(\"format\", END)\n    return wf.compile(checkpointer=MemorySaver())\n\ndef test_full_pipeline_with_results():\n    with patch(\"hotel_api.search\", return_value=[{\"name\":\"APA\",\"price\":95}]):\n        app = build_app()\n        cfg = {\"configurable\": {\"thread_id\": \"test-1\"}}\n        result = app.invoke({\n            \"destination\":\"Tokyo\",\"budget\":200.0,\n            \"hotel_results\":[],\"messages\":[],\n        }, config=cfg)\n        assert len(result[\"hotel_results\"]) == 1\n        assert \"Found 1\" in result[\"messages\"][-1]\n        # Assert on INTERMEDIATE state via checkpointer\n        snapshot = app.get_state(cfg)\n        assert snapshot.values[\"hotel_results\"][0][\"name\"] == \"APA\"\n\ndef test_pipeline_no_results():\n    with patch(\"hotel_api.search\", return_value=[]):\n        app = build_app()\n        result = app.invoke({\n            \"destination\":\"Tokyo\",\"budget\":20.0,\n            \"hotel_results\":[],\"messages\":[],\n        }, config={\"configurable\":{\"thread_id\":\"test-2\"}})\n        assert result[\"hotel_results\"] == []\n        assert \"No hotels\" in result[\"messages\"][-1]\n\n\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n# LAYER 3: Routing tests \u2014 test graph structure\n# \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\ndef test_graph_structure():\n    \"\"\"Verify nodes and edges are wired as expected.\"\"\"\n    app = build_app()\n    graph = app.get_graph()\n    node_names = {n.id for n in graph.nodes.values()}\n    assert \"search\" in node_names\n    assert \"format\" in node_names\n\n\nif __name__ == \"__main__\":\n    test_format_node_with_results()\n    test_format_node_empty_results()\n    print(\"All tests passed\")"}, {"group": "Architect Prep", "num": "A1", "title": "Design Decisions", "filename": null, "tags": [], "desc": "When to use which LangGraph primitive \u2014 pattern selection, memory choice, persistence decision, and when NOT to use LangGraph at all.", "usecase": null, "wn": [], "install": null, "code": null, "qs": [{"q": "When is a plain LLM call better than a LangGraph graph?", "a": "When the task fits in one call with no state to carry across steps, no tools to loop over, and no need to resume. LangGraph adds real overhead (state schema definition, node wiring, graph compilation) that only pays off when you actually need branching, looping, persistence, or multi-agent coordination. A single prompt-response cycle is always faster and simpler without LangGraph.", "mnemonic": "One-shot task = no graph. Loop/branch/resume/multi = graph.", "steps": ["Single LLM call", "No branching needed", "No LangGraph", "Loop or resume? Use graph"]}, {"q": "TypedDict vs MessagesState \u2014 when to use which?", "a": "MessagesState when your graph is fundamentally a conversation \u2014 it comes pre-wired with the add_messages reducer which handles message merging, tool call pairing, and history management correctly. TypedDict when your graph carries structured domain data (booking state, search results, user preferences) alongside or instead of a message list. Mix them: your TypedDict can include a messages field with Annotated[list, add_messages].", "mnemonic": "Conversation = MessagesState. Domain data = TypedDict. Mix both.", "steps": ["Conversation graph", "MessagesState", "Domain data graph", "TypedDict"]}, {"q": "MemorySaver vs PostgresSaver \u2014 the real decision factors?", "a": "The decision isn't just dev vs prod \u2014 it's about whether state needs to survive any of: process restart, pod eviction, horizontal scaling across multiple instances, or user sessions that span hours/days. If any of these apply, PostgresSaver. If your graph is fully synchronous, single-process, and stateless across API calls, MemorySaver is fine even in production for that narrow case.", "mnemonic": "Survive restart/scale/hours? Postgres. Otherwise MemorySaver is fine.", "steps": ["Need to survive restart?", "Yes \u2192 PostgresSaver", "No \u2192 MemorySaver", "(Dev always MemorySaver)"]}], "isArch": true}, {"group": "Architect Prep", "num": "A2", "title": "Tradeoff Tables", "filename": null, "tags": [], "desc": "Side-by-side comparisons for pattern selection, routing mechanism choice, memory architecture, and streaming modes.", "usecase": null, "wn": [], "install": null, "code": null, "qs": [{"q": "How do you compare ReAct vs Plan-Execute latency?", "a": "ReAct: latency scales with loop count \u2014 N tool calls = N LLM+tool round trips in series. Plan-Execute: upfront planning adds one LLM call, but each subsequent executor step is independent and could run in parallel (if you use Send). For the same N steps, Plan-Execute can be faster if steps are parallelisable; ReAct will be faster if N is small and reactive.", "mnemonic": "ReAct: N serial LLM calls. Plan-Execute: 1 plan + N parallel possible.", "steps": ["ReAct: N steps", "N LLM calls in series", "Plan-Execute: 1 plan", "Steps parallelisable"]}, {"q": "What routing mechanism fits each use case?", "a": "Conditional edges when routing logic is known at graph-build time and covers a fixed set of next nodes \u2014 most graphs. Send when the number of branches is dynamic (not known until runtime) \u2014 parallel fan-out. Command when a node discovers mid-execution that it needs to go somewhere not wired in its edges \u2014 lateral handoffs. interrupt_before/after when an external actor (human or system) needs to inspect or modify state before the next node runs.", "mnemonic": "Edges=fixed paths, Send=dynamic N, Command=runtime override, interrupt=external gate", "steps": ["Fixed routes", "conditional_edges", "Dynamic N routes", "Send API"]}, {"q": "How do you choose between episodic and semantic memory in the Store?", "a": "Episodic memory is for \"have I seen something like this before\" \u2014 stores compressed summaries of past interactions, searched by similarity. Semantic memory is for \"what do I know about this specific entity\" \u2014 stores facts keyed by entity ID, retrieved by exact lookup. Use episodic for pattern-matching and avoiding repeat mistakes; use semantic for persistent user/entity facts that update incrementally.", "mnemonic": "Episodic=similarity search over past. Semantic=exact lookup of entity facts.", "steps": ["Past similar?", "Episodic search", "Entity facts?", "Semantic exact get"]}], "isArch": true}, {"group": "Architect Prep", "num": "A3", "title": "Failure Modes", "filename": null, "tags": [], "desc": "The failure modes specific to LangGraph systems \u2014 and what actually causes them.", "usecase": null, "wn": [], "install": null, "code": null, "qs": [{"q": "What causes infinite loops and how do you prevent them?", "a": "An infinite loop happens when the routing function never returns END or a terminal node \u2014 most commonly because the LLM always returns a tool call (ReAct) or the replan node always finds more steps (Plan-Execute). Prevention: set recursion_limit on every invoke call, track a loop_count in state with a hard maximum, and add an explicit \"gave_up\" routing branch that fires when the count is exceeded rather than letting GraphRecursionError propagate.", "mnemonic": "Loop count + recursion_limit + gave_up branch = no infinite loops", "steps": ["Loop count in state", "Count++", "Hit max?", "Route to gave_up"]}, {"q": "How does checkpoint corruption happen and how do you prevent it?", "a": "Checkpoint corruption happens when two concurrent invocations write to the same thread_id simultaneously \u2014 the second write overwrites or conflicts with the first, leaving the checkpoint in an inconsistent state. Prevention with MemorySaver: don't share across processes. Prevention with PostgresSaver: row-level locking handles this automatically, but you should still design each user session to have a unique thread_id to avoid unnecessary serialisation.", "mnemonic": "Two writers, same thread_id = corruption. Unique IDs + PostgresSaver locks.", "steps": ["2 concurrent writes", "Same thread_id", "MemorySaver: corruption", "PostgresSaver: locked, safe"]}, {"q": "What happens when a node returns extra fields not in the state schema?", "a": "LangGraph silently drops them \u2014 extra keys in a node's return dict are ignored. This is a common source of subtle bugs: a node returns {\"typo_field\": value} thinking it's writing to \"total_price\", and no error is raised. The state field simply never gets updated. Always lint your return dicts against the TypedDict schema, and add tests that assert specific fields were written after a node runs.", "mnemonic": "Unknown return key = silently dropped. Lint and assert.", "steps": ["Node returns {typo_key}", "Not in TypedDict", "LangGraph drops it", "No error \u2014 silent bug"]}], "isArch": true}, {"group": "Architect Prep", "num": "A4", "title": "System Design", "filename": null, "tags": [], "desc": "Full LangGraph system architecture \u2014 from simple single-process to full distributed production with 6 infra maturity stages.", "usecase": null, "wn": [], "install": null, "code": null, "qs": [{"q": "Walk me through the full LangGraph system architecture", "a": "Start with the graph definition layer: TypedDict state schemas, compiled StateGraphs for each agent or pipeline. Layer the persistence infrastructure: PostgresSaver for working memory per thread, PostgresStore for cross-thread episodic and semantic memory. Add the serving layer: an API (FastAPI/async) that manages thread_ids and invokes the compiled graphs. Wrap with observability: LangSmith tracing for debugging, structured logging for audit. Add a human-approval queue for interrupt_before gates. Deploy as containerised services with independent scaling per agent type.", "mnemonic": "State schema \u2192 compiled graphs \u2192 persistence \u2192 API \u2192 observe \u2192 approve", "steps": ["State + graphs", "Persistence layer", "API serving", "Observe + human gate"]}, {"q": "How do you scale LangGraph to handle 1000 concurrent sessions?", "a": "First ensure all graphs use PostgresSaver \u2014 concurrent sessions must not share in-process state. Then scale horizontally: stateless API pods each invoke graphs independently, relying on PostgresSaver for all session state. Use a connection pool (psycopg-pool) per pod to manage DB connections. For CPU-intensive nodes (reranking, embedding), extract to dedicated worker services connected via message queue. Agent graphs themselves are stateless between invocations \u2014 the DB is the only shared resource.", "mnemonic": "Stateless pods + PostgresSaver + connection pool = horizontal scale", "steps": ["Stateless API pods", "PostgresSaver for state", "Connection pool per pod", "Workers for CPU tasks"]}, {"q": "Where do you put observability in a LangGraph system?", "a": "Two separate observability stacks: LangSmith for debugging traces (auto-instruments every node, LLM call, and tool call \u2014 excellent for \"why did the agent do that\"), and structured logging (structlog/JSON to stdout) for audit and cost tracking. Don't use LangSmith as your compliance system of record \u2014 it's a third-party SaaS. Your own logs are what you control, retain, and can present to auditors.", "mnemonic": "LangSmith=debug traces you rent. structlog=audit logs you own.", "steps": ["LangSmith", "Auto-traces (debug)", "structlog", "Audit logs (compliance)"]}], "isArch": true}]
</script>
<script>
var S = JSON.parse(document.getElementById('D').textContent);

// Syntax highlighter
function hi(code) {
  var s = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var result = '', lines = s.split('\n');
  lines.forEach(function(line) {
    var l = line;
    // Comments
    var ci = l.indexOf('#');
    var comment = '';
    if(ci >= 0) { comment = l.slice(ci); l = l.slice(0,ci); }
    // Strings (simple - f-strings, regular)
    l = l.replace(/([fFbBrRuU]?)("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="st">$1$2</span>');
    // Keywords
    l = l.replace(/\b(from|import|class|def|return|if|else|elif|for|while|in|not|and|or|is|None|True|False|with|as|try|except|raise|pass|lambda|yield|break|continue|async|await)\b/g, '<span class="kw">$1</span>');
    // Decorators
    l = l.replace(/(@\w+)/g, '<span class="dc">$1</span>');
    // Built-ins
    l = l.replace(/\b(print|len|list|dict|str|int|float|bool|range|enumerate|zip|map|filter|sorted|getattr|hasattr|isinstance|type|super)\b/g, '<span class="bi">$1</span>');
    // Numbers
    l = l.replace(/\b(\d+\.?\d*)\b/g, '<span class="nm">$1</span>');
    // Class names (after class keyword)
    l = l.replace(/\bclass\s+([A-Z]\w*)/g, 'class <span class="cls">$1</span>');
    // def names
    l = l.replace(/\bdef\s+(\w+)/g, 'def <span class="fn">$1</span>');
    if(comment) l = l + '<span class="cm">' + comment + '</span>';
    result += l + '\n';
  });
  return result;
}

function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Mini SVG
function msvg(steps) {
  var c=['#00d4c8','#f59e0b','#34d399','#f87171'];
  var bw=44,bh=22,gap=7,y=12,W=222;
  var total=steps.length*bw+(steps.length-1)*gap;
  var x0=(W-total)/2;
  var o='<svg viewBox="0 0 '+W+' '+(bh+y+8)+'" width="100%">';
  steps.forEach(function(t,i){
    var x=x0+i*(bw+gap),col=c[i%c.length];
    o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="none" stroke="'+col+'" stroke-width="1.2"/>';
    o+='<text x="'+(x+bw/2)+'" y="'+(y+bh/2+4)+'" font-family="system-ui" font-size="7.5" fill="'+col+'" text-anchor="middle">'+esc(t)+'</text>';
    if(i<steps.length-1){var ax=x+bw+1,ay=y+bh/2;o+='<line x1="'+ax+'" y1="'+ay+'" x2="'+(ax+gap-2)+'" y2="'+ay+'" stroke="#2d3a56" stroke-width="1"/><polygon points="'+(ax+gap-2)+','+(ay-2.5)+' '+(ax+gap+2)+','+ay+' '+(ax+gap-2)+','+(ay+2.5)+'" fill="#2d3a56"/>';}
  });
  return o+'</svg>';
}

function qaCard(q,i,pfx){
  var id=pfx+'-'+i;
  return '<div class="qa-item"><div class="qa-q" onclick="tqa(\''+id+'\')">'
    +'<span class="qa-qn">Q'+(i+1)+'</span><span class="qa-qt">'+esc(q.q)+'</span>'
    +'<span class="qa-ar" id="a-'+id+'">&#8250;</span></div>'
    +'<div class="qa-body" id="b-'+id+'"><div class="qa-diag">'+msvg(q.steps||[])+'</div>'
    +'<div class="qa-mem">&#128161; '+esc(q.mnemonic)+'</div>'
    +'<div class="qa-ans">'+esc(q.a)+'</div></div></div>';
}

function tqa(id){
  var b=document.getElementById('b-'+id),a=document.getElementById('a-'+id);
  if(!b)return;
  var o=b.classList.toggle('open');
  if(a)a.classList.toggle('open',o);
}

function renderQA(qs,pfx){return (qs||[]).map(function(q,i){return qaCard(q,i,pfx);}).join('');}

// Rail
function buildRail(){
  var groups={},order=[];
  S.forEach(function(s,i){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group);}
    groups[s.group].push({s:s,i:i});
  });
  var h='';
  order.forEach(function(g){
    h+='<div class="rg">'+esc(g)+'</div>';
    groups[g].forEach(function(x){
      h+='<div class="si" id="si-'+x.i+'" onclick="go('+x.i+')">'
        +'<div class="si-num">'+esc(x.s.num)+'</div>'
        +'<div class="si-title">'+esc(x.s.title)+'</div></div>';
    });
  });
  document.getElementById('rail').innerHTML=h;
}

// Code render
function renderCode(s){
  var tags=(s.tags||[]).map(function(t){return '<span class="tag '+t.c+'">'+esc(t.l)+'</span>';}).join(' ');
  document.getElementById('shdr').innerHTML=
    '<div class="shdr-top"><span class="shdr-num">'+esc(s.num)+'</span>'
    +'<span class="shdr-title">'+esc(s.title)+'</span> '+tags+'</div>'
    +'<div class="shdr-desc">'+esc(s.desc)+'</div>';

  var wn=(s.wn||[]).map(function(w){return '<li>'+esc(w)+'</li>';}).join('');

  document.getElementById('carea').innerHTML=
    '<div class="uc"><div class="uc-lbl">Travel Booking AI use case</div>'
    +'<div class="uc-text">'+esc(s.usecase)+'</div></div>'
    +'<div class="wn"><div class="wn-title">What\'s new in this section</div>'
    +'<ul class="wn-list">'+wn+'</ul>'
    +'<div class="wn-ilbl">Install</div>'
    +'<div class="wn-install">$ '+esc(s.install)+'</div></div>'
    +'<div class="cb"><div class="cb-bar">'
    +'<div><span class="cb-lang">python</span><span class="cb-file">'+esc(s.filename)+'</span></div>'
    +'<button class="cb-copy" onclick="cpCode()">Copy</button>'
    +'</div><pre id="cpre">'+hi(s.code_plain||'')+'</pre></div>';
}

function cpCode(){
  var p=document.getElementById('cpre');
  if(!p)return;
  navigator.clipboard.writeText(p.innerText).then(function(){
    var b=document.querySelector('.cb-copy');
    if(b){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy';},1800);}
  });
}

// Arch renders
var A1D=[
  {sc:'Simple single-step task',ch:'Plain LLM call',why:'One call, one response, no state. LangGraph overhead unjustified.',nt:'Any task needing looping, branching, or state across turns.'},
  {sc:'Conversation with tools',ch:'ReAct (P1) + MessagesState',why:'Think-Act-Observe loop. MessagesState handles history. Simplest real agent.',nt:'Long-horizon tasks where seeing the full plan upfront matters.'},
  {sc:'Long-horizon structured task',ch:'Plan-and-Execute (P2)',why:'Upfront plan visible and auditable. Partial replanning without full restart.',nt:'Short reactive tasks where each step depends on the previous observation.'},
  {sc:'N independent lookups',ch:'Parallel fan-out (P3)',why:'max(branch latency) not sum. 3+ independent calls with meaningful latency.',nt:'1-2 calls or dependent sub-tasks — overhead exceeds savings.'},
  {sc:'Complex reusable sub-pipeline',ch:'Subgraph (P4)',why:'Independently compilable, testable, deployable. Mirrors team ownership.',nt:'Simple shared logic — a utility function is cheaper.'},
  {sc:'Irreversible high-value action',ch:'Human-in-loop (P6)',why:'interrupt_before is a structural pause, not a prompt instruction that can be bypassed.',nt:'High-volume low-value actions where review latency outweighs risk.'},
  {sc:'Multi-domain, auditable routing',ch:'Supervisor or Hierarchical (M1/M2)',why:'Centralised routing = one audit point. Every handoff is a logged decision.',nt:'Low-latency systems where the supervisor hop is unacceptable.'},
  {sc:'Domain-aware lateral routing',ch:'Swarm / Command (M3)',why:'Each agent routes from domain expertise. Removes the supervisor hop.',nt:'Systems requiring centralised audit of every routing decision.'},
];

var A3D=[
  {n:'Infinite / Runaway Loops',ca:'Routing function never reaches END — LLM always requests a tool, or replan always finds more steps.',sy:'GraphRecursionError after recursion_limit, or ever-increasing cost.',fx:'Set recursion_limit on every invoke(). Track loop_count in state with a cap. Add "gave_up" branch.'},
  {n:'Silent State Update Failures',ca:'Node returns a dict with a misspelled field — LangGraph drops unknown keys without error.',sy:'State field never updates despite node appearing to run successfully.',fx:'Lint return dicts against TypedDict. Add tests that call get_state() and assert specific fields.'},
  {n:'Checkpoint Corruption',ca:'Two concurrent invocations write to the same thread_id with a non-thread-safe checkpointer.',sy:'Inconsistent state after concurrent operations.',fx:'Use PostgresSaver in production (row-level locking). Unique thread_ids per user session.'},
  {n:'Memory Leak via Store',ca:'Writing to the Store on every execution without a retention policy.',sy:'Increasing DB storage, eventually slow search() queries.',fx:'Set TTL on Store records. Update existing records rather than always inserting new ones.'},
  {n:'Human-in-Loop Deadlock',ca:'Graph paused at interrupt_before with MemorySaver, then process restarts — state is lost.',sy:'User waiting for approval the system has forgotten.',fx:'Always use PostgresSaver for any graph with interrupt_before. Implement stale-interrupt timeout.'},
  {n:'Context Accumulation',ca:'In a long ReAct loop, every tool result appended — by iteration 20 the window is mostly stale.',sy:'LLM performance degrades mid-loop, or context window exceeded errors.',fx:'Summarise older observations after N iterations. Use a sliding window or summarise_node every K steps.'},
  {n:'Subgraph State Schema Mismatch',ca:'Parent state has a field the subgraph expects but under a different name — subgraph gets None.',sy:'Subgraph behaves as if inputs are missing.',fx:'Document the shared field contract. Add integration tests asserting the subgraph got the right inputs.'},
  {n:'Swarm Handoff Audit Gap',ca:'Command-based handoffs have no central router, so no automatic audit log of the transition.',sy:'Compliance review finds gaps in the transition log.',fx:'Log explicitly inside every make_handoff_tool. Add tests checking get_state_history() after handoff.'},
];

var INFRA=[
  {lb:'Infra 1',ti:'Single Python Script',tg:'No server, no persistence',de:'Graph definition and invocation in one file. State lives only for the process duration. Perfect for building and testing logic.',ch:'Starting point — no previous stage.',

function renderArch(s){
  var pn=s.num;
  document.getElementById('shdr').innerHTML=
    '<div class="shdr-top"><span class="shdr-num" style="color:var(--purple);background:var(--purpleb);border-color:rgba(167,139,250,.25);">'+esc(pn)+'</span>'
    +'<span class="shdr-title">'+esc(s.title)+'</span>'
    +'<span class="tag tp">Architect Prep</span></div>'
    +'<div class="shdr-desc">'+esc(s.desc)+'</div>';
  if(pn==='A1') renderA1();
  else if(pn==='A2') renderA2();
  else if(pn==='A3') renderA3();
  else if(pn==='A4') renderA4();
}

function renderA1(){
  document.getElementById('carea').innerHTML='<div class="dc-grid">'
    +A1D.map(function(d){return '<div class="dc-card">'
      +'<div class="dc-scenario">'+esc(d.sc)+'</div>'
      +'<div class="dc-choice">'+esc(d.ch)+'</div>'
      +'<div class="dc-why">'+esc(d.why)+'</div>'
      +'<div class="dc-not"><strong>Not when:</strong> '+esc(d.nt)+'</div>'
      +'</div>';}).join('')+'</div>';
}

// Code render
function hi(code){
  var lines=code.split('\n');
  return lines.map(function(line){
    var l=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var ci=l.indexOf('#');var cmt='';
    if(ci>=0){cmt=l.slice(ci);l=l.slice(0,ci);}
    l=l.replace(/\b(from|import|class|def|return|if|else|elif|for|while|in|not|and|or|is|None|True|False|with|as|try|except|raise|pass|lambda|yield|break|continue|async|await)\b/g,'<span class="kw">$1</span>');
    l=l.replace(/(@\w+)/g,'<span class="dc">$1</span>');
    l=l.replace(/\b(print|len|list|dict|str|int|float|bool|range|enumerate|zip|map|filter|sorted|getattr|hasattr|isinstance|type|super)\b/g,'<span class="bi">$1</span>');
    l=l.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
    // Strings after keyword highlighting (simplified)
    l=l.replace(/(f?["'](?:[^"'\\]|\\.)*["'])/g,'<span class="st">$1</span>');
    if(cmt)l=l+'<span class="cm">'+cmt+'</span>';
    return l;
  }).join('\n');
}

  navigator.clipboard.writeText(p.innerText).then(function(){

  });
}

// Q&A
function msvg(steps){
  var c=['#00d4c8','#f59e0b','#34d399','#f87171'];
  var bw=44,bh=22,gap=7,y=12,W=222;
  var total=(steps||[]).length*bw+((steps||[]).length-1)*gap;
  var x0=(W-total)/2,o='<svg viewBox="0 0 '+W+' '+(bh+y+8)+'" width="100%">';
  (steps||[]).forEach(function(t,i){
    var x=x0+i*(bw+gap),col=c[i%c.length];
    o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="none" stroke="'+col+'" stroke-width="1.2"/>';
    o+='<text x="'+(x+bw/2)+'" y="'+(y+bh/2+4)+'" font-family="system-ui" font-size="7.5" fill="'+col+'" text-anchor="middle">'+esc(t)+'</text>';
    if(i<(steps||[]).length-1){var ax=x+bw+1,ay=y+bh/2;o+='<line x1="'+ax+'" y1="'+ay+'" x2="'+(ax+gap-2)+'" y2="'+ay+'" stroke="#2d3a56" stroke-width="1"/><polygon points="'+(ax+gap-2)+','+(ay-2.5)+' '+(ax+gap+2)+','+ay+' '+(ax+gap-2)+','+(ay+2.5)+'" fill="#2d3a56"/>';}
  });
  return o+'</svg>';
}

function qaCard(q,i,pfx){
  var id=pfx+'-'+i;

    +'<span class="qa-qn">Q'+(i+1)+'</span><span class="qa-qt">'+esc(q.q)+'</span>'
    +'<span class="qa-ar" id="a-'+id+'">&#8250;</span></div>'
    +'<div class="qa-body" id="b-'+id+'"><div class="qa-diag">'+msvg(q.steps)+'</div>'
    +'<div class="qa-mem">&#128161; '+esc(q.mnemonic)+'</div>'
    +'<div class="qa-ans">'+esc(q.a)+'</div></div></div>';
}

function tqa(id){
  var b=document.getElementById('b-'+id),a=document.getElementById('a-'+id);
  if(!b)return;
  var o=b.classList.toggle('open');
  if(a)a.classList.toggle('open',o);
}

// Rail
function buildRail(){
  var groups={},order=[];
  S.forEach(function(s,i){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group);}
    groups[s.group].push({s:s,i:i});
  });
  var h='';
  order.forEach(function(g){
    h+='<div class="rg">'+esc(g)+'</div>';
    groups[g].forEach(function(x){
      h+='<div class="si" id="si-'+x.i+'" onclick="go('+x.i+')">'
        +'<div class="si-num">'+esc(x.s.num)+'</div>'
        +'<div class="si-title">'+esc(x.s.title)+'</div></div>';
    });
  });
  document.getElementById('rail').innerHTML=h;
}

var cur=0;
function go(i){
  document.querySelectorAll('.si').forEach(function(el){el.classList.remove('on');});
  var el=document.getElementById('si-'+i);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  cur=i;
  var s=S[i];
  document.getElementById('carea').scrollTop=0;
  document.getElementById('rpsub').textContent=s.num+' · '+s.title;
  document.getElementById('rpbody').innerHTML=(s.qs||[]).map(function(q,j){return qaCard(q,j,s.num);}).join('');
  if(s.isArch) renderArch(s);
  else renderCode(s);
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.key==='ArrowDown'||e.key==='j')&&cur<S.length-1){e.preventDefault();go(cur+1);}
  if((e.key==='ArrowUp'||e.key==='k')&&cur>0){e.preventDefault();go(cur-1);}
});

buildRail();
go(0);
</script>
