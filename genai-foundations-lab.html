sition can produce slightly different logits", "Model version changes are silent non-determinism \u2014 a provider updating weights changes outputs without notice"], "code_plain": "import numpy as np\n\n\ndef demonstrate_fp_nonassociativity() -> dict:\n    \"\"\"\n    Floating-point addition is NOT associative.\n    Different summation orders -> different results.\n    This is why parallel GPU reductions can vary run to run.\n    \"\"\"\n    vals = [1e20, 1.0, -1e20, 1.0]\n\n    left_to_right = ((vals[0] + vals[1]) + vals[2]) + vals[3]\n    grouped       = (vals[0] + vals[2]) + (vals[1] + vals[3])\n\n    return {\n        \"left_to_right\": left_to_right,   # loses the 1.0s to rounding\n        \"grouped\":       grouped,         # keeps them -> 2.0\n        \"equal\":         left_to_right == grouped,\n    }\n\n\nNON_DETERMINISM_SOURCES = {\n    \"sampling\":        \"temperature > 0, or top-p / top-k drawing randomly\",\n    \"fp_association\":  \"parallel reductions sum in varying order\",\n    \"gpu_scheduling\":  \"kernel launch and reduction order not fixed\",\n    \"batching\":        \"batch position shifts numerics slightly\",\n    \"model_version\":   \"provider updates weights without notice\",\n}\n\n\nif __name__ == \"__main__\":\n    print(demonstrate_fp_nonassociativity())\n    for src, why in NON_DETERMINISM_SOURCES.items():\n        print(f\"  {src:16} {why}\")", "qs": [{"q": "Why can outputs vary even at temperature 0?", "mnemonic": "Sampling isn't the only cause", "steps": ["Temp 0 kills sampling", "But FP + GPU remain", "Order changes numbers", "Logits shift slightly"], "a": "Temperature 0 removes sampling randomness, but other sources remain. Floating-point addition isn't associative, so parallel GPU reductions that sum in a different order produce slightly different logits. If two tokens have very close logits, that tiny numerical difference can flip which one is the argmax \u2014 changing the output. So determinism requires controlling far more than just the sampling knob."}, {"q": "Why does floating-point non-associativity matter here?", "mnemonic": "Order changes the sum", "steps": ["(a+b)+c \u2260 a+(b+c)", "Parallel sums reorder", "Tiny logit shifts", "Argmax can flip"], "a": "Floating-point rounding means the order of additions affects the result \u2014 (a+b)+c can differ from a+(b+c). GPUs parallelise the huge summations inside attention and matrix multiplies, and the order those partial sums combine isn't fixed run to run. The resulting logit differences are tiny, but when two candidate tokens are near-tied, a tiny shift changes which wins, altering the generated text."}, {"q": "Why is a silent model version change so dangerous?", "mnemonic": "Weights change, no notice", "steps": ["Provider updates model", "Same API call", "Different weights", "Output drifts silently"], "a": "When a provider updates a hosted model's weights, your identical API calls start producing different outputs with no code change and often no announcement. For a regulated application this is especially dangerous: behaviour you validated and documented can drift without your knowledge, breaking reproducibility and audit trails. It's why pinning to explicit model versions, not floating aliases, is a governance requirement."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 205\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"205\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">WHERE NON-DETERMINISM ENTERS<\/text><rect x=\"230\" y=\"150\" width=\"100\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"168.0\" fill=\"#34d399\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">varying<\/text><text x=\"280.0\" y=\"181.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">output<\/text><rect x=\"50\" y=\"40\" width=\"80\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"90.0\" y=\"61.0\" fill=\"#00d4c8\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">sampling<\/text><line x1=\"90\" y1=\"74\" x2=\"280\" y2=\"150\" stroke=\"#00d4c8\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><polygon points=\"274,147 280,150 274,153\" fill=\"#00d4c8\"/><rect x=\"170\" y=\"40\" width=\"80\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"210.0\" y=\"61.0\" fill=\"#f59e0b\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">fp order<\/text><line x1=\"210\" y1=\"74\" x2=\"280\" y2=\"150\" stroke=\"#f59e0b\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><polygon points=\"277,144 280,150 283,144\" fill=\"#f59e0b\"/><rect x=\"295\" y=\"40\" width=\"80\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"335.0\" y=\"61.0\" fill=\"#a78bfa\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">GPU sched<\/text><line x1=\"335\" y1=\"74\" x2=\"280\" y2=\"150\" stroke=\"#a78bfa\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><polygon points=\"277,144 280,150 283,144\" fill=\"#a78bfa\"/><rect x=\"410\" y=\"40\" width=\"80\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#60a5fa\" stroke-width=\"1.5\"/><text x=\"450.0\" y=\"61.0\" fill=\"#60a5fa\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">batching<\/text><line x1=\"450\" y1=\"74\" x2=\"280\" y2=\"150\" stroke=\"#60a5fa\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><polygon points=\"274,147 280,150 274,153\" fill=\"#60a5fa\"/><rect x=\"470\" y=\"95\" width=\"80\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#f87171\" stroke-width=\"1.5\"/><text x=\"510.0\" y=\"116.0\" fill=\"#f87171\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">version<\/text><line x1=\"510\" y1=\"129\" x2=\"280\" y2=\"150\" stroke=\"#f87171\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><polygon points=\"274,147 280,150 274,153\" fill=\"#f87171\"/><text x=\"280\" y=\"200\" fill=\"#546e7a\" font-size=\"8.5\" text-anchor=\"middle\">even at T=0, tiny logit shifts can flip a near-tied argmax<\/text><\/svg>", "pitfall": "Assuming that pinning temperature to 0 makes a system fully reproducible. Floating-point non-associativity, GPU kernel scheduling, batching, and silent version updates all remain \u2014 sampling is only the most obvious source.", "connects": "Sampling non-determinism traces back to AR4 decoding and TS3 temperature. DT2 addresses these sources by pinning each one; DT4 is how you continuously detect when a source (like a version change) breaks reproducibility."}, {"num": "DT2", "group": "Determinism", "title": "Pinning for Reproducibility", "filename": "dt2_pinning.py", "tags": [{"l": "Determinism", "c": "tr"}, {"l": "Control", "c": "tg"}], "desc": "To make outputs reproducible you pin every source of variation: temperature 0, a fixed seed, an explicit model version, fixed prompts, and recorded parameters. Reproducibility isn't automatic \u2014 it's engineered by removing each degree of freedom.", "usecase": "For your refund assistant to be auditable, the same input must yield the same output months later. That means pinning the model version, sampling parameters, prompt template, and seed \u2014 and recording all of them alongside every logged decision.", "install": "pip install openai", "wn": ["Set temperature to 0 to eliminate sampling \u2014 the single biggest lever for reproducibility", "Pin an explicit model version (e.g. a dated snapshot), never a floating 'latest' alias", "Pass a fixed seed where the provider supports it, to control any residual sampling", "Version the prompt template with a content hash \u2014 a changed prompt is a changed system", "Record every parameter (model, version, temperature, seed, prompt hash) with each logged output"], "code_plain": "import hashlib\nimport json\n\n\ndef pinned_config(prompt_template: str) -> dict:\n    \"\"\"\n    Every degree of freedom, pinned and recorded.\n    Reproducibility = removing variation, then logging what you fixed.\n    \"\"\"\n    return {\n        \"model\":         \"gpt-4-0613\",       # dated snapshot, NOT \"gpt-4\"\n        \"temperature\":   0,                  # no sampling\n        \"top_p\":         1,                   # no nucleus truncation\n        \"seed\":          42,                  # fixed seed if supported\n        \"prompt_hash\":   hashlib.sha256(\n                             prompt_template.encode()\n                         ).hexdigest()[:16],  # prompt is part of the system\n    }\n\n\ndef call_with_audit(client, prompt: str, config: dict) -> dict:\n    \"\"\"Make the call AND record everything needed to reproduce it.\"\"\"\n    resp = client.chat.completions.create(\n        model=config[\"model\"],\n        temperature=config[\"temperature\"],\n        top_p=config[\"top_p\"],\n        seed=config[\"seed\"],\n        messages=[{\"role\": \"user\", \"content\": prompt}],\n    )\n    output = resp.choices[0].message.content\n\n    return {\n        \"output\":       output,\n        \"reproduced_with\": config,           # log the full pin\n        \"system_fingerprint\": resp.system_fingerprint,  # backend version marker\n    }\n\n\nif __name__ == \"__main__\":\n    cfg = pinned_config(\"You are a refund policy assistant. {question}\")\n    print(json.dumps(cfg, indent=2))", "qs": [{"q": "Why pin a dated model snapshot instead of a floating alias?", "mnemonic": "Aliases move under you", "steps": ["'gpt-4' floats", "Provider updates it", "Snapshot is frozen", "Pin the date"], "a": "A floating alias like 'gpt-4' points to whatever the provider currently serves, so its behaviour shifts silently when they update the model. A dated snapshot (e.g. 'gpt-4-0613') is frozen \u2014 it keeps producing the same behaviour regardless of newer releases. For reproducibility and audit you pin the snapshot, so the model you validated is the model that runs, until you deliberately choose to move."}, {"q": "Why version the prompt with a content hash?", "mnemonic": "Prompt is part of the system", "steps": ["Prompt shapes output", "Small edit changes all", "Hash detects change", "Prompt is versioned"], "a": "The prompt is as much a part of the system's behaviour as the weights \u2014 a small wording change can shift every output. Hashing the prompt template gives it a version identity, so you can detect when it changed and tie each logged output to the exact prompt that produced it. Treating prompts as unversioned free text is a common cause of unexplained behaviour drift."}, {"q": "What must you record to actually reproduce an output?", "mnemonic": "Log the full pin", "steps": ["Model + version", "Temp + seed + top_p", "Prompt hash", "Store with output"], "a": "Reproducing an output requires every input that shaped it: the model and its exact version, the sampling parameters (temperature, top_p, seed), and the prompt version hash. Recording all of these alongside the output \u2014 plus any backend fingerprint the provider exposes \u2014 means you can recreate the exact conditions later. Without this record, 'the same input' is undefined and reproduction is impossible."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 195\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"195\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">PIN EVERY DEGREE OF FREEDOM<\/text><rect x=\"35\" y=\"55\" width=\"96\" height=\"42\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"83.0\" y=\"80.0\" fill=\"#00d4c8\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">temperature 0<\/text><rect x=\"137\" y=\"55\" width=\"96\" height=\"42\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"185.0\" y=\"80.0\" fill=\"#f59e0b\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">model snapshot<\/text><rect x=\"239\" y=\"55\" width=\"96\" height=\"42\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"287.0\" y=\"80.0\" fill=\"#a78bfa\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">fixed seed<\/text><rect x=\"341\" y=\"55\" width=\"96\" height=\"42\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"389.0\" y=\"80.0\" fill=\"#34d399\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">prompt hash<\/text><rect x=\"443\" y=\"55\" width=\"96\" height=\"42\" rx=\"4\" fill=\"#111827\" stroke=\"#60a5fa\" stroke-width=\"1.5\"/><text x=\"491.0\" y=\"80.0\" fill=\"#60a5fa\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">top_p = 1<\/text><line x1=\"280\" y1=\"97\" x2=\"280\" y2=\"125\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"277,119 280,125 283,119\" fill=\"#546e7a\"/><rect x=\"200\" y=\"128\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#f87171\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"146.0\" fill=\"#f87171\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">reproducible output<\/text><text x=\"280.0\" y=\"159.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">same in &#8594; same out<\/text><\/svg>", "pitfall": "Pinning a floating model alias instead of a dated snapshot. An alias moves when the provider updates the model, so your 'pinned' config silently changes behaviour \u2014 always pin an explicit, dated version.", "connects": "Pinning temperature 0 builds on TS3; pinning the prompt uses the same content-hash idea the chunking lab uses for caching. DT3 explains why this matters for governance, and DT4 verifies the pin still holds over time."}, {"num": "DT3", "group": "Determinism", "title": "Why It Matters in Regulated Environments", "filename": "dt3_regulated.py", "tags": [{"l": "Determinism", "c": "tr"}, {"l": "Model Risk", "c": "tp"}], "desc": "In regulated environments, a model that gives different answers to the same input is a model-risk and audit failure. Model risk management requires that you can explain, reproduce, and validate model behaviour. Non-determinism undermines all three \u2014 which is why determinism is a governance requirement, not a preference.", "usecase": "When a regulator or internal audit reviews a refund decision your assistant influenced, you must reproduce exactly what the model saw and said. If the output isn't reproducible, you cannot demonstrate control \u2014 and the model may be deemed unfit for the use case.", "install": "pip install hashlib", "wn": ["Model risk management requires that model behaviour be explainable, reproducible, and validated", "Non-deterministic output breaks reproducibility \u2014 you can't prove what the model did on a past decision", "Auditability requires a complete record: input, model version, parameters, and output, all reproducible", "Bounded, deterministic behaviour is easier to validate, monitor for drift, and defend to a regulator", "Determinism is a control, not a nicety \u2014 it's how you demonstrate governance over an AI system"], "code_plain": "import hashlib\nimport json\nfrom datetime import datetime\n\n\ndef audit_record(question: str, output: str, config: dict) -> dict:\n    \"\"\"\n    A model-risk audit record: everything needed to\n    explain and reproduce a model-influenced decision.\n    \"\"\"\n    record = {\n        \"timestamp\":    datetime.utcnow().isoformat(),\n        \"input\":        question,\n        \"output\":       output,\n        \"model\":        config[\"model\"],          # exact version\n        \"temperature\":  config[\"temperature\"],    # 0 for reproducibility\n        \"seed\":         config.get(\"seed\"),\n        \"prompt_hash\":  config[\"prompt_hash\"],\n    }\n    # tamper-evident: hash the whole record for the audit log\n    record[\"record_hash\"] = hashlib.sha256(\n        json.dumps(record, sort_keys=True).encode()\n    ).hexdigest()\n    return record\n\n\ndef is_reproducible(config: dict) -> tuple[bool, list[str]]:\n    \"\"\"Check a config meets the reproducibility bar for regulated use.\"\"\"\n    gaps = []\n    if config.get(\"temperature\", 1) != 0:\n        gaps.append(\"temperature must be 0\")\n    if \"-\" not in config.get(\"model\", \"\"):\n        gaps.append(\"model must be a dated snapshot, not a floating alias\")\n    if \"prompt_hash\" not in config:\n        gaps.append(\"prompt must be versioned\")\n    return (len(gaps) == 0, gaps)\n\n\nif __name__ == \"__main__\":\n    cfg = {\"model\": \"gpt-4-0613\", \"temperature\": 0, \"prompt_hash\": \"abc123\"}\n    print(\"reproducible:\", is_reproducible(cfg))", "qs": [{"q": "What does model risk management require of model behaviour?", "mnemonic": "Explain, reproduce, validate", "steps": ["Explainable", "Reproducible", "Validated", "Governed end-to-end"], "a": "Model risk management guidance requires that models be explainable, reproducible, and independently validated, with governance over their full lifecycle. For an LLM that means you must be able to say why it produced an output, recreate that output on demand, and have evidence the model was tested for its intended use. Non-deterministic behaviour directly obstructs the reproducibility and validation pillars."}, {"q": "Why does non-determinism break auditability?", "mnemonic": "Can't prove the past", "steps": ["Audit asks: what happened", "Rerun differs", "No proof of decision", "Control not demonstrated"], "a": "An audit needs you to show exactly what the model saw and produced for a past decision. If the same input can yield different outputs, rerunning it doesn't reproduce the original, so you can't prove what actually happened or that the system behaved as documented. Without reproducibility you cannot demonstrate control over the model \u2014 which in a regulated setting can render it unfit for the use case."}, {"q": "Why is determinism framed as a control, not a preference?", "mnemonic": "Governance, not taste", "steps": ["Reproducible = provable", "Provable = auditable", "Auditable = defensible", "A governance control"], "a": "In regulated finance, determinism is what lets you demonstrate governance: a reproducible system can be validated, monitored for drift, and defended to a regulator with concrete evidence. It's the mechanism by which abstract requirements \u2014 explainability, control, auditability \u2014 become provable facts about your system. That makes it a formal control in your model-risk framework, on the same footing as access controls or change management, not an engineering nicety."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 200\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"200\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">DETERMINISM AS A GOVERNANCE CONTROL<\/text><rect x=\"40\" y=\"80\" width=\"110\" height=\"50\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"95.0\" y=\"103.0\" fill=\"#00d4c8\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">reproducible<\/text><text x=\"95.0\" y=\"116.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">pinned config<\/text><line x1=\"150\" y1=\"105\" x2=\"190\" y2=\"105\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"184,102 190,105 184,108\" fill=\"#546e7a\"/><rect x=\"190\" y=\"80\" width=\"110\" height=\"50\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"245.0\" y=\"103.0\" fill=\"#f59e0b\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">auditable<\/text><text x=\"245.0\" y=\"116.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">recreate any run<\/text><line x1=\"300\" y1=\"105\" x2=\"340\" y2=\"105\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"334,102 340,105 334,108\" fill=\"#546e7a\"/><rect x=\"340\" y=\"80\" width=\"110\" height=\"50\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"395.0\" y=\"103.0\" fill=\"#a78bfa\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">validated<\/text><text x=\"395.0\" y=\"116.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">tested for use<\/text><line x1=\"450\" y1=\"105\" x2=\"490\" y2=\"105\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"484,102 490,105 484,108\" fill=\"#546e7a\"/><rect x=\"475\" y=\"80\" width=\"70\" height=\"50\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"510.0\" y=\"109.0\" fill=\"#34d399\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">defensible<\/text><text x=\"280\" y=\"165\" fill=\"#8b94ab\" font-size=\"9\" text-anchor=\"middle\">Non-determinism breaks all three &#8212; you cannot prove a past decision<\/text><text x=\"280\" y=\"184\" fill=\"#546e7a\" font-size=\"8.5\" text-anchor=\"middle\">a control in the model-risk framework, not an engineering nicety<\/text><\/svg>", "pitfall": "Treating determinism as a nice-to-have you can add later. In a regulated setting, non-reproducible behaviour undermines validation and audit from day one \u2014 determinism is a design constraint, not a finishing touch.", "connects": "This builds directly on DT2 pinning and DT1's list of what must be controlled. The same reproducibility discipline applies to the retrieval steps in the chunking and vector-search labs, where inputs must also be recreatable."}, {"num": "DT4", "group": "Determinism", "title": "Determinism Testing & Drift Detection", "filename": "dt4_drift.py", "tags": [{"l": "Determinism", "c": "tr"}, {"l": "Monitoring", "c": "ta"}], "desc": "Pinning the config isn't enough \u2014 you must continuously verify it holds. Determinism testing replays a fixed suite and checks outputs are identical; drift detection alerts when a provider-side change shifts behaviour despite unchanged inputs.", "usecase": "You pinned everything, but the provider silently updated the backend. A nightly determinism suite that replays known inputs and compares against golden outputs catches that drift before it reaches a customer or an auditor.", "install": "pip install numpy", "wn": ["Keep a golden suite: fixed inputs paired with their validated expected outputs", "Replay the suite regularly and assert outputs match exactly \u2014 any mismatch is drift or a regression", "A hash of each output makes comparison cheap and exact \u2014 compare hashes, not full text", "Track the provider's system fingerprint; a change there signals a backend update you must re-validate", "On detected drift, freeze, investigate, and re-validate before allowing the changed behaviour into production"], "code_plain": "import hashlib\n\n\ndef output_hash(text: str) -> str:\n    return hashlib.sha256(text.encode()).hexdigest()\n\n\ndef build_golden_suite(cases: list[dict]) -> dict:\n    \"\"\"Fix inputs to their validated outputs (hashed).\"\"\"\n    return {c[\"input\"]: output_hash(c[\"expected_output\"]) for c in cases}\n\n\ndef check_determinism(golden: dict, run_fn) -> dict:\n    \"\"\"\n    Replay the golden suite; any hash mismatch is drift.\n    run_fn(input) -> current model output text.\n    \"\"\"\n    drifted, passed = [], 0\n    for inp, expected_hash in golden.items():\n        actual_hash = output_hash(run_fn(inp))\n        if actual_hash == expected_hash:\n            passed += 1\n        else:\n            drifted.append(inp)\n\n    return {\n        \"total\":       len(golden),\n        \"passed\":      passed,\n        \"drifted\":     drifted,\n        \"is_stable\":   len(drifted) == 0,\n    }\n\n\ndef fingerprint_changed(previous: str, current: str) -> bool:\n    \"\"\"A changed backend fingerprint = re-validation required.\"\"\"\n    return previous != current\n\n\nif __name__ == \"__main__\":\n    golden = build_golden_suite([\n        {\"input\": \"refund window?\", \"expected_output\": \"30 days for enterprise.\"},\n    ])\n    # in production run_fn calls the pinned model\n    result = check_determinism(golden, run_fn=lambda x: \"30 days for enterprise.\")\n    print(result)", "qs": [{"q": "Why replay a golden suite regularly?", "mnemonic": "Verify the pin still holds", "steps": ["Config pinned", "But backend can shift", "Replay known inputs", "Catch drift early"], "a": "Pinning your config sets the intent, but providers can change backends underneath you, so you must verify the intent still holds. Replaying a golden suite of fixed inputs against their validated outputs, on a schedule, confirms behaviour hasn't drifted. Any mismatch surfaces a provider-side change or a regression before it reaches a customer or an auditor \u2014 turning silent drift into a caught, actionable signal."}, {"q": "Why compare output hashes instead of full text?", "mnemonic": "Exact and cheap", "steps": ["Hash each output", "Compare hashes", "Exact match check", "Fast at scale"], "a": "Hashing each output reduces the comparison to a single fixed-length string check, which is exact and cheap to store and compare at scale. A hash mismatch definitively flags that the output changed, without needing to diff or store large volumes of text. It's the same content-hash discipline used for prompt versioning \u2014 a compact, tamper-evident fingerprint of what the model produced."}, {"q": "What should happen when drift is detected?", "mnemonic": "Freeze, investigate, re-validate", "steps": ["Mismatch found", "Freeze rollout", "Investigate cause", "Re-validate before resuming"], "a": "Detected drift means the system no longer behaves as validated, so you freeze \u2014 halt promoting the changed behaviour \u2014 then investigate whether it's a provider update, a config slip, or a genuine regression. Only after re-validating the new behaviour against your requirements and updating the golden suite do you allow it into production. This freeze-investigate-revalidate loop is how governance stays intact when behaviour changes."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 195\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"195\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">GOLDEN SUITE &#8594; DRIFT DETECTION<\/text><rect x=\"30\" y=\"70\" width=\"90\" height=\"46\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"75.0\" y=\"91.0\" fill=\"#00d4c8\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">golden suite<\/text><text x=\"75.0\" y=\"104.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">fixed in/out<\/text><line x1=\"120\" y1=\"93\" x2=\"160\" y2=\"93\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"154,90 160,93 154,96\" fill=\"#546e7a\"/><rect x=\"160\" y=\"70\" width=\"90\" height=\"46\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"205.0\" y=\"91.0\" fill=\"#f59e0b\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">replay<\/text><text x=\"205.0\" y=\"104.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">hash outputs<\/text><line x1=\"250\" y1=\"93\" x2=\"290\" y2=\"93\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"284,90 290,93 284,96\" fill=\"#546e7a\"/><rect x=\"290\" y=\"70\" width=\"80\" height=\"46\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"330.0\" y=\"91.0\" fill=\"#a78bfa\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">compare<\/text><text x=\"330.0\" y=\"104.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">vs expected<\/text><line x1=\"370\" y1=\"93\" x2=\"410\" y2=\"70\" stroke=\"#34d399\" stroke-width=\"1.5\"/><polygon points=\"404,67 410,70 404,73\" fill=\"#34d399\"/><line x1=\"370\" y1=\"93\" x2=\"410\" y2=\"116\" stroke=\"#f87171\" stroke-width=\"1.5\"/><polygon points=\"404,113 410,116 404,119\" fill=\"#f87171\"/><rect x=\"410\" y=\"52\" width=\"120\" height=\"32\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"470.0\" y=\"72.0\" fill=\"#34d399\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">match &#8594; stable<\/text><rect x=\"410\" y=\"102\" width=\"120\" height=\"32\" rx=\"4\" fill=\"#111827\" stroke=\"#f87171\" stroke-width=\"1.5\"/><text x=\"470.0\" y=\"122.0\" fill=\"#f87171\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">mismatch &#8594; drift<\/text><text x=\"280\" y=\"170\" fill=\"#546e7a\" font-size=\"8.5\" text-anchor=\"middle\">on drift: freeze &#8594; investigate &#8594; re-validate<\/text><\/svg>", "pitfall": "Running the golden suite once and assuming stability holds forever. Providers update backends silently, so a one-time check gives false confidence \u2014 the suite only protects you if it runs on a schedule and alerts on drift.", "connects": "Drift detection verifies the DT2 pins still hold and catches the DT1 version-change source in the act. The output-hash technique is the same content-hashing used for caching in the chunking lab."}, {"num": "OR1", "group": "Orchestration", "title": "Simple Prompt-Response", "filename": "or1_prompt_response.py", "tags": [{"l": "Orchestration", "c": "tg"}, {"l": "Baseline", "c": "tc"}], "desc": "The simplest pattern: one prompt in, one response out, no state, no tools, no branching. It's the most predictable, cheapest, and most auditable option \u2014 and the right default until a task genuinely needs more.", "usecase": "'Summarise this refund policy paragraph' is a single-shot task: one input, one output, done. Reaching for an agent here would add cost, latency, and non-determinism for no benefit. Start simple and only escalate when forced to.", "install": "pip install openai", "wn": ["One prompt, one completion \u2014 no memory between calls, no tools, no control flow", "Most predictable and auditable pattern: a single input maps to a single output you can pin and reproduce", "Cheapest and lowest-latency \u2014 one model call, no orchestration overhead", "Ideal for classification, extraction, summarisation, single-turn Q&A \u2014 bounded, self-contained tasks", "Default to this; escalate to chains or agents only when the task provably needs multi-step or dynamic behaviour"], "code_plain": "from openai import OpenAI\n\nclient = OpenAI()\n\n\ndef prompt_response(question: str, context: str = \"\") -> str:\n    \"\"\"\n    One call, one answer. No state, no tools, no branching.\n    The most predictable and auditable pattern.\n    \"\"\"\n    system = \"You are a refund policy assistant. Answer only from the context.\"\n    user = f\"Context:\\n{context}\\n\\nQuestion: {question}\"\n\n    resp = client.chat.completions.create(\n        model=\"gpt-4-0613\",\n        temperature=0,                      # deterministic\n        messages=[\n            {\"role\": \"system\", \"content\": system},\n            {\"role\": \"user\", \"content\": user},\n        ],\n    )\n    return resp.choices[0].message.content\n\n\n# When this is enough:\n#   - single-turn Q&A over provided context\n#   - classification, extraction, summarisation\n#   - anything with no need for memory, tools, or multiple steps\n#\n# One input -> one output. Nothing to orchestrate, nothing to audit\n# beyond the single call. This is the default; escalate only when forced.\n\nif __name__ == \"__main__\":\n    answer = prompt_response(\n        \"How long do enterprise refunds take?\",\n        context=\"Enterprise refunds are processed within 5-7 business days.\",\n    )\n    print(answer)", "qs": [{"q": "Why default to simple prompt-response?", "mnemonic": "Simplest wins by default", "steps": ["One call, one answer", "Predictable + cheap", "Easy to audit", "Escalate only if forced"], "a": "It's the most predictable, cheapest, and most auditable pattern \u2014 a single input maps to a single output you can pin, reproduce, and reason about with no orchestration to reason around. Chains and agents add cost, latency, and non-determinism. Starting simple and escalating only when a task provably needs more keeps systems easier to validate and defend, which matters most in regulated settings."}, {"q": "What tasks are a natural fit for this pattern?", "mnemonic": "Bounded, self-contained", "steps": ["Classification", "Extraction", "Summarisation", "Single-turn Q&A"], "a": "Tasks that are bounded and self-contained: classification, extraction, summarisation, and single-turn question answering over provided context. These need no memory across calls, no external tools, and no multi-step reasoning that must be orchestrated. One input fully determines the expected output, so the simplest pattern serves them perfectly without any added machinery."}, {"q": "What does this pattern deliberately lack?", "mnemonic": "No state, tools, or flow", "steps": ["No memory", "No tools", "No branching", "One shot only"], "a": "By design it has no memory between calls, no tool use, and no control flow or branching \u2014 it's a single stateless call. That's exactly what makes it predictable and auditable. When a task genuinely requires remembering prior turns, calling external systems, or making decisions across multiple steps, that absence becomes a limitation and you escalate to a chain or an agent."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 160\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"160\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">SIMPLE PROMPT-RESPONSE<\/text><rect x=\"90\" y=\"60\" width=\"90\" height=\"46\" rx=\"4\" fill=\"#111827\" stroke=\"#60a5fa\" stroke-width=\"1.5\"/><text x=\"135.0\" y=\"81.0\" fill=\"#60a5fa\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">prompt<\/text><text x=\"135.0\" y=\"94.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">one input<\/text><line x1=\"180\" y1=\"83\" x2=\"240\" y2=\"83\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"234,80 240,83 234,86\" fill=\"#546e7a\"/><rect x=\"240\" y=\"60\" width=\"90\" height=\"46\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"285.0\" y=\"81.0\" fill=\"#00d4c8\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">model<\/text><text x=\"285.0\" y=\"94.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">one call<\/text><line x1=\"330\" y1=\"83\" x2=\"390\" y2=\"83\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"384,80 390,83 384,86\" fill=\"#546e7a\"/><rect x=\"390\" y=\"60\" width=\"90\" height=\"46\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"435.0\" y=\"81.0\" fill=\"#34d399\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">response<\/text><text x=\"435.0\" y=\"94.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">one output<\/text><text x=\"280\" y=\"130\" fill=\"#8b94ab\" font-size=\"9\" text-anchor=\"middle\">No state &#183; no tools &#183; no branching &#8212; most predictable, the default<\/text><\/svg>", "pitfall": "Reaching for a chain or agent when a single call would do. Added orchestration brings cost, latency, and non-determinism \u2014 if one prompt fully answers the task, more machinery only makes it harder to reason about.", "connects": "This is the simplest point on the OR4 decision spectrum. Under regulated constraints (DT3) it's also the easiest to make reproducible, since there's only one call to pin (DT2)."}, {"num": "OR2", "group": "Orchestration", "title": "Chains (Fixed Pipelines)", "filename": "or2_chains.py", "tags": [{"l": "Orchestration", "c": "tg"}, {"l": "Pipeline", "c": "tb"}], "desc": "A chain is a fixed sequence of steps, each feeding the next \u2014 retrieve, then answer, then check. The control flow is predetermined and deterministic in structure: the same steps run in the same order every time, which keeps it auditable while handling multi-step work.", "usecase": "Answering a refund question with RAG is a chain: embed the query, retrieve chunks, then generate an answer from them. The steps are fixed and known in advance \u2014 you always retrieve before you generate. No dynamic decisions about what to do next.", "install": "pip install langchain-openai", "wn": ["A chain is a predetermined sequence of steps \u2014 the flow is fixed at design time, not decided at runtime", "Each step's output feeds the next: retrieve -> augment prompt -> generate -> optionally validate", "The structure is deterministic even if individual LLM calls aren't \u2014 you always run the same steps in order", "More capable than a single prompt, but far more predictable and auditable than an agent", "Ideal when the task decomposes into known, ordered sub-steps that don't change per input (classic RAG)"], "code_plain": "from langchain_openai import ChatOpenAI, OpenAIEmbeddings\n\nllm = ChatOpenAI(model=\"gpt-4-0613\", temperature=0)\nembedder = OpenAIEmbeddings(model=\"text-embedding-3-small\")\n\n\ndef rag_chain(question: str, retriever) -> dict:\n    \"\"\"\n    A fixed pipeline: the SAME steps in the SAME order every time.\n    retrieve -> augment -> generate. No runtime branching.\n    \"\"\"\n    # STEP 1: retrieve (always first)\n    q_vec = embedder.embed_query(question)\n    chunks = retriever.search(q_vec, k=5)\n\n    # STEP 2: augment the prompt with retrieved context\n    context = \"\\n\".join(c[\"text\"] for c in chunks)\n    prompt = (\n        \"Answer only from the context below.\\n\\n\"\n        f\"Context:\\n{context}\\n\\nQuestion: {question}\"\n    )\n\n    # STEP 3: generate (always after retrieval)\n    answer = llm.invoke(prompt).content\n\n    return {\n        \"answer\":    answer,\n        \"citations\": [c[\"id\"] for c in chunks],   # provenance from step 1\n    }\n\n\n# The flow is FIXED: you always retrieve, then generate.\n# The chain never decides at runtime to skip retrieval or add a step.\n# Deterministic structure -> predictable, auditable, testable.", "qs": [{"q": "What makes a chain's control flow predictable?", "mnemonic": "Steps fixed at design time", "steps": ["Define steps upfront", "Same order always", "No runtime choice", "Structure is fixed"], "a": "A chain's sequence of steps is decided when you write it, not at runtime \u2014 it always retrieves then generates, in that order, for every input. Individual LLM calls inside the chain may still vary, but the structure is invariant: no step is added, skipped, or reordered based on the input. This fixed structure is what makes chains far more predictable and auditable than agents while still handling multi-step work."}, {"q": "How does a chain differ from a single prompt?", "mnemonic": "Ordered steps vs one shot", "steps": ["Prompt: one call", "Chain: many steps", "Output feeds next", "Decomposed task"], "a": "A single prompt is one stateless call; a chain is a sequence of steps where each output feeds the next \u2014 retrieve, augment, generate, maybe validate. It handles tasks that decompose into known ordered sub-steps that a single call can't do well, like RAG. The gain is capability over multi-step work; the cost is more calls and slightly more to reason about, but the flow stays fixed."}, {"q": "When is a chain the right choice over an agent?", "mnemonic": "Known steps, no decisions", "steps": ["Steps known upfront", "Same every input", "No dynamic routing", "Chain fits"], "a": "Choose a chain when the task decomposes into a known, ordered set of steps that don't change per input \u2014 classic RAG is the archetype: you always retrieve before generating. If the sequence is fixed, an agent's runtime decision-making adds non-determinism and cost for no benefit. Reserve agents for when the model genuinely must decide what to do next based on intermediate results."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 165\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"165\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">CHAIN &#8212; FIXED PIPELINE<\/text><rect x=\"40\" y=\"62\" width=\"100\" height=\"44\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"90.0\" y=\"88.0\" fill=\"#00d4c8\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">retrieve<\/text><line x1=\"140\" y1=\"84\" x2=\"162\" y2=\"84\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"156,81 162,84 156,87\" fill=\"#546e7a\"/><rect x=\"162\" y=\"62\" width=\"100\" height=\"44\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"212.0\" y=\"88.0\" fill=\"#f59e0b\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">augment<\/text><line x1=\"262\" y1=\"84\" x2=\"284\" y2=\"84\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"278,81 284,84 278,87\" fill=\"#546e7a\"/><rect x=\"284\" y=\"62\" width=\"100\" height=\"44\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"334.0\" y=\"88.0\" fill=\"#a78bfa\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">generate<\/text><line x1=\"384\" y1=\"84\" x2=\"406\" y2=\"84\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"400,81 406,84 400,87\" fill=\"#546e7a\"/><rect x=\"406\" y=\"62\" width=\"100\" height=\"44\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"456.0\" y=\"88.0\" fill=\"#34d399\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">validate<\/text><text x=\"280\" y=\"135\" fill=\"#8b94ab\" font-size=\"9\" text-anchor=\"middle\">Same steps, same order, every input &#8212; deterministic structure<\/text><\/svg>", "pitfall": "Letting a chain's steps drift into runtime conditionals. Once the flow starts branching based on intermediate output, it's really an agent \u2014 keep chains genuinely fixed, or acknowledge you've crossed into OR3 territory.", "connects": "A RAG chain is exactly the pipeline built across the chunking and vector-search labs: embed, retrieve, then generate. It sits between OR1 and OR3 on the OR4 decision guide."}, {"num": "OR3", "group": "Orchestration", "title": "Agents (Dynamic Loops)", "filename": "or3_agents.py", "tags": [{"l": "Orchestration", "c": "tr"}, {"l": "Dynamic", "c": "ta"}], "desc": "An agent decides its own steps at runtime. It loops \u2014 reason, choose a tool, observe the result, repeat \u2014 until it deems the task done. This dynamism handles open-ended tasks a fixed chain can't, but at the cost of predictability, higher latency, and harder auditing.", "usecase": "A question like 'compare my last three refunds and flag anything unusual' needs the model to decide which lookups to make and when to stop. An agent can do that; a fixed chain can't. But every runtime decision is a new source of variance to govern.", "install": "pip install langchain-openai", "wn": ["An agent chooses its actions at runtime \u2014 it decides which tool to call and when the task is complete", "The loop is reason -> act (call a tool) -> observe -> repeat, until a stop condition", "Dynamism handles open-ended, multi-step tasks whose steps can't be known in advance", "The cost is predictability: runtime decisions mean more variance, higher latency, and harder audit trails", "Bound agents hard \u2014 max steps, allowed tools, approval gates \u2014 especially in regulated contexts"], "code_plain": "from langchain_openai import ChatOpenAI\n\nllm = ChatOpenAI(model=\"gpt-4-0613\", temperature=0)\n\n\ndef agent_loop(task: str, tools: dict, max_steps: int = 6) -> dict:\n    \"\"\"\n    The agent DECIDES its own steps at runtime:\n      reason -> choose a tool -> observe -> repeat -> stop.\n    Bounded by max_steps so it can never run away.\n    \"\"\"\n    history: list[str] = []\n\n    for step in range(max_steps):\n        # the model reasons about what to do NEXT, given progress so far\n        decision = llm.invoke(\n            f\"Task: {task}\\nProgress:\\n\" + \"\\n\".join(history) +\n            \"\\nChoose a tool and input, or reply DONE.\"\n        ).content\n\n        if decision.strip().startswith(\"DONE\"):\n            return {\"result\": history[-1] if history else \"\", \"steps\": step,\n                    \"completed\": True}\n\n        # parse and execute the chosen tool (dynamic dispatch)\n        tool_name, tool_input = parse_decision(decision)\n        if tool_name in tools:\n            observation = tools[tool_name](tool_input)\n            history.append(f\"{tool_name}({tool_input}) -> {observation}\")\n\n    # ran out of steps without finishing -> bounded failure, not runaway\n    return {\"result\": history, \"steps\": max_steps, \"completed\": False}\n\n\ndef parse_decision(text: str) -> tuple[str, str]:\n    \"\"\"Extract (tool, input) from the model's chosen action.\"\"\"\n    line = text.strip().splitlines()[0]\n    name, _, arg = line.partition(\":\")\n    return name.strip(), arg.strip()", "qs": [{"q": "What distinguishes an agent from a chain?", "mnemonic": "Runtime decisions vs fixed flow", "steps": ["Chain: steps fixed", "Agent: chooses steps", "Decides tool + stop", "Dynamic at runtime"], "a": "A chain's steps are fixed at design time; an agent decides its steps at runtime. The agent loops \u2014 reasoning about what to do next, choosing a tool, observing the result, and repeating until it judges the task complete. That runtime decision-making lets it handle open-ended tasks whose steps can't be known in advance, which a fixed chain fundamentally cannot do. The tradeoff is that every decision is a new source of variance."}, {"q": "Why must agents be bounded in regulated contexts?", "mnemonic": "Dynamism needs hard limits", "steps": ["Agent decides freely", "Could loop or misact", "Cap steps + tools", "Gate risky actions"], "a": "An agent's freedom to choose actions at runtime is exactly what makes it risky: without limits it can loop indefinitely, call tools it shouldn't, or take irreversible actions. In regulated contexts you bound it hard \u2014 a maximum step count, an allow-list of tools, and human-approval gates on high-value actions. These structural limits turn open-ended autonomy into controlled, auditable behaviour that governance can defend."}, {"q": "What is the agent's core loop?", "mnemonic": "Reason, act, observe, repeat", "steps": ["Reason about next", "Act via a tool", "Observe result", "Repeat or stop"], "a": "The agent runs a loop: it reasons about what to do next given progress so far, acts by calling a chosen tool, observes the result, and feeds that back to reason again \u2014 repeating until a stop condition or step limit. This reason-act-observe cycle is what lets it adapt its path to intermediate results. The stop condition and max-step bound guarantee it terminates rather than looping forever."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 200\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"200\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">AGENT &#8212; DYNAMIC LOOP<\/text><rect x=\"235\" y=\"40\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"58.0\" fill=\"#00d4c8\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">reason<\/text><text x=\"280.0\" y=\"71.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">what next?<\/text><rect x=\"370\" y=\"100\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"415.0\" y=\"118.0\" fill=\"#f59e0b\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">act<\/text><text x=\"415.0\" y=\"131.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">call a tool<\/text><rect x=\"235\" y=\"160\" width=\"90\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"181.0\" fill=\"#a78bfa\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">observe<\/text><rect x=\"90\" y=\"100\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"135.0\" y=\"118.0\" fill=\"#34d399\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">stop?<\/text><text x=\"135.0\" y=\"131.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">done / max<\/text><line x1=\"325\" y1=\"60\" x2=\"415\" y2=\"100\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"409,97 415,100 409,103\" fill=\"#546e7a\"/><line x1=\"415\" y1=\"140\" x2=\"280\" y2=\"160\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"274,157 280,160 274,163\" fill=\"#546e7a\"/><line x1=\"235\" y1=\"177\" x2=\"135\" y2=\"140\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"129,137 135,140 129,143\" fill=\"#546e7a\"/><line x1=\"135\" y1=\"100\" x2=\"235\" y2=\"60\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"229,57 235,60 229,63\" fill=\"#546e7a\"/><text x=\"280\" y=\"192\" fill=\"#8b94ab\" font-size=\"9\" text-anchor=\"middle\">Model decides steps at runtime &#8212; bound max steps + tools + gates<\/text><\/svg>", "pitfall": "Deploying an unbounded agent. Without a hard step cap, a tool allow-list, and gates on irreversible actions, an agent can loop indefinitely or take unintended actions \u2014 bound it before it ever reaches production.", "connects": "Agents are the most powerful and least predictable OR4 option. Their runtime decisions compound the DT1 non-determinism problem, so the DT3 governance controls matter most here."}, {"num": "OR4", "group": "Orchestration", "title": "Choosing Your Pattern", "filename": "or4_decision_guide.py", "tags": [{"l": "Orchestration", "c": "tr"}, {"l": "Capstone", "c": "tp"}, {"l": "Decision guide", "c": "ta"}], "desc": "The capstone: a decision function mapping task shape \u2014 statefulness, tool need, dynamism, and governance constraints \u2014 to the right orchestration pattern. The guiding principle is to use the least powerful pattern that solves the task, because simpler means more predictable, cheaper, and more auditable.", "usecase": "Interviewer: 'when do you reach for an agent versus a chain?' The defensible answer walks the constraints \u2014 does it need runtime decisions? tools? memory? \u2014 and lands on the simplest pattern that fits, with governance cost weighed explicitly. This section is that reasoning.", "install": "pip install langchain", "wn": ["Start from the task shape: does it need memory, tools, and \u2014 crucially \u2014 decisions made at runtime?", "No tools, no state, single step -> simple prompt-response (most predictable, default choice)", "Known ordered steps, no runtime branching -> chain (predictable structure, handles multi-step)", "Steps unknowable in advance, needs runtime decisions -> agent (powerful, least predictable)", "Principle: use the least powerful pattern that solves the task \u2014 simpler is more auditable and cheaper"], "code_plain": "from dataclasses import dataclass\n\n\n@dataclass\nclass TaskShape:\n    single_step:       bool    # is it one input -> one output?\n    steps_known:       bool    # are the steps fixed and orderable upfront?\n    needs_tools:       bool    # external lookups / actions required?\n    needs_runtime_decisions: bool  # must the model decide what to do next?\n    regulated:         bool    # governance / audit constraints apply?\n\n\ndef recommend_pattern(t: TaskShape) -> dict:\n    \"\"\"\n    Map task shape to orchestration pattern.\n    Principle: the LEAST powerful pattern that solves the task.\n    \"\"\"\n    if t.single_step and not t.needs_tools:\n        pattern = \"Simple Prompt-Response\"\n        why = \"One input, one output, no tools \u2014 the most predictable option.\"\n\n    elif t.steps_known and not t.needs_runtime_decisions:\n        pattern = \"Chain (fixed pipeline)\"\n        why = \"Steps are known and ordered; fixed structure stays auditable.\"\n\n    else:\n        pattern = \"Agent (dynamic loop)\"\n        why = \"Steps can't be known upfront; runtime decisions are required.\"\n\n    # governance overlay: escalation raises the control burden\n    controls = []\n    if t.regulated:\n        controls = [\n            \"temperature 0 + pinned model version (determinism)\",\n            \"full audit record per call (model risk mgmt)\",\n        ]\n        if pattern.startswith(\"Agent\"):\n            controls += [\n                \"bound max steps + allow-list tools\",\n                \"human approval gate on irreversible actions\",\n            ]\n\n    return {\"pattern\": pattern, \"why\": why, \"required_controls\": controls}\n\n\nif __name__ == \"__main__\":\n    task = TaskShape(single_step=False, steps_known=True, needs_tools=True,\n                     needs_runtime_decisions=False, regulated=True)\n    print(recommend_pattern(task))   # -> Chain, with regulated controls", "qs": [{"q": "What's the guiding principle for choosing a pattern?", "mnemonic": "Least powerful that works", "steps": ["Simpler = predictable", "Simpler = cheaper", "Simpler = auditable", "Escalate only if forced"], "a": "Use the least powerful pattern that actually solves the task. Simpler patterns are more predictable, cheaper, lower-latency, and easier to audit \u2014 a single prompt beats a chain beats an agent on all those axes. You escalate to a more powerful pattern only when the task provably requires it: multi-step work forces a chain, runtime decision-making forces an agent. Reaching for an agent by default trades away control for power you may not need."}, {"q": "What's the key question separating a chain from an agent?", "mnemonic": "Runtime decisions or not", "steps": ["Steps known upfront?", "Yes \u2192 chain", "Decide at runtime?", "Yes \u2192 agent"], "a": "The deciding question is whether the steps can be known and ordered in advance. If they can, a chain's fixed pipeline suffices and stays predictable. If the model must decide what to do next based on intermediate results \u2014 steps that can't be enumerated upfront \u2014 you need an agent's runtime decision-making. Everything else (tools, memory) can attach to either; runtime dynamism is the true dividing line."}, {"q": "How does regulation change the pattern decision?", "mnemonic": "Same choice, more controls", "steps": ["Pick simplest pattern", "Add determinism controls", "Agent \u2192 bound + gate", "Governance overlay"], "a": "Regulation doesn't change which pattern fits the task, but it raises the control burden on top of it. Every pattern gains determinism requirements \u2014 temperature 0, pinned versions, and full audit records. Agents gain more: bounded steps, tool allow-lists, and human-approval gates on irreversible actions. The governance overlay makes simpler patterns even more attractive, since each escalation adds controls you must implement and defend."}], "isArch": false, "diagram": "<svg viewBox=\"0 0 560 215\" width=\"100%\" style=\"max-width:640px\" font-family=\"system-ui\"><rect width=\"560\" height=\"215\" fill=\"#0a0f1e\" rx=\"8\"/><text x=\"280.0\" y=\"16\" fill=\"#546e7a\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" letter-spacing=\"1\">CHOOSING YOUR PATTERN<\/text><rect x=\"215\" y=\"26\" width=\"130\" height=\"34\" rx=\"4\" fill=\"#111827\" stroke=\"#60a5fa\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"47.0\" fill=\"#60a5fa\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">task shape?<\/text><line x1=\"240\" y1=\"60\" x2=\"150\" y2=\"90\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"144,87 150,90 144,93\" fill=\"#546e7a\"/><line x1=\"280\" y1=\"60\" x2=\"280\" y2=\"90\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"277,84 280,90 283,84\" fill=\"#546e7a\"/><line x1=\"330\" y1=\"60\" x2=\"430\" y2=\"90\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"424,87 430,90 424,93\" fill=\"#546e7a\"/><rect x=\"80\" y=\"92\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#00d4c8\" stroke-width=\"1.5\"/><text x=\"155.0\" y=\"110.0\" fill=\"#00d4c8\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">prompt-response<\/text><text x=\"155.0\" y=\"123.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">single step, no tools<\/text><rect x=\"245\" y=\"92\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/><text x=\"320.0\" y=\"110.0\" fill=\"#f59e0b\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">chain<\/text><text x=\"320.0\" y=\"123.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">steps known upfront<\/text><rect x=\"400\" y=\"92\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#111827\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"475.0\" y=\"110.0\" fill=\"#a78bfa\" font-size=\"8.5\" font-weight=\"700\" text-anchor=\"middle\">agent<\/text><text x=\"475.0\" y=\"123.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">runtime decisions<\/text><rect x=\"150\" y=\"155\" width=\"260\" height=\"38\" rx=\"4\" fill=\"#111827\" stroke=\"#f87171\" stroke-width=\"1.5\"/><text x=\"280.0\" y=\"172.0\" fill=\"#f87171\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\">regulated overlay<\/text><text x=\"280.0\" y=\"185.0\" fill=\"#546e7a\" font-size=\"8\" text-anchor=\"middle\">+ determinism + audit + gates<\/text><line x1=\"155\" y1=\"132\" x2=\"230\" y2=\"155\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"224,152 230,155 224,158\" fill=\"#546e7a\"/><line x1=\"320\" y1=\"132\" x2=\"300\" y2=\"155\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"297,149 300,155 303,149\" fill=\"#546e7a\"/><line x1=\"470\" y1=\"132\" x2=\"380\" y2=\"155\" stroke=\"#546e7a\" stroke-width=\"1.5\"/><polygon points=\"374,152 380,155 374,158\" fill=\"#546e7a\"/><text x=\"280\" y=\"208\" fill=\"#8b94ab\" font-size=\"9\" text-anchor=\"middle\">Use the least powerful pattern that solves the task<\/text><\/svg>", "pitfall": "Defaulting to the most powerful pattern 'to be safe'. The opposite is true \u2014 the least powerful pattern that solves the task is the most predictable, cheapest, and easiest to govern; escalate only when the task forces it.", "connects": "This capstone ties together OR1, OR2, and OR3, and folds in the DT3 governance overlay \u2014 each escalation up the pattern ladder adds the determinism and audit controls from DT2 and DT4."}]
</script>
<script>
var S = JSON.parse(document.getElementById('D').textContent);

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Syntax highlighter — applied at render time on plain text
function hi(code){
  // 1. escape HTML
  var esc0 = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc0.split('\n').map(function(line){
    // 2. pull out comment (everything after first #)
    var cmt='';
    var ci=line.indexOf('#');
    var l = line;
    if(ci>=0){cmt=line.slice(ci);l=line.slice(0,ci);}
    // 3. protect strings FIRST with placeholders so later regexes can't touch them
    //    triple-quoted (single-line docstrings) BEFORE normal quotes
    var store=[];
    l=l.replace(/("""[\s\S]*?"""|'''[\s\S]*?''')/g,function(m){
      store.push('<span class="st">'+m+'</span>');
      return '\uE000STR'+(store.length-1)+'END\uE000';
    });
    l=l.replace(/(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')/g,function(m){
      store.push('<span class="st">'+m+'</span>');
      return '\uE000STR'+(store.length-1)+'END\uE000';
    });
    // 4. keywords / builtins / numbers / decorators on the string-free text
    l=l.replace(/\b(from|import|class|def|return|if|else|elif|for|while|in|not|and|or|is|None|True|False|with|as|try|except|raise|pass|lambda|yield|break|continue|async|await|Protocol)\b/g,'<span class="kw">$1</span>');
    l=l.replace(/(@\w+)/g,'<span class="dc">$1</span>');
    l=l.replace(/\b(print|len|list|dict|str|int|float|bool|range|enumerate|zip|map|filter|sorted|getattr|hasattr|isinstance|type|super|set|tuple|sum|min|max|any|all|round)\b/g,'<span class="bi">$1</span>');
    l=l.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
    // 5. restore protected strings
    l=l.replace(/\uE000STR(\d+)END\uE000/g,function(_,i){return store[+i];});
    // 6. re-attach comment
    if(cmt)l=l+'<span class="cm">'+cmt+'</span>';
    return l;
  }).join('\n');
}

// Mini SVG for Q&A steps
function msvg(steps){
  var c=['#00d4c8','#f59e0b','#34d399','#f87171'];
  steps=steps||[];
  var bw=44,bh=22,gap=7,y=12,W=232;
  var total=steps.length*bw+(steps.length-1)*gap;
  var x0=(W-total)/2,o='<svg viewBox="0 0 '+W+' '+(bh+y+8)+'" width="100%">';
  steps.forEach(function(t,i){
    var x=x0+i*(bw+gap),col=c[i%c.length];
    o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="none" stroke="'+col+'" stroke-width="1.2"/>';
    o+='<text x="'+(x+bw/2)+'" y="'+(y+bh/2+4)+'" font-family="system-ui" font-size="7" fill="'+col+'" text-anchor="middle">'+esc(t)+'</text>';
    if(i<steps.length-1){var ax=x+bw+1,ay=y+bh/2;o+='<line x1="'+ax+'" y1="'+ay+'" x2="'+(ax+gap-2)+'" y2="'+ay+'" stroke="#2d3a56" stroke-width="1"/><polygon points="'+(ax+gap-2)+','+(ay-2.5)+' '+(ax+gap+2)+','+ay+' '+(ax+gap-2)+','+(ay+2.5)+'" fill="#2d3a56"/>';}
  });
  return o+'</svg>';
}

function qaCard(q,i,pfx){
  var id=pfx+'-'+i;
  return '<div class="qa-item"><div class="qa-q" onclick="tqa(\''+id+'\')">'
    +'<span class="qa-qn">Q'+(i+1)+'</span><span class="qa-qt">'+esc(q.q)+'</span>'
    +'<span class="qa-ar" id="a-'+id+'">&#8250;</span></div>'
    +'<div class="qa-body" id="b-'+id+'"><div class="qa-diag">'+msvg(q.steps)+'</div>'
    +'<div class="qa-mem">&#128161; '+esc(q.mnemonic)+'</div>'
    +'<div class="qa-ans">'+esc(q.a)+'</div></div></div>';
}

function tqa(id){
  var b=document.getElementById('b-'+id),a=document.getElementById('a-'+id);
  if(!b)return;
  var o=b.classList.toggle('open');
  if(a)a.classList.toggle('open',o);
}

// Rail
function buildRail(){
  var groups={},order=[];
  S.forEach(function(s,i){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group);}
    groups[s.group].push({s:s,i:i});
  });
  var h='';
  order.forEach(function(g){
    h+='<div class="rg">'+esc(g)+'</div>';
    groups[g].forEach(function(x){
      h+='<div class="si" id="si-'+x.i+'" onclick="go('+x.i+')">'
        +'<div class="si-num">'+esc(x.s.num)+'</div>'
        +'<div class="si-title">'+esc(x.s.title)+'</div></div>';
    });
  });
  document.getElementById('rail').innerHTML=h;
}

function renderCode(s,idx){
  var tags=(s.tags||[]).map(function(t){return '<span class="tag '+t.c+'">'+esc(t.l)+'</span>';}).join(' ');
  document.getElementById('shdr').innerHTML=
    '<div class="shdr-top"><span class="shdr-num">'+esc(s.num)+'</span>'
    +'<span class="shdr-title">'+esc(s.title)+'</span> '+tags+'</div>'
    +'<div class="shdr-desc">'+esc(s.desc)+'</div>';
  var wn=(s.wn||[]).map(function(w){return '<li>'+esc(w)+'</li>';}).join('');
  var pct=Math.round(((idx+1)/S.length)*100);
  document.getElementById('carea').innerHTML=
    '<div class="prog"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
    +'<div class="uc"><div class="uc-lbl">Why this matters — use case</div>'
    +'<div class="uc-text">'+esc(s.usecase)+'</div></div>'
    +'<div class="wn"><div class="wn-title">What\'s new in this section</div>'
    +'<ul class="wn-list">'+wn+'</ul>'
    +'<div class="wn-ilbl">Install</div>'
    +'<div class="wn-install">$ '+esc(s.install)+'</div></div>'
    +(s.diagram ? '<div class="dgm"><div class="dgm-title">Concept diagram</div><div class="dgm-wrap">'+s.diagram+'</div></div>' : '')
    +'<div class="cb"><div class="cb-bar">'
    +'<div><span class="cb-lang">python</span><span class="cb-file">'+esc(s.filename)+'</span></div>'
    +'<button class="cb-copy" onclick="cpCode()">Copy</button></div>'
    +'<pre id="cpre">'+hi(s.code_plain||'')+'</pre></div>'
    +(s.pitfall ? '<div class="pit"><div class="pit-title">&#9888; Common pitfall</div><div class="pit-body">'+esc(s.pitfall)+'</div></div>' : '')
    +(s.connects ? '<div class="cx"><div class="cx-title">&#8599; Connects to</div><div class="cx-body">'+esc(s.connects)+'</div></div>' : '');
}

function cpCode(){
  var p=document.getElementById('cpre');
  if(!p)return;
  navigator.clipboard.writeText(p.innerText).then(function(){
    var b=document.querySelector('.cb-copy');
    if(b){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy';},1800);}
  });
}

var cur=0;
function go(i){
  document.querySelectorAll('.si').forEach(function(el){el.classList.remove('on');});
  var el=document.getElementById('si-'+i);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  cur=i;
  var s=S[i];
  document.getElementById('carea').scrollTop=0;
  renderCode(s,i);
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.key==='ArrowDown'||e.key==='j')&&cur<S.length-1){e.preventDefault();go(cur+1);}
  if((e.key==='ArrowUp'||e.key==='k')&&cur>0){e.preventDefault();go(cur-1);}
});

buildRail();
go(0);
</script>
</body>
