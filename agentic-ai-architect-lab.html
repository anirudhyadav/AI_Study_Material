<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Agentic AI Architect Lab — AY</title>
<style>
:root{
  --navy:#0a0f1e;--navy2:#111827;--navy3:#1a2236;--navy4:#243050;--navy5:#2d3a56;
  --teal:#00d4c8;--teal2:#00a89e;--tealb:rgba(0,212,200,.08);
  --amber:#f59e0b;--amber2:#b45309;--amberb:rgba(245,158,11,.08);
  --purple:#a78bfa;--purpleb:rgba(167,139,250,.08);
  --green:#34d399;--greenb:rgba(52,211,153,.08);
  --coral:#f87171;--coralb:rgba(248,113,113,.08);
  --blue:#60a5fa;--blueb:rgba(96,165,250,.08);
  --t1:#e8eaf0;--t2:#8b94ab;--t3:#4a5568;
  --bd:#1e2d45;--bd2:#2d4060;
  --mono:'Courier New',Courier,monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--navy);color:var(--t1);font-family:var(--sans);font-size:13px;}
::-webkit-scrollbar{width:5px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--navy5);border-radius:3px;}

/* HEADER */
.hdr{height:52px;background:var(--navy2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:200;}
.logo{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--navy);flex-shrink:0;}
.hdr-info{flex:1;}
.hdr-title{font-size:13px;font-weight:700;}
.hdr-sub{font-size:10px;color:var(--t3);margin-top:1px;}
.hdr-pills{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;max-width:600px;}
.hpill{padding:3px 9px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--navy3);color:var(--t3);transition:all .15s;letter-spacing:.2px;}
.hpill:hover{border-color:var(--bd2);color:var(--t2);}
.hpill.on{background:var(--tealb);border-color:var(--teal);color:var(--teal);}

/* LAYOUT */
.body{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;overflow:hidden;}

.ai{padding:10px 11px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all .15s;}
.ai:hover{background:var(--navy3);border-color:var(--bd);}
.ai.on{background:var(--purpleb);border-color:var(--purple);}
.ai-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.ai-title{font-size:12px;font-weight:700;color:var(--t1);margin:2px 0;}
.ai.on .ai-num{color:var(--purple);}
.ai.on .ai-title{color:var(--purple);}
.ai-why{font-size:10px;color:var(--t3);line-height:1.4;}

/* RAIL */
.rail{width:252px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--bd);overflow-y:auto;padding:10px 8px;}
.rail-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);padding:8px 8px 6px;}
.rail-lbl:first-child{padding-top:4px;}
.si{padding:10px 11px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;transition:all .15s;}
.si:hover{background:var(--navy3);border-color:var(--bd);}
.si.on{background:var(--tealb);border-color:var(--teal);}
.si-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.si-title{font-size:12px;font-weight:700;color:var(--t1);margin:2px 0;}
.si.on .si-num{color:var(--teal);}
.si.on .si-title{color:var(--teal);}
.si-why{font-size:10px;color:var(--t3);line-height:1.4;}
.rail-divider{height:1px;background:var(--bd);margin:10px 4px;position:relative;}
.rail-divider span{position:absolute;top:-7px;left:8px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);background:var(--navy2);padding:0 5px;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.stage-hdr{padding:14px 18px 10px;background:var(--navy2);border-bottom:1px solid var(--bd);flex-shrink:0;}
.sh-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
.sh-num{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.2);padding:2px 7px;border-radius:4px;}
.sh-title{font-size:15px;font-weight:700;color:var(--t1);}
.sh-desc{font-size:12px;color:var(--t2);line-height:1.55;max-width:760px;}
.sh-meta{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap;}
.sh-meta span{font-size:10px;color:var(--t3);}
.sh-meta strong{font-family:var(--mono);color:var(--t2);}
.tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;letter-spacing:.2px;}
.tc{background:var(--tealb);color:var(--teal);}
.ta{background:var(--amberb);color:var(--amber);}
.tp{background:var(--purpleb);color:var(--purple);}
.tg{background:var(--greenb);color:var(--green);}
.tr{background:var(--coralb);color:var(--coral);}
.tb{background:var(--blueb);color:var(--blue);}

.code-area,.arch-area{flex:1;overflow-y:auto;padding:16px 18px 22px;}

/* USE CASE BANNER */
.usecase{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:8px;padding:11px 14px;margin-bottom:14px;}
.usecase-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);margin-bottom:4px;}
.usecase-text{font-size:11.5px;color:var(--t2);line-height:1.6;}

/* CODE BLOCK */
.cb{background:var(--navy);border:1px solid var(--bd);border-radius:8px;overflow:hidden;position:relative;margin-bottom:14px;}
.cb-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 13px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.cb-left{display:flex;align-items:center;gap:10px;}
.cb-lang{font-size:10px;color:var(--t3);font-family:var(--mono);}
.cb-file{font-size:10px;color:var(--t2);font-family:var(--mono);}
.cb-copy{font-size:9px;font-weight:700;padding:2px 9px;border-radius:4px;background:var(--navy4);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;font-family:var(--sans);transition:all .15s;}
.cb-copy:hover{color:var(--t1);border-color:var(--teal);}
pre{padding:16px;font-family:var(--mono);font-size:11.5px;line-height:1.8;overflow-x:auto;white-space:pre;}

/* syntax */
.kw{color:#c792ea;}.fn{color:#82aaff;}.cls{color:#ffcb6b;}
.st{color:#c3e88d;}.cm{color:#546e7a;font-style:italic;}
.nm{color:#f78c6c;}.dc{color:#89ddff;}.im{color:#c792ea;}
.bi{color:#f78c6c;}

/* DIAGRAM */
.diag-box{background:var(--navy);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.diag-title{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);padding:8px 14px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.diag-box svg{display:block;}

/* WHAT'S NEW / NOTES */
.wn{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:8px;padding:13px 15px;}
.wn-title{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;}
.wn-body{font-size:12px;color:var(--t2);line-height:1.7;}
.wn-body li{margin-bottom:4px;padding-left:4px;}
.wn-body code{font-family:var(--mono);font-size:11px;background:var(--navy3);padding:1px 5px;border-radius:3px;color:var(--teal);}
.inst{margin-top:10px;background:var(--navy);border:1px solid var(--bd);border-radius:6px;padding:10px 14px;font-family:var(--mono);font-size:11px;color:var(--green);}
.inst-lbl{font-size:9px;color:var(--t3);font-family:var(--sans);margin-bottom:4px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}

/* ARCHITECT: decision card, tradeoff table, failure card, metric card, checklist, Q&A */
.ah-top{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap;}
.ah-num{font-size:10px;font-family:var(--mono);color:var(--purple);background:var(--purpleb);border:1px solid rgba(167,139,250,.2);padding:2px 7px;border-radius:4px;}
.ah-title{font-size:15px;font-weight:700;color:var(--t1);}
.ah-desc{font-size:12px;color:var(--t2);line-height:1.55;max-width:760px;}
.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.dc{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;padding:14px;}
.dc-scenario{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.dc-choice{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:5px;}
.dc-why{font-size:11px;color:var(--t2);line-height:1.6;margin-bottom:6px;}
.dc-not{font-size:10px;color:var(--coral);line-height:1.5;}
.dc-not strong{font-weight:700;}
.tt{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px;}
.tt th{background:var(--navy3);color:var(--t3);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 11px;text-align:left;border-bottom:1px solid var(--bd);}
.tt td{padding:8px 11px;border-bottom:1px solid var(--bd);color:var(--t2);vertical-align:top;line-height:1.5;}
.tt tr:last-child td{border-bottom:none;}
.tt td:first-child{color:var(--t1);font-weight:600;font-size:12px;}
.tt tr:hover td{background:var(--navy3);}
.good{color:var(--green);}.ok{color:var(--amber);}.bad{color:var(--coral);}
.section-h{font-size:11px;font-weight:700;color:var(--t2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
.fc{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--coral);border-radius:8px;padding:13px 15px;margin-bottom:10px;}
.fc-name{font-size:13px;font-weight:700;color:var(--coral);margin-bottom:4px;}
.fc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px;}
.fc-block{font-size:11px;line-height:1.6;}
.fc-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);margin-bottom:3px;}
.mc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.mc{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;padding:14px;}
.mc-name{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:4px;}
.mc-formula{font-family:var(--mono);font-size:10px;color:var(--amber);background:var(--navy3);padding:4px 8px;border-radius:4px;margin-bottom:6px;}
.mc-desc{font-size:11px;color:var(--t2);line-height:1.6;}
.mc-good{font-size:10px;color:var(--green);margin-top:5px;}
.cl-section{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px;}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:11px;color:var(--t2);line-height:1.5;}
.cl-item:last-child{border-bottom:none;}
.cl-check{width:14px;height:14px;border-radius:3px;background:var(--greenb);border:1px solid rgba(52,211,153,.3);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--green);}
.cl-req{font-size:9px;font-weight:700;letter-spacing:.3px;padding:1px 5px;border-radius:3px;margin-left:auto;flex-shrink:0;}
.req-p0{background:var(--coralb);color:var(--coral);}
.req-p1{background:var(--amberb);color:var(--amber);}
.req-p2{background:var(--greenb);color:var(--green);}
.qa-item{background:var(--navy2);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;overflow:hidden;}
.qa-q{padding:12px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:background .15s;}
.qa-q:hover{background:var(--navy3);}
.qa-q.open{background:var(--navy3);border-bottom:1px solid var(--bd);}
.qa-qnum{font-size:10px;font-family:var(--mono);color:var(--amber);flex-shrink:0;margin-top:1px;}
.qa-qtext{font-size:12px;font-weight:600;color:var(--t1);flex:1;line-height:1.5;}
.qa-arrow{color:var(--t3);font-size:12px;flex-shrink:0;transition:transform .2s;}
.qa-q.open .qa-arrow{transform:rotate(90deg);}
.qa-a{padding:14px;display:none;font-size:11px;color:var(--t2);line-height:1.7;}
.qa-a.open{display:block;}
.qa-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-bottom:8px;display:inline-block;}
.qa-wf{background:var(--tealb);color:var(--teal);}
.qa-arch{background:var(--amberb);color:var(--amber);}
.qa-prod{background:var(--purpleb);color:var(--purple);}

/* INLINE Q&A PANEL (ask sidebar) */
.sugs-qa .qa-item{margin-bottom:6px;border-radius:6px;}
.sugs-qa .qa-q{padding:8px 9px;gap:6px;}
.sugs-qa .qa-qnum{font-size:9px;}
.sugs-qa .qa-qtext{font-size:11px;line-height:1.4;}
.sugs-qa .qa-a{padding:10px;}
.qa-diagram{background:var(--navy);border:1px solid var(--bd);border-radius:6px;padding:6px 4px;margin-bottom:8px;}
.qa-mnemonic{font-size:10.5px;font-weight:600;color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.18);border-radius:5px;padding:6px 9px;margin-bottom:8px;line-height:1.4;}
.qa-answer-text{font-size:11px;color:var(--t2);line-height:1.65;}

/* INFRA MATURITY STAGES (A5) */
.infra-pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.infra-pill{padding:6px 13px;border-radius:18px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--navy3);color:var(--t3);transition:all .15s;}
.infra-pill:hover{border-color:var(--bd2);color:var(--t2);}
.infra-pill.on{background:var(--tealb);border-color:var(--teal);color:var(--teal);}
.infra-stage-hdr{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap;}
.infra-stage-title{font-size:13px;font-weight:700;color:var(--t1);}
.infra-stage-desc{font-size:11.5px;color:var(--t2);line-height:1.55;margin-bottom:12px;}
.infra-whatchanged{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:8px;padding:11px 14px;margin-top:12px;}
.infra-whatchanged-title{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--amber);margin-bottom:6px;}
.infra-whatchanged-body{font-size:11.5px;color:var(--t2);line-height:1.65;}
.infra-whatchanged-body code{font-family:var(--mono);font-size:10.5px;background:var(--navy3);padding:1px 5px;border-radius:3px;color:var(--teal);}
.info-box{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:8px;padding:13px 15px;margin-bottom:12px;}
.info-title{font-size:11px;font-weight:700;color:var(--teal);margin-bottom:6px;}
.info-body{font-size:11px;color:var(--t2);line-height:1.7;}
.info-body li{margin-bottom:3px;padding-left:2px;}

/* ASK PANEL */
.ask{width:284px;flex-shrink:0;background:var(--navy2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.ask-hdr{padding:11px 13px;border-bottom:1px solid var(--bd);}
.ask-hdr-t{font-size:12px;font-weight:700;color:var(--purple);}
.ask-hdr-s{font-size:10px;color:var(--t3);margin-top:1px;}
.ask-body{flex:1;overflow-y:auto;padding:10px 11px 4px;}
.sugs{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.sug{background:var(--navy3);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;font-size:10px;color:var(--t2);cursor:pointer;text-align:left;font-family:var(--sans);transition:all .15s;line-height:1.4;}
.sug:hover{border-color:var(--bd2);color:var(--t1);}
.msg{margin-bottom:8px;}
.who{font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--t3);text-transform:uppercase;margin-bottom:2px;}
.bbl{padding:7px 9px;border-radius:6px;font-size:11px;line-height:1.6;}
.bbl-u{background:var(--navy4);color:var(--t1);border-radius:6px 6px 2px 6px;}
.bbl-a{background:var(--purpleb);border:1px solid rgba(167,139,250,.12);color:var(--t1);border-radius:6px 6px 6px 2px;}
.ask-ft{padding:7px 9px;border-top:1px solid var(--bd);}
.ask-row{display:flex;gap:5px;align-items:flex-end;}
.ask-inp{flex:1;background:var(--navy3);border:1px solid var(--bd);border-radius:5px;color:var(--t1);font-family:var(--sans);font-size:11px;padding:6px 8px;resize:none;outline:none;height:38px;transition:border-color .15s;}
.ask-inp:focus{border-color:var(--teal2);}
.ask-btn{flex-shrink:0;padding:6px 10px;background:var(--teal);color:var(--navy);border:none;border-radius:5px;font-weight:700;font-size:12px;cursor:pointer;}
.ask-btn:hover{background:var(--teal2);}
.sp{display:inline-block;width:10px;height:10px;border:2px solid var(--bd2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:3px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">AY</div>
  <div class="hdr-info">
    <div class="hdr-title">Agentic AI Architect Lab</div>
    <div class="hdr-sub">LangGraph · Patterns → Multi-Agent → Infrastructure → Architect Prep</div>
  </div>
  <div class="hdr-pills" id="hdrPills"></div>
</div>

<div class="body">
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="stage-hdr" id="stageHdr"></div>
    <div class="code-area" id="codeArea"></div>
  </div>
  <div class="ask">
    <div class="ask-hdr">
      <div class="ask-hdr-t">Ask Claude</div>
      <div class="ask-hdr-s" id="askSub">Section-aware · Claims AI context</div>
    </div>
    <div class="ask-body" id="askBody"><div class="sugs" id="sugs"></div></div>
    <div class="ask-ft">
      <div class="ask-row">
        <textarea class="ask-inp" id="askInp" placeholder="Ask about this section…"></textarea>
        <button class="ask-btn" onclick="sendAsk()">→</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  PATTERNS — P1 to P6
// ═══════════════════════════════════════════════════════
const PATTERNS = [

{
num:'P1', title:'ReAct — Reason + Act', filename:'p1_react_langgraph.py',
desc:'Single agent interleaves reasoning and tool calls in a loop: Thought → Action → Observation → repeat until it has enough information to answer. The simplest agentic pattern and the foundation for everything else.',
tags:[{l:'Single agent',c:'tc'},{l:'Tool loop',c:'ta'},{l:'Debuggable',c:'tg'}],
install:'pip install langgraph langchain-anthropic',
usecase:'Claims triage: agent receives a claim ID, reasons about what it needs (policy details, loss estimate), calls tools to fetch each, and produces a recommendation — all in one traceable loop.',
wn:['<code>AgentState</code> carries <code>messages</code> list — full ReAct history','<code>should_continue()</code> conditional edge checks if the LLM requested a tool call','<code>tool_node</code> executes the requested tool and appends the result as an observation','Loop continues until the LLM responds without a tool call — that\'s the final answer','<code>recursion_limit</code> prevents infinite loops — hard cap at 10 iterations'],
code:`<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END, MessagesState
<span class="im">from</span> langgraph.prebuilt <span class="im">import</span> ToolNode
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> langchain_core.tools <span class="im">import</span> tool


<span class="cm"># ── Tools the agent can call ────────────────────────────────</span>
<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">policy_lookup</span>(claim_id: <span class="cls">str</span>) -> <span class="cls">dict</span>:
    <span class="st">"""Fetch policy coverage details for a claim ID."""</span>
    <span class="cm"># In production: query pgvector / policy DB</span>
    <span class="kw">return</span> {<span class="st">"claim_id"</span>: claim_id, <span class="st">"coverage_limit"</span>: <span class="nm">250000</span>, <span class="st">"deductible"</span>: <span class="nm">5000</span>}

<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">calculate_recovery</span>(loss_amount: <span class="cls">float</span>, recovery_rate: <span class="cls">float</span>, deductible: <span class="cls">float</span>) -> <span class="cls">dict</span>:
    <span class="st">"""Calculate net recovery amount after deductible."""</span>
    gross = loss_amount * recovery_rate
    net   = max(<span class="nm">0</span>, gross - deductible)
    <span class="kw">return</span> {<span class="st">"gross_recovery"</span>: gross, <span class="st">"net_recovery"</span>: net}

tools = [policy_lookup, calculate_recovery]


<span class="cm"># ── LLM bound with tools ────────────────────────────────────</span>
llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>).bind_tools(tools)


<span class="cm"># ── Nodes ───────────────────────────────────────────────────</span>
<span class="kw">def</span> <span class="fn">agent_node</span>(state: MessagesState) -> MessagesState:
    <span class="st">"""THOUGHT: reason over messages, decide next action."""</span>
    response = llm.invoke(state[<span class="st">"messages"</span>])
    <span class="kw">return</span> {<span class="st">"messages"</span>: [response]}

tool_node = ToolNode(tools)   <span class="cm"># ACTION + OBSERVATION in one prebuilt node</span>


<span class="cm"># ── Conditional edge: loop or finish ───────────────────────</span>
<span class="kw">def</span> <span class="fn">should_continue</span>(state: MessagesState) -> <span class="cls">str</span>:
    last = state[<span class="st">"messages"</span>][-<span class="nm">1</span>]
    <span class="cm"># If LLM requested a tool call, keep looping</span>
    <span class="kw">if</span> <span class="bi">getattr</span>(last, <span class="st">"tool_calls"</span>, <span class="kw">None</span>):
        <span class="kw">return</span> <span class="st">"tools"</span>
    <span class="kw">return</span> END   <span class="cm"># LLM gave a final answer — stop</span>


<span class="cm"># ── Build the graph ─────────────────────────────────────────</span>
workflow = StateGraph(MessagesState)
workflow.add_node(<span class="st">"agent"</span>, agent_node)
workflow.add_node(<span class="st">"tools"</span>, tool_node)
workflow.set_entry_point(<span class="st">"agent"</span>)
workflow.add_conditional_edges(<span class="st">"agent"</span>, should_continue, {<span class="st">"tools"</span>: <span class="st">"tools"</span>, END: END})
workflow.add_edge(<span class="st">"tools"</span>, <span class="st">"agent"</span>)   <span class="cm"># back to THOUGHT after OBSERVATION</span>

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke(
        {<span class="st">"messages"</span>: [(<span class="st">"user"</span>, <span class="st">"Process claim WF-2024-8821: verify coverage and calculate recovery for a $32,500 water damage loss."</span>)]},
        config={<span class="st">"recursion_limit"</span>: <span class="nm">10</span>},   <span class="cm"># hard cap — prevents infinite loop</span>
    )
    <span class="bi">print</span>(result[<span class="st">"messages"</span>][-<span class="nm">1</span>].content)`
},

{
num:'P2', title:'Plan-and-Execute', filename:'p2_plan_execute_langgraph.py',
desc:'A planner LLM decomposes the task into discrete steps upfront. An executor then runs each step independently, optionally replanning if a step fails or reveals new information. Better than ReAct for long-horizon, multi-step tasks where upfront structure beats reactive looping.',
tags:[{l:'Planner node',c:'tc'},{l:'Executor loop',c:'ta'},{l:'Replanning',c:'tg'}],
install:'pip install langgraph langchain-anthropic',
usecase:'Multi-claim batch review: planner breaks "review all claims filed this week above $10K" into discrete per-claim steps, executor processes each, replans if a claim needs escalation.',
wn:['<code>PlanState</code> carries <code>plan</code> (list of steps), <code>past_steps</code>, <code>response</code>','<code>planner_node</code> calls LLM once to produce the full ordered step list','<code>executor_node</code> pops the next step, executes it (tool call or sub-agent), appends to <code>past_steps</code>','<code>replan_node</code>: after each step, LLM decides whether to continue, replan, or finish','Conditional edge <code>should_end()</code> routes to <code>END</code> when plan is exhausted or response is ready'],
code:`<span class="im">from</span> typing <span class="im">import</span> TypedDict, Annotated
<span class="im">import</span> operator
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> pydantic <span class="im">import</span> BaseModel, Field


<span class="cm"># ── Typed state ─────────────────────────────────────────────</span>
<span class="kw">class</span> PlanState(TypedDict):
    task:       <span class="cls">str</span>
    plan:       <span class="cls">list</span>[<span class="cls">str</span>]
    past_steps: Annotated[<span class="cls">list</span>[<span class="cls">tuple</span>], operator.add]   <span class="cm"># (step, result) pairs</span>
    response:   <span class="cls">str</span> | <span class="kw">None</span>


<span class="kw">class</span> Plan(BaseModel):
    steps: <span class="cls">list</span>[<span class="cls">str</span>] = Field(description=<span class="st">"Ordered steps to complete the task"</span>)

llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)
planner_llm = llm.with_structured_output(Plan)   <span class="cm"># forces structured plan output</span>


<span class="cm"># ── Planner node ────────────────────────────────────────────</span>
<span class="kw">def</span> <span class="fn">planner_node</span>(state: PlanState) -> PlanState:
    plan = planner_llm.invoke(
        <span class="st">f"Break this task into clear, executable steps:\n{state['task']}"</span>
    )
    <span class="kw">return</span> {<span class="st">"plan"</span>: plan.steps}


<span class="cm"># ── Executor node — runs ONE step at a time ────────────────</span>
<span class="kw">def</span> <span class="fn">executor_node</span>(state: PlanState) -> PlanState:
    step = state[<span class="st">"plan"</span>][<span class="nm">0</span>]
    <span class="cm"># In production: this would dispatch to a tool or sub-agent</span>
    result = llm.invoke(<span class="st">f"Execute this step: {step}\nContext so far: {state['past_steps']}"</span>)
    remaining_plan = state[<span class="st">"plan"</span>][<span class="nm">1</span>:]
    <span class="kw">return</span> {<span class="st">"plan"</span>: remaining_plan, <span class="st">"past_steps"</span>: [(step, result.content)]}


<span class="cm"># ── Replan node — decide continue / replan / finish ────────</span>
<span class="kw">def</span> <span class="fn">replan_node</span>(state: PlanState) -> PlanState:
    <span class="kw">if</span> <span class="kw">not</span> state[<span class="st">"plan"</span>]:   <span class="cm"># no steps left — synthesize final response</span>
        final = llm.invoke(
            <span class="st">f"Task: {state['task']}\nCompleted steps: {state['past_steps']}\n"</span>
            <span class="st">f"Write the final response."</span>
        )
        <span class="kw">return</span> {<span class="st">"response"</span>: final.content}
    <span class="kw">return</span> {}   <span class="cm"># more steps remain — loop continues</span>


<span class="cm"># ── Conditional edge ────────────────────────────────────────</span>
<span class="kw">def</span> <span class="fn">should_end</span>(state: PlanState) -> <span class="cls">str</span>:
    <span class="kw">return</span> END <span class="kw">if</span> state.get(<span class="st">"response"</span>) <span class="kw">else</span> <span class="st">"executor"</span>


<span class="cm"># ── Build graph ─────────────────────────────────────────────</span>
workflow = StateGraph(PlanState)
workflow.add_node(<span class="st">"planner"</span>,  planner_node)
workflow.add_node(<span class="st">"executor"</span>, executor_node)
workflow.add_node(<span class="st">"replan"</span>,   replan_node)
workflow.set_entry_point(<span class="st">"planner"</span>)
workflow.add_edge(<span class="st">"planner"</span>,  <span class="st">"executor"</span>)
workflow.add_edge(<span class="st">"executor"</span>, <span class="st">"replan"</span>)
workflow.add_conditional_edges(<span class="st">"replan"</span>, should_end, {<span class="st">"executor"</span>: <span class="st">"executor"</span>, END: END})

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke({
        <span class="st">"task"</span>: <span class="st">"Review all claims filed this week above $10,000 and flag any needing escalation."</span>,
        <span class="st">"plan"</span>: [], <span class="st">"past_steps"</span>: [], <span class="st">"response"</span>: <span class="kw">None</span>,
    }, config={<span class="st">"recursion_limit"</span>: <span class="nm">25</span>})
    <span class="bi">print</span>(result[<span class="st">"response"</span>])`
},

{
num:'P3', title:'Reflexion — Self-Critique Loop', filename:'p3_reflexion_langgraph.py',
desc:'Agent generates an answer, then critiques its own output against the original task, and revises if the critique finds issues. Episodic memory of past failures is fed back in, dramatically improving accuracy on complex reasoning tasks compared to single-shot generation.',
tags:[{l:'Self-critique',c:'tc'},{l:'Revision loop',c:'ta'},{l:'Episodic memory',c:'tg'}],
install:'pip install langgraph langchain-anthropic',
usecase:'Claims denial letter drafting: agent drafts a denial rationale, critiques it for tone, legal precision, and policy citation accuracy, revises until critique passes — critical when a poorly-worded denial creates regulatory risk.',
wn:['<code>ReflexionState</code> carries <code>draft</code>, <code>critique</code>, <code>revision_count</code>, <code>memory</code> (past failure patterns)','<code>generate_node</code>: produces initial draft, informed by <code>memory</code> of past mistakes','<code>critique_node</code>: separate LLM call scores the draft and lists specific issues','<code>route_after_critique()</code>: if critique says "PASS" or <code>revision_count</code> hits max (3), finish — else revise','<code>revise_node</code>: regenerates using the critique as explicit feedback','On success, the failure pattern (if any) is appended to <code>memory</code> for future runs'],
code:`<span class="im">from</span> typing <span class="im">import</span> TypedDict
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic


<span class="kw">class</span> ReflexionState(TypedDict):
    task:            <span class="cls">str</span>
    draft:           <span class="cls">str</span> | <span class="kw">None</span>
    critique:        <span class="cls">str</span> | <span class="kw">None</span>
    verdict:         <span class="cls">str</span>          <span class="cm"># "PASS" | "REVISE"</span>
    revision_count:  <span class="cls">int</span>
    memory:          <span class="cls">list</span>[<span class="cls">str</span>]    <span class="cm"># past failure patterns, persists across runs</span>

llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)


<span class="cm"># ── Generate (informed by past failure memory) ─────────────</span>
<span class="kw">def</span> <span class="fn">generate_node</span>(state: ReflexionState) -> ReflexionState:
    memory_str = <span class="st">"\n"</span>.join(<span class="st">f"- {m}"</span> <span class="kw">for</span> m <span class="kw">in</span> state[<span class="st">"memory"</span>]) <span class="kw">or</span> <span class="st">"None"</span>
    prior_feedback = state.get(<span class="st">"critique"</span>) <span class="kw">or</span> <span class="st">""</span>
    resp = llm.invoke(
        <span class="st">f"Task: {state['task']}\n\n"</span>
        <span class="st">f"Known failure patterns to avoid:\n{memory_str}\n\n"</span>
        <span class="st">f"{'Previous critique: ' + prior_feedback if prior_feedback else ''}\n\n"</span>
        <span class="st">f"Write the response."</span>
    )
    <span class="kw">return</span> {<span class="st">"draft"</span>: resp.content}


<span class="cm"># ── Critique — a SEPARATE call acting as a strict reviewer ─</span>
<span class="kw">def</span> <span class="fn">critique_node</span>(state: ReflexionState) -> ReflexionState:
    resp = llm.invoke(
        <span class="st">f"You are a strict compliance reviewer. Task: {state['task']}\n\n"</span>
        <span class="st">f"Draft:\n{state['draft']}\n\n"</span>
        <span class="st">f"Critique for: legal precision, correct policy citation, appropriate tone. "</span>
        <span class="st">f"Reply 'PASS' if acceptable, or list specific issues to fix."</span>
    )
    text   = resp.content
    verdict = <span class="st">"PASS"</span> <span class="kw">if</span> text.strip().upper().startswith(<span class="st">"PASS"</span>) <span class="kw">else</span> <span class="st">"REVISE"</span>
    <span class="kw">return</span> {<span class="st">"critique"</span>: text, <span class="st">"verdict"</span>: verdict, <span class="st">"revision_count"</span>: state[<span class="st">"revision_count"</span>] + <span class="nm">1</span>}


<span class="cm"># ── Routing: pass, revise, or hit max revisions ────────────</span>
<span class="kw">def</span> <span class="fn">route_after_critique</span>(state: ReflexionState) -> <span class="cls">str</span>:
    <span class="kw">if</span> state[<span class="st">"verdict"</span>] == <span class="st">"PASS"</span> <span class="kw">or</span> state[<span class="st">"revision_count"</span>] >= <span class="nm">3</span>:
        <span class="kw">return</span> END
    <span class="kw">return</span> <span class="st">"generate"</span>   <span class="cm"># loop back with critique as feedback</span>


<span class="cm"># ── Build graph ─────────────────────────────────────────────</span>
workflow = StateGraph(ReflexionState)
workflow.add_node(<span class="st">"generate"</span>, generate_node)
workflow.add_node(<span class="st">"critique"</span>, critique_node)
workflow.set_entry_point(<span class="st">"generate"</span>)
workflow.add_edge(<span class="st">"generate"</span>, <span class="st">"critique"</span>)
workflow.add_conditional_edges(<span class="st">"critique"</span>, route_after_critique, {<span class="st">"generate"</span>: <span class="st">"generate"</span>, END: END})

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke({
        <span class="st">"task"</span>: <span class="st">"Draft a denial letter for claim WF-2024-9012: water damage not covered under policy exclusion 4.2(b)."</span>,
        <span class="st">"draft"</span>: <span class="kw">None</span>, <span class="st">"critique"</span>: <span class="kw">None</span>, <span class="st">"verdict"</span>: <span class="st">""</span>,
        <span class="st">"revision_count"</span>: <span class="nm">0</span>, <span class="st">"memory"</span>: [<span class="st">"Always cite the exact policy clause number"</span>],
    })
    <span class="bi">print</span>(<span class="st">f"Final draft ({result['revision_count']} revisions):\n{result['draft']}"</span>)`
},

{
num:'P4', title:'Tool-use Agent — Parallel Dispatch', filename:'p4_tool_use_langgraph.py',
desc:'Beyond single sequential tool calls — this pattern has the agent identify multiple independent sub-tasks and dispatch tool calls in parallel, then merge results. Critical for latency when a task naturally decomposes into independent lookups.',
tags:[{l:'Parallel tools',c:'tc'},{l:'Fan-out/fan-in',c:'ta'},{l:'Result merge',c:'tg'}],
install:'pip install langgraph langchain-anthropic',
usecase:'Claims summary dashboard: a single query "summarize claim WF-8821" needs policy lookup, loss history, prior payouts, and fraud score — all independent, all fetched in parallel rather than sequentially.',
wn:['<code>fan_out_node</code>: LLM identifies independent sub-queries needed','LangGraph <code>Send</code> API dispatches N parallel branches dynamically — not a fixed graph shape','Each branch is an independent tool call node, runs concurrently','<code>fan_in_node</code>: collects all branch results via <code>Annotated[list, operator.add]</code> reducer','Total latency = max(branch latencies), not sum — critical win over sequential ReAct for independent lookups'],
code:`<span class="im">from</span> typing <span class="im">import</span> TypedDict, Annotated
<span class="im">import</span> operator
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END
<span class="im">from</span> langgraph.types <span class="im">import</span> Send
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> pydantic <span class="im">import</span> BaseModel


<span class="kw">class</span> FanState(TypedDict):
    query:        <span class="cls">str</span>
    subtasks:     <span class="cls">list</span>[<span class="cls">str</span>]
    results:      Annotated[<span class="cls">list</span>[<span class="cls">dict</span>], operator.add]   <span class="cm"># merged from parallel branches</span>
    summary:      <span class="cls">str</span> | <span class="kw">None</span>

<span class="kw">class</span> SubTasks(BaseModel):
    tasks: <span class="cls">list</span>[<span class="cls">str</span>]

llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)


<span class="cm"># ── Identify independent sub-tasks ─────────────────────────</span>
<span class="kw">def</span> <span class="fn">identify_subtasks</span>(state: FanState) -> FanState:
    parsed = llm.with_structured_output(SubTasks).invoke(
        <span class="st">f"List the independent data lookups needed for: {state['query']}\n"</span>
        <span class="st">f"e.g. policy_lookup, loss_history, prior_payouts, fraud_score"</span>
    )
    <span class="kw">return</span> {<span class="st">"subtasks"</span>: parsed.tasks}


<span class="cm"># ── Fan-out: dynamically dispatch N parallel branches ──────</span>
<span class="kw">def</span> <span class="fn">dispatch</span>(state: FanState) -> <span class="cls">list</span>[Send]:
    <span class="cm"># Send() creates a parallel branch per subtask — graph shape is dynamic</span>
    <span class="kw">return</span> [Send(<span class="st">"run_lookup"</span>, {<span class="st">"task"</span>: t, <span class="st">"query"</span>: state[<span class="st">"query"</span>]}) <span class="kw">for</span> t <span class="kw">in</span> state[<span class="st">"subtasks"</span>]]


<span class="cm"># ── Each branch runs independently and in parallel ─────────</span>
<span class="kw">def</span> <span class="fn">run_lookup</span>(branch_state: <span class="cls">dict</span>) -> FanState:
    task = branch_state[<span class="st">"task"</span>]
    <span class="cm"># In production: route to the actual tool (policy DB, fraud model, etc.)</span>
    result = llm.invoke(<span class="st">f"Simulate calling tool '{task}' for: {branch_state['query']}"</span>)
    <span class="kw">return</span> {<span class="st">"results"</span>: [{<span class="st">"task"</span>: task, <span class="st">"output"</span>: result.content}]}


<span class="cm"># ── Fan-in: merge all parallel results into one summary ────</span>
<span class="kw">def</span> <span class="fn">fan_in_node</span>(state: FanState) -> FanState:
    merged = <span class="st">"\n\n"</span>.join(<span class="st">f"[{r['task']}]\n{r['output']}"</span> <span class="kw">for</span> r <span class="kw">in</span> state[<span class="st">"results"</span>])
    summary = llm.invoke(<span class="st">f"Synthesize these parallel lookup results into one summary:\n\n{merged}"</span>)
    <span class="kw">return</span> {<span class="st">"summary"</span>: summary.content}


<span class="cm"># ── Build graph with dynamic fan-out ────────────────────────</span>
workflow = StateGraph(FanState)
workflow.add_node(<span class="st">"identify"</span>,   identify_subtasks)
workflow.add_node(<span class="st">"run_lookup"</span>, run_lookup)
workflow.add_node(<span class="st">"fan_in"</span>,     fan_in_node)
workflow.set_entry_point(<span class="st">"identify"</span>)
workflow.add_conditional_edges(<span class="st">"identify"</span>, dispatch, [<span class="st">"run_lookup"</span>])   <span class="cm"># Send-based fan-out</span>
workflow.add_edge(<span class="st">"run_lookup"</span>, <span class="st">"fan_in"</span>)
workflow.add_edge(<span class="st">"fan_in"</span>, END)

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke({
        <span class="st">"query"</span>: <span class="st">"Summarize claim WF-8821 — coverage, loss history, prior payouts, fraud risk"</span>,
        <span class="st">"subtasks"</span>: [], <span class="st">"results"</span>: [], <span class="st">"summary"</span>: <span class="kw">None</span>,
    })
    <span class="bi">print</span>(result[<span class="st">"summary"</span>])`
},

{
num:'P5', title:'Code Interpreter Agent', filename:'p5_code_interpreter_langgraph.py',
desc:'Agent generates code, executes it in a sandboxed environment, observes the result (output or error), and iterates until the code runs successfully or produces the desired output. Essential for data analysis, calculation-heavy tasks, and anything requiring deterministic computation an LLM cannot do reliably in its head.',
tags:[{l:'Sandbox exec',c:'tc'},{l:'Error-fix loop',c:'ta'},{l:'Deterministic',c:'tg'}],
install:'pip install langgraph langchain-anthropic e2b-code-interpreter',
usecase:'Claims actuarial calculations: agent writes Python to compute weighted recovery rates across a portfolio of claims, executes in sandbox, fixes errors, returns verified numeric output — far more reliable than asking the LLM to do arithmetic in text.',
wn:['<code>CodeState</code> carries <code>code</code>, <code>execution_result</code>, <code>error</code>, <code>attempt</code>','<code>generate_code_node</code>: LLM writes Python for the task','<code>execute_node</code>: runs code in an isolated sandbox (E2B, Modal, or subprocess with resource limits)','<code>route_after_execute()</code>: if error and <code>attempt</code> &lt; 3, go to <code>fix_code</code> — else finish','<code>fix_code_node</code>: LLM sees the traceback and rewrites the code — this is the self-healing loop','Sandbox isolation is non-negotiable in production — never <code>exec()</code> LLM-generated code directly in your process'],
code:`<span class="im">from</span> typing <span class="im">import</span> TypedDict
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> e2b_code_interpreter <span class="im">import</span> Sandbox   <span class="cm"># isolated sandbox execution</span>


<span class="kw">class</span> CodeState(TypedDict):
    task:             <span class="cls">str</span>
    code:             <span class="cls">str</span> | <span class="kw">None</span>
    execution_result: <span class="cls">str</span> | <span class="kw">None</span>
    error:            <span class="cls">str</span> | <span class="kw">None</span>
    attempt:          <span class="cls">int</span>

llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)


<span class="cm"># ── Generate code for the task ──────────────────────────────</span>
<span class="kw">def</span> <span class="fn">generate_code_node</span>(state: CodeState) -> CodeState:
    error_context = <span class="st">f"\nPrevious attempt failed with:\n{state['error']}\nFix it."</span> <span class="kw">if</span> state.get(<span class="st">"error"</span>) <span class="kw">else</span> <span class="st">""</span>
    resp = llm.invoke(
        <span class="st">f"Write Python code to: {state['task']}{error_context}\n"</span>
        <span class="st">f"Return ONLY the code, no explanation."</span>
    )
    code = resp.content.strip().removeprefix(<span class="st">"\`\`\`python"</span>).removesuffix(<span class="st">"\`\`\`"</span>).strip()
    <span class="kw">return</span> {<span class="st">"code"</span>: code, <span class="st">"attempt"</span>: state[<span class="st">"attempt"</span>] + <span class="nm">1</span>}


<span class="cm"># ── Execute in an ISOLATED sandbox — never exec() in-process ─</span>
<span class="kw">def</span> <span class="fn">execute_node</span>(state: CodeState) -> CodeState:
    <span class="kw">with</span> Sandbox() <span class="kw">as</span> sbx:   <span class="cm"># fresh isolated VM per execution</span>
        execution = sbx.run_code(state[<span class="st">"code"</span>])
    <span class="kw">if</span> execution.error:
        <span class="kw">return</span> {<span class="st">"error"</span>: <span class="bi">str</span>(execution.error), <span class="st">"execution_result"</span>: <span class="kw">None</span>}
    <span class="kw">return</span> {<span class="st">"execution_result"</span>: <span class="bi">str</span>(execution.results), <span class="st">"error"</span>: <span class="kw">None</span>}


<span class="cm"># ── Route: retry on error (max 3 attempts) or finish ────────</span>
<span class="kw">def</span> <span class="fn">route_after_execute</span>(state: CodeState) -> <span class="cls">str</span>:
    <span class="kw">if</span> state[<span class="st">"error"</span>] <span class="kw">and</span> state[<span class="st">"attempt"</span>] < <span class="nm">3</span>:
        <span class="kw">return</span> <span class="st">"fix"</span>
    <span class="kw">return</span> END


<span class="cm"># ── Build graph ─────────────────────────────────────────────</span>
workflow = StateGraph(CodeState)
workflow.add_node(<span class="st">"generate"</span>, generate_code_node)
workflow.add_node(<span class="st">"execute"</span>,  execute_node)
workflow.add_node(<span class="st">"fix"</span>,      generate_code_node)   <span class="cm"># reuse same node — error context drives the fix</span>
workflow.set_entry_point(<span class="st">"generate"</span>)
workflow.add_edge(<span class="st">"generate"</span>, <span class="st">"execute"</span>)
workflow.add_conditional_edges(<span class="st">"execute"</span>, route_after_execute, {<span class="st">"fix"</span>: <span class="st">"fix"</span>, END: END})
workflow.add_edge(<span class="st">"fix"</span>, <span class="st">"execute"</span>)

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:

        <span class="st">"task"</span>: <span class="st">"Compute the weighted average recovery rate across claims: [(32500,0.78),(18000,0.65),(41200,0.82)]"</span>,
        <span class="st">"code"</span>: <span class="kw">None</span>, <span class="st">"execution_result"</span>: <span class="kw">None</span>, <span class="st">"error"</span>: <span class="kw">None</span>, <span class="st">"attempt"</span>: <span class="nm">0</span>,
    })
    <span class="bi">print</span>(<span class="st">f"Result after {result['attempt']} attempt(s):\n{result['execution_result']}"</span>)`
},

{
num:'P6', title:'Computer Use Agent', filename:'p6_computer_use_langgraph.py',
desc:'Agent controls a browser or desktop directly — takes a screenshot, decides an action (click, type, scroll), executes it, observes the new screenshot, and repeats. Claude\'s native computer-use capability slots into a LangGraph loop the same way any other tool does.',
tags:[{l:'Screenshot loop',c:'tc'},{l:'Browser/desktop',c:'ta'},{l:'Action grounding',c:'tg'}],
install:'pip install langgraph langchain-anthropic playwright',
usecase:'Legacy claims portal automation: many insurers still run claims intake on legacy web portals with no API. A computer-use agent navigates the portal directly — screenshot, click, type — to extract claim data without needing portal-side integration work.',
wn:['<code>ComputerState</code> carries <code>screenshot</code> (base64), <code>action_history</code>, <code>task_complete</code>','<code>observe_node</code>: captures current screenshot via Playwright','<code>decide_node</code>: sends screenshot + task to Claude with the <code>computer_use</code> tool — model returns a grounded action (click coordinates, text to type)','<code>act_node</code>: executes the action via Playwright (click, type, scroll, screenshot)','Loop continues until model signals <code>task_complete</code> — hard cap of 20 steps to bound cost and runaway sessions','Every action is logged with coordinates and screenshot hash — critical audit trail since the agent is taking real UI actions'],
code:`<span class="im">from</span> typing <span class="im">import</span> TypedDict
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END
<span class="im">from</span> anthropic <span class="im">import</span> Anthropic
<span class="im">from</span> playwright.sync_api <span class="im">import</span> sync_playwright
<span class="im">import</span> base64, structlog

log = structlog.get_logger()


<span class="kw">class</span> ComputerState(TypedDict):
    task:           <span class="cls">str</span>
    screenshot_b64: <span class="cls">str</span> | <span class="kw">None</span>
    action_history: <span class="cls">list</span>[<span class="cls">dict</span>]
    task_complete:  <span class="cls">bool</span>
    step_count:     <span class="cls">int</span>

client = Anthropic()
playwright_ctx = sync_playwright().start()
browser = playwright_ctx.chromium.launch()
page    = browser.new_page()


<span class="cm"># ── Observe: capture current screen state ──────────────────</span>
<span class="kw">def</span> <span class="fn">observe_node</span>(state: ComputerState) -> ComputerState:
    screenshot = page.screenshot()
    <span class="kw">return</span> {<span class="st">"screenshot_b64"</span>: base64.b64encode(screenshot).decode()}


<span class="cm"># ── Decide: Claude sees the screenshot, returns a grounded action ─</span>
<span class="kw">def</span> <span class="fn">decide_node</span>(state: ComputerState) -> ComputerState:
    resp = client.messages.create(
        model=<span class="st">"claude-sonnet-4-6"</span>,
        max_tokens=<span class="nm">1024</span>,
        tools=[{<span class="st">"type"</span>: <span class="st">"computer_20250124"</span>, <span class="st">"name"</span>: <span class="st">"computer"</span>,
                <span class="st">"display_width_px"</span>: <span class="nm">1280</span>, <span class="st">"display_height_px"</span>: <span class="nm">800</span>}],
        messages=[{<span class="st">"role"</span>: <span class="st">"user"</span>, <span class="st">"content"</span>: [
            {<span class="st">"type"</span>: <span class="st">"text"</span>, <span class="st">"text"</span>: <span class="st">f"Task: {state['task']}\nHistory: {state['action_history']}"</span>},
            {<span class="st">"type"</span>: <span class="st">"image"</span>, <span class="st">"source"</span>: {<span class="st">"type"</span>: <span class="st">"base64"</span>, <span class="st">"media_type"</span>: <span class="st">"image/png"</span>,
                                       <span class="st">"data"</span>: state[<span class="st">"screenshot_b64"</span>]}},
        ]}],
    )
    tool_use = <span class="bi">next</span>((b <span class="kw">for</span> b <span class="kw">in</span> resp.content <span class="kw">if</span> b.type == <span class="st">"tool_use"</span>), <span class="kw">None</span>)
    <span class="kw">if</span> tool_use <span class="kw">is</span> <span class="kw">None</span>:   <span class="cm"># model gave a text response — task is done</span>
        <span class="kw">return</span> {<span class="st">"task_complete"</span>: <span class="kw">True</span>}
    <span class="kw">return</span> {<span class="st">"action_history"</span>: state[<span class="st">"action_history"</span>] + [tool_use.input]}


<span class="cm"># ── Act: execute the grounded action via Playwright ────────</span>
<span class="kw">def</span> <span class="fn">act_node</span>(state: ComputerState) -> ComputerState:
    action = state[<span class="st">"action_history"</span>][-<span class="nm">1</span>]
    log.info(<span class="st">"computer_action"</span>, action=action, step=state[<span class="st">"step_count"</span>])   <span class="cm"># audit log</span>
    <span class="kw">if</span> action[<span class="st">"action"</span>] == <span class="st">"left_click"</span>:
        page.mouse.click(*action[<span class="st">"coordinate"</span>])
    <span class="kw">elif</span> action[<span class="st">"action"</span>] == <span class="st">"type"</span>:
        page.keyboard.type(action[<span class="st">"text"</span>])
    <span class="kw">elif</span> action[<span class="st">"action"</span>] == <span class="st">"scroll"</span>:
        page.mouse.wheel(<span class="nm">0</span>, action.get(<span class="st">"scroll_amount"</span>, <span class="nm">300</span>))
    <span class="kw">return</span> {<span class="st">"step_count"</span>: state[<span class="st">"step_count"</span>] + <span class="nm">1</span>}


<span class="cm"># ── Route: continue, or stop on completion / step limit ────</span>
<span class="kw">def</span> <span class="fn">route_after_decide</span>(state: ComputerState) -> <span class="cls">str</span>:
    <span class="kw">if</span> state[<span class="st">"task_complete"</span>] <span class="kw">or</span> state[<span class="st">"step_count"</span>] >= <span class="nm">20</span>:
        <span class="kw">return</span> END
    <span class="kw">return</span> <span class="st">"act"</span>


<span class="cm"># ── Build graph ─────────────────────────────────────────────</span>
workflow = StateGraph(ComputerState)
workflow.add_node(<span class="st">"observe"</span>, observe_node)
workflow.add_node(<span class="st">"decide"</span>,  decide_node)
workflow.add_node(<span class="st">"act"</span>,     act_node)
workflow.set_entry_point(<span class="st">"observe"</span>)
workflow.add_edge(<span class="st">"observe"</span>, <span class="st">"decide"</span>)
workflow.add_conditional_edges(<span class="st">"decide"</span>, route_after_decide, {<span class="st">"act"</span>: <span class="st">"act"</span>, END: END})
workflow.add_edge(<span class="st">"act"</span>, <span class="st">"observe"</span>)   <span class="cm"># loop: new screenshot after every action</span>

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    page.goto(<span class="st">"https://legacy-claims-portal.internal/search"</span>)
    result = app.invoke({
        <span class="st">"task"</span>: <span class="st">"Search for claim WF-8821 and extract the loss amount and adjuster name."</span>,
        <span class="st">"screenshot_b64"</span>: <span class="kw">None</span>, <span class="st">"action_history"</span>: [],
        <span class="st">"task_complete"</span>: <span class="kw">False</span>, <span class="st">"step_count"</span>: <span class="nm">0</span>,
    }, config={<span class="st">"recursion_limit"</span>: <span class="nm">50</span>})
    <span class="bi">print</span>(<span class="st">f"Completed in {result['step_count']} steps"</span>)`
},

{
num:'M1', title:'Orchestrator-Worker', filename:'m1_orchestrator_worker.py',
desc:'A supervisor agent receives the task, decides which specialized worker agent(s) to invoke, and routes between them dynamically based on the conversation state. Each worker is a complete sub-graph with its own tools and scope. The most common production multi-agent pattern.',
tags:[{l:'Supervisor LLM',c:'tc'},{l:'Specialized workers',c:'ta'},{l:'Dynamic routing',c:'tg'}],
install:'pip install langgraph langchain-anthropic',
usecase:'Claims Orchestrator routes to Policy Agent (coverage questions), Recovery Calculator Agent (financial math), or Audit Agent (compliance checks) — each worker has narrow scope and its own tool set, the supervisor just routes.',
wn:['<code>SupervisorState</code> carries <code>messages</code> and <code>next_agent</code> (which worker to call next)','<code>supervisor_node</code>: LLM with structured output decides which worker handles the current need, or <code>FINISH</code>','Each worker (<code>policy_agent</code>, <code>recovery_agent</code>, <code>audit_agent</code>) is a separate ReAct sub-graph compiled independently','<code>route_to_worker()</code> conditional edge maps the supervisor\'s decision to the corresponding worker node','After a worker completes, control returns to the supervisor — not directly to another worker — keeping routing centralized and auditable'],
code:`<span class="im">from</span> typing <span class="im">import</span> TypedDict, Literal
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END, MessagesState
<span class="im">from</span> langgraph.prebuilt <span class="im">import</span> create_react_agent
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> pydantic <span class="im">import</span> BaseModel
<span class="im">from</span> langchain_core.tools <span class="im">import</span> tool

llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)


<span class="cm"># ── Worker tools (abbreviated — each worker has its own set) ─</span>
<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">lookup_coverage</span>(claim_id: <span class="cls">str</span>) -> <span class="cls">dict</span>:
    <span class="st">"""Policy coverage lookup."""</span>
    <span class="kw">return</span> {<span class="st">"coverage_limit"</span>: <span class="nm">250000</span>, <span class="st">"deductible"</span>: <span class="nm">5000</span>}

<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">calculate_recovery</span>(loss: <span class="cls">float</span>, rate: <span class="cls">float</span>) -> <span class="cls">float</span>:
    <span class="st">"""Recovery calculation."""</span>
    <span class="kw">return</span> loss * rate

<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">check_compliance</span>(claim_id: <span class="cls">str</span>) -> <span class="cls">dict</span>:
    <span class="st">"""SR 11-7 compliance check on a claim decision."""</span>
    <span class="kw">return</span> {<span class="st">"compliant"</span>: <span class="kw">True</span>, <span class="st">"flags"</span>: []}


<span class="cm"># ── Each worker is a complete, independently-scoped ReAct agent ─</span>
policy_agent   = create_react_agent(llm, tools=[lookup_coverage])
recovery_agent = create_react_agent(llm, tools=[calculate_recovery])
audit_agent    = create_react_agent(llm, tools=[check_compliance])


<span class="cm"># ── Supervisor decides routing via structured output ───────</span>
<span class="kw">class</span> Route(BaseModel):
    next: Literal[<span class="st">"policy"</span>, <span class="st">"recovery"</span>, <span class="st">"audit"</span>, <span class="st">"FINISH"</span>]

supervisor_llm = llm.with_structured_output(Route)

SUPERVISOR_PROMPT = <span class="st">"""You route Claims AI requests to the right specialist:
- policy: coverage and policy detail questions
- recovery: financial calculations
- audit: compliance and SR 11-7 checks
- FINISH: when the user's request has been fully addressed
Conversation so far: {messages}
Who should act next?"""</span>

<span class="kw">def</span> <span class="fn">supervisor_node</span>(state: MessagesState) -> <span class="cls">dict</span>:
    decision = supervisor_llm.invoke(SUPERVISOR_PROMPT.format(messages=state[<span class="st">"messages"</span>]))
    <span class="kw">return</span> {<span class="st">"next"</span>: decision.next}


<span class="cm"># ── Worker nodes call their sub-graph and report back ──────</span>
<span class="kw">def</span> <span class="fn">make_worker_node</span>(agent_graph):
    <span class="kw">def</span> <span class="fn">_node</span>(state: MessagesState) -> MessagesState:
        result = agent_graph.invoke({<span class="st">"messages"</span>: state[<span class="st">"messages"</span>]})
        <span class="kw">return</span> {<span class="st">"messages"</span>: result[<span class="st">"messages"</span>]}
    <span class="kw">return</span> _node


<span class="cm"># ── Build the supervisor graph ──────────────────────────────</span>
<span class="kw">class</span> SupervisorState(MessagesState):
    next: <span class="cls">str</span>

workflow = StateGraph(SupervisorState)
workflow.add_node(<span class="st">"supervisor"</span>, supervisor_node)
workflow.add_node(<span class="st">"policy"</span>,     make_worker_node(policy_agent))
workflow.add_node(<span class="st">"recovery"</span>,   make_worker_node(recovery_agent))
workflow.add_node(<span class="st">"audit"</span>,      make_worker_node(audit_agent))
workflow.set_entry_point(<span class="st">"supervisor"</span>)
workflow.add_conditional_edges(<span class="st">"supervisor"</span>, <span class="kw">lambda</span> s: s[<span class="st">"next"</span>],
    {<span class="st">"policy"</span>: <span class="st">"policy"</span>, <span class="st">"recovery"</span>: <span class="st">"recovery"</span>, <span class="st">"audit"</span>: <span class="st">"audit"</span>, <span class="st">"FINISH"</span>: END})
<span class="cm"># Workers always return to supervisor — centralized, auditable routing</span>
workflow.add_edge(<span class="st">"policy"</span>,   <span class="st">"supervisor"</span>)
workflow.add_edge(<span class="st">"recovery"</span>, <span class="st">"supervisor"</span>)
workflow.add_edge(<span class="st">"audit"</span>,    <span class="st">"supervisor"</span>)

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke({
        <span class="st">"messages"</span>: [(<span class="st">"user"</span>, <span class="st">"For claim WF-8821: check coverage, calculate recovery on a $32,500 loss, and verify compliance."</span>)],
        <span class="st">"next"</span>: <span class="st">""</span>,
    }, config={<span class="st">"recursion_limit"</span>: <span class="nm">15</span>})
    <span class="bi">print</span>(result[<span class="st">"messages"</span>][-<span class="nm">1</span>].content)`
},

{
num:'M2', title:'Hierarchical Multi-Agent', filename:'m2_hierarchical_langgraph.py',
desc:'Scales beyond flat orchestrator-worker. A top-level manager routes to domain managers (Claims, Recovery, Compliance), each of which is itself a supervisor over a set of specialized workers. Each layer is a complete LangGraph subgraph compiled and nested inside the parent graph.',

install:'pip install langgraph langchain-anthropic',

code:`<span class="im">from</span> typing <span class="im">import</span> Literal
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END, MessagesState

<span class="cm"># ════════════════════════════════════════════════════

<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">intake_claim</span>(details: <span class="cls">str</span>) -> <span class="cls">dict</span>: <span class="kw">return</span> {<span class="st">"status"</span>: <span class="st">"intaken"</span>}
<span class="dc">@tool</span>
<span class="kw">def</span> <span class="fn">triage_claim</span>(claim_id: <span class="cls">str</span>) -> <span class="cls">dict</span>: <span class="kw">return</span> {<span class="st">"priority"</span>: <span class="st">"high"</span>}

intake_agent = create_react_agent(llm, tools=[intake_claim])
triage_agent = create_react_agent(llm, tools=[triage_claim])

<span class="kw">class</span> ClaimsRoute(BaseModel):
    next: Literal[<span class="st">"intake"</span>, <span class="st">"triage"</span>, <span class="st">"FINISH"</span>]

<span class="kw">def</span> <span class="fn">claims_manager_node</span>(state: MessagesState) -> <span class="cls">dict</span>:

claims_domain = StateGraph(MessagesState)

claims_domain_app = claims_domain.compile()   <span class="cm"># compiled — now a reusable unit</span>

recovery_agent = create_react_agent(llm, tools=[calculate_payout])
recovery_domain = StateGraph(MessagesState)
recovery_domain.add_node(<span class="st">"calculate"</span>, <span class="kw">lambda</span> s: recovery_agent.invoke(s))
recovery_domain.set_entry_point(<span class="st">"calculate"</span>)
recovery_domain.add_edge(<span class="st">"calculate"</span>, END)
recovery_domain_app = recovery_domain.compile()


<span class="cm"># ════════════════════════════════════════════════════
# LAYER 1 — Top-level manager routes between domains
# ════════════════════════════════════════════════════</span>
<span class="kw">class</span> TopRoute(BaseModel):
    next: Literal[<span class="st">"claims_domain"</span>, <span class="st">"recovery_domain"</span>, <span class="st">"FINISH"</span>]

<span class="kw">def</span> <span class="fn">top_manager_node</span>(state: MessagesState) -> <span class="cls">dict</span>:

<span class="kw">class</span> TopState(MessagesState):

top_workflow = StateGraph(TopState)

<span class="cm"># A compiled subgraph IS a node — nesting is native to LangGraph</span>

top_workflow.add_edge(<span class="st">"claims_domain"</span>,   <span class="st">"manager"</span>)
top_workflow.add_edge(<span class="st">"recovery_domain"</span>, <span class="st">"manager"</span>)

app = top_workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke({

    }, config={<span class="st">"recursion_limit"</span>: <span class="nm">20</span>})

{
num:'M3', title:'Handoff Protocol', filename:'m3_handoff_protocol.py',
desc:'When agents need to transfer control directly to each other (not back through a central supervisor), you need an explicit handoff protocol: what state transfers, what context is summarized vs passed in full, and how the receiving agent knows why it was invoked. This is the pattern behind OpenAI Swarm and LangGraph\'s Command-based handoffs.',
tags:[{l:'Direct transfer',c:'tc'},{l:'Command primitive',c:'ta'},{l:'Context handoff',c:'tg'}],
install:'pip install langgraph langchain-anthropic',
usecase:'Claims escalation: the Policy Agent realizes mid-conversation that a question is actually a fraud concern — it hands off directly to the Fraud Agent with a structured handoff payload, rather than routing back through a general supervisor and losing context.',
wn:['LangGraph\'s <code>Command</code> object lets a node directly specify both a state update AND the next node to go to — bypassing the supervisor for lateral handoffs','<code>handoff_tool</code>: a special tool definition that, when called, triggers a <code>Command(goto=target_agent)</code> instead of returning a normal tool result','Handoff payload includes <code>reason</code> (why control is transferring) and <code>context_summary</code> (compressed history, not full transcript) — keeps the receiving agent\'s context window lean','This differs from M1 Orchestrator-Worker: here agents transfer control to EACH OTHER, not back to a central router — useful when the handoff logic is domain knowledge the specialist agent has, not the generalist supervisor','Audit consideration: every handoff must still be logged for SR 11-7 — <code>Command</code> handoffs are easy to lose track of without explicit logging at the handoff_tool call site'],
code:`<span class="im">from</span> typing <span class="im">import</span> Annotated
<span class="im">from</span> langgraph.graph <span class="im">import</span> StateGraph, END, MessagesState
<span class="im">from</span> langgraph.types <span class="im">import</span> Command
<span class="im">from</span> langgraph.prebuilt <span class="im">import</span> InjectedState
<span class="im">from</span> langchain_anthropic <span class="im">import</span> ChatAnthropic
<span class="im">from</span> langchain_core.tools <span class="im">import</span> tool, InjectedToolCallId
<span class="im">import</span> structlog

log = structlog.get_logger()
llm = ChatAnthropic(model=<span class="st">"claude-sonnet-4-6"</span>)


<span class="cm"># ── Handoff tool factory — creates a tool that transfers control ─</span>
<span class="kw">def</span> <span class="fn">make_handoff_tool</span>(*, target_agent: <span class="cls">str</span>):
    <span class="dc">@tool</span>(<span class="st">f"transfer_to_{target_agent}"</span>, description=<span class="st">f"Transfer control to {target_agent} when their expertise is needed."</span>)
    <span class="kw">def</span> <span class="fn">handoff</span>(
        reason: <span class="cls">str</span>,
        context_summary: <span class="cls">str</span>,
        state: Annotated[<span class="cls">dict</span>, InjectedState],
        tool_call_id: Annotated[<span class="cls">str</span>, InjectedToolCallId],
    ) -> Command:
        log.info(<span class="st">"agent_handoff"</span>, target=target_agent, reason=reason)   <span class="cm"># SR 11-7 audit</span>
        tool_msg = {<span class="st">"role"</span>: <span class="st">"tool"</span>, <span class="st">"content"</span>: <span class="st">f"Transferred to {target_agent}: {reason}"</span>,
                    <span class="st">"tool_call_id"</span>: tool_call_id}
        <span class="cm"># Command does TWO things: updates state AND specifies the next node</span>
        <span class="kw">return</span> Command(
            goto=target_agent,
            update={<span class="st">"messages"</span>: state[<span class="st">"messages"</span>] + [tool_msg],
                    <span class="st">"handoff_context"</span>: context_summary},
        )
    <span class="kw">return</span> handoff


<span class="cm"># ── Policy agent — can hand off to fraud_agent directly ────</span>
transfer_to_fraud = make_handoff_tool(target_agent=<span class="st">"fraud_agent"</span>)

<span class="kw">def</span> <span class="fn">policy_agent_node</span>(state: MessagesState):
    llm_with_handoff = llm.bind_tools([transfer_to_fraud])   <span class="cm"># + normal policy tools</span>
    response = llm_with_handoff.invoke(
        [{<span class="st">"role"</span>: <span class="st">"system"</span>, <span class="st">"content"</span>:
          <span class="st">"You handle policy questions. If you detect potential fraud indicators "</span>
          <span class="st">"(inconsistent dates, inflated amounts, repeat claimant), transfer to fraud_agent."</span>}]
        + state[<span class="st">"messages"</span>]
    )
    <span class="kw">return</span> {<span class="st">"messages"</span>: [response]}


<span class="cm"># ── Fraud agent — receives the handoff context directly ────</span>
<span class="kw">def</span> <span class="fn">fraud_agent_node</span>(state: MessagesState):
    handoff_ctx = state.get(<span class="st">"handoff_context"</span>, <span class="st">""</span>)
    response = llm.invoke(
        [{<span class="st">"role"</span>: <span class="st">"system"</span>, <span class="st">"content"</span>:
          <span class="st">f"You are the Fraud Investigation agent. Context from policy agent: {handoff_ctx}"</span>}]
        + state[<span class="st">"messages"</span>]
    )
    <span class="kw">return</span> {<span class="st">"messages"</span>: [response]}


<span class="cm"># ── Build graph — note: NO supervisor needed for the handoff itself ─</span>
<span class="kw">class</span> HandoffState(MessagesState):
    handoff_context: <span class="cls">str</span>

workflow = StateGraph(HandoffState)
workflow.add_node(<span class="st">"policy_agent"</span>, policy_agent_node)
workflow.add_node(<span class="st">"fraud_agent"</span>,  fraud_agent_node)
workflow.set_entry_point(<span class="st">"policy_agent"</span>)
<span class="cm"># Command(goto=...) inside policy_agent_node handles the routing dynamically —</span>
<span class="cm"># no explicit conditional_edges call needed for the handoff path itself</span>
workflow.add_edge(<span class="st">"fraud_agent"</span>, END)

app = workflow.compile()


<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    result = app.invoke({
        <span class="st">"messages"</span>: [(<span class="st">"user"</span>, <span class="st">"Claim WF-7734 has a loss date after the policy cancellation date — please review coverage."</span>)],
        <span class="st">"handoff_context"</span>: <span class="st">""</span>,
    })
    <span class="bi">print</span>(result[<span class="st">"messages"</span>][-<span class="nm">1</span>].content)`
},
