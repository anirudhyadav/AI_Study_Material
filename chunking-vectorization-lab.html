s what gets embedded:\n    embed_text = f\"{summary}\\n{questions}\\n{chunk_text}\"\n\n    return {\n        \"embed_text\":   embed_text,   # goes to the embedder\n        \"return_text\":  chunk_text,   # goes to the user / LLM\n        \"summary\":      summary,\n    }\n\n\nRAW = (\n    \"Enterprise refunds are pro-rated and processed within 5-7 \"\n    \"business days to the original payment method.\"\n)\n# Augmented embed_text now also matches:\n#   \"how long till I get my money back\"\n#   \"when is my enterprise refund paid\"", "qs": [{"q": "Why embed a summary instead of just the raw chunk?", "mnemonic": "Match intent, not just words", "steps": ["Raw chunk: technical", "User: casual phrasing", "Summary bridges", "Vector matches intent"], "a": "Raw technical text uses different vocabulary than a casual user query, so their vectors sit far apart. Prepending a plain-language summary of what the chunk answers pulls its embedding toward how real users actually phrase questions. The chunk becomes reachable by intent-level and paraphrased queries that the raw text alone would never match."}, {"q": "Why keep the original text as the returned content?", "mnemonic": "Embed enriched, return original", "steps": ["Augment for search", "Match improves", "Return raw text", "LLM sees clean source"], "a": "The augmentation exists only to improve matching \u2014 the summary and hypothetical questions are scaffolding. You embed the enriched string but return the original chunk to the LLM, so generation works from the clean authoritative source, not from a paraphrase that might have drifted. Search representation and content representation are deliberately separated."}, {"q": "What's the cost-benefit of this technique?", "mnemonic": "Pay once, recall forever", "steps": ["LLM call per chunk", "Ingest cost up", "Recall lasting gain", "Worth it for key corpora"], "a": "You pay an LLM call per chunk at ingest, raising ingestion cost and time. In return you get a durable lift in retrieval recall on natural-language queries \u2014 paid once, benefiting every future query. It's worth it for high-traffic or high-value corpora where missed retrievals are costly, and skippable for low-value bulk text."}], "isArch": false}, {"num": "PR1", "group": "Production", "title": "Chunking Pipeline Architecture", "filename": "pr1_pipeline.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Architecture", "c": "tc"}], "desc": "A production chunking pipeline is a staged flow: load, clean, route by type, chunk, enrich, embed, index \u2014 each stage isolated, testable, and observable. This is the backbone everything else plugs into.", "usecase": "Your ingestion handles PDFs, Markdown, HTML, and code from dozens of sources nightly. A staged pipeline routes each document to the right chunker, enriches, embeds with caching, and upserts \u2014 reliably and observably.", "install": "pip install langchain langchain-openai pydantic", "wn": ["Stage the flow: load -> clean -> route -> chunk -> enrich -> embed -> index, each independently testable", "Route by document type: code goes to the AST chunker, Markdown to the header chunker, and so on", "Make every stage observable \u2014 log counts and timings so you can find where a bad batch went wrong", "Idempotent upserts keyed by content hash mean re-running the pipeline is safe and only-changed-cost", "Separate the chunking strategy from the pipeline plumbing so you can swap strategies without a rewrite"], "code_plain": "from dataclasses import dataclass\nfrom typing import Callable, Protocol\n\n\nclass Chunker(Protocol):\n    def __call__(self, text: str) -> list[str]: ...\n\n\n@dataclass\nclass Document:\n    doc_id: str\n    text:   str\n    kind:   str          # \"markdown\" | \"code\" | \"html\" | \"text\"\n    source: str\n\n\ndef route_chunker(kind: str, registry: dict[str, Chunker]) -> Chunker:\n    \"\"\"Pick the chunker for this document type; fall back to recursive.\"\"\"\n    return registry.get(kind, registry[\"text\"])\n\n\ndef run_pipeline(\n    docs: list[Document],\n    registry: dict[str, Chunker],\n    enrich: Callable[[str], str],\n    embed: Callable[[list[str]], list[list[float]]],\n    upsert: Callable[[list[dict]], None],\n) -> dict:\n    \"\"\"Staged, observable, idempotent ingestion pipeline.\"\"\"\n    stats = {\"docs\": 0, \"chunks\": 0}\n\n    for doc in docs:\n        chunker = route_chunker(doc.kind, registry)     # ROUTE\n        pieces  = chunker(doc.text)                      # CHUNK\n        enriched = [enrich(p) for p in pieces]           # ENRICH\n        vectors  = embed(enriched)                       # EMBED (cached)\n\n        records = [\n            {\"doc_id\": doc.doc_id, \"index\": i,\n             \"text\": p, \"vector\": v, \"source\": doc.source}\n            for i, (p, v) in enumerate(zip(pieces, vectors))\n        ]\n        upsert(records)                                  # INDEX (idempotent)\n\n        stats[\"docs\"]   += 1\n        stats[\"chunks\"] += len(records)\n\n    return stats", "qs": [{"q": "Why route documents by type to different chunkers?", "mnemonic": "Right tool per format", "steps": ["Code -> AST", "Markdown -> headers", "HTML -> DOM", "Text -> recursive"], "a": "Each document type has structure a specialised chunker exploits: code needs AST boundaries, Markdown has headers, HTML has a DOM, plain text needs recursive splitting. Routing each document to the matching chunker means every format is chunked optimally instead of forcing one strategy on all. A registry with a sensible fallback keeps this clean and extensible."}, {"q": "Why make upserts idempotent by content hash?", "mnemonic": "Re-run safely, change-only cost", "steps": ["Pipeline re-runs", "Hash unchanged", "Skip or overwrite", "No duplicates"], "a": "Ingestion pipelines get re-run \u2014 on schedule, after a crash, or on partial failure. Keying upserts by content hash means re-processing an unchanged chunk overwrites the same record rather than creating a duplicate, and combined with a cache it costs nothing. Re-running the whole pipeline is safe and cheap, which is essential for operational reliability."}, {"q": "Why separate chunking strategy from pipeline plumbing?", "mnemonic": "Swap strategy, keep plumbing", "steps": ["Strategy in registry", "Plumbing stays fixed", "Swap chunker", "No rewrite"], "a": "The load/clean/embed/index plumbing is stable; the chunking strategy evolves as you learn what works. Keeping strategy behind a simple Chunker interface in a registry lets you swap or A/B a new chunker without touching the pipeline. This separation is what lets you improve retrieval quality iteratively without risky rewrites of the whole ingestion path."}], "isArch": false}, {"num": "PR2", "group": "Production", "title": "Incremental Re-chunking", "filename": "pr2_incremental.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Efficiency", "c": "tg"}], "desc": "When a source document changes, re-chunking the entire corpus is wasteful. Incremental re-chunking diffs old versus new chunks by content hash and only re-embeds and re-indexes what actually changed.", "usecase": "A single clause in a 200-page policy is edited. Instead of re-embedding all 4,000 chunks, incremental re-chunking detects the 3 changed chunks, re-embeds only those, and deletes the stale ones.", "install": "pip install numpy", "wn": ["Compute content hashes for the new chunk set and compare against the stored hashes", "Three sets emerge: unchanged (skip), new (embed + insert), removed (delete from index)", "Only new and changed chunks hit the embedder \u2014 cost scales with the size of the edit, not the document", "Delete orphaned vectors whose source chunks no longer exist to prevent stale retrievals", "Track a document version so you can roll back or audit exactly what changed and when"], "code_plain": "import hashlib\n\n\ndef chunk_hash(text: str) -> str:\n    return hashlib.sha256(\" \".join(text.split()).lower().encode()).hexdigest()\n\n\ndef diff_chunks(\n    old_hashes: set[str],\n    new_chunks: list[str],\n) -> dict[str, list]:\n    \"\"\"\n    Compare new chunks against stored hashes.\n    Returns what to embed, what to delete, what to skip.\n    \"\"\"\n    new_hashed = {chunk_hash(c): c for c in new_chunks}\n    new_hashes = set(new_hashed.keys())\n\n    to_insert = [new_hashed[h] for h in (new_hashes - old_hashes)]  # NEW\n    to_delete = list(old_hashes - new_hashes)                       # REMOVED\n    unchanged = new_hashes & old_hashes                             # SKIP\n\n    return {\n        \"to_insert\": to_insert,   # embed + upsert these\n        \"to_delete\": to_delete,   # remove these stale vectors\n        \"unchanged\": list(unchanged),\n    }\n\n\ndef apply_incremental(diff: dict, embed, index) -> dict:\n    \"\"\"Embed only new chunks; delete only stale ones.\"\"\"\n    if diff[\"to_delete\"]:\n        index.delete(ids=diff[\"to_delete\"])\n\n    inserted = 0\n    if diff[\"to_insert\"]:\n        vectors = embed(diff[\"to_insert\"])          # only the changes\n        index.upsert(list(zip(diff[\"to_insert\"], vectors)))\n        inserted = len(vectors)\n\n    return {\n        \"inserted\": inserted,\n        \"deleted\":  len(diff[\"to_delete\"]),\n        \"skipped\":  len(diff[\"unchanged\"]),\n    }", "qs": [{"q": "How does incremental re-chunking scale cost with edit size?", "mnemonic": "Pay for the diff, not the doc", "steps": ["Diff old vs new", "3 chunks changed", "Embed 3, not 4000", "Cost tracks edit"], "a": "By diffing new chunk hashes against stored ones, only genuinely new or changed chunks are embedded and indexed. Editing one clause in a huge document produces a handful of changed chunks, so you embed a handful \u2014 not the whole corpus. Cost and time scale with the size of the edit, making frequent re-indexing of large documents practical."}, {"q": "Why delete orphaned vectors?", "mnemonic": "Stale chunks poison results", "steps": ["Old chunk removed", "Vector remains", "Retrieves stale text", "Delete orphans"], "a": "When source text is removed or rewritten, its old vector lingers in the index unless explicitly deleted. That orphaned vector can still be retrieved, surfacing outdated or contradictory content in answers \u2014 dangerous for a policy corpus. The diff's removed-set tells you exactly which vectors to delete so the index never serves text that no longer exists in the source."}, {"q": "Why track a document version?", "mnemonic": "Audit and roll back", "steps": ["Version each change", "Know what changed", "Roll back if needed", "Audit trail"], "a": "A version stamp on each re-chunking pass records exactly what changed and when, giving you an audit trail and the ability to roll back to a prior state. In regulated finance this is essential \u2014 you must be able to prove which version of a policy was in effect and retrievable at any point in time, and reconstruct it if challenged."}], "isArch": false}, {"num": "PR3", "group": "Production", "title": "Chunk Quality Evaluation", "filename": "pr3_evaluation.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Metrics", "c": "ta"}], "desc": "You can't improve what you don't measure. Chunk quality evaluation runs a labelled query set against your index and scores retrieval with hit rate, MRR, and context precision \u2014 turning chunking from guesswork into a tuned parameter.", "usecase": "Before shipping a new chunking strategy for the refund corpus, you run 200 labelled questions through both the old and new index and compare hit rate and MRR \u2014 proving the change actually improves retrieval.", "install": "pip install numpy", "wn": ["Build a labelled eval set: questions paired with the chunk id(s) that truly answer them", "Hit rate @k: fraction of queries where a correct chunk appears in the top k results", "MRR (mean reciprocal rank): rewards putting the correct chunk higher in the ranking", "Context precision: of the retrieved chunks, what fraction are actually relevant \u2014 measures noise", "Evaluate every chunking change against the same set so improvements are provable, not anecdotal"], "code_plain": "import numpy as np\n\n\ndef hit_rate_at_k(results: list[list[str]], relevant: list[set[str]], k: int) -> float:\n    \"\"\"Fraction of queries with a relevant chunk in the top-k.\"\"\"\n    hits = 0\n    for retrieved, gold in zip(results, relevant):\n        if any(doc_id in gold for doc_id in retrieved[:k]):\n            hits += 1\n    return hits / len(results)\n\n\ndef mrr(results: list[list[str]], relevant: list[set[str]]) -> float:\n    \"\"\"Mean reciprocal rank of the first relevant chunk.\"\"\"\n    total = 0.0\n    for retrieved, gold in zip(results, relevant):\n        for rank, doc_id in enumerate(retrieved, start=1):\n            if doc_id in gold:\n                total += 1.0 / rank\n                break\n    return total / len(results)\n\n\ndef context_precision(results: list[list[str]], relevant: list[set[str]], k: int) -> float:\n    \"\"\"Of the top-k retrieved, what fraction are relevant (low noise).\"\"\"\n    precisions = []\n    for retrieved, gold in zip(results, relevant):\n        topk = retrieved[:k]\n        if topk:\n            hits = sum(1 for d in topk if d in gold)\n            precisions.append(hits / len(topk))\n    return float(np.mean(precisions)) if precisions else 0.0\n\n\ndef evaluate(strategy_name: str, results, relevant, k: int = 5) -> dict:\n    \"\"\"Score one chunking strategy on the labelled eval set.\"\"\"\n    return {\n        \"strategy\":          strategy_name,\n        \"hit_rate@k\":        round(hit_rate_at_k(results, relevant, k), 3),\n        \"mrr\":               round(mrr(results, relevant), 3),\n        \"context_precision\": round(context_precision(results, relevant, k), 3),\n    }", "qs": [{"q": "What does hit rate @k tell you that MRR doesn't?", "mnemonic": "Found it vs ranked it well", "steps": ["Hit rate: in top-k?", "MRR: how high?", "Hit = coverage", "MRR = ranking quality"], "a": "Hit rate @k asks a binary question: did a correct chunk appear anywhere in the top k? It measures coverage. MRR asks how high the first correct chunk was ranked \u2014 it measures ranking quality. A strategy can have high hit rate but poor MRR (finds the answer but buries it), so you need both: one for whether you retrieve it, one for how well you rank it."}, {"q": "What does context precision measure?", "mnemonic": "Signal vs noise in results", "steps": ["Top-k retrieved", "How many relevant?", "Rest is noise", "Precision = signal ratio"], "a": "Context precision measures, of the chunks you returned, what fraction are actually relevant. Low precision means the LLM receives mostly noise around the useful chunk, which wastes context and can mislead generation. It catches a failure mode the hit-rate metrics miss: you found the answer, but you also dragged in five irrelevant chunks that dilute it."}, {"q": "Why evaluate every change against the same labelled set?", "mnemonic": "Provable, not anecdotal", "steps": ["Same questions", "Old vs new", "Compare metrics", "Ship on evidence"], "a": "Running an identical labelled query set against both the old and new strategy gives an apples-to-apples comparison, so an improvement is provable rather than a hunch from spot-checking a few queries. It turns chunking into a tuned, measured parameter \u2014 you ship a change because the numbers moved, and you catch regressions before they reach production."}], "isArch": false}, {"num": "PR4", "group": "Production", "title": "Choosing Your Strategy", "filename": "pr4_decision_guide.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Capstone", "c": "tp"}, {"l": "Decision guide", "c": "ta"}], "desc": "The capstone: a decision function that maps your document type, query pattern, scale, and budget to the right chunking + vectorization strategy. This is the interview-ready synthesis of the whole lab.", "usecase": "An interviewer asks 'how would you chunk a mixed corpus of policies, code, and transcripts for a regulated RAG system?'. This decision guide is the structured, defensible answer \u2014 strategy chosen per constraint.", "install": "pip install langchain", "wn": ["Start from constraints: document structure, query type, corpus scale, latency and cost budget", "Structured docs -> structure-aware chunkers; unstructured -> semantic; code -> AST; high-value -> propositions", "Exact-match queries -> hybrid (dense + sparse); paraphrased queries -> summary-augmented dense", "Always add parent-child when the LLM needs more context than the precise match provides", "There is no universal best \u2014 the right answer is a defensible mapping from constraints to strategy"], "code_plain": "from dataclasses import dataclass\n\n\n@dataclass\nclass Constraints:\n    structured:      bool     # has headers / clear structure\n    is_code:         bool\n    query_is_exact:  bool     # IDs, codes, names vs paraphrased intent\n    high_value:      bool     # is max precision worth LLM ingest cost\n    needs_context:   bool     # does the LLM need more than the match\n\n\ndef recommend_strategy(c: Constraints) -> dict:\n    \"\"\"Map constraints to a chunking + vectorization strategy.\"\"\"\n\n    # 1) Chunking strategy\n    if c.is_code:\n        chunking = \"AST-based code chunking (ST2)\"\n    elif c.high_value:\n        chunking = \"Proposition chunking (SM3) - max precision\"\n    elif c.structured:\n        chunking = \"Structure-aware header/DOM chunking (ST1/ST3)\"\n    else:\n        chunking = \"Semantic chunking (SM1) - topic-shift boundaries\"\n\n    # 2) Add parent-child if generation needs broader context\n    if c.needs_context:\n        chunking += \" + Parent-Child (ME2)\"\n\n    # 3) Vectorization strategy\n    if c.query_is_exact:\n        vectorization = \"Hybrid dense + sparse with RRF (VE3)\"\n    else:\n        vectorization = \"Dense + summary augmentation (VE1 + ME3)\"\n\n    # 4) Always-on production concerns\n    production = [\n        \"Content-hash caching (VE5)\",\n        \"Incremental re-chunking (PR2)\",\n        \"Labelled eval set: hit rate + MRR (PR3)\",\n    ]\n\n    return {\n        \"chunking\":      chunking,\n        \"vectorization\": vectorization,\n        \"production\":    production,\n    }\n\n\n# Example: regulated policy corpus, paraphrased queries, needs context\nEXAMPLE = Constraints(\n    structured=True, is_code=False, query_is_exact=False,\n    high_value=True, needs_context=True,\n)\n# -> Proposition + Parent-Child, Dense + summary aug, full prod stack", "qs": [{"q": "What's the first question to ask when choosing a strategy?", "mnemonic": "Constraints before technique", "steps": ["Doc structure?", "Query type?", "Scale + budget?", "Then pick strategy"], "a": "Start from constraints, never from a favourite technique. What's the document structure \u2014 headers, code, freeform? What are the queries like \u2014 exact identifiers or paraphrased intent? What's the corpus scale and the latency/cost budget? The right strategy falls out of these answers. Leading with 'I'd use semantic chunking' before understanding constraints is the wrong instinct in an interview and in practice."}, {"q": "How do you choose between hybrid and dense-only vectorization?", "mnemonic": "Exact terms need sparse", "steps": ["Queries have IDs?", "Yes -> hybrid", "Paraphrased -> dense", "Match query pattern"], "a": "Look at the query pattern. If queries contain exact terms \u2014 codes, IDs, names \u2014 you need sparse retrieval alongside dense, so hybrid with RRF (VE3). If queries are paraphrased intent-level questions, dense embeddings with summary augmentation (ME3) serve better. Many production systems default to hybrid because real query streams mix both, and hybrid degrades gracefully when one signal is weak."}, {"q": "Why is there no universal best chunking strategy?", "mnemonic": "Best depends on constraints", "steps": ["Different docs", "Different queries", "Different budgets", "Mapping, not winner"], "a": "Each strategy optimises for different conditions: AST for code, semantic for unstructured, propositions for max precision at high cost, structure-aware for headed documents. The 'best' is whichever matches your specific document type, query pattern, scale, and budget. The mature answer \u2014 and the one interviewers want \u2014 is a defensible mapping from constraints to strategy, not a single silver bullet."}], "isArch": false}]

<script>
var S = JSON.parse(document.getElementById('D').textContent);

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Syntax highlighter — applied at render time on plain text
function hi(code){
  return code.split('\n').map(function(line){
    var l=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var ci=l.indexOf('#');var cmt='';
    if(ci>=0){cmt=l.slice(ci);l=l.slice(0,ci);}
    l=l.replace(/\b(from|import|class|def|return|if|else|elif|for|while|in|not|and|or|is|None|True|False|with|as|try|except|raise|pass|lambda|yield|break|continue|async|await|Protocol)\b/g,'<span class="kw">$1</span>');
    l=l.replace(/(@\w+)/g,'<span class="dc">$1</span>');
    l=l.replace(/\b(print|len|list|dict|str|int|float|bool|range|enumerate|zip|map|filter|sorted|getattr|hasattr|isinstance|type|super|set|tuple|sum|min|max|any|all|round)\b/g,'<span class="bi">$1</span>');
    l=l.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
    l=l.replace(/(f?["'](?:[^"'\\]|\\.)*["'])/g,'<span class="st">$1</span>');
    if(cmt)l=l+'<span class="cm">'+cmt+'</span>';
    return l;
  }).join('\n');
}

// Mini SVG for Q&A steps
function msvg(steps){
  var c=['#00d4c8','#f59e0b','#34d399','#f87171'];
  steps=steps||[];
  var bw=44,bh=22,gap=7,y=12,W=232;
  var total=steps.length*bw+(steps.length-1)*gap;
  var x0=(W-total)/2,o='<svg viewBox="0 0 '+W+' '+(bh+y+8)+'" width="100%">';
  steps.forEach(function(t,i){
    var x=x0+i*(bw+gap),col=c[i%c.length];
    o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="none" stroke="'+col+'" stroke-width="1.2"/>';
    o+='<text x="'+(x+bw/2)+'" y="'+(y+bh/2+4)+'" font-family="system-ui" font-size="7" fill="'+col+'" text-anchor="middle">'+esc(t)+'</text>';
    if(i<steps.length-1){var ax=x+bw+1,ay=y+bh/2;o+='<line x1="'+ax+'" y1="'+ay+'" x2="'+(ax+gap-2)+'" y2="'+ay+'" stroke="#2d3a56" stroke-width="1"/><polygon points="'+(ax+gap-2)+','+(ay-2.5)+' '+(ax+gap+2)+','+ay+' '+(ax+gap-2)+','+(ay+2.5)+'" fill="#2d3a56"/>';}
  });
  return o+'</svg>';
}

function qaCard(q,i,pfx){
  var id=pfx+'-'+i;
  return '<div class="qa-item"><div class="qa-q" onclick="tqa(\''+id+'\')">'
    +'<span class="qa-qn">Q'+(i+1)+'</span><span class="qa-qt">'+esc(q.q)+'</span>'
    +'<span class="qa-ar" id="a-'+id+'">&#8250;</span></div>'
    +'<div class="qa-body" id="b-'+id+'"><div class="qa-diag">'+msvg(q.steps)+'</div>'
    +'<div class="qa-mem">&#128161; '+esc(q.mnemonic)+'</div>'
    +'<div class="qa-ans">'+esc(q.a)+'</div></div></div>';
}

function tqa(id){
  var b=document.getElementById('b-'+id),a=document.getElementById('a-'+id);
  if(!b)return;
  var o=b.classList.toggle('open');
  if(a)a.classList.toggle('open',o);
}

// Rail
function buildRail(){
  var groups={},order=[];
  S.forEach(function(s,i){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group);}
    groups[s.group].push({s:s,i:i});
  });
  var h='';
  order.forEach(function(g){
    h+='<div class="rg">'+esc(g)+'</div>';
    groups[g].forEach(function(x){
      h+='<div class="si" id="si-'+x.i+'" onclick="go('+x.i+')">'
        +'<div class="si-num">'+esc(x.s.num)+'</div>'
        +'<div class="si-title">'+esc(x.s.title)+'</div></div>';
    });
  });
  document.getElementById('rail').innerHTML=h;
}

function renderCode(s,idx){
  var tags=(s.tags||[]).map(function(t){return '<span class="tag '+t.c+'">'+esc(t.l)+'</span>';}).join(' ');
  document.getElementById('shdr').innerHTML=
    '<div class="shdr-top"><span class="shdr-num">'+esc(s.num)+'</span>'
    +'<span class="shdr-title">'+esc(s.title)+'</span> '+tags+'</div>'
    +'<div class="shdr-desc">'+esc(s.desc)+'</div>';
  var wn=(s.wn||[]).map(function(w){return '<li>'+esc(w)+'</li>';}).join('');
  var pct=Math.round(((idx+1)/S.length)*100);
  document.getElementById('carea').innerHTML=
    '<div class="prog"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
    +'<div class="uc"><div class="uc-lbl">Enterprise Refund Policy — use case</div>'
    +'<div class="uc-text">'+esc(s.usecase)+'</div></div>'
    +'<div class="wn"><div class="wn-title">What\'s new in this section</div>'
    +'<ul class="wn-list">'+wn+'</ul>'
    +'<div class="wn-ilbl">Install</div>'
    +'<div class="wn-install">$ '+esc(s.install)+'</div></div>'
    +'<div class="cb"><div class="cb-bar">'
    +'<div><span class="cb-lang">python</span><span class="cb-file">'+esc(s.filename)+'</span></div>'
    +'<button class="cb-copy" onclick="cpCode()">Copy</button></div>'
    +'<pre id="cpre">'+hi(s.code_plain||'')+'</pre></div>';
}

function cpCode(){
  var p=document.getElementById('cpre');
  if(!p)return;
  navigator.clipboard.writeText(p.innerText).then(function(){
    var b=document.querySelector('.cb-copy');
    if(b){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy';},1800);}
  });
}

var cur=0;
function go(i){
  document.querySelectorAll('.si').forEach(function(el){el.classList.remove('on');});
  var el=document.getElementById('si-'+i);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  cur=i;
  var s=S[i];
  document.getElementById('carea').scrollTop=0;
  document.getElementById('rpsub').textContent=s.num+' · '+s.title;
  document.getElementById('rpbody').innerHTML=(s.qs||[]).map(function(q,j){return qaCard(q,j,s.num);}).join('');
  renderCode(s,i);
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.key==='ArrowDown'||e.key==='j')&&cur<S.length-1){e.preventDefault();go(cur+1);}
  if((e.key==='ArrowUp'||e.key==='k')&&cur>0){e.preventDefault();go(cur-1);}
});

buildRail();
go(0);
</script>
