<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chunking &amp; Vectorization Lab</title>
<style>
:root{
  --navy:#0a0f1e;--navy2:#111827;--navy3:#1a2236;--navy4:#243050;--navy5:#2d3a56;
  --teal:#00d4c8;--tealb:rgba(0,212,200,.1);
  --amber:#f59e0b;--amberb:rgba(245,158,11,.1);
  --purple:#a78bfa;--purpleb:rgba(167,139,250,.1);
  --green:#34d399;--greenb:rgba(52,211,153,.1);
  --coral:#f87171;--coralb:rgba(248,113,113,.1);
  --blue:#60a5fa;--blueb:rgba(96,165,250,.1);
  --t1:#e8eaf0;--t2:#8b94ab;--t3:#4a5568;
  --bd:#1e2d45;--bd2:#2d4060;
  --mono:'Courier New',Courier,monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--navy);color:var(--t1);font-family:var(--sans);font-size:13px;}
::-webkit-scrollbar{width:5px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--navy5);border-radius:3px;}
.hdr{height:48px;background:var(--navy2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--navy);flex-shrink:0;}
.hdr-title{font-size:13px;font-weight:700;}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--purpleb);border:1px solid rgba(167,139,250,.25);color:var(--purple);margin-left:6px;}
.hdr-sub{font-size:10px;color:var(--t3);margin-left:6px;}
.wrap{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;overflow:hidden;}
.rail{width:236px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--bd);overflow-y:auto;padding:6px 5px 16px;}
.rg{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);padding:10px 8px 4px;border-top:1px solid var(--bd);margin-top:4px;}
.rg:first-child{border-top:none;margin-top:0;}
.si{padding:7px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all .15s;}
.si:hover{background:var(--navy3);}
.si.on{background:var(--tealb);border-color:rgba(0,212,200,.4);}
.si-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.si-title{font-size:11px;font-weight:700;color:var(--t1);margin-top:2px;}
.si.on .si-num{color:var(--teal);}
.si.on .si-title{color:var(--teal);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.shdr{padding:10px 16px 8px;background:var(--navy2);border-bottom:1px solid var(--bd);flex-shrink:0;}
.shdr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.shdr-num{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.25);padding:2px 7px;border-radius:4px;}
.shdr-title{font-size:14px;font-weight:700;}
.shdr-desc{font-size:11px;color:var(--t2);line-height:1.55;max-width:760px;}
.tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;}
.tc{background:var(--tealb);color:var(--teal);}
.ta{background:var(--amberb);color:var(--amber);}
.tp{background:var(--purpleb);color:var(--purple);}
.tg{background:var(--greenb);color:var(--green);}
.tr{background:var(--coralb);color:var(--coral);}
.tb{background:var(--blueb);color:var(--blue);}
.carea{flex:1;overflow-y:auto;padding:12px 16px 20px;}
.prog{height:3px;background:var(--navy3);border-radius:2px;margin-bottom:12px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--purple));transition:width .3s;}
.uc{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:7px;padding:9px 12px;margin-bottom:10px;}
.uc-lbl{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--amber);margin-bottom:3px;}
.uc-text{font-size:11px;color:var(--t2);line-height:1.55;}
.wn{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:7px;padding:10px 12px;margin-bottom:10px;}
.wn-title{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
.wn-list{font-size:11px;color:var(--t2);line-height:1.7;padding-left:14px;}
.wn-list li{margin-bottom:2px;}
.wn-ilbl{font-size:9px;color:var(--t3);font-family:var(--sans);margin-top:7px;margin-bottom:2px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.wn-install{background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--green);}
.cb{background:var(--navy);border:1px solid var(--bd);border-radius:7px;overflow:hidden;margin-bottom:12px;}
.cb-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.cb-lang{font-size:10px;color:var(--t3);font-family:var(--mono);}
.cb-file{font-size:10px;color:var(--t2);font-family:var(--mono);margin-left:8px;}
.cb-copy{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--navy4);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;font-family:var(--sans);}
.cb-copy:hover{color:var(--teal);border-color:var(--teal);}
.cb pre{padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.8;overflow-x:auto;white-space:pre;color:var(--t1);margin:0;background:var(--navy);}
.kw{color:#c792ea;}.fn{color:#82aaff;}.cls{color:#ffcb6b;}.st{color:#c3e88d;}.cm{color:#546e7a;font-style:italic;}.nm{color:#f78c6c;}.dc{color:#89ddff;}.bi{color:#f78c6c;}
.rp{width:270px;flex-shrink:0;background:var(--navy2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.rp-hdr{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.rp-title{font-size:11px;font-weight:700;color:var(--purple);}
.rp-sub{font-size:9px;color:var(--t3);margin-top:1px;}
.rp-body{flex:1;overflow-y:auto;padding:8px 9px 12px;}
.qa-item{background:var(--navy3);border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;overflow:hidden;}
.qa-q{padding:8px 10px;cursor:pointer;display:flex;align-items:flex-start;gap:7px;}
.qa-q:hover{background:var(--navy4);}
.qa-qn{font-size:9px;font-family:var(--mono);color:var(--amber);flex-shrink:0;margin-top:1px;}
.qa-qt{font-size:10.5px;font-weight:600;color:var(--t1);flex:1;line-height:1.35;}
.qa-ar{color:var(--t3);font-size:11px;flex-shrink:0;transition:transform .18s;}
.qa-ar.open{transform:rotate(90deg);}
.qa-body{display:none;padding:9px 10px;border-top:1px solid var(--bd);}
.qa-body.open{display:block;}
.qa-diag{background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:4px 2px;margin-bottom:6px;}
.qa-mem{font-size:9.5px;font-weight:600;color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.18);border-radius:4px;padding:4px 7px;margin-bottom:6px;line-height:1.4;}
.qa-ans{font-size:10.5px;color:var(--t2);line-height:1.6;}
</style>

tokens = len(enc.encode(sample))\n        print(f\"{label:<12} {chars:>6} {tokens:>7} {chars/tokens:>12.1f}\")\n\n\nif __name__ == \"__main__\":\n    sample = \"Enterprise refund policy details. \" * 100\n    chunks = token_chunker(sample, chunk_size=200, chunk_overlap=20)\n    print(f\"Chunks: {len(chunks)}\")\n    print()\n    show_token_vs_char_difference()", "qs": [{"q": "Why does character chunking fail for Japanese, Chinese, or code?", "mnemonic": "1 CJK char = 2-4 tokens. URLs can be 1 char/token.", "steps": ["1500 chars", "Tokenize", "CJK: 4000+ tokens", "Exceeds model limit"], "a": "The character-to-token ratio varies dramatically by content type. Japanese characters are typically 2-4 tokens each, meaning a '1500 character' chunk can be 4000+ tokens \u2014 far beyond a 512-token embedding model limit, causing silent truncation or API errors. Token chunking eliminates this entire class of bugs."}, {"q": "How much headroom should you leave below the model context limit?", "mnemonic": "Leave 20% headroom \u2014 the query also eats tokens at retrieval", "steps": ["Model max tokens", "Target 80% max", "Chunk at that size", "Query fits too"], "a": "Leave at least 10-20% headroom below the model documented maximum. The tokenizer used in production may differ slightly from the one you measured with. At inference time some retrieval systems concatenate the query to each chunk before re-ranking \u2014 you need room for that query. For a 512-token model, target 400-450 token chunks."}, {"q": "What encoding should you use with tiktoken?", "mnemonic": "cl100k_base for OpenAI models; check vendor docs for others", "steps": ["OpenAI models", "cl100k_base", "Cohere/BGE", "Vendor-specific"], "a": "cl100k_base is the encoding used by GPT-4, text-embedding-3-*, and text-embedding-ada-002. Use it for any OpenAI-compatible embedding. For Cohere, BGE, E5, and other open-source models, the tokenizer may differ \u2014 typically SentencePiece or WordPiece. Measure with cl100k_base as an approximation, but validate with the actual model tokenizer before setting hard limits in production."}], "isArch": false}, {"num": "CH4", "group": "Fundamentals", "title": "Sentence Chunking", "filename": "ch4_sentence.py", "tags": [{"l": "NLP-aware", "c": "tc"}, {"l": "Coherent", "c": "tg"}], "desc": "Split on sentence boundaries detected by NLTK or spaCy. Each chunk is one or more complete sentences \u2014 no mid-sentence splits. The minimum viable upgrade from fixed-size splitting for prose documents.", "usecase": "Legal documents, medical records, financial reports, customer support tickets \u2014 any prose where sentence integrity is critical to meaning.", "install": "pip install nltk spacy tiktoken && python -m nltk.downloader punkt && python -m spacy download en_core_web_sm", "wn": ["NLTK sent_tokenize handles most English prose well \u2014 fast, no GPU needed", "spaCy gives better accuracy for complex sentences and abbreviations (Dr., Inc.) but requires a model download", "Group N sentences per chunk, not one per chunk \u2014 single sentences are often too short to embed meaningfully", "Track sentence count and character offset in metadata for precise provenance", "Combine with a max-token guard to prevent very long sentences from exceeding model limits"], "code_plain": "import nltk\nimport tiktoken\nfrom dataclasses import dataclass\n\nnltk.download(\"punkt_tab\", quiet=True)\n\n\n@dataclass\nclass SentenceChunk:\n    text:           str\n    sentences:      list[str]\n    sentence_count: int\n    token_count:    int\n    char_start:     int\n    chunk_index:    int\n\n\ndef sentence_chunker(\n    text: str,\n    sentences_per_chunk: int = 5,\n    sentence_overlap:    int = 1,\n    max_tokens:          int = 512,\n) -> list[SentenceChunk]:\n    enc = tiktoken.get_encoding(\"cl100k_base\")\n    sentences = nltk.sent_tokenize(text)\n\n    chunks = []\n    i = 0\n    char_offset = 0\n\n    while i < len(sentences):\n        group = []\n        token_total = 0\n\n        j = i\n        while j < len(sentences) and len(group) < sentences_per_chunk:\n            sent_tokens = len(enc.encode(sentences[j]))\n            if token_total + sent_tokens > max_tokens and group:\n                break\n            group.append(sentences[j])\n            token_total += sent_tokens\n            j += 1\n\n        if not group:\n            group = [sentences[i]]\n            j = i + 1\n\n        chunk_text = \" \".join(group)\n        start = text.find(group[0], char_offset)\n\n        chunks.append(SentenceChunk(\n            text=chunk_text,\n            sentences=group,\n            sentence_count=len(group),\n            token_count=len(enc.encode(chunk_text)),\n            char_start=start,\n            chunk_index=len(chunks),\n        ))\n\n        char_offset = start + len(group[0])\n        i = max(j - sentence_overlap, j if j <= i else i + 1)\n\n    return chunks\n\n\nif __name__ == \"__main__\":\n    sample = (\n        \"The Enterprise refund policy covers all annual subscriptions. \"\n        \"Customers may request a refund within 30 days of their billing anniversary. \"\n        \"Pro-rated refunds are calculated based on the number of unused days. \"\n        \"Monthly plans are non-refundable after the first 48 hours. \"\n        \"All refund requests must be submitted through the enterprise portal. \"\n        \"Processing takes 5-7 business days to the original payment method.\"\n    )\n\n    chunks = sentence_chunker(sample, sentences_per_chunk=3, sentence_overlap=1)\n    for c in chunks:\n        print(f\"Chunk {c.chunk_index}: {c.sentence_count} sentences, {c.token_count} tokens\")\n        print(f\"  {c.text[:80]}...\")\n        print()", "qs": [{"q": "Why group multiple sentences per chunk instead of one per chunk?", "mnemonic": "One sentence = too little context for a meaningful embedding", "steps": ["1 sentence", "Thin embedding", "3-5 sentences", "Richer embedding"], "a": "A single short sentence ('Refunds take 5-7 days.') produces an embedding that lacks context \u2014 it matches queries about processing time for any topic, not just refunds. Grouping 3-7 sentences gives the model enough co-occurring terms to produce a contextually rich vector. The embedding captures the semantic neighbourhood of the chunk, not just the vocabulary of one sentence."}, {"q": "How does sentence overlap differ from character overlap?", "mnemonic": "Sentence overlap = back up N sentences, not N chars", "steps": ["Chunk ends at S5", "Overlap=1", "Next chunk starts S5", "S5 appears twice"], "a": "Instead of repeating a fixed number of characters, sentence overlap backs up by N complete sentences when starting the next chunk. This means the last sentence of chunk N is the first sentence of chunk N+1. This is linguistically cleaner \u2014 you never start a chunk mid-sentence. The tradeoff is variable overlap size, but that is generally better than a fixed character count that can split words."}, {"q": "What happens when a single sentence exceeds the max_tokens limit?", "mnemonic": "Log it, include it anyway, flag for review \u2014 never silently drop", "steps": ["Long sentence", "Exceeds limit", "Include anyway", "Log the exception"], "a": "Some sentences are genuinely very long \u2014 legal boilerplate, complex technical specifications. The correct behavior is to include the sentence as its own chunk even if it exceeds your target, log the occurrence, and let the embedding model handle truncation. Do not silently drop oversized chunks or split them mid-sentence. Add a 'truncated: true' metadata flag so retrieval consumers know the chunk may be incomplete."}], "isArch": false}, {"num": "CH5", "group": "Fundamentals", "title": "Recursive Character Splitting", "filename": "ch5_recursive.py", "tags": [{"l": "Hierarchy-aware", "c": "tc"}, {"l": "LangChain default", "c": "ta"}, {"l": "Best baseline", "c": "tg"}], "desc": "Try splitting on paragraphs first, then sentences, then words, then characters \u2014 stopping as soon as chunks are small enough. Respects natural document structure without requiring NLP. The best general-purpose baseline.", "usecase": "General-purpose documents where you do not know the structure in advance \u2014 web pages, PDFs, customer emails, meeting transcripts. The default choice when you have not analysed your document types yet.", "install": "pip install langchain-text-splitters tiktoken", "wn": ["Separator hierarchy: paragraph -> sentence -> word -> char \u2014 tries each in order until chunks fit", "Never falls through to the last separator unless all others fail \u2014 mid-word splits are extremely rare", "Produces more coherent chunks than fixed-size at similar token budgets", "Works well as-is for English prose; adjust separator list for Markdown, code, or HTML", "The default choice in LangChain RAG tutorials for good reason \u2014 use it until you have evidence to do otherwise"], "code_plain": "from langchain_text_splitters import RecursiveCharacterTextSplitter\nimport tiktoken\n\n\ndef recursive_splitter(\n    text: str,\n    chunk_size:    int = 1000,\n    chunk_overlap: int = 150,\n) -> list[dict]:\n    \"\"\"\n    Tries separators in order: paragraph -> sentence -> word -> char.\n    Stops when all chunks fit within chunk_size characters.\n    \"\"\"\n    splitter = RecursiveCharacterTextSplitter(\n        chunk_size=chunk_size,\n        chunk_overlap=chunk_overlap,\n        separators=[\"\\n\\n\", \"\\n\", \". \", \"! \", \"? \", \" \", \"\"],\n        length_function=len,\n        is_separator_regex=False,\n    )\n\n    enc = tiktoken.get_encoding(\"cl100k_base\")\n    raw_chunks = splitter.split_text(text)\n\n    return [\n        {\n            \"text\":        chunk,\n            \"char_count\":  len(chunk),\n            \"token_count\": len(enc.encode(chunk)),\n            \"chunk_index\": i,\n        }\n        for i, chunk in enumerate(raw_chunks)\n    ]\n\n\ndef recursive_splitter_token_aware(\n    text: str,\n    chunk_size:    int = 512,   # NOW in tokens\n    chunk_overlap: int = 64,\n) -> list[dict]:\n    enc = tiktoken.get_encoding(\"cl100k_base\")\n\n    def token_length(s: str) -> int:\n        return len(enc.encode(s))\n\n    splitter = RecursiveCharacterTextSplitter(\n        chunk_size=chunk_size,\n        chunk_overlap=chunk_overlap,\n        length_function=token_length,   # measure in tokens\n        separators=[\"\\n\\n\", \"\\n\", \". \", \" \", \"\"],\n    )\n\n    return [\n        {\"text\": c, \"token_count\": token_length(c), \"chunk_index\": i}\n        for i, c in enumerate(splitter.split_text(text))\n    ]\n\n\nif __name__ == \"__main__\":\n    document = \"\"\"\nRefund Policy\n\nAll Enterprise customers are eligible for refunds under the following conditions.\nRefund requests must be submitted within 30 days of the billing date.\n\nAnnual Plans\n\nAnnual plan refunds are calculated on a pro-rated basis.\nThe unused portion of the subscription is refunded to the original payment method.\nProcessing takes 5-7 business days.\n\nMonthly Plans\n\nMonthly subscriptions are non-refundable after the first 48 hours of the billing cycle.\nExceptions may be granted for documented service outages exceeding 4 hours.\n    \"\"\"\n\n    chunks = recursive_splitter(document.strip(), chunk_size=300, chunk_overlap=50)\n    for c in chunks:\n        print(f\"[Chunk {c['chunk_index']}] {c['char_count']} chars / {c['token_count']} tokens\")\n        print(f\"  {c['text'][:100]}...\")\n        print()", "qs": [{"q": "Why does the separator list order matter?", "mnemonic": "Try biggest boundaries first \u2014 fall to smallest only if needed", "steps": ["Try paragraph", "Too big? Try sentence", "Too big? Try word", "Last: char"], "a": "The splitter tries each separator in order and only moves to the next if the resulting chunks are still larger than chunk_size. Starting with paragraph breaks means chunks respect document structure when possible. Only if a paragraph is too large does it try sentence breaks, then word breaks, then raw character splits. The result is that most chunks end at paragraph or sentence boundaries."}, {"q": "When should you customise the separator list?", "mnemonic": "Match separators to document structure: Markdown->headers, Code->functions", "steps": ["Default separators", "Prose only", "Custom list", "Markdown/Code"], "a": "The default list works for plain prose. For Markdown, add heading separators before paragraph breaks: ['# ', '## ', '### ', chr(10)+chr(10), ...]. For Python code, add function/class boundaries: [chr(10)+'class ', chr(10)+'def ', chr(10)+chr(10), ...]. For JSON, handle object boundaries. Your separator list should match the natural unit boundaries of your specific document format, with the largest semantic unit first."}, {"q": "Is the recursive splitter always better than fixed-size?", "mnemonic": "Recursive > fixed for prose. Fixed > recursive for tabular/structured data.", "steps": ["Prose document", "Recursive wins", "Table/CSV/JSON", "Fixed-size wins"], "a": "For prose documents, recursive splitting consistently produces more coherent chunks. But for highly structured data \u2014 CSV rows, JSON objects, HTML tables \u2014 the recursive separator list may not match the structure and you get arbitrary splits anyway. For structured data, use format-specific chunking or fixed-size with a separator that matches your record boundary."}], "isArch": false}, {"num": "ST1", "group": "Structure-Aware", "title": "Markdown / Header Chunking", "filename": "st1_markdown_headers.py", "tags": [{"l": "Structure", "c": "tp"}, {"l": "Document-aware", "c": "tc"}], "desc": "Splitting on the document's own heading hierarchy keeps each chunk semantically whole and carries the header path as metadata \u2014 so a chunk about 'Refunds > Enterprise' knows exactly where it came from.", "usecase": "Your policy manual is Markdown with ## sections and ### subsections. Header-based chunking keeps 'Enterprise > Refunds' as one coherent unit and tags it with its full breadcrumb for filtered retrieval.", "install": "pip install langchain-text-splitters", "wn": ["MarkdownHeaderTextSplitter splits on #, ##, ### and attaches each header level as metadata", "The header path becomes a breadcrumb: {'h1':'Billing','h2':'Refunds','h3':'Enterprise'} \u2014 usable as a metadata filter at query time", "Structure-aware chunks respect author intent: a section is a unit of meaning the writer already defined", "Combine with a secondary size splitter \u2014 a huge section still needs to be broken to fit embedding limits", "Header metadata dramatically improves retrieval precision: you can filter to only 'Refunds' chunks before semantic search"], "code_plain": "from langchain_text_splitters import (\n    MarkdownHeaderTextSplitter,\n    RecursiveCharacterTextSplitter,\n)\n\n\ndef chunk_markdown_by_headers(md_text: str) -> list[dict]:\n    \"\"\"\n    Two-stage: split on headers first (structure),\n    then size-split any oversized section (fit embedding window).\n    \"\"\"\n    headers_to_split_on = [\n        (\"#\",   \"h1\"),\n        (\"##\",  \"h2\"),\n        (\"###\", \"h3\"),\n    ]\n\n    header_splitter = MarkdownHeaderTextSplitter(\n        headers_to_split_on=headers_to_split_on,\n        strip_headers=False,   # keep header text inside the chunk\n    )\n    sections = header_splitter.split_text(md_text)\n\n    # Second pass: enforce a max size while preserving header metadata\n    size_splitter = RecursiveCharacterTextSplitter(\n        chunk_size=800, chunk_overlap=100,\n    )\n\n    chunks: list[dict] = []\n    for sec in sections:\n        breadcrumb = \" > \".join(\n            sec.metadata.get(h, \"\") for h in (\"h1\", \"h2\", \"h3\") if sec.metadata.get(h)\n        )\n        for piece in size_splitter.split_text(sec.page_content):\n            chunks.append({\n                \"text\":       piece,\n                \"breadcrumb\": breadcrumb,\n                \"metadata\":   sec.metadata,\n            })\n    return chunks\n\n\nSAMPLE = \"\"\"\n# Billing Policy\n\n## Refunds\n\n### Enterprise Plans\nAnnual Enterprise customers may request a pro-rated refund within 30 days.\n\n### Monthly Plans\nMonthly plans are non-refundable after the first 48 hours.\n\"\"\"\n\nif __name__ == \"__main__\":\n    for c in chunk_markdown_by_headers(SAMPLE):\n        print(f\"[{c['breadcrumb']}] {c['text'][:60]}...\")", "qs": [{"q": "Why split on headers before size?", "mnemonic": "Structure first, size second", "steps": ["Parse headers", "Keep sections whole", "Tag breadcrumb", "Size-split leftovers"], "a": "Headers encode author-defined units of meaning. Splitting on them first keeps each concept intact and lets you attach a breadcrumb path as metadata. The size pass only runs on sections that exceed the embedding window, so you preserve structure wherever possible and only break coherence as a last resort."}, {"q": "What does the breadcrumb metadata buy you?", "mnemonic": "Filter before you search", "steps": ["Query mentions refunds", "Filter h2=Refunds", "Search within subset", "Higher precision"], "a": "The breadcrumb ('Billing > Refunds > Enterprise') becomes a metadata filter. At query time you can pre-filter to only chunks under 'Refunds' before running semantic search \u2014 this cuts the candidate set dramatically and raises precision, especially in large multi-topic documents."}, {"q": "When does header chunking fail?", "mnemonic": "No headers, no structure", "steps": ["Flat document", "No markdown", "Nothing to split on", "Fall back to recursive"], "a": "It fails on unstructured text with no heading hierarchy \u2014 plain transcripts, OCR output, or single-blob documents. When there are no headers to anchor on, you get one giant chunk and must fall back to recursive or semantic splitting. Always have a fallback path."}], "isArch": false}, {"num": "ST2", "group": "Structure-Aware", "title": "Code Chunking (AST-based)", "filename": "st2_code_ast.py", "tags": [{"l": "Structure", "c": "tp"}, {"l": "AST", "c": "ta"}], "desc": "Code has syntactic boundaries \u2014 functions, classes, methods \u2014 that must never be split mid-body. AST-aware splitting chunks on these boundaries so each chunk is a complete, runnable, embeddable unit.", "usecase": "Your RAG system indexes an internal Python SDK so engineers can ask 'how do I authenticate a booking request?'. Each function must stay whole; a half-function chunk is useless for code retrieval.", "install": "pip install langchain-text-splitters tree-sitter-languages", "wn": ["Language-aware splitters keep function and class definitions intact \u2014 never split a def mid-body", "RecursiveCharacterTextSplitter.from_language() knows the separators for Python, JS, Java, Go, etc.", "Each chunk should ideally be one function or one class \u2014 the natural unit of code reuse and retrieval", "Preserve the signature and docstring with the body; they carry the semantic signal an embedder needs", "For large classes, split by method but repeat the class signature as a header in each method chunk"], "code_plain": "from langchain_text_splitters import (\n    RecursiveCharacterTextSplitter,\n    Language,\n)\n\n\ndef chunk_python_code(source: str) -> list[dict]:\n    \"\"\"\n    Split Python on syntactic boundaries: class defs,\n    function defs, then smaller structures. Never mid-body.\n    \"\"\"\n    splitter = RecursiveCharacterTextSplitter.from_language(\n        language=Language.PYTHON,\n        chunk_size=1000,\n        chunk_overlap=0,   # code overlap adds noise, not context\n    )\n    pieces = splitter.split_text(source)\n\n    chunks: list[dict] = []\n    for i, piece in enumerate(pieces):\n        kind = \"unknown\"\n        stripped = piece.lstrip()\n        if stripped.startswith(\"class \"):\n            kind = \"class\"\n        elif stripped.startswith(\"def \") or stripped.startswith(\"async def \"):\n            kind = \"function\"\n\n        chunks.append({\n            \"text\":     piece,\n            \"kind\":     kind,\n            \"language\": \"python\",\n            \"metadata\": {\"chunk_index\": i},\n        })\n    return chunks\n\n\nSAMPLE = (\n    \"class BookingClient:\n\"\n    \"    def authenticate(self, api_key: str) -> str:\n\"\n    \"        resp = self._post('/auth', {'key': api_key})\n\"\n    \"        return resp['token']\n\"\n    \"\n\"\n    \"    def search_hotels(self, city: str, nights: int) -> list[dict]:\n\"\n    \"        return self._get(f'/hotels?city={city}&nights={nights}')\n\"\n)\n\nif __name__ == \"__main__\":\n    for c in chunk_python_code(SAMPLE):\n        print(f\"{c['kind']:10} | {c['text'][:50]}...\")", "qs": [{"q": "Why is AST-based chunking better than character splitting for code?", "mnemonic": "Never cut a function in half", "steps": ["Parse syntax", "Find def/class", "Keep body whole", "Embed complete unit"], "a": "Character splitting cuts functions mid-body, producing chunks that are neither valid code nor semantically complete. AST-aware splitting respects syntactic boundaries so each chunk is a whole function or class \u2014 runnable, readable, and carrying the full signal (signature + docstring + body) that a code embedder needs to match a query."}, {"q": "Why set chunk_overlap=0 for code?", "mnemonic": "Overlap helps prose, hurts code", "steps": ["Prose: overlap saves context", "Code: overlap = duplicate lines", "Duplicates add noise", "Zero is cleaner"], "a": "Overlap in prose prevents answers being split across a boundary. In code, boundaries are already syntactic (function ends where it ends), so overlap just duplicates partial function bodies \u2014 adding noise that confuses retrieval and wastes tokens. Zero overlap keeps each function chunk clean."}, {"q": "How do you handle a class too large for one chunk?", "mnemonic": "Split by method, repeat the header", "steps": ["Class exceeds limit", "Split per method", "Repeat class signature", "Each method self-contained"], "a": "Split the class into per-method chunks, but prepend the class signature (and key attributes) as a header to each method chunk. That way each chunk still knows which class it belongs to, and a query like 'how does BookingClient authenticate' can match the authenticate method while retaining class context."}], "isArch": false}, {"num": "ST3", "group": "Structure-Aware", "title": "HTML & Document Chunking", "filename": "st3_html_document.py", "tags": [{"l": "Structure", "c": "tp"}, {"l": "DOM-aware", "c": "tc"}], "desc": "HTML and rich documents carry structure in tags and layout: headings, tables, lists, sections. DOM-aware chunking uses that tree to produce clean, context-preserving chunks instead of stripping to noisy plain text.", "usecase": "You ingest help-centre articles scraped as HTML. Tables of pricing tiers and nested FAQ lists must survive chunking intact so a query about 'Enterprise seat pricing' retrieves the right table row context.", "install": "pip install langchain-text-splitters beautifulsoup4 lxml", "wn": ["HTMLHeaderTextSplitter walks the DOM and splits on h1-h6 while carrying the tag hierarchy as metadata", "Tables should be kept whole or serialised row-by-row with the column headers repeated per row", "Strip boilerplate (nav, footer, scripts) before chunking \u2014 it pollutes embeddings with irrelevant tokens", "Preserve semantic containers: an <article> or <section> is a natural chunk boundary", "Convert to clean Markdown as an intermediate step when the HTML is messy \u2014 then chunk the Markdown"], "code_plain": "from langchain_text_splitters import HTMLHeaderTextSplitter\nfrom bs4 import BeautifulSoup\n\n\ndef clean_and_chunk_html(html: str) -> list[dict]:\n    \"\"\"\n    1. Strip boilerplate tags.\n    2. Split on heading structure.\n    3. Carry the heading path as metadata.\n    \"\"\"\n    soup = BeautifulSoup(html, \"lxml\")\n    for tag in soup([\"script\", \"style\", \"nav\", \"footer\", \"aside\"]):\n        tag.decompose()\n    cleaned = str(soup)\n\n    splitter = HTMLHeaderTextSplitter(\n        headers_to_split_on=[\n            (\"h1\", \"section\"),\n            (\"h2\", \"subsection\"),\n            (\"h3\", \"topic\"),\n        ],\n    )\n    docs = splitter.split_text(cleaned)\n\n    chunks: list[dict] = []\n    for d in docs:\n        path = \" > \".join(\n            d.metadata.get(k, \"\")\n            for k in (\"section\", \"subsection\", \"topic\")\n            if d.metadata.get(k)\n        )\n        chunks.append({\n            \"text\":     d.page_content,\n            \"path\":     path,\n            \"metadata\": d.metadata,\n        })\n    return chunks\n\n\ndef serialise_table(table_html: str) -> list[str]:\n    \"\"\"Turn an HTML table into row strings with headers repeated.\"\"\"\n    soup = BeautifulSoup(table_html, \"lxml\")\n    headers = [th.get_text(strip=True) for th in soup.select(\"thead th\")]\n    rows: list[str] = []\n    for tr in soup.select(\"tbody tr\"):\n        cells = [td.get_text(strip=True) for td in tr.select(\"td\")]\n        pairs = [f\"{h}: {c}\" for h, c in zip(headers, cells)]\n        rows.append(\" | \".join(pairs))\n    return rows", "qs": [{"q": "Why strip boilerplate before chunking HTML?", "mnemonic": "Nav and footers poison embeddings", "steps": ["Raw HTML has nav/footer", "Repeated on every page", "Dilutes the real signal", "Strip, then chunk"], "a": "Navigation menus, footers, and sidebars repeat on every page and carry no article-specific meaning. If you embed them, every chunk shares this boilerplate vector component, pulling unrelated chunks closer together and hurting retrieval precision. Stripping them first ensures embeddings capture only the actual content."}, {"q": "How should tables be chunked?", "mnemonic": "Repeat headers per row", "steps": ["Table has header row", "Serialise each row", "Prepend column names", "Row is self-contained"], "a": "A table row like '$500 | 25 | annual' is meaningless alone. Serialise each row with its column headers repeated inline ('Price: $500 | Seats: 25 | Term: annual') so each row chunk is self-contained and retrievable. Alternatively keep small tables whole so the model sees the full comparison context."}, {"q": "When convert HTML to Markdown first?", "mnemonic": "Messy HTML, clean Markdown", "steps": ["HTML is messy", "Convert to Markdown", "Cleaner structure", "Chunk the Markdown"], "a": "When the HTML is deeply nested, inconsistent, or full of styling divs, converting to clean Markdown as an intermediate step normalises the structure. You get predictable ## headers and clean lists, which the header splitter handles far more reliably than raw tag soup. It is a normalisation step, not a detour."}], "isArch": false}, {"num": "SM1", "group": "Semantic", "title": "Semantic Chunking", "filename": "sm1_semantic_boundaries.py", "tags": [{"l": "Semantic", "c": "tg"}, {"l": "Embedding-based", "c": "tc"}], "desc": "Instead of fixed sizes, semantic chunking places boundaries where the topic actually shifts \u2014 detected by measuring the embedding distance between consecutive sentences and cutting at the peaks.", "usecase": "A support transcript drifts across billing, then login issues, then refunds \u2014 with no headings. Semantic chunking detects each topic shift and cuts there, so 'refund' content lands in its own coherent chunk.", "install": "pip install langchain-experimental langchain-openai numpy", "wn": ["Embed each sentence, then measure cosine distance between consecutive sentences", "A large distance spike signals a topic shift \u2014 that's where you place a chunk boundary", "The breakpoint threshold (percentile of distances) tunes how aggressively you split", "No fixed size: chunks are as long as the topic stays coherent, then break naturally", "Cost tradeoff: you embed every sentence up front, but retrieval quality improves markedly on unstructured text"], "code_plain": "import numpy as np\nfrom langchain_openai import OpenAIEmbeddings\n\n\ndef semantic_chunk(\n    sentences: list[str],\n    percentile_threshold: int = 90,\n) -> list[dict]:\n    \"\"\"\n    Cut where consecutive-sentence embedding distance spikes.\n    Boundary = distance above the Nth percentile of all gaps.\n    \"\"\"\n    embedder = OpenAIEmbeddings(model=\"text-embedding-3-small\")\n    vectors = embedder.embed_documents(sentences)\n    vectors = np.array(vectors)\n\n    # Cosine distance between each adjacent sentence pair\n    distances = []\n    for i in range(len(vectors) - 1):\n        a, b = vectors[i], vectors[i + 1]\n        cos_sim = np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\n        distances.append(1.0 - cos_sim)\n\n    # Boundaries where distance exceeds the chosen percentile\n    cutoff = np.percentile(distances, percentile_threshold)\n    boundaries = [i for i, d in enumerate(distances) if d > cutoff]\n\n    chunks: list[dict] = []\n    start = 0\n    for b in boundaries:\n        end = b + 1\n        chunks.append({\n            \"text\":            \" \".join(sentences[start:end]),\n            \"sentence_span\":   (start, end),\n        })\n        start = end\n    if start < len(sentences):\n        chunks.append({\n            \"text\":          \" \".join(sentences[start:]),\n            \"sentence_span\": (start, len(sentences)),\n        })\n    return chunks", "qs": [{"q": "How does semantic chunking find boundaries?", "mnemonic": "Cut where meaning jumps", "steps": ["Embed each sentence", "Measure adjacent distance", "Spike = topic shift", "Cut at the spike"], "a": "It embeds every sentence, then measures cosine distance between each consecutive pair. When two neighbouring sentences are semantically far apart, that gap is a topic shift. By cutting at distance spikes above a chosen percentile, chunks break exactly where the subject changes rather than at an arbitrary character count."}, {"q": "What does the percentile threshold control?", "mnemonic": "Higher percentile, fewer cuts", "steps": ["Low percentile: many cuts", "High percentile: few cuts", "Tune to topic density", "Balance size vs coherence"], "a": "The percentile threshold decides how big a distance spike must be to count as a boundary. A 95th-percentile threshold only cuts at the sharpest topic shifts, giving fewer, larger chunks. A 75th cuts more aggressively into smaller, tighter chunks. You tune it to the document's topic density and your target chunk size."}, {"q": "What's the main cost of semantic chunking?", "mnemonic": "Embed everything up front", "steps": ["Embed every sentence", "Extra API calls", "Higher ingest cost", "Better retrieval payoff"], "a": "You must embed every sentence during ingestion, which is far more embedding calls than fixed-size chunking needs. That raises ingest time and cost. The payoff is markedly better retrieval on unstructured text where fixed boundaries would split coherent ideas \u2014 so it's worth it precisely when structure is absent."}], "isArch": false}, {"num": "SM2", "group": "Semantic", "title": "Late Chunking (Jina)", "filename": "sm2_late_chunking.py", "tags": [{"l": "Semantic", "c": "tg"}, {"l": "Advanced", "c": "tr"}], "desc": "Late chunking flips the usual order: embed the whole document first through a long-context model, then pool token embeddings into chunks. Each chunk vector is informed by full-document context \u2014 so pronouns and references resolve correctly.", "usecase": "A policy doc says 'It must be requested within 30 days' where 'It' means 'the refund'. Standard chunking loses that link. Late chunking embeds with full context, so the chunk vector still encodes what 'It' refers to.", "install": "pip install transformers torch numpy", "wn": ["Traditional chunking embeds each chunk in isolation \u2014 losing cross-chunk context like pronoun references", "Late chunking embeds the full document first, producing token-level embeddings with global context baked in", "Chunk boundaries are applied after embedding: pool the token vectors within each boundary into one chunk vector", "Requires a long-context embedding model (8k+ tokens) that outputs token-level, not just pooled, embeddings", "Dramatically improves retrieval where meaning depends on distant context \u2014 legal, policy, technical docs"], "code_plain": "import numpy as np\nimport torch\nfrom transformers import AutoModel, AutoTokenizer\n\n\ndef late_chunk(text: str, boundaries: list[tuple[int, int]]) -> list[dict]:\n    \"\"\"\n    1. Embed the WHOLE document -> token-level embeddings.\n    2. Pool tokens within each (start, end) boundary.\n    Each chunk vector carries full-document context.\n    \"\"\"\n    model_name = \"jinaai/jina-embeddings-v2-base-en\"\n    tokenizer = AutoTokenizer.from_pretrained(model_name)\n    model = AutoModel.from_pretrained(model_name, trust_remote_code=True)\n\n    inputs = tokenizer(text, return_tensors=\"pt\", truncation=True, max_length=8192)\n    with torch.no_grad():\n        outputs = model(**inputs)\n\n    # Token-level embeddings for the entire document at once\n    token_embeddings = outputs.last_hidden_state[0]   # (seq_len, dim)\n\n    chunks: list[dict] = []\n    for (tok_start, tok_end) in boundaries:\n        # Mean-pool the token vectors inside this chunk's span\n        span = token_embeddings[tok_start:tok_end]\n        chunk_vector = span.mean(dim=0).numpy()\n\n        chunks.append({\n            \"token_span\":    (tok_start, tok_end),\n            \"vector\":        chunk_vector,\n            \"vector_norm\":   float(np.linalg.norm(chunk_vector)),\n        })\n    return chunks\n\n\n# Contrast with naive chunking:\n#   naive:  embed(chunk_text)          -> no outside context\n#   late:   pool(embed(full_doc)[span]) -> full context per chunk", "qs": [{"q": "How does late chunking differ from normal chunking?", "mnemonic": "Embed first, cut second", "steps": ["Embed full document", "Get token vectors", "Apply boundaries after", "Pool per chunk"], "a": "Normal chunking splits text then embeds each piece in isolation, so a chunk never sees context outside its own boundary. Late chunking embeds the entire document first through a long-context model, producing token-level vectors that already encode global context, then pools those tokens into chunks afterward. The order is reversed \u2014 embed then cut, not cut then embed."}, {"q": "What problem does it solve?", "mnemonic": "Resolve distant references", "steps": ["'It' refers back", "Normal chunk loses link", "Late keeps full context", "Reference survives"], "a": "It solves lost cross-chunk context \u2014 especially pronouns and references that point to something in a distant part of the document. Because the token embeddings were computed over the whole text, the vector for a chunk containing 'It must be requested in 30 days' still encodes that 'It' means the refund defined pages earlier. Isolated chunking cannot do this."}, {"q": "What's the hard requirement to use it?", "mnemonic": "Needs long-context token embeddings", "steps": ["Long-context model", "8k+ token window", "Token-level output", "Not just pooled"], "a": "You need an embedding model that (a) accepts a long context window \u2014 8k tokens or more so the whole document fits \u2014 and (b) exposes token-level embeddings rather than only a single pooled vector. Models like Jina v2 support this. A standard short-context, pooled-only embedder cannot do late chunking."}], "isArch": false}, {"num": "SM3", "group": "Semantic", "title": "Proposition Chunking", "filename": "sm3_propositions.py", "tags": [{"l": "Semantic", "c": "tg"}, {"l": "LLM-powered", "c": "ta"}], "desc": "Proposition chunking uses an LLM to rewrite text into standalone atomic facts \u2014 each a single self-contained statement. These maximise retrieval precision because every unit expresses exactly one idea with no ambiguity.", "usecase": "A dense paragraph bundles refund window, processing time, and payment method into one blob. Proposition chunking splits it into three atomic facts, so a query about 'processing time' matches only the relevant statement.", "install": "pip install langchain-openai langchain-core", "wn": ["An LLM decomposes text into propositions: atomic, self-contained, context-independent statements", "Each proposition resolves pronouns and adds implied context so it stands alone ('The refund...' not 'It...')", "Propositions maximise precision \u2014 one idea per chunk means near-zero irrelevant content per retrieval", "Higher cost: every document passes through an LLM at ingest time, so reserve it for high-value corpora", "Store the parent document id on each proposition so you can expand back to full context when needed"], "code_plain": "from langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\nimport json\n\nPROMPT = ChatPromptTemplate.from_messages([\n    (\"system\",\n     \"Decompose the text into a list of atomic propositions. \"\n     \"Each proposition must be a single self-contained fact. \"\n     \"Resolve all pronouns to their referents. \"\n     \"Add implied subjects so each statement stands alone. \"\n     \"Return ONLY a JSON array of strings, no other text.\"),\n    (\"human\", \"{text}\"),\n])\n\n\ndef propositionalise(text: str, doc_id: str) -> list[dict]:\n    \"\"\"Rewrite a passage into standalone atomic facts via an LLM.\"\"\"\n    llm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)\n    chain = PROMPT | llm\n    raw = chain.invoke({\"text\": text}).content\n\n    try:\n        props = json.loads(raw)\n    except json.JSONDecodeError:\n        props = [text]   # fall back to the original on parse failure\n\n    return [\n        {\n            \"text\":     p,\n            \"metadata\": {\"doc_id\": doc_id, \"type\": \"proposition\"},\n        }\n        for p in props\n    ]\n\n\nSAMPLE = (\n    \"Enterprise customers can get a refund within 30 days. \"\n    \"It is processed in 5-7 business days to the original card.\"\n)\n\n# Expected propositions:\n#   \"Enterprise customers can request a refund within 30 days of billing.\"\n#   \"Enterprise refunds are processed within 5-7 business days.\"\n#   \"Enterprise refunds are returned to the original payment card.\"", "qs": [{"q": "What makes a good proposition?", "mnemonic": "One fact, stands alone", "steps": ["Single idea", "No pronouns", "Implied subject added", "Context-independent"], "a": "A good proposition expresses exactly one atomic fact and is fully self-contained: all pronouns resolved to their referents and any implied subject made explicit. 'It ships in 5 days' becomes 'Enterprise refunds are processed within 5-7 business days.' It should be understandable with zero surrounding context \u2014 that is what makes it retrievable in isolation."}, {"q": "Why does this maximise retrieval precision?", "mnemonic": "One idea, zero dilution", "steps": ["Chunk = one fact", "Query matches exactly", "No irrelevant content", "Precision peaks"], "a": "When each chunk contains a single idea, a retrieved chunk is almost entirely relevant to the query that matched it \u2014 there is no unrelated content diluting the signal. A query about processing time matches only the processing-time proposition, not a paragraph that also discusses windows and payment methods. Precision approaches its ceiling."}, {"q": "What's the catch, and how do you mitigate it?", "mnemonic": "Costly \u2014 keep the parent link", "steps": ["LLM per document", "High ingest cost", "Store doc_id", "Expand for context"], "a": "Every document passes through an LLM at ingest, making it the most expensive strategy \u2014 reserve it for high-value corpora. Mitigate the context-loss risk by storing the parent doc_id on each proposition, so after retrieving an atomic fact you can expand back to the full source passage when the LLM needs richer context to answer."}], "isArch": false}, {"num": "VE1", "group": "Vectorization", "title": "Embedding Models", "filename": "ve1_embedding_models.py", "tags": [{"l": "Vectorize", "c": "tb"}, {"l": "Core", "c": "tc"}], "desc": "An embedding model turns a chunk of text into a dense vector \u2014 a point in high-dimensional space where semantic similarity becomes geometric distance. The model you pick sets the ceiling on retrieval quality.", "usecase": "Every chunk of your refund policy becomes a vector. A user's question becomes a vector too. Retrieval is just finding the policy vectors nearest to the question vector \u2014 so the embedder's quality is everything.", "install": "pip install langchain-openai langchain-cohere sentence-transformers", "wn": ["Dense embeddings map text to a fixed-length vector (e.g. 1536 dims) where cosine distance = semantic distance", "Model choice is a tradeoff: OpenAI (managed, strong), Cohere (multilingual), BGE / E5 (open, self-hostable)", "Dimension count affects storage and speed: 384-dim BGE-small is fast; 3072-dim large is more accurate but heavier", "Match the model to your domain \u2014 general models underperform on code, legal, or biomedical without fine-tuning", "Always embed queries and documents with the SAME model \u2014 mixing embedders makes distances meaningless"], "code_plain": "from langchain_openai import OpenAIEmbeddings\nfrom langchain_cohere import CohereEmbeddings\nfrom langchain_community.embeddings import HuggingFaceEmbeddings\n\n\ndef build_embedder(provider: str = \"openai\"):\n    \"\"\"\n    Return an embedder. Query and document embeddings MUST\n    come from the same model or distances are meaningless.\n    \"\"\"\n    if provider == \"openai\":\n        # 1536 dims, managed, strong general performance\n        return OpenAIEmbeddings(model=\"text-embedding-3-small\")\n\n    if provider == \"openai-large\":\n        # 3072 dims, higher accuracy, more storage + latency\n        return OpenAIEmbeddings(model=\"text-embedding-3-large\")\n\n    if provider == \"cohere\":\n        # strong multilingual retrieval\n        return CohereEmbeddings(model=\"embed-multilingual-v3.0\")\n\n    if provider == \"bge\":\n        # open, self-hostable, 384 dims - fast and cheap\n        return HuggingFaceEmbeddings(\n            model_name=\"BAAI/bge-small-en-v1.5\",\n            encode_kwargs={\"normalize_embeddings\": True},\n        )\n\n    raise ValueError(f\"unknown provider: {provider}\")\n\n\ndef embed_chunks(chunks: list[str], provider: str = \"openai\") -> list[list[float]]:\n    embedder = build_embedder(provider)\n    return embedder.embed_documents(chunks)\n\n\ndef embed_query(question: str, provider: str = \"openai\") -> list[float]:\n    embedder = build_embedder(provider)\n    return embedder.embed_query(question)   # same model as documents", "qs": [{"q": "Why must queries and documents use the same embedder?", "mnemonic": "Same space or no meaning", "steps": ["Doc uses model A", "Query uses model B", "Different spaces", "Distances meaningless"], "a": "Embeddings only compare within one model's vector space. Two models place text in geometrically unrelated spaces, so a distance between a model-A document vector and a model-B query vector is noise, not similarity. You must embed both sides with the identical model (and version) for cosine distance to actually mean semantic closeness."}, {"q": "How do you choose the embedding dimension?", "mnemonic": "Bigger = accurate but heavier", "steps": ["Small dim: fast/cheap", "Large dim: accurate", "More storage cost", "Balance to scale"], "a": "Higher dimensions capture more nuance and generally retrieve better, but cost more storage and make similarity search slower. A 384-dim BGE-small is ideal for high-volume, latency-sensitive systems; a 3072-dim large model suits smaller corpora where accuracy matters most. Choose based on corpus size, latency budget, and required precision."}, {"q": "When do you need a domain-specific embedder?", "mnemonic": "General fails on jargon", "steps": ["General model", "Code/legal/bio input", "Poor similarity", "Fine-tune or specialise"], "a": "General-purpose embedders underperform on specialised vocabularies \u2014 code, legal, biomedical \u2014 where surface tokens look similar but meanings differ sharply. If retrieval quality is poor on domain text, switch to a domain-tuned model (e.g. a code embedder) or fine-tune one on your corpus. Evaluate on your own queries before committing."}], "isArch": false}, {"num": "VE2", "group": "Vectorization", "title": "Sparse Vectors (BM25 / SPLADE)", "filename": "ve2_sparse_vectors.py", "tags": [{"l": "Vectorize", "c": "tb"}, {"l": "Lexical", "c": "ta"}], "desc": "Dense vectors capture meaning but miss exact terms \u2014 product codes, names, rare keywords. Sparse vectors (BM25, SPLADE) score on term overlap, catching the literal matches that dense retrieval fumbles.", "usecase": "A user searches for error code 'BK-4021'. Dense embeddings blur it into 'some error code', but a sparse vector matches the exact token. Sparse retrieval nails identifiers, SKUs, and rare terms.", "install": "pip install rank-bm25 langchain-community", "wn": ["Sparse vectors are high-dimensional but mostly zero \u2014 one dimension per vocabulary term", "BM25 scores by term frequency and rarity: exact keyword overlap, no semantic generalisation", "SPLADE is a learned sparse model \u2014 it expands terms with related tokens while staying interpretable", "Sparse excels at exact matches: IDs, codes, names, acronyms where dense retrieval blurs the signal", "Sparse and dense are complementary \u2014 this is exactly why hybrid retrieval (VE3) exists"], "code_plain": "from rank_bm25 import BM25Okapi\nimport re\n\n\ndef tokenize(text: str) -> list[str]:\n    \"\"\"Lowercase word tokens; keep alphanumerics like 'BK-4021'.\"\"\"\n    return re.findall(r\"[a-z0-9\\-]+\", text.lower())\n\n\nclass SparseIndex:\n    \"\"\"A minimal BM25 sparse retriever over chunk texts.\"\"\"\n\n    def __init__(self, chunks: list[str]) -> None:\n        self.chunks = chunks\n        tokenized = [tokenize(c) for c in chunks]\n        self.bm25 = BM25Okapi(tokenized)\n\n    def search(self, query: str, k: int = 5) -> list[dict]:\n        scores = self.bm25.get_scores(tokenize(query))\n        ranked = sorted(\n            enumerate(scores), key=lambda x: x[1], reverse=True\n        )[:k]\n        return [\n            {\"chunk\": self.chunks[i], \"bm25_score\": float(s)}\n            for i, s in ranked if s > 0\n        ]\n\n\nCHUNKS = [\n    \"Enterprise refunds are processed within 5-7 business days.\",\n    \"Error BK-4021 means the booking session token has expired.\",\n    \"Monthly plans are non-refundable after 48 hours.\",\n]\n\nif __name__ == \"__main__\":\n    index = SparseIndex(CHUNKS)\n    # Dense would blur 'BK-4021'; BM25 matches the exact token\n    for hit in index.search(\"what is error BK-4021\"):\n        print(f\"{hit['bm25_score']:.2f}  {hit['chunk']}\")", "qs": [{"q": "When does sparse beat dense retrieval?", "mnemonic": "Exact tokens beat meaning", "steps": ["Query has ID/code", "Dense blurs it", "Sparse matches exact", "Sparse wins"], "a": "Sparse wins when the query hinges on exact literal terms \u2014 product codes, error IDs, names, acronyms, SKUs. Dense embeddings generalise 'BK-4021' into a fuzzy region of 'error-code-like' text and can miss the precise match. BM25 scores direct token overlap, so it retrieves the chunk containing that exact string reliably."}, {"q": "How does BM25 score relevance?", "mnemonic": "Frequent + rare = relevant", "steps": ["Count term in chunk", "Weight by rarity", "Common words down", "Rare matches up"], "a": "BM25 rewards chunks where the query terms appear frequently, but down-weights terms that are common across the whole corpus and up-weights rare ones. A rare exact match ('BK-4021') scores very high; a match on a ubiquitous word ('the') scores near zero. It captures lexical relevance without any notion of semantic meaning."}, {"q": "How does SPLADE differ from BM25?", "mnemonic": "Learned expansion, still sparse", "steps": ["BM25: raw term overlap", "SPLADE: learned weights", "Expands related terms", "Sparse + semantic hint"], "a": "BM25 is a fixed statistical formula over raw terms. SPLADE is a learned sparse model: it predicts weighted term expansions, so a chunk about 'refund' can also activate related tokens like 'reimbursement'. It keeps the interpretability and exact-match strength of sparse vectors while adding a light layer of learned semantic association."}], "isArch": false}, {"num": "VE3", "group": "Vectorization", "title": "Hybrid Vectors (RRF Fusion)", "filename": "ve3_hybrid_rrf.py", "tags": [{"l": "Vectorize", "c": "tb"}, {"l": "Fusion", "c": "tg"}], "desc": "Hybrid retrieval runs dense and sparse in parallel, then fuses their ranked lists with Reciprocal Rank Fusion \u2014 combining semantic understanding with exact-match precision into one result set.", "usecase": "A query 'refund policy for error BK-4021' needs both: semantic match on 'refund policy' (dense) and exact match on 'BK-4021' (sparse). Hybrid + RRF returns chunks strong on either signal.", "install": "pip install rank-bm25 langchain-openai numpy", "wn": ["Run dense (semantic) and sparse (lexical) retrieval independently, each producing a ranked list", "Reciprocal Rank Fusion combines lists by rank position, not raw scores \u2014 so incomparable scales don't matter", "RRF formula: score = sum over lists of 1 / (k + rank), with k a smoothing constant (~60)", "A chunk ranked high by either retriever surfaces; chunks ranked high by both dominate", "Hybrid is the production default \u2014 it degrades gracefully when one signal is weak for a given query"], "code_plain": "from collections import defaultdict\n\n\ndef reciprocal_rank_fusion(\n    ranked_lists: list[list[str]],\n    k: int = 60,\n) -> list[tuple[str, float]]:\n    \"\"\"\n    Fuse multiple ranked lists by rank position.\n    score(doc) = sum over lists of 1 / (k + rank_in_list)\n    Robust because it ignores each retriever's raw score scale.\n    \"\"\"\n    scores: dict[str, float] = defaultdict(float)\n    for ranked in ranked_lists:\n        for rank, doc_id in enumerate(ranked):\n            scores[doc_id] += 1.0 / (k + rank)\n\n    return sorted(scores.items(), key=lambda x: x[1], reverse=True)\n\n\ndef hybrid_search(\n    query: str,\n    dense_retriever,\n    sparse_retriever,\n    k: int = 5,\n) -> list[tuple[str, float]]:\n    \"\"\"Combine semantic and lexical retrieval into one fused ranking.\"\"\"\n    dense_hits  = dense_retriever.search(query, k=k * 2)    # list of doc_ids\n    sparse_hits = sparse_retriever.search(query, k=k * 2)   # list of doc_ids\n\n    fused = reciprocal_rank_fusion([dense_hits, sparse_hits])\n    return fused[:k]\n\n\n# Why RRF and not score averaging?\n#   dense cosine in [0, 1]; BM25 in [0, 30+]  -> not comparable\n#   RRF uses ONLY rank position -> scale-free, robust fusion", "qs": [{"q": "Why fuse on rank instead of raw score?", "mnemonic": "Different scales, use position", "steps": ["Cosine 0-1", "BM25 0-30+", "Not comparable", "Rank is scale-free"], "a": "Dense cosine scores live in [0,1] while BM25 scores can range into the tens \u2014 averaging them lets one scale dominate arbitrarily. Reciprocal Rank Fusion uses only each document's rank position within its list, which is scale-free. A document ranked #1 contributes the same regardless of whether it came from the dense or sparse retriever, making fusion robust."}, {"q": "What does the k constant do in RRF?", "mnemonic": "k smooths rank influence", "steps": ["Small k: top ranks dominate", "Large k: flatter", "k~60 default", "Tune for balance"], "a": "k is a smoothing constant in 1/(k+rank). A small k makes the top-ranked items hugely dominant; a large k flattens the contribution across ranks so lower-ranked items still matter. The common default of 60 balances rewarding top hits while letting a strong second-list match surface. You tune it if one retriever should carry more weight."}, {"q": "Why is hybrid the production default?", "mnemonic": "Graceful when one signal fails", "steps": ["Semantic query: dense wins", "Exact query: sparse wins", "Either surfaces", "Robust across queries"], "a": "Real query streams mix semantic questions and exact-term lookups. Dense alone fails on codes; sparse alone fails on paraphrases. Hybrid covers both, and RRF means when one retriever is weak for a given query, the other still surfaces the right chunk. It degrades gracefully rather than failing on whole query classes \u2014 which is why it's the safe production choice."}], "isArch": false}, {"num": "VE4", "group": "Vectorization", "title": "Batching & Rate Limits", "filename": "ve4_batching.py", "tags": [{"l": "Vectorize", "c": "tb"}, {"l": "Throughput", "c": "tr"}], "desc": "Embedding a million chunks means thousands of API calls. Naive one-at-a-time calls are slow and hit rate limits. Batching, concurrency control, and exponential backoff turn a fragile loop into a robust pipeline.", "usecase": "You're re-indexing 2M refund-policy chunks overnight. Without batching and backoff, you hit the provider's rate limit at chunk 400 and the whole job dies. A resilient embedder finishes the run.", "install": "pip install openai tenacity tqdm", "wn": ["Batch multiple texts per API call \u2014 providers accept arrays, cutting request count 100x", "Respect rate limits: track tokens-per-minute and requests-per-minute, throttle before you hit the ceiling", "Exponential backoff with jitter on 429 errors \u2014 retry with growing delays instead of hammering", "Bounded concurrency: a semaphore caps parallel requests so you saturate throughput without tripping limits", "Checkpoint progress \u2014 persist embedded chunk ids so a crash resumes instead of restarting the whole job"], "code_plain": "import asyncio\nfrom openai import AsyncOpenAI\nfrom tenacity import (\n    retry, wait_random_exponential, stop_after_attempt,\n    retry_if_exception_type,\n)\n\nclient = AsyncOpenAI()\n\n\n@retry(\n    wait=wait_random_exponential(min=1, max=60),   # backoff + jitter\n    stop=stop_after_attempt(6),\n    retry=retry_if_exception_type(Exception),\n)\nasync def embed_batch(texts: list[str]) -> list[list[float]]:\n    \"\"\"Embed one batch with automatic backoff on rate-limit errors.\"\"\"\n    resp = await client.embeddings.create(\n        model=\"text-embedding-3-small\",\n        input=texts,\n    )\n    return [d.embedding for d in resp.data]\n\n\nasync def embed_all(\n    chunks: list[str],\n    batch_size: int = 128,\n    max_concurrency: int = 5,\n) -> list[list[float]]:\n    \"\"\"Batch + bounded-concurrency embedding of a large corpus.\"\"\"\n    batches = [\n        chunks[i : i + batch_size]\n        for i in range(0, len(chunks), batch_size)\n    ]\n    sem = asyncio.Semaphore(max_concurrency)\n\n    async def run(batch: list[str]) -> list[list[float]]:\n        async with sem:                 # cap parallel requests\n            return await embed_batch(batch)\n\n    results = await asyncio.gather(*(run(b) for b in batches))\n    return [vec for batch_result in results for vec in batch_result]", "qs": [{"q": "Why batch texts into one API call?", "mnemonic": "One call, many texts", "steps": ["1000 chunks", "1000 calls: slow", "Batch of 128", "8 calls: fast"], "a": "Embedding endpoints accept an array of texts per request. Sending 128 chunks in one call instead of 128 separate calls cuts request count by that factor, slashing both wall-clock time and per-request overhead. It's the single biggest throughput win \u2014 a million chunks drops from a million requests to a few thousand batches."}, {"q": "How does exponential backoff with jitter help?", "mnemonic": "Back off, don't hammer", "steps": ["Hit 429", "Wait 1s, retry", "Fail? wait 2s, 4s", "Jitter spreads load"], "a": "On a 429 rate-limit error, retrying immediately just gets rejected again. Exponential backoff waits growing intervals (1s, 2s, 4s...) so the provider's window resets. Jitter adds randomness so many parallel workers don't all retry at the same instant and re-collide. Together they let a job ride through transient limits instead of crashing."}, {"q": "Why cap concurrency with a semaphore?", "mnemonic": "Saturate, don't overflow", "steps": ["Unbounded parallel", "Trips rate limit", "Semaphore caps N", "Steady max throughput"], "a": "Firing all batches in parallel overwhelms the rate limit instantly. A semaphore caps how many requests run concurrently \u2014 say 5 \u2014 so you push throughput up to just below the provider's ceiling and hold it there steadily. It's the difference between a burst that trips limits and a sustained flow that maximises safe throughput."}], "isArch": false}, {"num": "VE5", "group": "Vectorization", "title": "Embedding Caching & Deduplication", "filename": "ve5_cache_dedup.py", "tags": [{"l": "Vectorize", "c": "tb"}, {"l": "Cost control", "c": "tg"}], "desc": "Re-embedding unchanged text wastes money and time. A content-hash cache skips already-embedded chunks, and dedup removes near-identical chunks before they ever hit the embedder \u2014 cutting cost and index bloat.", "usecase": "On each nightly re-index, 95% of your policy chunks are unchanged. Hashing chunk content and caching vectors means you only embed the 5% that actually changed \u2014 turning an hour-long job into minutes.", "install": "pip install openai numpy", "wn": ["Hash each chunk's normalised text (SHA-256) and use the hash as a cache key for its vector", "On re-index, skip any chunk whose hash already exists in the cache \u2014 embed only new or changed content", "Deduplicate near-identical chunks with a similarity threshold before embedding to avoid index bloat", "Store the hash in chunk metadata so drift detection and cache invalidation are trivial", "A persistent vector cache turns incremental re-indexing from full-cost into change-only cost"], "code_plain": "import hashlib\nimport numpy as np\nfrom openai import OpenAI\n\nclient = OpenAI()\n\n\ndef content_hash(text: str) -> str:\n    \"\"\"Stable key from normalised chunk text.\"\"\"\n    normalised = \" \".join(text.split()).lower()\n    return hashlib.sha256(normalised.encode(\"utf-8\")).hexdigest()\n\n\nclass CachingEmbedder:\n    \"\"\"Embed only chunks whose content hash is not already cached.\"\"\"\n\n    def __init__(self) -> None:\n        self.cache: dict[str, list[float]] = {}   # hash -> vector\n\n    def embed(self, chunks: list[str]) -> list[list[float]]:\n        to_embed, positions = [], []\n        vectors: list[list[float] | None] = [None] * len(chunks)\n\n        for i, chunk in enumerate(chunks):\n            h = content_hash(chunk)\n            if h in self.cache:\n                vectors[i] = self.cache[h]        # cache hit: skip API\n            else:\n                to_embed.append(chunk)\n                positions.append((i, h))\n\n        if to_embed:                              # embed only the misses\n            resp = client.embeddings.create(\n                model=\"text-embedding-3-small\", input=to_embed,\n            )\n            for (i, h), data in zip(positions, resp.data):\n                vectors[i] = data.embedding\n                self.cache[h] = data.embedding    # populate cache\n\n        return vectors   # type: ignore[return-value]\n\n\ndef dedup(chunks: list[str], threshold: float = 0.97) -> list[str]:\n    \"\"\"Drop near-duplicate chunks by exact content hash first.\"\"\"\n    seen: set[str] = set()\n    unique: list[str] = []\n    for c in chunks:\n        h = content_hash(c)\n        if h not in seen:\n            seen.add(h)\n            unique.append(c)\n    return unique", "qs": [{"q": "How does content hashing enable incremental re-indexing?", "mnemonic": "Same hash, skip embed", "steps": ["Hash chunk text", "Exists in cache?", "Yes: reuse vector", "No: embed once"], "a": "Each chunk's normalised text is hashed to a stable key. On re-index you compute the hash and check the cache: if it exists, the content is unchanged and you reuse the stored vector for free. Only chunks with new hashes \u2014 genuinely new or edited content \u2014 get sent to the embedder. A 95%-unchanged corpus embeds only 5%, turning full cost into change-only cost."}, {"q": "Why normalise text before hashing?", "mnemonic": "Ignore trivial differences", "steps": ["Collapse whitespace", "Lowercase", "Hash the normal form", "Trivial edits = same key"], "a": "Without normalisation, an extra space or a capitalisation change produces a different hash and forces a needless re-embed. Collapsing whitespace and lowercasing first means cosmetically-different-but-semantically-identical text maps to the same key, so the cache hits correctly. You want the hash to change only when meaning could have changed."}, {"q": "What problem does deduplication solve?", "mnemonic": "Kill duplicate index bloat", "steps": ["Corpus has repeats", "Same chunk many times", "Bloats index", "Dedup before embed"], "a": "Corpora often contain repeated boilerplate \u2014 the same disclaimer across many documents. Embedding and indexing each copy wastes storage and skews retrieval (many identical hits crowd out diverse results). Deduplicating by content hash before embedding keeps one copy, shrinking the index and improving result diversity. Near-dup detection extends this to almost-identical chunks."}], "isArch": false}, {"num": "ME1", "group": "Metadata & Enrichment", "title": "Chunk Metadata Schema", "filename": "me1_metadata_schema.py", "tags": [{"l": "Metadata", "c": "tp"}, {"l": "Schema", "c": "tc"}], "desc": "Metadata is what turns a chunk from an anonymous vector into a filterable, traceable, governable unit. A disciplined schema enables pre-filtering, access control, provenance, and drift detection.", "usecase": "A regulated refund-policy corpus needs every chunk tagged with source, version, effective date, and access tier \u2014 so retrieval can filter to the current policy version a given user is allowed to see.", "install": "pip install pydantic", "wn": ["Provenance fields (doc_id, source, page, char span) let you trace any answer back to its exact origin", "Filtering fields (category, version, effective_date, access_tier) enable pre-filter before semantic search", "Structural fields (chunk_index, parent_id) preserve document order and hierarchy for context expansion", "A content hash enables cache reuse and drift detection with no extra computation", "Validate the schema with Pydantic at ingest \u2014 a malformed metadata record is a production incident waiting to happen"], "code_plain": "from pydantic import BaseModel, Field\nfrom datetime import datetime, date\nimport hashlib\n\n\nclass ChunkMetadata(BaseModel):\n    \"\"\"Every chunk carries this. Validated at ingest time.\"\"\"\n\n    # Provenance - trace an answer to its source\n    doc_id:       str\n    source:       str\n    page:         int | None = None\n    char_start:   int\n    char_end:     int\n\n    # Filtering - narrow the candidate set before search\n    category:      str\n    version:       str\n    effective_date: date\n    access_tier:   str = \"public\"     # public | internal | restricted\n\n    # Structure - reconstruct context\n    chunk_index:  int\n    parent_id:    str | None = None\n\n    # Integrity - cache + drift detection\n    content_hash: str\n    created_at:   datetime = Field(default_factory=datetime.utcnow)\n\n\ndef build_metadata(text: str, doc_id: str, idx: int, **kw) -> ChunkMetadata:\n    h = hashlib.sha256(\" \".join(text.split()).lower().encode()).hexdigest()\n    return ChunkMetadata(\n        doc_id=doc_id,\n        chunk_index=idx,\n        content_hash=h,\n        char_start=kw[\"char_start\"],\n        char_end=kw[\"char_end\"],\n        source=kw[\"source\"],\n        category=kw[\"category\"],\n        version=kw[\"version\"],\n        effective_date=kw[\"effective_date\"],\n        access_tier=kw.get(\"access_tier\", \"public\"),\n    )", "qs": [{"q": "Why validate metadata with Pydantic at ingest?", "mnemonic": "Fail at ingest, not at query", "steps": ["Bad record enters", "Silent bad filter", "Wrong results later", "Validate up front"], "a": "A malformed metadata record \u2014 missing effective_date, wrong type on access_tier \u2014 causes silent filter failures at query time that are hard to trace. Validating with Pydantic at ingest rejects bad records immediately at the point of entry, where the fix is cheap. It converts a subtle production retrieval bug into an obvious ingest-time error."}, {"q": "How does metadata enable access control?", "mnemonic": "Filter by tier before search", "steps": ["Tag access_tier", "User has clearance", "Pre-filter to allowed", "Then semantic search"], "a": "Tagging each chunk with an access_tier lets retrieval pre-filter to only the chunks a given user is cleared to see before any semantic search runs. A restricted chunk never enters the candidate set for an unauthorised user, so it cannot leak into an answer. This is essential in regulated environments where retrieval must respect data-access boundaries."}, {"q": "What does storing char_start and char_end buy you?", "mnemonic": "Point to the exact source span", "steps": ["Answer cites chunk", "Chunk knows offsets", "Highlight in source", "Auditable provenance"], "a": "Character offsets let you map a retrieved chunk back to its exact location in the source document \u2014 to highlight the passage, show it in context, or prove provenance in an audit. In regulated finance, being able to point to the precise span an answer came from is a compliance requirement, not a nicety."}], "isArch": false}, {"num": "ME2", "group": "Metadata & Enrichment", "title": "Parent-Child Chunking", "filename": "me2_parent_child.py", "tags": [{"l": "Metadata", "c": "tp"}, {"l": "Context", "c": "tg"}], "desc": "Parent-child chunking searches on small precise child chunks but returns the larger parent for context. You get the retrieval precision of small chunks with the answer-generation context of large ones.", "usecase": "A user's question matches one precise sentence about refund windows (child), but the LLM needs the whole surrounding policy paragraph (parent) to answer accurately. Parent-child gives you both.", "install": "pip install langchain langchain-openai", "wn": ["Index small child chunks for precise semantic matching \u2014 they retrieve accurately", "Store each child's parent_id pointing to a larger enclosing chunk", "At retrieval: match on children, then return their parents (deduplicated) to the LLM", "Resolves the precision/context tension \u2014 small for search, large for generation", "Also called 'small-to-big' retrieval; the child is the needle, the parent is the context"], "code_plain": "from dataclasses import dataclass, field\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\n\n\n@dataclass\nclass Node:\n    id:        str\n    text:      str\n    parent_id: str | None = None\n\n\ndef build_parent_child(document: str, doc_id: str) -> tuple[list[Node], list[Node]]:\n    \"\"\"\n    Parents = large chunks (context).\n    Children = small chunks (precise search), each linked to its parent.\n    \"\"\"\n    parent_splitter = RecursiveCharacterTextSplitter(chunk_size=1500, chunk_overlap=0)\n    child_splitter  = RecursiveCharacterTextSplitter(chunk_size=300,  chunk_overlap=50)\n\n    parents: list[Node] = []\n    children: list[Node] = []\n\n    for p_idx, parent_text in enumerate(parent_splitter.split_text(document)):\n        parent_id = f\"{doc_id}-p{p_idx}\"\n        parents.append(Node(id=parent_id, text=parent_text))\n\n        for c_idx, child_text in enumerate(child_splitter.split_text(parent_text)):\n            children.append(Node(\n                id=f\"{parent_id}-c{c_idx}\",\n                text=child_text,\n                parent_id=parent_id,\n            ))\n\n    return parents, children   # index children; keep parents in a docstore\n\n\ndef expand_to_parents(child_hits: list[Node], parent_store: dict[str, Node]) -> list[Node]:\n    \"\"\"Return deduplicated parents for the matched children.\"\"\"\n    seen: set[str] = set()\n    result: list[Node] = []\n    for child in child_hits:\n        pid = child.parent_id\n        if pid and pid not in seen:\n            seen.add(pid)\n            result.append(parent_store[pid])\n    return result", "qs": [{"q": "What tension does parent-child chunking resolve?", "mnemonic": "Small finds, big answers", "steps": ["Small: precise search", "Small: too little context", "Big: rich context", "Match small, return big"], "a": "Small chunks retrieve precisely but give the LLM too little context to answer; large chunks give context but retrieve imprecisely because they mix topics. Parent-child resolves this by searching on small child chunks for precision, then returning their larger parents so the LLM has full surrounding context. You stop trading one for the other."}, {"q": "Why deduplicate parents on expansion?", "mnemonic": "Many children, one parent", "steps": ["3 children match", "All same parent", "Return parent once", "Avoid duplicate context"], "a": "Several matched child chunks often share the same parent. If you returned a parent per child, the LLM would see the same passage repeated, wasting context window and skewing attention. Deduplicating so each parent appears once keeps the context clean and lets you fit more distinct parents within the token budget."}, {"q": "What is 'small-to-big' retrieval?", "mnemonic": "Needle then haystack", "steps": ["Child = needle", "Match precisely", "Parent = context", "Big for generation"], "a": "It's another name for parent-child: the small child chunk is the precise needle you match against the query, and the large parent is the surrounding haystack of context you hand to the model for generation. You search small and answer big \u2014 the retrieval unit and the generation unit are deliberately different sizes."}], "isArch": false}, {"num": "ME3", "group": "Metadata & Enrichment", "title": "Summary-Augmented Chunks", "filename": "me3_summary_augmented.py", "tags": [{"l": "Metadata", "c": "tp"}, {"l": "LLM-enriched", "c": "ta"}], "desc": "Summary-augmented chunking prepends an LLM-generated summary or hypothetical questions to each chunk before embedding \u2014 enriching the vector so it matches a wider range of real user queries.", "usecase": "A dense technical chunk about refund processing never matches the casual query 'how long till I get my money back'. Prepending a plain-language summary makes the chunk's vector reachable by real-world phrasing.", "install": "pip install langchain-openai", "wn": ["Generate a short LLM summary of each chunk and prepend it before embedding", "Or generate hypothetical questions the chunk answers (HyDE-style) and embed those alongside", "The enriched embedding matches paraphrased and intent-level queries the raw text would miss", "Keep the original text as the returned content \u2014 only the embedded representation is augmented", "Trades ingest-time LLM cost for a lasting boost in retrieval recall on natural-language queries"], "code_plain": "from langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\n\nSUMMARY_PROMPT = ChatPromptTemplate.from_template(\n    \"Summarise what question(s) this text answers, in one plain sentence:\\n\\n{chunk}\"\n)\n\nQUESTION_PROMPT = ChatPromptTemplate.from_template(\n    \"List 3 short questions a user might ask that this text answers. \"\n    \"One per line, no numbering:\\n\\n{chunk}\"\n)\n\n\ndef augment_chunk(chunk_text: str) -> dict:\n    \"\"\"\n    Embed an enriched representation (summary + hypothetical\n    questions + original) but RETURN the original text.\n    \"\"\"\n    llm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)\n\n    summary = (SUMMARY_PROMPT | llm).invoke({\"chunk\": chunk_text}).content\n    questions = (QUESTION_PROMPT | llm).invoke({\"chunk\": chunk_text}).content\n\n    # This enriched string i
