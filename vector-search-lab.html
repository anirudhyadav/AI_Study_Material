<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Vector Search Lab</title>
<style>
:root{
  --navy:#0a0f1e;--navy2:#111827;--navy3:#1a2236;--navy4:#243050;--navy5:#2d3a56;
  --teal:#00d4c8;--tealb:rgba(0,212,200,.1);
  --amber:#f59e0b;--amberb:rgba(245,158,11,.1);
  --purple:#a78bfa;--purpleb:rgba(167,139,250,.1);
  --green:#34d399;--greenb:rgba(52,211,153,.1);
  --coral:#f87171;--coralb:rgba(248,113,113,.1);
  --blue:#60a5fa;--blueb:rgba(96,165,250,.1);
  --t1:#e8eaf0;--t2:#8b94ab;--t3:#4a5568;
  --bd:#1e2d45;--bd2:#2d4060;
  --mono:'Courier New',Courier,monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--navy);color:var(--t1);font-family:var(--sans);font-size:13px;}
::-webkit-scrollbar{width:5px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--navy5);border-radius:3px;}
.hdr{height:48px;background:var(--navy2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--teal),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--navy);flex-shrink:0;}
.hdr-title{font-size:13px;font-weight:700;}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--purpleb);border:1px solid rgba(167,139,250,.25);color:var(--purple);margin-left:6px;}
.hdr-sub{font-size:10px;color:var(--t3);margin-left:6px;}
.wrap{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;overflow:hidden;}
.rail{width:236px;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--bd);overflow-y:auto;padding:6px 5px 16px;}
.rg{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);padding:10px 8px 4px;border-top:1px solid var(--bd);margin-top:4px;}
.rg:first-child{border-top:none;margin-top:0;}
.si{padding:7px 8px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all .15s;}
.si:hover{background:var(--navy3);}
.si.on{background:var(--tealb);border-color:rgba(0,212,200,.4);}
.si-num{font-size:9px;font-family:var(--mono);color:var(--t3);}
.si-title{font-size:11px;font-weight:700;color:var(--t1);margin-top:2px;}
.si.on .si-num{color:var(--teal);}
.si.on .si-title{color:var(--teal);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.shdr{padding:10px 16px 8px;background:var(--navy2);border-bottom:1px solid var(--bd);flex-shrink:0;}
.shdr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.shdr-num{font-size:10px;font-family:var(--mono);color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.25);padding:2px 7px;border-radius:4px;}
.shdr-title{font-size:14px;font-weight:700;}
.shdr-desc{font-size:11px;color:var(--t2);line-height:1.55;max-width:760px;}
.tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;}
.tc{background:var(--tealb);color:var(--teal);}
.ta{background:var(--amberb);color:var(--amber);}
.tp{background:var(--purpleb);color:var(--purple);}
.tg{background:var(--greenb);color:var(--green);}
.tr{background:var(--coralb);color:var(--coral);}
.tb{background:var(--blueb);color:var(--blue);}
.carea{flex:1;overflow-y:auto;padding:12px 16px 20px;}
.prog{height:3px;background:var(--navy3);border-radius:2px;margin-bottom:12px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--purple));transition:width .3s;}
.uc{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--amber);border-radius:7px;padding:9px 12px;margin-bottom:10px;}
.uc-lbl{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--amber);margin-bottom:3px;}
.uc-text{font-size:11px;color:var(--t2);line-height:1.55;}
.wn{background:var(--navy2);border:1px solid var(--bd);border-left:3px solid var(--teal);border-radius:7px;padding:10px 12px;margin-bottom:10px;}
.wn-title{font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--teal);margin-bottom:6px;}
.wn-list{font-size:11px;color:var(--t2);line-height:1.7;padding-left:14px;}
.wn-list li{margin-bottom:2px;}
.wn-ilbl{font-size:9px;color:var(--t3);font-family:var(--sans);margin-top:7px;margin-bottom:2px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.wn-install{background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--green);}
.cb{background:var(--navy);border:1px solid var(--bd);border-radius:7px;overflow:hidden;margin-bottom:12px;}
.cb-bar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--navy3);border-bottom:1px solid var(--bd);}
.cb-lang{font-size:10px;color:var(--t3);font-family:var(--mono);}
.cb-file{font-size:10px;color:var(--t2);font-family:var(--mono);margin-left:8px;}
.cb-copy{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--navy4);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;font-family:var(--sans);}
.cb-copy:hover{color:var(--teal);border-color:var(--teal);}
.cb pre{padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.8;overflow-x:auto;white-space:pre;color:var(--t1);margin:0;background:var(--navy);}
.kw{color:#c792ea;}.fn{color:#82aaff;}.cls{color:#ffcb6b;}.st{color:#c3e88d;}.cm{color:#546e7a;font-style:italic;}.nm{color:#f78c6c;}.dc{color:#89ddff;}.bi{color:#f78c6c;}
.rp{width:270px;flex-shrink:0;background:var(--navy2);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;}
.rp-hdr{padding:9px 11px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.rp-title{font-size:11px;font-weight:700;color:var(--purple);}
.rp-sub{font-size:9px;color:var(--t3);margin-top:1px;}
.rp-body{flex:1;overflow-y:auto;padding:8px 9px 12px;}
.qa-item{background:var(--navy3);border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;overflow:hidden;}
.qa-q{padding:8px 10px;cursor:pointer;display:flex;align-items:flex-start;gap:7px;}
.qa-q:hover{background:var(--navy4);}
.qa-qn{font-size:9px;font-family:var(--mono);color:var(--amber);flex-shrink:0;margin-top:1px;}
.qa-qt{font-size:10.5px;font-weight:600;color:var(--t1);flex:1;line-height:1.35;}
.qa-ar{color:var(--t3);font-size:11px;flex-shrink:0;transition:transform .18s;}
.qa-ar.open{transform:rotate(90deg);}
.qa-body{display:none;padding:9px 10px;border-top:1px solid var(--bd);}
.qa-body.open{display:block;}
.qa-diag{background:var(--navy);border:1px solid var(--bd);border-radius:4px;padding:4px 2px;margin-bottom:6px;}
.qa-mem{font-size:9.5px;font-weight:600;color:var(--amber);background:var(--amberb);border:1px solid rgba(245,158,11,.18);border-radius:4px;padding:4px 7px;margin-bottom:6px;line-height:1.4;}
.qa-ans{font-size:10.5px;color:var(--t2);line-height:1.6;}
</style>

<script type="application/json" id="D">
[{"num": "VS1", "group": "Foundations", "title": "What is Vector Search?", "filename": "vs1_what_is_vector_search.py", "tags": [{"l": "Concept", "c": "tc"}, {"l": "Core theory", "c": "ta"}], "desc": "Vector search answers a question by turning it into a vector and finding the chunk vectors nearest to it in embedding space. Retrieval becomes a geometry problem: proximity means relevance.", "usecase": "A user asks 'how long until my enterprise refund arrives?'. You embed that question with the same model used on your policy chunks, then find the chunk vectors closest to it \u2014 those are your answer candidates.", "install": "pip install numpy openai", "wn": ["The question and the chunks live in the same vector space \u2014 search is finding nearest neighbours to the query vector", "You MUST embed the query with the exact model used for the documents, or distances are meaningless", "'Nearest' is defined by a distance metric \u2014 cosine similarity is the usual choice for text embeddings", "Search returns the top-k nearest chunks; those become the context handed to the LLM", "Everything else in this lab is about doing this faster (indexes), more precisely (filtering, reranking), and at scale"], "code_plain": "import numpy as np\nfrom openai import OpenAI\n\nclient = OpenAI()\nMODEL = \"text-embedding-3-small\"   # same model used for the chunks\n\n\ndef embed(text: str) -> np.ndarray:\n    \"\"\"Embed a single string into a vector.\"\"\"\n    resp = client.embeddings.create(model=MODEL, input=[text])\n    return np.array(resp.data[0].embedding)\n\n\ndef vector_search(question: str, chunk_vectors: np.ndarray,\n                  chunks: list[str], k: int = 3) -> list[dict]:\n    \"\"\"\n    The whole idea in one function:\n    1. embed the question with the SAME model as the chunks\n    2. score every chunk by similarity to the question\n    3. return the top-k nearest\n    \"\"\"\n    q = embed(question)\n\n    # cosine similarity to every chunk vector at once\n    q_norm = q / np.linalg.norm(q)\n    doc_norms = chunk_vectors / np.linalg.norm(chunk_vectors, axis=1, keepdims=True)\n    scores = doc_norms @ q_norm\n\n    top = np.argsort(scores)[::-1][:k]\n    return [{\"chunk\": chunks[i], \"score\": float(scores[i])} for i in top]\n\n\nif __name__ == \"__main__\":\n    chunks = [\n        \"Enterprise refunds are processed within 5-7 business days.\",\n        \"Monthly plans are non-refundable after 48 hours.\",\n        \"Refunds return to the original payment method.\",\n    ]\n    vecs = np.array([embed(c) for c in chunks])\n    for hit in vector_search(\"when will I get my money back\", vecs, chunks):\n        print(f\"{hit['score']:.3f}  {hit['chunk']}\")", "qs": [{"q": "Why must the query use the same embedding model as the chunks?", "mnemonic": "Same space or no meaning", "steps": ["Chunks: model A", "Query: model B", "Different geometry", "Distance is noise"], "a": "Embeddings are only comparable within one model's vector space. Two models place text in unrelated coordinate systems, so a distance between a model-A chunk and a model-B query measures nothing. You must embed the query with the identical model and version used at ingest for proximity to actually mean semantic relevance."}, {"q": "Why is 'nearest' the right notion of relevance?", "mnemonic": "Proximity = shared meaning", "steps": ["Embedder groups meaning", "Similar text \u2192 close", "Query near answer", "Nearest = most relevant"], "a": "A good embedder places semantically similar text close together, so a well-phrased question lands near the chunks that answer it. Distance in the space is a learned proxy for meaning-overlap. Finding nearest neighbours therefore surfaces the chunks most likely to contain the answer \u2014 which is exactly what retrieval needs."}, {"q": "What does top-k control?", "mnemonic": "How much context to pass", "steps": ["k too small: miss answer", "k too big: noise", "Tune to task", "Balance recall/precision"], "a": "k is how many nearest chunks you return as context. Too small and you risk missing the chunk with the answer; too large and you flood the LLM with irrelevant text that dilutes the signal and wastes context window. You tune k to the task \u2014 small for precise factual lookups, larger for synthesis across sources."}], "isArch": false}, {"num": "VS2", "group": "Foundations", "title": "Cosine Similarity & Distance Metrics", "filename": "vs2_distance_metrics.py", "tags": [{"l": "Concept", "c": "tc"}, {"l": "Math", "c": "ta"}], "desc": "'Nearest' needs a definition. Cosine similarity measures the angle between vectors, dot product measures alignment and magnitude, Euclidean measures straight-line distance. The metric must match how the embedder was trained.", "usecase": "Your refund-policy embeddings were trained for cosine similarity. Using Euclidean distance instead would rank chunks by vector length as much as meaning \u2014 quietly degrading every retrieval in the system.", "install": "pip install numpy", "wn": ["Cosine similarity = angle between vectors, ignoring magnitude \u2014 the default for normalised text embeddings", "Dot product = cosine \u00d7 magnitudes; identical to cosine when vectors are unit-normalised", "Euclidean (L2) = straight-line distance; sensitive to magnitude, used by some models", "The metric must match the one the embedding model was trained with \u2014 mismatches silently hurt recall", "Normalising vectors to unit length makes cosine, dot product, and L2 rank-equivalent \u2014 a common trick"], "code_plain": "import numpy as np\n\n\ndef cosine_similarity(a: np.ndarray, b: np.ndarray) -> float:\n    \"\"\"Angle between vectors. Magnitude-independent. Range [-1, 1].\"\"\"\n    return float(np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b)))\n\n\ndef dot_product(a: np.ndarray, b: np.ndarray) -> float:\n    \"\"\"Alignment AND magnitude. Equals cosine when vectors are normalised.\"\"\"\n    return float(np.dot(a, b))\n\n\ndef euclidean_distance(a: np.ndarray, b: np.ndarray) -> float:\n    \"\"\"Straight-line distance. Smaller = closer. Magnitude-sensitive.\"\"\"\n    return float(np.linalg.norm(a - b))\n\n\ndef normalise(v: np.ndarray) -> np.ndarray:\n    \"\"\"Unit-length vector: makes cosine == dot product.\"\"\"\n    return v / np.linalg.norm(v)\n\n\nif __name__ == \"__main__\":\n    q  = np.array([0.2, 0.9, 0.1])\n    c1 = np.array([0.3, 0.8, 0.2])   # similar direction\n    c2 = np.array([0.9, 0.1, 0.3])   # different direction\n\n    print(\"cosine  q,c1:\", round(cosine_similarity(q, c1), 3))   # high\n    print(\"cosine  q,c2:\", round(cosine_similarity(q, c2), 3))   # low\n\n    # After normalising, dot product == cosine\n    qn, c1n = normalise(q), normalise(c1)\n    print(\"dot(norm) q,c1:\", round(dot_product(qn, c1n), 3))", "qs": [{"q": "When is cosine equal to dot product?", "mnemonic": "Normalise and they merge", "steps": ["Cosine ignores length", "Dot uses length", "Unit-normalise both", "Now identical"], "a": "Cosine similarity is the dot product divided by both magnitudes. If you unit-normalise every vector to length 1, those magnitudes become 1 and cosine equals the raw dot product. Many vector DBs normalise at ingest for exactly this reason \u2014 you get cosine's magnitude-independence with the dot product's cheaper computation."}, {"q": "Why must the metric match the embedder's training?", "mnemonic": "Wrong metric, silent decay", "steps": ["Model trained cosine", "You use L2", "Ranks by magnitude", "Recall drops quietly"], "a": "Embedding models are trained so that a specific metric reflects similarity. If a model learned cosine but you query with Euclidean, ranking gets polluted by vector magnitude rather than pure direction, subtly reordering results. Nothing errors \u2014 retrieval just gets worse across the board. Always use the metric the model documents."}, {"q": "Why does magnitude-independence matter for text?", "mnemonic": "Meaning \u2260 vector length", "steps": ["Long doc: big vector", "Short doc: small vector", "Cosine ignores that", "Compares direction only"], "a": "Vector magnitude can reflect incidental properties like text length rather than meaning. Cosine looks only at direction \u2014 the semantic 'heading' of the text \u2014 so a short and a long chunk about the same topic still score as similar. That's why cosine is the default for text: it compares what the text is about, not how much of it there is."}], "isArch": false}, {"num": "VS3", "group": "Foundations", "title": "Brute-Force kNN (Exact Search)", "filename": "vs3_brute_force_knn.py", "tags": [{"l": "Baseline", "c": "tg"}, {"l": "Exact", "c": "tc"}], "desc": "Brute-force kNN compares the query against every chunk vector. It's exact \u2014 guaranteed to find the true nearest neighbours \u2014 but its cost grows linearly with the corpus, so it's the correctness baseline, not the scaling answer.", "usecase": "With 5,000 refund-policy chunks, scanning all of them per query is instant and perfectly accurate. At 50 million chunks it's far too slow \u2014 which is why the Indexes section exists. Start here to know ground truth.", "install": "pip install numpy", "wn": ["Brute-force computes similarity to every vector, then sorts \u2014 O(N\u00b7d) per query", "It is exact: it always returns the true top-k, making it the gold standard for measuring approximate methods", "Perfectly fine up to ~10k-100k vectors depending on dimension and latency budget", "Vectorised matrix multiply (all chunks at once) is far faster than a Python loop", "Use brute-force to generate ground-truth labels when evaluating an approximate index's recall"], "code_plain": "import numpy as np\n\n\nclass BruteForceIndex:\n    \"\"\"Exact nearest-neighbour search. The correctness baseline.\"\"\"\n\n    def __init__(self, vectors: np.ndarray, ids: list[str]) -> None:\n        # pre-normalise so cosine == dot product (one matmul at query time)\n        self.vectors = vectors / np.linalg.norm(vectors, axis=1, keepdims=True)\n        self.ids = ids\n\n    def search(self, query: np.ndarray, k: int = 5) -> list[tuple[str, float]]:\n        q = query / np.linalg.norm(query)\n\n        # similarity to ALL vectors in one vectorised operation\n        scores = self.vectors @ q                     # shape (N,)\n\n        # argpartition is O(N); full sort only the top-k\n        top = np.argpartition(scores, -k)[-k:]\n        top = top[np.argsort(scores[top])[::-1]]\n        return [(self.ids[i], float(scores[i])) for i in top]\n\n\ndef recall_at_k(approx: list[str], exact: list[str], k: int) -> float:\n    \"\"\"Fraction of the true top-k the approximate index recovered.\"\"\"\n    return len(set(approx[:k]) & set(exact[:k])) / k\n\n\nif __name__ == \"__main__\":\n    rng = np.random.default_rng(0)\n    vecs = rng.random((5000, 384))\n    index = BruteForceIndex(vecs, [f\"chunk-{i}\" for i in range(5000)])\n    q = rng.random(384)\n    for cid, score in index.search(q, k=3):\n        print(f\"{score:.3f}  {cid}\")", "qs": [{"q": "Why is brute-force the baseline but not the answer?", "mnemonic": "Exact but linear", "steps": ["Scans every vector", "Always correct", "Cost grows with N", "Too slow at scale"], "a": "Brute-force compares the query to every vector, so it always returns the true nearest neighbours \u2014 perfect accuracy. But cost scales linearly with corpus size: fine at tens of thousands, hopeless at tens of millions per query under a latency budget. It defines ground truth, which is why approximate indexes are measured against it."}, {"q": "Why use argpartition instead of a full sort?", "mnemonic": "Partition beats sort", "steps": ["Full sort: O(N log N)", "Only need top-k", "argpartition: O(N)", "Sort just the k"], "a": "You only need the top-k, not a fully ordered list of all N scores. argpartition rearranges the array in O(N) so the k largest are in the last k slots, then you sort only those k. This is much cheaper than an O(N log N) sort of the entire score array when N is large and k is small."}, {"q": "How does brute-force help evaluate an ANN index?", "mnemonic": "Ground truth for recall", "steps": ["Brute-force = true top-k", "ANN returns approx", "Compare overlap", "That's recall@k"], "a": "An approximate index trades some accuracy for speed, so you need to know what it missed. Brute-force gives the exact true top-k for a sample of queries; comparing the approximate results against it yields recall@k \u2014 the fraction of true neighbours recovered. That's the core quality metric for tuning any ANN index."}], "isArch": false}, {"num": "VS4", "group": "Foundations", "title": "Top-k & Score Thresholds", "filename": "vs4_topk_thresholds.py", "tags": [{"l": "Baseline", "c": "tg"}, {"l": "Tuning", "c": "ta"}], "desc": "Returning a fixed top-k always hands back k chunks \u2014 even when none are actually relevant. Score thresholds add a quality gate: drop chunks below a similarity floor so the LLM never sees irrelevant context.", "usecase": "A user asks something your policy corpus simply doesn't cover. Fixed top-k returns the 5 'least bad' chunks anyway; a score threshold returns nothing, letting you answer 'not found' instead of hallucinating from noise.", "install": "pip install numpy", "wn": ["Fixed top-k always returns k results regardless of quality \u2014 dangerous when the answer isn't in the corpus", "A similarity threshold filters out chunks below a relevance floor, so weak matches are dropped", "Combine both: take top-k, THEN drop anything under the threshold \u2014 bounded size and quality-gated", "Thresholds are metric-specific \u2014 a good cosine floor (~0.3-0.5) is meaningless for raw L2 distance", "Calibrate the threshold on a labelled set; too high starves the LLM, too low lets noise through"], "code_plain": "import numpy as np\n\n\ndef search_with_threshold(\n    scores: np.ndarray,\n    ids: list[str],\n    k: int = 5,\n    min_score: float = 0.35,\n) -> list[dict]:\n    \"\"\"\n    Top-k for a size bound, THEN a similarity floor for quality.\n    Returns fewer than k (or zero) when matches are weak.\n    \"\"\"\n    top = np.argsort(scores)[::-1][:k]\n\n    results = [\n        {\"id\": ids[i], \"score\": float(scores[i])}\n        for i in top\n        if scores[i] >= min_score          # quality gate\n    ]\n    return results\n\n\ndef answerable(results: list[dict]) -> bool:\n    \"\"\"No chunk cleared the threshold -> the corpus can't answer this.\"\"\"\n    return len(results) > 0\n\n\nif __name__ == \"__main__\":\n    ids = [f\"chunk-{i}\" for i in range(6)]\n    strong = np.array([0.71, 0.62, 0.55, 0.20, 0.11, 0.05])\n    weak   = np.array([0.22, 0.19, 0.15, 0.12, 0.08, 0.03])\n\n    r1 = search_with_threshold(strong, ids)\n    r2 = search_with_threshold(weak, ids)\n    print(\"strong query answerable:\", answerable(r1), \"->\", len(r1), \"chunks\")\n    print(\"weak query answerable:  \", answerable(r2), \"->\", len(r2), \"chunks\")", "qs": [{"q": "Why is fixed top-k dangerous on its own?", "mnemonic": "Always returns, even garbage", "steps": ["Corpus lacks answer", "Top-k still returns k", "LLM sees noise", "Hallucination risk"], "a": "Fixed top-k unconditionally returns k chunks, even when the corpus contains nothing relevant \u2014 it just hands back the k least-distant vectors, which may all be unrelated. The LLM then treats that noise as context and can hallucinate a confident answer. A threshold lets the system say 'no good match' instead of forcing k weak results through."}, {"q": "Why combine top-k with a threshold?", "mnemonic": "Bound size AND quality", "steps": ["Top-k caps count", "Threshold caps quality", "Take k then filter", "Bounded and clean"], "a": "Top-k alone bounds quantity but not quality; a threshold alone bounds quality but could return a huge set on a broad query. Applying top-k first caps the result size, then the threshold drops anything below the relevance floor. You get at most k chunks, all of which clear a quality bar \u2014 the best of both."}, {"q": "Why must thresholds be calibrated, not guessed?", "mnemonic": "Floor depends on metric + data", "steps": ["Metric sets range", "Data sets spread", "Guess = miss", "Calibrate on labels"], "a": "A threshold's right value depends on the distance metric and the actual score distribution of your corpus and queries. Too high and you discard valid answers, starving the LLM; too low and noise slips through. You calibrate it against a labelled query set \u2014 measuring where real answers score versus irrelevant chunks \u2014 rather than picking a number blind."}], "isArch": false}, {"num": "IX1", "group": "Indexes", "title": "Inverted File Index (IVF)", "filename": "ix1_ivf.py", "tags": [{"l": "Index", "c": "tp"}, {"l": "Partitioning", "c": "tc"}], "desc": "IVF partitions the vector space into clusters, then searches only the few clusters nearest the query instead of every vector. It trades a little recall for a large speedup \u2014 the first big step beyond brute force.", "usecase": "Your 10M refund-and-support chunks are too many to scan per query. IVF clusters them into 4,096 cells; a query probes only the ~16 nearest cells, cutting comparisons by orders of magnitude while keeping recall high.", "install": "pip install faiss-cpu numpy", "wn": ["IVF runs k-means to partition vectors into 'cells' (Voronoi regions) around centroids", "At query time, find the nprobe nearest centroids and search only those cells \u2014 skip the rest", "nprobe tunes the recall/speed tradeoff: more cells probed = higher recall, slower query", "Training builds the centroids; you must train on a representative sample before adding vectors", "IVF alone stores full vectors \u2014 combine with PQ (IX3) to also shrink memory"], "code_plain": "import faiss\nimport numpy as np\n\n\ndef build_ivf_index(vectors: np.ndarray, nlist: int = 4096) -> faiss.IndexIVFFlat:\n    \"\"\"\n    Partition the space into nlist cells via k-means, then\n    search only the cells nearest each query.\n    \"\"\"\n    d = vectors.shape[1]\n    quantizer = faiss.IndexFlatIP(d)                 # centroid assigner\n    index = faiss.IndexIVFFlat(quantizer, d, nlist, faiss.METRIC_INNER_PRODUCT)\n\n    faiss.normalize_L2(vectors)                      # cosine via inner product\n    index.train(vectors)                             # learn the centroids\n    index.add(vectors)                               # assign vectors to cells\n    return index\n\n\ndef search_ivf(index: faiss.IndexIVFFlat, query: np.ndarray,\n               k: int = 5, nprobe: int = 16) -> tuple:\n    \"\"\"nprobe = how many nearest cells to actually search.\"\"\"\n    index.nprobe = nprobe                            # recall vs speed knob\n    q = query.reshape(1, -1).astype(\"float32\")\n    faiss.normalize_L2(q)\n    scores, ids = index.search(q, k)\n    return ids[0], scores[0]\n\n\nif __name__ == \"__main__\":\n    rng = np.random.default_rng(0)\n    vecs = rng.random((100000, 128)).astype(\"float32\")\n    index = build_ivf_index(vecs, nlist=1024)\n    q = rng.random(128).astype(\"float32\")\n    ids, scores = search_ivf(index, q, k=3, nprobe=8)\n    print(\"top ids:\", ids)", "qs": [{"q": "How does IVF speed up search?", "mnemonic": "Search cells, not everything", "steps": ["Cluster into cells", "Query picks near cells", "Skip far cells", "Fewer comparisons"], "a": "IVF clusters vectors into cells around centroids. A query only compares against vectors in the few cells whose centroids are nearest to it, skipping the vast majority of the corpus. Instead of scanning all N vectors, you scan a small fraction \u2014 a large speedup for a small, tunable loss in recall."}, {"q": "What does nprobe control?", "mnemonic": "More probes, more recall", "steps": ["nprobe = cells searched", "Low: fast, misses", "High: slower, thorough", "Tune the tradeoff"], "a": "nprobe is how many of the nearest cells the query actually searches. A low nprobe searches few cells \u2014 very fast but may miss neighbours sitting just across a cell boundary, lowering recall. A high nprobe searches more cells, raising recall toward brute-force at the cost of speed. It's the primary recall/latency knob for IVF."}, {"q": "Why must IVF be trained before adding vectors?", "mnemonic": "Centroids come first", "steps": ["k-means needs data", "Learn centroids", "Then assign vectors", "Sample must represent"], "a": "IVF's cells are defined by centroids learned via k-means, so it must train on a representative sample first to place those centroids well. Only then can vectors be assigned to their nearest cell. If you train on unrepresentative data, the partition is lopsided \u2014 some cells overloaded, others empty \u2014 hurting both speed and recall."}], "isArch": false}, {"num": "IX2", "group": "Indexes", "title": "HNSW (Graph-Based ANN)", "filename": "ix2_hnsw.py", "tags": [{"l": "Index", "c": "tp"}, {"l": "Graph ANN", "c": "tg"}], "desc": "HNSW builds a layered proximity graph and greedily walks it toward the query's neighbourhood. It's the production workhorse of approximate search \u2014 excellent recall at very low latency, at the cost of memory and build time.", "usecase": "For sub-10ms retrieval over your refund corpus with 95%+ recall, HNSW is the default. It powers most modern vector DBs precisely because it hits that speed/quality point better than IVF for many workloads.", "install": "pip install hnswlib numpy", "wn": ["HNSW = Hierarchical Navigable Small World: a multi-layer graph where each node links to nearby nodes", "Upper layers are sparse (long hops); lower layers dense (fine steps) \u2014 like a skip list for vectors", "Search greedily hops toward the query, descending layers until it reaches the local neighbourhood", "M (links per node) and ef (search breadth) tune recall vs memory and latency", "Higher recall and lower latency than IVF for many workloads, but more memory and slower to build"], "code_plain": "import hnswlib\nimport numpy as np\n\n\ndef build_hnsw(vectors: np.ndarray, M: int = 16,\n               ef_construction: int = 200) -> hnswlib.Index:\n    \"\"\"\n    Build a navigable small-world graph.\n    M               = links per node (memory vs recall)\n    ef_construction = build-time breadth (quality vs build speed)\n    \"\"\"\n    dim = vectors.shape[1]\n    index = hnswlib.Index(space=\"cosine\", dim=dim)\n    index.init_index(max_elements=len(vectors), M=M,\n                     ef_construction=ef_construction)\n    index.add_items(vectors, np.arange(len(vectors)))\n    return index\n\n\ndef search_hnsw(index: hnswlib.Index, query: np.ndarray,\n                k: int = 5, ef: int = 64) -> tuple:\n    \"\"\"ef = search-time breadth. Must be >= k. Higher = better recall.\"\"\"\n    index.set_ef(ef)\n    ids, distances = index.knn_query(query.reshape(1, -1), k=k)\n    return ids[0], distances[0]\n\n\nif __name__ == \"__main__\":\n    rng = np.random.default_rng(0)\n    vecs = rng.random((100000, 128)).astype(\"float32\")\n    index = build_hnsw(vecs, M=16)\n    q = rng.random(128).astype(\"float32\")\n    ids, dist = search_hnsw(index, q, k=3, ef=64)\n    print(\"top ids:\", ids, \"distances:\", np.round(dist, 3))", "qs": [{"q": "How does HNSW find neighbours so fast?", "mnemonic": "Greedy walk down layers", "steps": ["Enter top layer", "Hop toward query", "Descend layers", "Land at neighbours"], "a": "HNSW is a layered graph: sparse top layers allow long hops across the space, dense bottom layers allow fine local steps. Search enters at the top, greedily hops to whichever neighbour is closer to the query, then descends layer by layer. It converges on the query's local neighbourhood in a logarithmic number of steps rather than scanning linearly."}, {"q": "What do M and ef control?", "mnemonic": "Links and breadth", "steps": ["M: links per node", "ef: search breadth", "Higher M: recall+memory", "Higher ef: recall+latency"], "a": "M is how many neighbours each node links to \u2014 higher M means a richer graph with better recall but more memory. ef is the breadth of the search frontier at query time \u2014 higher ef explores more candidates for better recall at higher latency. Together they tune the recall/memory/latency balance; ef is adjustable per query, M is fixed at build."}, {"q": "What's HNSW's main cost versus IVF?", "mnemonic": "Memory and build time", "steps": ["Graph links per node", "Big RAM footprint", "Slow to build", "Buys low latency"], "a": "HNSW stores multiple graph links per vector, giving it a larger memory footprint than IVF, and constructing the graph is comparatively slow. In return it delivers higher recall at lower query latency for many workloads. The tradeoff is RAM and build time versus query performance \u2014 usually worth it in latency-sensitive production retrieval."}], "isArch": false}, {"num": "IX3", "group": "Indexes", "title": "Product Quantization (PQ)", "filename": "ix3_pq.py", "tags": [{"l": "Index", "c": "tp"}, {"l": "Compression", "c": "tr"}], "desc": "Product Quantization compresses vectors by splitting each into sub-vectors and replacing each with a nearby codebook entry. A 1536-dim float vector can shrink ~32x, letting billions of vectors fit in RAM \u2014 at some accuracy cost.", "usecase": "Storing 100M full refund-corpus vectors in RAM is prohibitively expensive. PQ compresses each to a handful of bytes, so the whole index fits in memory and search stays fast, with recall recovered by a rerank pass.", "install": "pip install faiss-cpu numpy", "wn": ["PQ splits each vector into m sub-vectors and quantizes each to the nearest centroid in a small codebook", "A vector becomes m bytes (one codebook id per sub-vector) instead of d floats \u2014 massive compression", "Distances are approximated from precomputed codebook tables, so search stays fast", "Combine with IVF (IVFPQ) for partitioning + compression \u2014 the standard billion-scale recipe", "PQ loses precision; recover final accuracy by reranking the top candidates with full vectors"], "code_plain": "import faiss\nimport numpy as np\n\n\ndef build_ivfpq(vectors: np.ndarray, nlist: int = 1024,\n                m: int = 16, nbits: int = 8) -> faiss.IndexIVFPQ:\n    \"\"\"\n    IVF partitioning + PQ compression: the billion-scale recipe.\n    m     = sub-vectors per vector (more = better recall, more memory)\n    nbits = bits per sub-quantizer (8 -> 256-entry codebook)\n    \"\"\"\n    d = vectors.shape[1]\n    assert d % m == 0, \"dimension must divide evenly into m sub-vectors\"\n\n    quantizer = faiss.IndexFlatL2(d)\n    index = faiss.IndexIVFPQ(quantizer, d, nlist, m, nbits)\n\n    index.train(vectors)          # learns centroids AND codebooks\n    index.add(vectors)            # stores compressed codes, not full vectors\n    return index\n\n\ndef memory_comparison(n: int, d: int, m: int) -> dict:\n    \"\"\"Full float32 vectors vs PQ codes.\"\"\"\n    full_bytes = n * d * 4        # 4 bytes per float32\n    pq_bytes   = n * m            # 1 byte per sub-vector code\n    return {\n        \"full_mb\": round(full_bytes / 1e6, 1),\n        \"pq_mb\":   round(pq_bytes / 1e6, 1),\n        \"ratio\":   round(full_bytes / pq_bytes, 1),\n    }\n\n\nif __name__ == \"__main__\":\n    print(memory_comparison(n=10_000_000, d=512, m=16))\n    # -> ~32x smaller: full ~20.5 GB vs PQ ~160 MB", "qs": [{"q": "How does PQ compress a vector?", "mnemonic": "Split, then codebook each part", "steps": ["Split into sub-vectors", "Quantize each part", "Store codebook ids", "Bytes not floats"], "a": "PQ divides each vector into m equal sub-vectors and replaces every sub-vector with the id of the nearest entry in a learned codebook. So a vector becomes m small integer codes instead of d floating-point numbers. With a 256-entry codebook that's one byte per sub-vector \u2014 turning a multi-kilobyte vector into a handful of bytes."}, {"q": "Why combine PQ with IVF?", "mnemonic": "Partition plus compress", "steps": ["IVF: fewer to scan", "PQ: smaller each", "Together: IVFPQ", "Billion-scale in RAM"], "a": "IVF reduces how many vectors you compare by partitioning; PQ reduces how much each vector costs to store and compare by compressing. Combined as IVFPQ you get both wins at once \u2014 you scan only a few cells, and those cells hold tiny compressed codes. That's the standard recipe for fitting billions of vectors in memory with fast search."}, {"q": "Why rerank after a PQ search?", "mnemonic": "Compress to find, full to rank", "steps": ["PQ is approximate", "Coarse top candidates", "Rescore with full vectors", "Recover precision"], "a": "PQ distances are approximations from codebook tables, so the ordering of the top candidates is coarse. You use PQ to cheaply gather a candidate set, then rescore those few candidates with their full (uncompressed) vectors to get an accurate final ranking. This two-stage 'compress to find, full to rank' recovers most of the precision PQ gave up."}], "isArch": false}, {"num": "IX4", "group": "Indexes", "title": "Choosing an Index", "filename": "ix4_choosing_index.py", "tags": [{"l": "Index", "c": "tp"}, {"l": "Decision", "c": "ta"}], "desc": "There's no universal index \u2014 the choice is a mapping from corpus size, recall target, latency budget, and memory ceiling to Flat, HNSW, IVF, or IVFPQ. Knowing when each wins is the core index-design skill.", "usecase": "Interviewer: 'you have 200M chunks, need <20ms p99 and 90% recall on a fixed RAM budget.' The defensible answer walks size \u2192 HNSW-vs-IVFPQ \u2192 memory ceiling \u2192 IVFPQ with a rerank pass. This section is that reasoning.", "install": "pip install numpy", "wn": ["Small corpus (<100k): Flat / brute-force \u2014 exact, simple, fast enough, no tuning", "Medium, latency-critical, RAM available: HNSW \u2014 best recall/latency, higher memory", "Large, memory-constrained: IVFPQ \u2014 partition + compress, rerank to recover precision", "Recall target drives tuning: nprobe for IVF, ef for HNSW, m for PQ", "Always benchmark recall@k AND p99 latency on YOUR data \u2014 index choice is empirical, not dogma"], "code_plain": "from dataclasses import dataclass\n\n\n@dataclass\nclass IndexConstraints:\n    n_vectors:       int      # corpus size\n    recall_target:   float    # e.g. 0.95\n    latency_ms:      float    # p99 budget\n    memory_limited:  bool     # tight RAM ceiling?\n\n\ndef recommend_index(c: IndexConstraints) -> dict:\n    \"\"\"Map constraints to a vector index choice.\"\"\"\n\n    if c.n_vectors < 100_000:\n        choice = \"Flat (brute-force)\"\n        why = \"Small enough for exact search; no approximation needed.\"\n\n    elif c.memory_limited or c.n_vectors > 50_000_000:\n        choice = \"IVFPQ + rerank\"\n        why = \"Compression fits huge corpora in RAM; rerank restores precision.\"\n\n    elif c.latency_ms < 20 and c.recall_target >= 0.9:\n        choice = \"HNSW\"\n        why = \"Best recall-at-low-latency when memory is available.\"\n\n    else:\n        choice = \"IVF (Flat cells)\"\n        why = \"Solid partitioned search; simpler and lighter than HNSW.\"\n\n    knobs = {\n        \"HNSW\":         \"tune ef (search breadth), M (graph degree)\",\n        \"IVF (Flat cells)\": \"tune nprobe (cells searched)\",\n        \"IVFPQ + rerank\":   \"tune nprobe, m (sub-vectors), rerank depth\",\n        \"Flat (brute-force)\": \"no tuning required\",\n    }[choice]\n\n    return {\"index\": choice, \"why\": why, \"tune\": knobs}\n\n\nif __name__ == \"__main__\":\n    print(recommend_index(IndexConstraints(200_000_000, 0.90, 20, True)))", "qs": [{"q": "When is brute-force still the right choice?", "mnemonic": "Small enough to be exact", "steps": ["Under ~100k vectors", "Scan is fast", "Zero tuning", "Exact beats approx"], "a": "For small corpora \u2014 roughly under 100k vectors \u2014 brute-force scans fast enough to meet most latency budgets while being perfectly exact and needing zero tuning. Adding an approximate index there just introduces recall loss and complexity for no real speed benefit. Reach for ANN only when the corpus outgrows what an exact scan can serve in time."}, {"q": "HNSW or IVFPQ \u2014 what decides?", "mnemonic": "Memory ceiling decides", "steps": ["RAM available: HNSW", "RAM tight: IVFPQ", "HNSW: low latency", "IVFPQ: huge scale"], "a": "The deciding factor is the memory ceiling versus corpus size. If you can afford the RAM, HNSW gives the best recall at low latency. If the corpus is so large that full vectors won't fit, IVFPQ compresses them to fit and you add a rerank pass to recover precision. Latency target and recall goal then fine-tune the knobs within that choice."}, {"q": "Why benchmark on your own data?", "mnemonic": "Index choice is empirical", "steps": ["Data shape varies", "Recall data-dependent", "Measure recall + p99", "Decide on numbers"], "a": "Index performance depends on your data's dimensionality, clustering, and query distribution \u2014 published benchmarks may not transfer. The disciplined approach measures recall@k and p99 latency for candidate indexes on your actual vectors and queries, then picks based on those numbers. Index selection is an empirical engineering decision, not a dogmatic default."}], "isArch": false}, {"num": "QY1", "group": "Query-Side", "title": "Query Embedding & Preprocessing", "filename": "qy1_query_embedding.py", "tags": [{"l": "Query", "c": "tb"}, {"l": "Preprocessing", "c": "tc"}], "desc": "The query is embedded just like a chunk \u2014 but small preprocessing choices (instruction prefixes, cleaning, expansion) can meaningfully shift where the query lands in vector space and which chunks it retrieves.", "usecase": "A terse query 'refund time?' embeds into a vague region. Light normalisation and an instruction prefix ('Represent this question for retrieval:') sharpen its vector so it lands nearer the precise refund-timing chunk.", "install": "pip install openai numpy", "wn": ["Embed the query with the same model as the documents \u2014 non-negotiable for comparable vectors", "Some models expect an asymmetric setup: a query prefix distinct from the document prefix (E5, BGE, Instructor)", "Clean the query lightly \u2014 trim, collapse whitespace \u2014 but don't over-process natural language", "Very short queries embed poorly; expansion (QY4) or a prefix can help them land more precisely", "Cache query embeddings \u2014 repeated or common questions shouldn't be re-embedded every time"], "code_plain": "import numpy as np\nfrom openai import OpenAI\n\nclient = OpenAI()\n\n\ndef preprocess_query(raw: str) -> str:\n    \"\"\"Light normalisation only \u2014 don't mangle natural language.\"\"\"\n    return \" \".join(raw.strip().split())\n\n\ndef embed_query(raw: str, instruct: bool = False) -> np.ndarray:\n    \"\"\"\n    Embed a query. Some models (E5/BGE/Instructor) want an\n    asymmetric query prefix distinct from the document prefix.\n    \"\"\"\n    text = preprocess_query(raw)\n    if instruct:\n        text = f\"Represent this question for retrieving policy answers: {text}\"\n\n    resp = client.embeddings.create(\n        model=\"text-embedding-3-small\", input=[text],\n    )\n    return np.array(resp.data[0].embedding)\n\n\nclass QueryCache:\n    \"\"\"Avoid re-embedding common or repeated questions.\"\"\"\n\n    def __init__(self) -> None:\n        self._cache: dict[str, np.ndarray] = {}\n\n    def embed(self, raw: str) -> np.ndarray:\n        key = preprocess_query(raw).lower()\n        if key not in self._cache:\n            self._cache[key] = embed_query(raw)\n        return self._cache[key]\n\n\nif __name__ == \"__main__\":\n    cache = QueryCache()\n    v1 = cache.embed(\"refund time?\")\n    v2 = cache.embed(\"Refund  time?\")   # cache hit after normalisation\n    print(\"cached:\", np.allclose(v1, v2))", "qs": [{"q": "What is asymmetric embedding?", "mnemonic": "Query prefix \u2260 doc prefix", "steps": ["Model trained asymmetric", "Query gets prefix A", "Doc gets prefix B", "Improves matching"], "a": "Some embedding models (E5, BGE, Instructor) are trained so queries and documents get different instruction prefixes \u2014 a short question is represented differently from a long passage it should match. Using the correct query-side prefix places the query where the model expects, improving retrieval. Skipping it, or using the document prefix, degrades matching on these models."}, {"q": "Why not heavily preprocess a natural-language query?", "mnemonic": "Embedders like natural text", "steps": ["Model trained on prose", "Over-cleaning removes signal", "Light trim only", "Keep it natural"], "a": "Modern embedders are trained on natural language, so aggressive preprocessing \u2014 stopword removal, stemming, punctuation stripping \u2014 throws away signal the model uses. Light normalisation (trimming, collapsing whitespace) is safe, but the query should stay close to how a person phrased it. Over-processing is a habit from keyword search that hurts here."}, {"q": "Why cache query embeddings?", "mnemonic": "Common questions repeat", "steps": ["Same question asked", "Re-embed wastes calls", "Cache by normal form", "Reuse the vector"], "a": "In production many users ask the same or near-identical questions. Re-embedding each one repeats an API call and adds latency for no new information. Caching by the normalised query text reuses the vector for repeats, cutting cost and speeding response. Normalising the cache key means trivially different phrasings still hit the cache."}], "isArch": false}, {"num": "QY2", "group": "Query-Side", "title": "Metadata Filtering (Pre vs Post)", "filename": "qy2_metadata_filtering.py", "tags": [{"l": "Query", "c": "tb"}, {"l": "Filtering", "c": "tg"}], "desc": "Metadata filtering restricts search to chunks matching structured conditions \u2014 version, category, access tier. Whether you filter before or after the vector search changes both correctness and performance dramatically.", "usecase": "A user may only see the current policy version and their own access tier. Pre-filtering to eligible chunks before vector search guarantees the top-k are both relevant AND permitted \u2014 post-filtering could return an empty set.", "install": "pip install numpy", "wn": ["Pre-filter: restrict the candidate set by metadata BEFORE vector search \u2014 correct and secure, needs index support", "Post-filter: vector search first, then drop non-matching results \u2014 simple but can return fewer than k, or zero", "Access control MUST be pre-filter \u2014 you cannot rely on post-filtering to enforce security boundaries", "Pre-filtering on high-selectivity conditions (rare tiers) can slow ANN indexes that assume a full graph", "Modern vector DBs support filtered ANN natively \u2014 filter pushed into the graph/cell traversal"], "code_plain": "import numpy as np\n\n\ndef pre_filter_search(query: np.ndarray, vectors: np.ndarray,\n                      metadata: list[dict], k: int,\n                      conditions: dict) -> list[dict]:\n    \"\"\"\n    Filter the candidate set FIRST, then search only eligible vectors.\n    Correct for access control: forbidden chunks never enter search.\n    \"\"\"\n    eligible = [\n        i for i, m in enumerate(metadata)\n        if all(m.get(key) == val for key, val in conditions.items())\n    ]\n    if not eligible:\n        return []\n\n    sub = vectors[eligible]\n    sub = sub / np.linalg.norm(sub, axis=1, keepdims=True)\n    q = query / np.linalg.norm(query)\n    scores = sub @ q\n\n    top = np.argsort(scores)[::-1][:k]\n    return [\n        {\"id\": metadata[eligible[i]][\"id\"], \"score\": float(scores[i])}\n        for i in top\n    ]\n\n\ndef post_filter_search(ranked: list[dict], metadata_by_id: dict,\n                       conditions: dict, k: int) -> list[dict]:\n    \"\"\"\n    Search first, filter after. Simpler, but may return < k\n    (or nothing) if the top hits fail the conditions.\n    NEVER use this path for access control.\n    \"\"\"\n    out = []\n    for hit in ranked:\n        m = metadata_by_id[hit[\"id\"]]\n        if all(m.get(key) == val for key, val in conditions.items()):\n            out.append(hit)\n        if len(out) == k:\n            break\n    return out", "qs": [{"q": "Why must access control be pre-filter, not post-filter?", "mnemonic": "Forbidden must never rank", "steps": ["Post: search all first", "Restricted chunk ranks", "Leak risk in top-k", "Pre-filter excludes it"], "a": "Post-filtering runs vector search over everything, so restricted chunks are ranked and only dropped afterward \u2014 if the drop logic ever fails or the chunk influences scoring, forbidden content can leak. Pre-filtering removes ineligible chunks before search, so a user's query is only ever compared against permitted vectors. Security boundaries must be enforced at the pre-filter stage, structurally."}, {"q": "When can post-filtering return too few results?", "mnemonic": "Top-k all fail the filter", "steps": ["Search returns k", "Most fail condition", "Few survive", "Below target k"], "a": "Post-filtering keeps only the search hits that pass the condition. If the true nearest neighbours mostly fail the filter \u2014 say the query's best matches are all the wrong version \u2014 you're left with far fewer than k results, sometimes zero, even though eligible answers exist deeper in the ranking. Pre-filtering avoids this by searching only eligible chunks in the first place."}, {"q": "What's the performance catch with pre-filtering on ANN?", "mnemonic": "Filters fight the graph", "steps": ["ANN assumes full graph", "High-selectivity filter", "Few nodes survive", "Traversal degrades"], "a": "ANN indexes like HNSW rely on a dense, fully-connected graph to navigate. A highly selective pre-filter removes most nodes, breaking the graph's connectivity so traversal may fail to reach the eligible neighbours or fall back to slow scans. Modern vector DBs mitigate this with filtered-ANN algorithms that push the filter into traversal, but naive pre-filtering on rare conditions can hurt."}], "isArch": false}, {"num": "QY3", "group": "Query-Side", "title": "Hybrid Search at Query Time", "filename": "qy3_hybrid_query.py", "tags": [{"l": "Query", "c": "tb"}, {"l": "Fusion", "c": "tg"}], "desc": "Hybrid search runs the question through both a dense vector search and a sparse keyword search, then fuses the two rankings. It catches exact terms the embedder blurs while keeping semantic understanding for paraphrases.", "usecase": "'What does error BK-4021 mean for my refund?' needs semantic match on 'refund' (dense) and exact match on 'BK-4021' (sparse). Hybrid retrieval returns chunks strong on either, so neither signal is lost.", "install": "pip install rank-bm25 numpy", "wn": ["Run dense (semantic) and sparse (BM25) retrieval independently on the same question", "Fuse the two ranked lists with Reciprocal Rank Fusion \u2014 rank-based, so incomparable score scales don't matter", "Dense catches paraphrases and intent; sparse catches exact IDs, codes, and rare terms", "Hybrid degrades gracefully \u2014 when one retriever is weak for a query, the other still surfaces the answer", "This is the query-time counterpart to storing both dense and sparse vectors at index time"], "code_plain": "from collections import defaultdict\nfrom rank_bm25 import BM25Okapi\nimport numpy as np\nimport re\n\n\ndef tokenize(text: str) -> list[str]:\n    return re.findall(r\"[a-z0-9\\-]+\", text.lower())\n\n\ndef reciprocal_rank_fusion(lists: list[list[str]], k: int = 60) -> list[tuple]:\n    \"\"\"Fuse ranked lists by position: score = sum 1 / (k + rank).\"\"\"\n    scores: dict[str, float] = defaultdict(float)\n    for ranked in lists:\n        for rank, doc_id in enumerate(ranked):\n            scores[doc_id] += 1.0 / (k + rank)\n    return sorted(scores.items(), key=lambda x: x[1], reverse=True)\n\n\ndef hybrid_search(question: str, q_vector: np.ndarray,\n                  doc_vectors: np.ndarray, chunks: list[str],\n                  ids: list[str], bm25: BM25Okapi, k: int = 5) -> list[tuple]:\n    \"\"\"Dense + sparse, fused with RRF.\"\"\"\n    # dense ranking\n    dv = doc_vectors / np.linalg.norm(doc_vectors, axis=1, keepdims=True)\n    dense_scores = dv @ (q_vector / np.linalg.norm(q_vector))\n    dense_ids = [ids[i] for i in np.argsort(dense_scores)[::-1][:k * 2]]\n\n    # sparse ranking\n    sparse_scores = bm25.get_scores(tokenize(question))\n    sparse_ids = [ids[i] for i in np.argsort(sparse_scores)[::-1][:k * 2]]\n\n    fused = reciprocal_rank_fusion([dense_ids, sparse_ids])\n    return fused[:k]", "qs": [{"q": "Why fuse dense and sparse instead of picking one?", "mnemonic": "Each covers the other's gap", "steps": ["Dense: paraphrase", "Sparse: exact IDs", "Query needs both", "Fuse to cover all"], "a": "Dense search understands meaning but blurs exact tokens like 'BK-4021'; sparse search nails exact terms but misses paraphrases. Real questions mix both \u2014 semantic intent plus specific identifiers. Running both and fusing means a query gets the strengths of each, so you don't fail whole classes of questions that one method alone would fumble."}, {"q": "Why fuse on rank rather than raw score?", "mnemonic": "Scales don't compare", "steps": ["Cosine 0-1", "BM25 0-30+", "Averaging skews", "Rank is scale-free"], "a": "Dense cosine scores sit in [0,1] while BM25 scores range into the tens, so averaging them lets one dominate arbitrarily. Reciprocal Rank Fusion uses only each document's rank position in its list, which is scale-free. A top-ranked hit contributes equally whether it came from dense or sparse, making the fusion robust to their incompatible score ranges."}, {"q": "How does hybrid degrade gracefully?", "mnemonic": "One weak, other carries", "steps": ["Exact query", "Dense weak here", "Sparse still finds", "Answer surfaces"], "a": "When a query is dominated by an exact term, dense retrieval may rank the right chunk poorly \u2014 but sparse ranks it highly, so RRF still surfaces it. The reverse holds for paraphrased queries where sparse struggles. Because either retriever can carry a query the other handles badly, hybrid rarely fails completely \u2014 it degrades to whichever signal works."}], "isArch": false}, {"num": "QY4", "group": "Query-Side", "title": "Multi-Query & HyDE", "filename": "qy4_multiquery_hyde.py", "tags": [{"l": "Query", "c": "tb"}, {"l": "Expansion", "c": "ta"}], "desc": "When a single query vector retrieves poorly, expand it. Multi-query generates several rephrasings and unions their results; HyDE generates a hypothetical answer and searches with that \u2014 both pull in relevant chunks a lone query misses.", "usecase": "A vague question 'refund stuff?' retrieves weakly. Multi-query rephrases it into three precise questions; HyDE drafts a plausible refund-policy answer and searches with it \u2014 landing near the real policy chunks the original missed.", "install": "pip install langchain-openai numpy", "wn": ["Multi-query: an LLM rephrases the question N ways; search each and union (or RRF) the results", "HyDE (Hypothetical Document Embeddings): the LLM drafts a fake answer, you embed and search with THAT", "HyDE works because a hypothetical answer sits nearer real answer chunks than the question does", "Both trade an extra LLM call for higher recall on vague, short, or awkwardly phrased queries", "Deduplicate the unioned results \u2014 the same chunk will surface from multiple query variants"], "code_plain": "from langchain_openai import ChatOpenAI\nfrom langchain_core.prompts import ChatPromptTemplate\n\nllm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)\n\nMULTI_PROMPT = ChatPromptTemplate.from_template(\n    \"Generate 3 different rephrasings of this question, \"\n    \"one per line, no numbering:\\n\\n{question}\"\n)\n\nHYDE_PROMPT = ChatPromptTemplate.from_template(\n    \"Write a short, plausible answer to this question as if \"\n    \"quoting a policy document:\\n\\n{question}\"\n)\n\n\ndef multi_query(question: str) -> list[str]:\n    \"\"\"N rephrasings -> search each -> union results.\"\"\"\n    out = (MULTI_PROMPT | llm).invoke({\"question\": question}).content\n    variants = [line.strip() for line in out.splitlines() if line.strip()]\n    return [question, *variants]        # include the original\n\n\ndef hyde_query(question: str) -> str:\n    \"\"\"\n    Draft a hypothetical answer and search with IT.\n    A fake answer sits closer to real answer chunks than the question.\n    \"\"\"\n    return (HYDE_PROMPT | llm).invoke({\"question\": question}).content\n\n\ndef union_dedup(result_lists: list[list[str]]) -> list[str]:\n    \"\"\"Merge results from all variants, keeping first-seen order.\"\"\"\n    seen, merged = set(), []\n    for lst in result_lists:\n        for doc_id in lst:\n            if doc_id not in seen:\n                seen.add(doc_id)\n                merged.append(doc_id)\n    return merged", "qs": [{"q": "Why does HyDE search with a fake answer?", "mnemonic": "Answers sit near answers", "steps": ["Question phrased as ask", "Answer phrased as statement", "Fake answer near real", "Better neighbours"], "a": "A question and its answer are phrased differently \u2014 one asks, one states \u2014 so the question vector may sit some distance from the answer chunks. HyDE has the LLM draft a hypothetical answer, which is phrased like the real answer chunks and therefore lands near them in vector space. Searching with that draft retrieves the true answer chunks more reliably than the raw question."}, {"q": "What does multi-query buy you?", "mnemonic": "Many angles, more recall", "steps": ["One phrasing misses", "Rephrase N ways", "Union results", "Catch more answers"], "a": "A single phrasing embeds to one point and may miss chunks that a different wording would have found. Multi-query has an LLM rephrase the question several ways, searches each, and unions the results \u2014 covering multiple angles on the same intent. It raises recall on vague or awkwardly worded questions at the cost of extra searches and an LLM call."}, {"q": "Why deduplicate the unioned results?", "mnemonic": "Same chunk, many variants", "steps": ["Variants overlap", "Chunk found repeatedly", "Dupes waste context", "Keep first-seen"], "a": "The whole point of expansion is that variants retrieve overlapping sets, so the same strong chunk surfaces from several of them. Without dedup you'd pass duplicates to the LLM, wasting context window and over-weighting repeated chunks. Deduplicating (keeping first-seen order or refusing by RRF) gives a clean, diverse candidate set from the combined recall."}], "isArch": false}, {"num": "RK1", "group": "Ranking", "title": "Reranking (Cross-Encoder)", "filename": "rk1_reranking.py", "tags": [{"l": "Ranking", "c": "tr"}, {"l": "Precision", "c": "tc"}], "desc": "Vector search is fast but approximate at judging relevance. A cross-encoder rerank pass reads the query and each candidate together and scores true relevance \u2014 dramatically sharpening the final ordering of the top results.", "usecase": "Vector search returns 50 plausible refund chunks; the exact answer sits at rank 12. A cross-encoder reranker reads the question against each candidate and lifts that precise chunk to rank 1 before it reaches the LLM.", "install": "pip install sentence-transformers numpy", "wn": ["Bi-encoders (embeddings) encode query and doc separately \u2014 fast, but relevance is only approximate", "Cross-encoders encode query and doc TOGETHER \u2014 far more accurate relevance, but too slow to run on the whole corpus", "The pattern: vector search retrieves a broad candidate set, the cross-encoder reranks just those", "Rerank depth is a knob: rerank top-50 to get a great top-5, trading a little latency for big precision gains", "Reranking is often the single highest-ROI addition to a naive vector-search pipeline"], "code_plain": "from sentence_transformers import CrossEncoder\nimport numpy as np\n\n# Cross-encoder: reads (query, doc) jointly for accurate relevance\nreranker = CrossEncoder(\"cross-encoder/ms-marco-MiniLM-L-6-v2\")\n\n\ndef retrieve_and_rerank(question: str, candidates: list[dict],\n                        top_n: int = 5) -> list[dict]:\n    \"\"\"\n    Two-stage retrieval:\n      1. vector search already produced `candidates` (broad, approximate)\n      2. cross-encoder rescoring for precise final ranking\n    \"\"\"\n    pairs = [(question, c[\"text\"]) for c in candidates]\n    scores = reranker.predict(pairs)              # joint relevance scores\n\n    for c, s in zip(candidates, scores):\n        c[\"rerank_score\"] = float(s)\n\n    reranked = sorted(candidates, key=lambda c: c[\"rerank_score\"], reverse=True)\n    return reranked[:top_n]\n\n\nif __name__ == \"__main__\":\n    question = \"how long do enterprise refunds take?\"\n    candidates = [\n        {\"text\": \"Monthly plans are non-refundable after 48 hours.\"},\n        {\"text\": \"Enterprise refunds are processed within 5-7 business days.\"},\n        {\"text\": \"Refunds return to the original payment method.\"},\n    ]\n    for c in retrieve_and_rerank(question, candidates, top_n=2):\n        print(f\"{c['rerank_score']:.2f}  {c['text']}\")", "qs": [{"q": "Why is a cross-encoder more accurate than a bi-encoder?", "mnemonic": "Reads both together", "steps": ["Bi-encoder: separate", "No query-doc interaction", "Cross: joint read", "Sees the interplay"], "a": "A bi-encoder embeds query and document independently, so it never sees how specific query words relate to specific document words \u2014 relevance is inferred from vector proximity alone. A cross-encoder feeds the query and document through the model together, letting attention directly compare them. That joint read captures fine-grained relevance a bi-encoder approximates, giving much sharper scores."}, {"q": "Why not run the cross-encoder on the whole corpus?", "mnemonic": "Accurate but slow", "steps": ["Joint pass per doc", "No precompute", "Millions too slow", "Rerank a shortlist"], "a": "Because a cross-encoder must run a full model pass for every (query, document) pair at query time \u2014 nothing can be precomputed the way embeddings can. Doing that across millions of chunks per query is far too slow. So you let fast vector search shortlist a few dozen candidates, then spend the cross-encoder's cost only on reranking that small set."}, {"q": "Why is reranking often the highest-ROI upgrade?", "mnemonic": "Big precision, small change", "steps": ["Naive top-k noisy", "Add rerank stage", "Answer jumps to top", "Minimal plumbing"], "a": "A naive vector pipeline often retrieves the right chunk but ranks it below noise, so the LLM sees it buried or misses it. Dropping in a rerank stage over the existing candidate set lifts the true answer to the top with minimal architectural change \u2014 no re-indexing, no new data. The precision gain per unit of engineering effort is usually the best available."}], "isArch": false}, {"num": "RK2", "group": "Ranking", "title": "Maximal Marginal Relevance (MMR)", "filename": "rk2_mmr.py", "tags": [{"l": "Ranking", "c": "tr"}, {"l": "Diversity", "c": "tg"}], "desc": "Pure relevance ranking can return five near-identical chunks. MMR balances relevance against diversity \u2014 each pick must be relevant to the query yet different from what's already selected, so the LLM sees complementary context.", "usecase": "Your top-5 refund chunks are five paraphrases of the same sentence \u2014 the LLM learns nothing new from four of them. MMR swaps redundant picks for chunks covering processing time, method, AND eligibility, widening the answer.", "install": "pip install numpy", "wn": ["Relevance-only ranking often returns redundant, near-duplicate chunks \u2014 wasted context window", "MMR scores each candidate as: \u03bb\u00b7relevance \u2212 (1\u2212\u03bb)\u00b7max similarity to already-chosen chunks", "\u03bb tunes the balance: \u03bb=1 is pure relevance, \u03bb=0 is pure diversity", "It selects iteratively \u2014 each pick depends on what's already in the result set", "Use MMR when coverage matters (synthesis, summarisation) more than returning the single best chunk repeatedly"], "code_plain": "import numpy as np\n\n\ndef mmr(query_vec: np.ndarray, cand_vecs: np.ndarray,\n        cand_ids: list[str], k: int = 5, lam: float = 0.6) -> list[str]:\n    \"\"\"\n    Maximal Marginal Relevance.\n    score = lam * relevance - (1 - lam) * redundancy\n    Picks relevant-but-different chunks, iteratively.\n    \"\"\"\n    # normalise for cosine\n    q = query_vec / np.linalg.norm(query_vec)\n    V = cand_vecs / np.linalg.norm(cand_vecs, axis=1, keepdims=True)\n\n    relevance = V @ q                     # similarity to the query\n    selected: list[int] = []\n    remaining = list(range(len(cand_ids)))\n\n    while remaining and len(selected) < k:\n        best_i, best_score = None, -1e9\n        for i in remaining:\n            if selected:\n                # redundancy = max similarity to anything already chosen\n                redundancy = max(float(V[i] @ V[j]) for j in selected)\n            else:\n                redundancy = 0.0\n            score = lam * relevance[i] - (1 - lam) * redundancy\n            if score > best_score:\n                best_score, best_i = score, i\n        selected.append(best_i)\n        remaining.remove(best_i)\n\n    return [cand_ids[i] for i in selected]\n\n\nif __name__ == \"__main__\":\n    rng = np.random.default_rng(0)\n    q = rng.random(64)\n    cands = rng.random((10, 64))\n    print(mmr(q, cands, [f\"c{i}\" for i in range(10)], k=3, lam=0.6))", "qs": [{"q": "What problem does MMR solve?", "mnemonic": "Kill redundant top-k", "steps": ["Top-5 all similar", "Same fact repeated", "LLM gains nothing", "MMR diversifies"], "a": "Relevance-only ranking can fill the top-k with near-duplicate chunks \u2014 five ways of saying the same thing. The LLM gains no new information from the duplicates, and context window is wasted. MMR penalises a candidate for being similar to already-selected chunks, so the result set covers different facets of the answer instead of repeating one."}, {"q": "What does the \u03bb parameter control?", "mnemonic": "Relevance vs diversity dial", "steps": ["\u03bb=1: pure relevance", "\u03bb=0: pure diversity", "Mid: balanced", "Tune to task"], "a": "\u03bb balances the two terms: at \u03bb=1 MMR is pure relevance (identical to normal ranking), at \u03bb=0 it maximises diversity regardless of query fit. Intermediate values trade off \u2014 each pick must be relevant to the query yet distinct from prior picks. You raise \u03bb when the single best chunk matters, lower it when broad coverage does."}, {"q": "When should you use MMR over plain reranking?", "mnemonic": "Coverage beats repetition", "steps": ["Synthesis task", "Need many facets", "Avoid duplicates", "MMR spreads coverage"], "a": "Use MMR when the answer requires synthesising several distinct pieces \u2014 summarisation, multi-aspect questions, research \u2014 where returning the same top fact repeatedly is useless. Plain reranking is better when you just need the single most relevant chunk. MMR shines precisely when the LLM benefits from complementary, non-overlapping context rather than the highest-scoring duplicates."}], "isArch": false}, {"num": "RK3", "group": "Ranking", "title": "Reciprocal Rank Fusion (Deep Dive)", "filename": "rk3_rrf_deep.py", "tags": [{"l": "Ranking", "c": "tr"}, {"l": "Fusion", "c": "ta"}], "desc": "RRF fuses any number of ranked lists \u2014 dense, sparse, multi-query, multiple indexes \u2014 into one, using only rank position. It's the glue that combines every retrieval signal in this lab into a single robust ordering.", "usecase": "You now have four rankings for one question: dense, sparse, a HyDE search, and a reranker. RRF merges all four into one final list where chunks strong across multiple signals rise to the top \u2014 no score calibration needed.", "install": "pip install numpy", "wn": ["RRF fuses N ranked lists: score(doc) = \u03a3 over lists of 1 / (k + rank_in_list)", "It uses ONLY rank position, so lists with wildly different score scales combine cleanly", "A document ranked highly by multiple retrievers accumulates score from each \u2014 consensus wins", "The constant k (~60) smooths how sharply top ranks dominate lower ones", "RRF is the standard fusion for hybrid, multi-query, and multi-index retrieval \u2014 simple and hard to beat"], "code_plain": "from collections import defaultdict\n\n\ndef rrf(ranked_lists: dict[str, list[str]], k: int = 60,\n        weights: dict[str, float] | None = None) -> list[tuple[str, float]]:\n    \"\"\"\n    Weighted Reciprocal Rank Fusion over named ranked lists.\n    score(doc) = \u03a3_lists  weight * 1 / (k + rank)\n    Rank-only: incomparable score scales fuse cleanly.\n    \"\"\"\n    weights = weights or {name: 1.0 for name in ranked_lists}\n    scores: dict[str, float] = defaultdict(float)\n    contributors: dict[str, list[str]] = defaultdict(list)\n\n    for name, ranked in ranked_lists.items():\n        w = weights.get(name, 1.0)\n        for rank, doc_id in enumerate(ranked):\n            scores[doc_id] += w * (1.0 / (k + rank))\n            contributors[doc_id].append(name)\n\n    fused = sorted(scores.items(), key=lambda x: x[1], reverse=True)\n    return fused\n\n\nif __name__ == \"__main__\":\n    lists = {\n        \"dense\":  [\"c3\", \"c1\", \"c7\", \"c2\"],\n        \"sparse\": [\"c1\", \"c9\", \"c3\", \"c5\"],\n        \"hyde\":   [\"c3\", \"c4\", \"c1\", \"c8\"],\n    }\n    # c3 and c1 appear high across multiple lists -> they win by consensus\n    for doc_id, score in rrf(lists)[:4]:\n        print(f\"{doc_id}  {score:.4f}\")", "qs": [{"q": "Why does RRF combine incompatible retrievers so well?", "mnemonic": "Rank erases scale", "steps": ["Scores incomparable", "Ranks universal", "Fuse by position", "Any signal combines"], "a": "Every retriever \u2014 dense, sparse, reranker \u2014 produces scores on its own scale, so they can't be averaged meaningfully. RRF discards the raw scores and uses only rank position, which is universal: being ranked first means the same thing everywhere. This lets you fuse any set of retrievers, however different their scoring, into one coherent ordering without calibration."}, {"q": "How does consensus emerge in RRF?", "mnemonic": "Many lists, score stacks", "steps": ["Doc in one list", "Small score", "Doc in three lists", "Scores add up"], "a": "Each list a document appears in adds 1/(k+rank) to its total. A chunk ranked highly by several retrievers accumulates a contribution from each, so its fused score stacks up above chunks that only one retriever liked. This naturally rewards consensus \u2014 the chunks multiple independent signals agree on rise to the top, which are usually the safest picks."}, {"q": "What role does the weight parameter play?", "mnemonic": "Trust some signals more", "steps": ["Reranker reliable", "Give it weight 2", "Sparse noisy", "Weight it down"], "a": "Weighted RRF lets you express that some retrievers are more trustworthy than others \u2014 you might weight a cross-encoder reranker higher than a raw BM25 list. Each list's rank contribution is scaled by its weight before summing. This tunes the fusion toward your stronger signals while still letting weaker ones break ties and contribute recall."}], "isArch": false}, {"num": "PR1", "group": "Production", "title": "Vector DB Architecture", "filename": "pr1_vectordb_arch.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Architecture", "c": "tc"}], "desc": "A production vector store is more than an index: it's persistence, metadata, filtering, replication, and an upsert path \u2014 packaged as pgvector, Qdrant, Weaviate, Milvus, or a managed service. The choice shapes your whole retrieval stack.", "usecase": "Your refund-RAG needs durable storage, metadata filtering by version and access tier, and horizontal scale. pgvector keeps it in your existing Postgres; a dedicated store like Qdrant gives richer filtered-ANN at higher operational cost.", "install": "pip install qdrant-client psycopg numpy", "wn": ["A vector DB bundles the ANN index with persistence, metadata storage, filtering, and replication", "pgvector: vectors inside Postgres \u2014 one system, transactional, great when your data already lives there", "Dedicated stores (Qdrant, Weaviate, Milvus): richer filtered-ANN, sharding, and scale, but another system to run", "The upsert path must be idempotent (keyed by chunk id/hash) so re-indexing is safe", "Match the store to your scale, filtering needs, and operational appetite \u2014 not to hype"], "code_plain": "from qdrant_client import QdrantClient\nfrom qdrant_client.models import (\n    Distance, VectorParams, PointStruct, Filter,\n    FieldCondition, MatchValue,\n)\n\n\ndef setup_collection(client: QdrantClient, name: str, dim: int) -> None:\n    \"\"\"Create a collection with cosine distance and HNSW under the hood.\"\"\"\n    client.recreate_collection(\n        collection_name=name,\n        vectors_config=VectorParams(size=dim, distance=Distance.COSINE),\n    )\n\n\ndef upsert_chunks(client: QdrantClient, name: str,\n                  ids: list[str], vectors, payloads: list[dict]) -> None:\n    \"\"\"Idempotent upsert: same id overwrites, so re-indexing is safe.\"\"\"\n    points = [\n        PointStruct(id=i, vector=list(v), payload=p)\n        for i, v, p in zip(ids, vectors, payloads)\n    ]\n    client.upsert(collection_name=name, points=points)\n\n\ndef filtered_search(client: QdrantClient, name: str, query_vector,\n                    version: str, k: int = 5):\n    \"\"\"Native filtered-ANN: filter pushed INTO the index traversal.\"\"\"\n    flt = Filter(must=[\n        FieldCondition(key=\"version\", match=MatchValue(value=version)),\n    ])\n    return client.search(\n        collection_name=name,\n        query_vector=list(query_vector),\n        query_filter=flt,          # pre-filter, evaluated during traversal\n        limit=k,\n    )", "qs": [{"q": "When is pgvector the right choice over a dedicated store?", "mnemonic": "Data already in Postgres", "steps": ["Already run Postgres", "Moderate scale", "Want transactions", "pgvector fits"], "a": "pgvector shines when your source data already lives in Postgres and your scale is moderate. You get vectors, metadata, and transactional consistency in one system you already operate \u2014 no extra service, no sync pipeline, joins against your relational data for free. Dedicated stores earn their operational cost when you need billion-scale, advanced filtered-ANN, or sharding pgvector can't easily provide."}, {"q": "Why must the upsert path be idempotent?", "mnemonic": "Re-index without duplicates", "steps": ["Re-runs happen", "Same id again", "Overwrite not duplicate", "Safe to repeat"], "a": "Indexing jobs get re-run after failures, on schedule, or during backfills. If upserts weren't idempotent, re-processing a chunk would create a duplicate vector, bloating the index and skewing retrieval with repeated hits. Keying upserts by a stable chunk id or content hash means re-running overwrites the same record, so the operation is safe to repeat any number of times."}, {"q": "What is filtered-ANN and why does it matter?", "mnemonic": "Filter inside traversal", "steps": ["Naive: filter breaks graph", "Filtered-ANN: filter in traversal", "Reaches eligible neighbours", "Fast and correct"], "a": "Naive pre-filtering removes nodes from an ANN graph, breaking the connectivity it needs to navigate. Filtered-ANN pushes the metadata condition into the traversal itself, so the search only walks toward eligible neighbours while keeping the graph navigable. It gives you correct pre-filtered results \u2014 essential for version and access-tier constraints \u2014 without the recall collapse naive filtering causes."}], "isArch": false}, {"num": "PR2", "group": "Production", "title": "Retrieval Evaluation", "filename": "pr2_retrieval_eval.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Metrics", "c": "ta"}], "desc": "You can't tune what you don't measure. Retrieval evaluation runs a labelled question set and scores recall@k, nDCG, and latency \u2014 turning every change (index, k, reranker) into a decision backed by numbers, not vibes.", "usecase": "Before enabling the cross-encoder reranker on your refund corpus, you measure recall@5 and nDCG on 300 labelled questions with and without it \u2014 proving the latency cost buys a real precision gain before it ships.", "install": "pip install numpy", "wn": ["Build a labelled set: questions paired with the chunk id(s) that truly answer them", "Recall@k: did a relevant chunk appear in the top k \u2014 measures whether you retrieved the answer at all", "nDCG: rewards ranking relevant chunks higher, discounted by position \u2014 measures ordering quality", "Track p50 and p99 latency alongside quality \u2014 a great ranking that's too slow fails in production", "Evaluate every retrieval change against the same set so improvements and regressions are provable"], "code_plain": "import numpy as np\n\n\ndef recall_at_k(retrieved: list[str], relevant: set[str], k: int) -> float:\n    \"\"\"Did we retrieve a relevant chunk in the top k?\"\"\"\n    hits = sum(1 for doc_id in retrieved[:k] if doc_id in relevant)\n    return hits / min(len(relevant), k) if relevant else 0.0\n\n\ndef ndcg_at_k(retrieved: list[str], relevant: set[str], k: int) -> float:\n    \"\"\"Ranking quality: relevant chunks higher = better, position-discounted.\"\"\"\n    dcg = 0.0\n    for rank, doc_id in enumerate(retrieved[:k], start=1):\n        if doc_id in relevant:\n            dcg += 1.0 / np.log2(rank + 1)\n    ideal = sum(1.0 / np.log2(r + 1) for r in range(1, min(len(relevant), k) + 1))\n    return float(dcg / ideal) if ideal > 0 else 0.0\n\n\ndef evaluate(runs: list[dict], k: int = 5) -> dict:\n    \"\"\"\n    runs: [{\"retrieved\": [...ids], \"relevant\": {...ids}, \"latency_ms\": float}]\n    \"\"\"\n    recalls = [recall_at_k(r[\"retrieved\"], r[\"relevant\"], k) for r in runs]\n    ndcgs   = [ndcg_at_k(r[\"retrieved\"], r[\"relevant\"], k) for r in runs]\n    lat     = sorted(r[\"latency_ms\"] for r in runs)\n\n    return {\n        f\"recall@{k}\": round(float(np.mean(recalls)), 3),\n        f\"ndcg@{k}\":   round(float(np.mean(ndcgs)), 3),\n        \"p50_ms\":      round(lat[len(lat) // 2], 1),\n        \"p99_ms\":      round(lat[int(len(lat) * 0.99)], 1),\n    }", "qs": [{"q": "What does recall@k miss that nDCG captures?", "mnemonic": "Found vs ranked well", "steps": ["Recall: in top-k?", "nDCG: how high?", "Recall ignores order", "nDCG rewards position"], "a": "Recall@k only asks whether a relevant chunk landed anywhere in the top k \u2014 it's blind to order, so the answer at rank 5 counts the same as rank 1. nDCG discounts by position, rewarding you for ranking relevant chunks higher. You need both: recall tells you if you retrieved the answer, nDCG tells you if you ranked it where the LLM will actually use it."}, {"q": "Why track p99 latency, not just the average?", "mnemonic": "Tails hurt users", "steps": ["Average looks fine", "p99 is the tail", "Slow queries frustrate", "SLA on p99"], "a": "An average hides the worst experiences \u2014 a good mean can still mean 1% of queries take seconds. p99 captures that tail, which is what users actually feel and what SLAs are written against. A retrieval change that improves quality but blows up p99 latency can be a net loss in production, so you measure the tail explicitly alongside quality."}, {"q": "Why evaluate against the same labelled set every time?", "mnemonic": "Provable, not anecdotal", "steps": ["Fixed question set", "Change one thing", "Compare metrics", "Ship on evidence"], "a": "Holding the labelled set constant makes every comparison apples-to-apples, so a metric move is attributable to your change rather than to different test questions. It
