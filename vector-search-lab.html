 turns retrieval tuning into a measured discipline \u2014 you ship the reranker because recall and nDCG rose without wrecking p99, and you catch regressions before they reach users. Spot-checking a few queries can't give that."}], "isArch": false}, {"num": "PR3", "group": "Production", "title": "Caching & Latency Optimization", "filename": "pr3_caching_latency.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Latency", "c": "tg"}], "desc": "Retrieval latency is query embedding + index search + rerank. Caching embeddings and results, plus trimming each stage, turns a multi-hundred-millisecond path into single digits for common queries \u2014 the difference users feel.", "usecase": "A support surface gets the same top questions thousands of times a day. Caching their query embeddings and even final results means repeat questions return in milliseconds, while the reranker runs only on genuinely new queries.", "install": "pip install numpy", "wn": ["Cache query embeddings keyed by normalised text \u2014 skip the embedding API call on repeats", "Cache final results for hot queries with a short TTL \u2014 the fastest retrieval is the one you skip", "Right-size the candidate set: retrieving 200 to rerank 5 is slower than retrieving 50 if recall holds", "Run embedding and any independent lookups concurrently; rerank only the final shortlist", "Measure where the milliseconds go (embed vs search vs rerank) before optimising \u2014 profile, don't guess"], "code_plain": "import time\nimport hashlib\nimport numpy as np\n\n\ndef qkey(text: str) -> str:\n    return hashlib.sha256(\" \".join(text.split()).lower().encode()).hexdigest()\n\n\nclass RetrievalCache:\n    \"\"\"Two-level cache: query embeddings and final result sets.\"\"\"\n\n    def __init__(self, result_ttl: float = 60.0) -> None:\n        self.embed_cache: dict[str, np.ndarray] = {}\n        self.result_cache: dict[str, tuple[float, list]] = {}\n        self.result_ttl = result_ttl\n\n    def get_embedding(self, text: str, embed_fn) -> np.ndarray:\n        key = qkey(text)\n        if key not in self.embed_cache:\n            self.embed_cache[key] = embed_fn(text)   # miss: embed once\n        return self.embed_cache[key]\n\n    def get_results(self, text: str):\n        key = qkey(text)\n        hit = self.result_cache.get(key)\n        if hit and (time.time() - hit[0]) < self.result_ttl:\n            return hit[1]                              # fresh cached results\n        return None\n\n    def put_results(self, text: str, results: list) -> None:\n        self.result_cache[qkey(text)] = (time.time(), results)\n\n\ndef right_size_candidates(recall_curve: dict[int, float],\n                          target_recall: float) -> int:\n    \"\"\"Smallest candidate count that still hits the recall target.\"\"\"\n    for n in sorted(recall_curve):\n        if recall_curve[n] >= target_recall:\n            return n\n    return max(recall_curve)", "qs": [{"q": "Why cache at two levels \u2014 embeddings and results?", "mnemonic": "Skip embed, or skip everything", "steps": ["Embed cache: skip API", "Result cache: skip all", "Hot query: instant", "Different hit rates"], "a": "The embedding cache saves the API call and its latency whenever a query text repeats, even if downstream results changed. The result cache short-circuits the entire pipeline for hot queries within a TTL \u2014 the fastest retrieval is the one you don't run. They have different hit patterns and TTLs, so having both captures more savings than either alone: one guards the expensive first step, the other guards the whole path."}, {"q": "Why can retrieving fewer candidates be faster without losing quality?", "mnemonic": "Right-size the shortlist", "steps": ["Rerank cost scales", "200 vs 50 candidates", "If recall holds at 50", "Rerank fewer, faster"], "a": "Rerank cost scales with candidate count, and vector search cost grows with how deep you retrieve. If your recall curve shows 50 candidates already capture the relevant chunks as well as 200 do, retrieving 200 just makes the reranker do 4x the work for no quality gain. Right-sizing the candidate set to the smallest count that holds recall trims latency for free."}, {"q": "Why profile before optimising latency?", "mnemonic": "Fix the real bottleneck", "steps": ["Embed vs search vs rerank", "Guess wrong stage", "Optimise the slow one", "Measure first"], "a": "The latency budget splits across embedding, search, and reranking, and which dominates varies by setup. Optimising the wrong stage \u2014 say hand-tuning the index when the reranker owns 80% of the time \u2014 wastes effort for little gain. Profiling shows where the milliseconds actually go, so you spend optimisation effort on the stage that will move p99, not on a guess."}], "isArch": false}, {"num": "PR4", "group": "Production", "title": "Filtering at Scale + Sharding", "filename": "pr4_scale_sharding.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Scale", "c": "tb"}], "desc": "At hundreds of millions of vectors, one index no longer fits or serves fast enough. Sharding splits the corpus across nodes searched in parallel and merged; scale-aware filtering keeps metadata constraints cheap across shards.", "usecase": "Your refund + support + docs corpus grows to 300M chunks across regions. Sharding by tenant and region lets each query hit only relevant shards in parallel, and access-tier filters run inside each shard's traversal before merge.", "install": "pip install numpy", "wn": ["Shard the corpus across nodes; search shards in parallel, then merge their top-k into a global top-k", "Route queries to only the relevant shards when you can partition by tenant, region, or time", "Merging is a k-way combine of each shard's local top-k \u2014 take the global best after gathering", "Filtered-ANN must run per shard so access and version constraints hold everywhere before merge", "Replicate shards for availability and read throughput; the query fan-out hides per-shard latency"], "code_plain": "import heapq\nimport numpy as np\n\n\ndef search_shard(shard_vectors: np.ndarray, shard_ids: list[str],\n                 query: np.ndarray, k: int,\n                 eligible: set[str] | None = None) -> list[tuple[float, str]]:\n    \"\"\"Local top-k within one shard, honouring the metadata filter.\"\"\"\n    V = shard_vectors / np.linalg.norm(shard_vectors, axis=1, keepdims=True)\n    q = query / np.linalg.norm(query)\n    scores = V @ q\n\n    local = [\n        (float(scores[i]), shard_ids[i])\n        for i in range(len(shard_ids))\n        if eligible is None or shard_ids[i] in eligible   # per-shard filter\n    ]\n    return heapq.nlargest(k, local)\n\n\ndef scatter_gather(shards: list[dict], query: np.ndarray,\n                   k: int = 5, eligible: set[str] | None = None) -> list[tuple]:\n    \"\"\"\n    Scatter the query to all shards, gather their local top-k,\n    merge into a single global top-k.\n    \"\"\"\n    gathered: list[tuple[float, str]] = []\n    for shard in shards:                      # in production: run in parallel\n        gathered.extend(\n            search_shard(shard[\"vectors\"], shard[\"ids\"], query, k, eligible)\n        )\n    return heapq.nlargest(k, gathered)        # k-way merge -> global top-k\n\n\ndef route_shards(all_shards: list[dict], region: str) -> list[dict]:\n    \"\"\"Query only shards that can hold eligible data.\"\"\"\n    return [s for s in all_shards if s[\"region\"] == region]", "qs": [{"q": "How does scatter-gather produce a correct global top-k?", "mnemonic": "Local top-k, then merge", "steps": ["Each shard: local top-k", "Gather all locals", "Merge k-way", "Global top-k emerges"], "a": "Each shard computes its own local top-k over just its vectors. Because the global top-k must be a subset of the union of per-shard top-ks, gathering every shard's local top-k and taking the k best overall yields the exact global top-k. The merge is a cheap k-way combine over a small gathered set, so parallel shard search stays correct while scaling horizontally."}, {"q": "Why route queries to only some shards when possible?", "mnemonic": "Skip irrelevant shards", "steps": ["Partition by tenant/region", "Query belongs to one", "Skip the rest", "Less fan-out"], "a": "If the corpus partitions cleanly \u2014 by tenant, region, or time \u2014 a given query can only match data in certain shards. Routing to just those shards cuts the fan-out, so you search a fraction of the cluster instead of all of it, saving compute and latency. It only works when the partition key aligns with the query's constraints; otherwise you must scatter to all."}, {"q": "Why run filtering per shard, before the merge?", "mnemonic": "Filter everywhere or leak", "steps": ["Constraint applies globally", "Enforce in each shard", "Ineligible never ranks", "Then merge safe"], "a": "A version or access-tier constraint must hold across the whole corpus, so each shard has to apply it during its own search \u2014 otherwise an ineligible chunk could win a shard's local top-k and reach the merge. Running filtered-ANN inside every shard ensures forbidden or stale chunks never enter the gathered set, so the merged global result is correct and secure by construction."}], "isArch": false}, {"num": "PR5", "group": "Production", "title": "Full RAG Retrieval Pipeline", "filename": "pr5_rag_pipeline.py", "tags": [{"l": "Production", "c": "tr"}, {"l": "Capstone", "c": "tp"}, {"l": "End-to-end", "c": "ta"}], "desc": "The capstone: every technique in this lab assembled into one path from a user's question to the ranked, filtered, deduplicated context handed to an LLM \u2014 query embedding, hybrid retrieval, filtering, fusion, reranking, and answerability.", "usecase": "Interviewer: 'walk me through retrieval end-to-end for a regulated refund assistant.' This pipeline is the answer \u2014 embed, pre-filter by access + version, hybrid search, RRF, cross-encoder rerank, threshold, and pass context or say 'not found'.", "install": "pip install numpy", "wn": ["Stage the flow: embed query -> pre-filter (access + version) -> hybrid retrieve -> RRF -> rerank -> threshold", "Pre-filter for security and freshness BEFORE search; never post-filter access control", "Hybrid + RRF gives robust recall; the cross-encoder rerank gives final precision", "Apply an answerability threshold so the system can say 'not in policy' instead of hallucinating", "Return context WITH provenance (chunk ids, source, version) so answers are auditable and citable"], "code_plain": "from dataclasses import dataclass\n\n\n@dataclass\nclass RetrievalConfig:\n    k_candidates:  int = 50      # broad recall before rerank\n    k_final:       int = 5       # context chunks to the LLM\n    min_rerank:    float = 0.3   # answerability floor\n\n\ndef rag_retrieve(question: str, user_ctx: dict, cfg: RetrievalConfig,\n                 deps) -> dict:\n    \"\"\"\n    End-to-end retrieval: question -> context (or 'not answerable').\n    `deps` bundles the embedder, indexes, fuser, and reranker.\n    \"\"\"\n    # 1. embed the query (same model as the chunks)\n    q_vec = deps.embed_query(question)\n\n    # 2. PRE-filter: access tier + current version (security + freshness)\n    eligible = {\n        \"access_tier\": user_ctx[\"tier\"],\n        \"version\":     deps.current_version,\n    }\n\n    # 3. hybrid retrieval over the eligible set\n    dense  = deps.dense_search(q_vec, eligible, k=cfg.k_candidates)\n    sparse = deps.sparse_search(question, eligible, k=cfg.k_candidates)\n\n    # 4. fuse the two rankings (rank-based, scale-free)\n    fused_ids = deps.rrf([dense, sparse])[:cfg.k_candidates]\n\n    # 5. cross-encoder rerank for final precision\n    candidates = deps.load_chunks(fused_ids)\n    reranked = deps.rerank(question, candidates, top_n=cfg.k_final)\n\n    # 6. answerability gate: refuse rather than hallucinate\n    kept = [c for c in reranked if c[\"rerank_score\"] >= cfg.min_rerank]\n    if not kept:\n        return {\"answerable\": False, \"context\": [], \"citations\": []}\n\n    # 7. return context WITH provenance for auditable answers\n    return {\n        \"answerable\": True,\n        \"context\":    [c[\"text\"] for c in kept],\n        \"citations\":  [\n            {\"id\": c[\"id\"], \"source\": c[\"source\"], \"version\": c[\"version\"]}\n            for c in kept\n        ],\n    }", "qs": [{"q": "Why does pre-filtering come before retrieval in the pipeline?", "mnemonic": "Security and freshness first", "steps": ["Embed query", "Pre-filter access + version", "Search eligible only", "Then retrieve"], "a": "Access control and version freshness are correctness constraints, not ranking preferences \u2014 a forbidden or stale chunk must never influence results. Applying them as a pre-filter means search only ever runs over eligible vectors, so the security boundary is structural. Doing this before hybrid retrieval also shrinks the candidate space, which helps latency. Post-filtering these would risk leaks and empty result sets."}, {"q": "Why both RRF and a reranker \u2014 isn't that redundant?", "mnemonic": "Recall then precision", "steps": ["RRF: fuse for recall", "Broad candidate set", "Rerank: sharpen top", "Precision on shortlist"], "a": "They do different jobs at different stages. RRF fuses dense and sparse to maximise recall \u2014 making sure the right chunk is somewhere in the broad candidate set despite either signal's blind spots. The cross-encoder reranker then reads the question against that shortlist to maximise precision \u2014 ordering the final few correctly. Recall first, precision second: fusion widens the net, reranking sharpens the pick."}, {"q": "Why return citations, and why the answerability gate?", "mnemonic": "Auditable, or honest refusal", "steps": ["Threshold weak matches", "None clear it", "Say 'not in policy'", "Cite what you keep"], "a": "The answerability gate drops candidates below a relevance floor, so when the corpus genuinely lacks the answer the system returns nothing and can say 'not in policy' instead of hallucinating from weak matches \u2014 essential in a regulated setting. Returning citations (chunk id, source, version) with the kept context makes every answer traceable to its exact source, which auditability and compliance require."}], "isArch": false}]

<script>
var S = JSON.parse(document.getElementById('D').textContent);

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Syntax highlighter — applied at render time on plain text
function hi(code){
  return code.split('\n').map(function(line){
    var l=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var ci=l.indexOf('#');var cmt='';
    if(ci>=0){cmt=l.slice(ci);l=l.slice(0,ci);}
    l=l.replace(/\b(from|import|class|def|return|if|else|elif|for|while|in|not|and|or|is|None|True|False|with|as|try|except|raise|pass|lambda|yield|break|continue|async|await|Protocol)\b/g,'<span class="kw">$1</span>');
    l=l.replace(/(@\w+)/g,'<span class="dc">$1</span>');
    l=l.replace(/\b(print|len|list|dict|str|int|float|bool|range|enumerate|zip|map|filter|sorted|getattr|hasattr|isinstance|type|super|set|tuple|sum|min|max|any|all|round)\b/g,'<span class="bi">$1</span>');
    l=l.replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
    l=l.replace(/(f?["'](?:[^"'\\]|\\.)*["'])/g,'<span class="st">$1</span>');
    if(cmt)l=l+'<span class="cm">'+cmt+'</span>';
    return l;
  }).join('\n');
}

// Mini SVG for Q&A steps
function msvg(steps){
  var c=['#00d4c8','#f59e0b','#34d399','#f87171'];
  steps=steps||[];
  var bw=44,bh=22,gap=7,y=12,W=232;
  var total=steps.length*bw+(steps.length-1)*gap;
  var x0=(W-total)/2,o='<svg viewBox="0 0 '+W+' '+(bh+y+8)+'" width="100%">';
  steps.forEach(function(t,i){
    var x=x0+i*(bw+gap),col=c[i%c.length];
    o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="none" stroke="'+col+'" stroke-width="1.2"/>';
    o+='<text x="'+(x+bw/2)+'" y="'+(y+bh/2+4)+'" font-family="system-ui" font-size="7" fill="'+col+'" text-anchor="middle">'+esc(t)+'</text>';
    if(i<steps.length-1){var ax=x+bw+1,ay=y+bh/2;o+='<line x1="'+ax+'" y1="'+ay+'" x2="'+(ax+gap-2)+'" y2="'+ay+'" stroke="#2d3a56" stroke-width="1"/><polygon points="'+(ax+gap-2)+','+(ay-2.5)+' '+(ax+gap+2)+','+ay+' '+(ax+gap-2)+','+(ay+2.5)+'" fill="#2d3a56"/>';}
  });
  return o+'</svg>';
}

function qaCard(q,i,pfx){
  var id=pfx+'-'+i;
  return '<div class="qa-item"><div class="qa-q" onclick="tqa(\''+id+'\')">'
    +'<span class="qa-qn">Q'+(i+1)+'</span><span class="qa-qt">'+esc(q.q)+'</span>'
    +'<span class="qa-ar" id="a-'+id+'">&#8250;</span></div>'
    +'<div class="qa-body" id="b-'+id+'"><div class="qa-diag">'+msvg(q.steps)+'</div>'
    +'<div class="qa-mem">&#128161; '+esc(q.mnemonic)+'</div>'
    +'<div class="qa-ans">'+esc(q.a)+'</div></div></div>';
}

function tqa(id){
  var b=document.getElementById('b-'+id),a=document.getElementById('a-'+id);
  if(!b)return;
  var o=b.classList.toggle('open');
  if(a)a.classList.toggle('open',o);
}

// Rail
function buildRail(){
  var groups={},order=[];
  S.forEach(function(s,i){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group);}
    groups[s.group].push({s:s,i:i});
  });
  var h='';
  order.forEach(function(g){
    h+='<div class="rg">'+esc(g)+'</div>';
    groups[g].forEach(function(x){
      h+='<div class="si" id="si-'+x.i+'" onclick="go('+x.i+')">'
        +'<div class="si-num">'+esc(x.s.num)+'</div>'
        +'<div class="si-title">'+esc(x.s.title)+'</div></div>';
    });
  });
  document.getElementById('rail').innerHTML=h;
}

function renderCode(s,idx){
  var tags=(s.tags||[]).map(function(t){return '<span class="tag '+t.c+'">'+esc(t.l)+'</span>';}).join(' ');
  document.getElementById('shdr').innerHTML=
    '<div class="shdr-top"><span class="shdr-num">'+esc(s.num)+'</span>'
    +'<span class="shdr-title">'+esc(s.title)+'</span> '+tags+'</div>'
    +'<div class="shdr-desc">'+esc(s.desc)+'</div>';
  var wn=(s.wn||[]).map(function(w){return '<li>'+esc(w)+'</li>';}).join('');
  var pct=Math.round(((idx+1)/S.length)*100);
  document.getElementById('carea').innerHTML=
    '<div class="prog"><div class="prog-fill" style="width:'+pct+'%"></div></div>'
    +'<div class="uc"><div class="uc-lbl">Enterprise Refund Policy — use case</div>'
    +'<div class="uc-text">'+esc(s.usecase)+'</div></div>'
    +'<div class="wn"><div class="wn-title">What\'s new in this section</div>'
    +'<ul class="wn-list">'+wn+'</ul>'
    +'<div class="wn-ilbl">Install</div>'
    +'<div class="wn-install">$ '+esc(s.install)+'</div></div>'
    +'<div class="cb"><div class="cb-bar">'
    +'<div><span class="cb-lang">python</span><span class="cb-file">'+esc(s.filename)+'</span></div>'
    +'<button class="cb-copy" onclick="cpCode()">Copy</button></div>'
    +'<pre id="cpre">'+hi(s.code_plain||'')+'</pre></div>';
}

function cpCode(){
  var p=document.getElementById('cpre');
  if(!p)return;
  navigator.clipboard.writeText(p.innerText).then(function(){
    var b=document.querySelector('.cb-copy');
    if(b){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy';},1800);}
  });
}

var cur=0;
function go(i){
  document.querySelectorAll('.si').forEach(function(el){el.classList.remove('on');});
  var el=document.getElementById('si-'+i);
  if(el){el.classList.add('on');el.scrollIntoView({block:'nearest'});}
  cur=i;
  var s=S[i];
  document.getElementById('carea').scrollTop=0;
  document.getElementById('rpsub').textContent=s.num+' · '+s.title;
  document.getElementById('rpbody').innerHTML=(s.qs||[]).map(function(q,j){return qaCard(q,j,s.num);}).join('');
  renderCode(s,i);
}

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.key==='ArrowDown'||e.key==='j')&&cur<S.length-1){e.preventDefault();go(cur+1);}
  if((e.key==='ArrowUp'||e.key==='k')&&cur>0){e.preventDefault();go(cur-1);}
});

buildRail();
go(0);
</script>
</body>
</html>
